// QR scan for material input during WO execution
let _qrScannerInstance = null;

function startQRCamera(stepNo, rmCode) {
  const cameraArea = $id(`qr-camera-area-${stepNo}`);
  if (!cameraArea) return;

  // Stop previous instance
  if (_qrScannerInstance) { try { _qrScannerInstance.stop(); } catch(e){} _qrScannerInstance = null; }

  cameraArea.innerHTML = '';
  cameraArea.style.minHeight = '250px';
  cameraArea.style.background = '#000';
  cameraArea.id = `qr-camera-area-${stepNo}`;

  if (typeof Html5Qrcode === 'undefined') {
    cameraArea.innerHTML = '<div class="fs-12 c-err" style="text-align:center;padding:20px">QR 스캐너를 불러올 수 없습니다</div>';
    return;
  }

  try {
    _qrScannerInstance = new Html5Qrcode(`qr-camera-area-${stepNo}`);
    _qrScannerInstance.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 },
      (decodedText) => {
        // QR 인식 성공 → 카메라 멈추고 조회
        try { _qrScannerInstance.stop(); } catch(e){}
        cameraArea.innerHTML = '<div class="fs-12 c-suc" style="text-align:center;padding:12px">✅ QR 인식 완료</div>';
        cameraArea.style.minHeight = '';
        cameraArea.style.background = '';
        processScannedQR(stepNo, rmCode, decodedText);
      },
      () => {} // scan miss — ignore
    ).catch((err) => {
      cameraArea.style.minHeight = '';
      cameraArea.style.background = '';
      cameraArea.innerHTML = '<div class="fs-12 c-err" style="text-align:center;padding:12px">카메라 접근이 거부되었습니다.<br>브라우저 설정에서 카메라 권한을 허용해주세요.</div>';
    });
  } catch(e) {
    cameraArea.innerHTML = '<div class="fs-12 c-err" style="text-align:center;padding:12px">카메라 초기화 실패</div>';
  }
}

async function processScannedQR(stepNo, rmCode, qrId) {
  if (!qrId) return;

  try {
    showLoading();
    SheetsAPI.invalidateCache('원재료개별');
    const indivs = await SheetsAPI.getAll('원재료개별');
    const indiv = indivs.find(r => r[0] === qrId);
    if (!indiv) { toast('해당 QR을 찾을 수 없습니다', 'err'); hideLoading(); return; }

    // 소진/폐기 상태는 스캔 거부, 잔여 상태는 재사용 허용
    const indivStatus = (indiv[3] || '').trim();
    if (['소진','폐기','입고취소'].includes(indivStatus)) {
      toast(`이 제품은 "${indivStatus}" 상태입니다. 사용할 수 없습니다.`, 'err');
      hideLoading();
      return;
    }

    const lots = await SheetsAPI.getAll('원재료LOT');
    const lot = lots.find(l => l[0] === indiv[1]);

    // Save scanned item
    if (!State.woExec._scannedLots) State.woExec._scannedLots = {};
    if (!State.woExec._scannedLots[stepNo]) State.woExec._scannedLots[stepNo] = [];

    // Prevent duplicate
    if (State.woExec._scannedLots[stepNo].find(s => s.qrId === qrId)) {
      toast('이미 스캔된 QR입니다', 'warn');
      hideLoading();
      return;
    }

    State.woExec._scannedLots[stepNo].push({
      qrId, lotId: indiv[1], name: lot?.[2] || '', remain: indiv[4] || '0',
      expiry: (lot?.[7]||'').substring(0,10), status: indiv[3] || ''
    });

    hideLoading();
    renderScannedList(stepNo);
    validateStepInputs(stepNo);
    toast(`${qrId} 스캔 완료`, 'suc');
  } catch (e) {
    hideLoading();
    toast('조회 실패: ' + e.message, 'err');
  }
}

function renderScannedList(stepNo) {
  const listEl = $id(`scanned-list-${stepNo}`);
  if (!listEl) return;
  const items = State.woExec._scannedLots?.[stepNo] || [];

  if (items.length === 0) { listEl.innerHTML = ''; return; }

  // 개별 항목별 useType 초기화 (기본: 'full')
  if (!State.woExec._itemUseType) State.woExec._itemUseType = {};
  if (!State.woExec._itemUseType[stepNo]) State.woExec._itemUseType[stepNo] = {};
  items.forEach((_, i) => {
    if (State.woExec._itemUseType[stepNo][i] === undefined) State.woExec._itemUseType[stepNo][i] = 'full';
  });

  listEl.innerHTML = `
    <div class="fs-12 fw-6 c-txt-l mb-4">투입 제품 목록 (${items.length}건)</div>
    ${items.map((item, i) => {
      const iut = State.woExec._itemUseType[stepNo][i] || 'full';
      const isFull = iut === 'full';
      return `
      <div class="card" style="padding:8px 12px;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:8px;height:8px;border-radius:50%;background:${isFull?'var(--suc)':'var(--warn)'};flex-shrink:0"></div>
          <div style="flex:1;min-width:0">
            <div class="fs-12 fw-6">${item.name}</div>
            <div class="lot-id" style="font-size:11px;font-weight:600">${item.qrId}</div>
            <div class="fs-11 c-txt-l">${isFull ? '전량 소진' : `잔여분 — 남은량 ${item.remain}kg`} · ${item.expiry}</div>
          </div>
          <button class="btn btn-sm" style="padding:2px 8px;font-size:11px;color:var(--err);background:none;border:1px solid var(--err)"
                  onclick="removeScannedItem(${stepNo},${i})">삭제</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn btn-sm flex-1" style="padding:3px 6px;font-size:11px;border:1.5px solid var(--info);${isFull?'background:var(--info);color:#fff':'background:transparent;color:var(--info)'}"
                  onclick="setItemUseType(${stepNo},${i},'full')">전량 소진</button>
          <button class="btn btn-sm flex-1" style="padding:3px 6px;font-size:11px;border:1.5px solid var(--warn);${!isFull?'background:var(--warn);color:#fff':'background:transparent;color:var(--warn)'}"
                  onclick="setItemUseType(${stepNo},${i},'partial')">잔여분</button>
        </div>
      </div>`;
    }).join('')}
  `;
}

function removeScannedItem(stepNo, index) {
  if (State.woExec._scannedLots?.[stepNo]) {
    State.woExec._scannedLots[stepNo].splice(index, 1);
    // _itemUseType 인덱스 재정렬
    if (State.woExec._itemUseType?.[stepNo]) {
      const old = State.woExec._itemUseType[stepNo];
      const rebuilt = {};
      const items = State.woExec._scannedLots[stepNo];
      items.forEach((_, i) => {
        rebuilt[i] = i < index ? (old[i] || 'full') : (old[i + 1] || 'full');
      });
      State.woExec._itemUseType[stepNo] = rebuilt;
    }
    renderScannedList(stepNo);
    validateStepInputs(stepNo);
  }
}

// 개별 항목별 전량/잔여분 설정
function setItemUseType(stepNo, index, type) {
  if (!State.woExec._itemUseType) State.woExec._itemUseType = {};
  if (!State.woExec._itemUseType[stepNo]) State.woExec._itemUseType[stepNo] = {};
  State.woExec._itemUseType[stepNo][index] = type;
  renderScannedList(stepNo);
  validateStepInputs(stepNo);
}

// 하위 호환 — 기존 setUseType 호출 무시
function setUseType(stepNo, type) {}

function validateStepInputs(stepNo) {
  const step = State.woExec?.steps?.[State.woExec?.currentStep];
  if (!step) return;
  // 미리보기 모드: 필수값 검증 없이 '공정 완료' 버튼 활성화 (모든 단계 화면 열람용)
  if (isPreviewing()) {
    document.querySelectorAll('#content > div:last-child button').forEach(btn => {
      if (btn.textContent.includes('공정 완료') || btn.textContent.includes('전체 완료')) { btn.dataset.valid = 'true'; btn.style.opacity = '1'; }
    });
    return;
  }
  const stepType = step[3] || 'input';
  const isWater = (step[4] || '') === 'RM002';

  let allValid = true;

  if (stepType === 'heat') {
    // CCP 는 빈칸을 허용하지 않는다 — 모든 측정행의 6개 값이 있어야 완료 가능
    const box = $id(`heat-rows-${stepNo}`);
    const cnt = box ? box.querySelectorAll('[data-heat-row]').length : 0;
    if (cnt === 0) allValid = false;
    let anyBad = false;
    for (let i = 0; i < cnt; i++) {
      const g = f => $id(`heat-${stepNo}-${i}-${f}`)?.value ?? '';
      if (['unit', 'at', 'start', 'end', 'core'].some(f => g(f) === '')) allValid = false;
      if (g('min') === '' && g('sec') === '') allValid = false;
      const r = { startC: g('start'), endC: g('end'), coreC: g('core'), sec: (parseInt(g('min')) || 0) * 60 + (parseInt(g('sec')) || 0) };
      if (!heatJudge(r).ok) anyBad = true;
    }
    // 이탈이 있으면 개선조치 없이는 넘어갈 수 없다 (기준서 개선조치 절차)
    if (anyBad && !($id(`heat-act-${stepNo}`)?.value || '').trim()) allValid = false;
  }
  else if (stepType === 'input') {
    // Check: 투입량 입력됨?
    const qtyInput = $id(`input-qty-${stepNo}`);
    const qtyVal = parseFloat(qtyInput?.value);
    if (!qtyVal || qtyVal <= 0) allValid = false;

    // Check: ±5% 범위 내?
    const targetVal = parseFloat(qtyInput?.dataset?.target || '0');
    let rangeHint = $id(`qty-range-hint-${stepNo}`);
    if (!rangeHint) {
      rangeHint = document.createElement('div');
      rangeHint.id = `qty-range-hint-${stepNo}`;
      rangeHint.style.cssText = 'font-size:11px;margin-top:4px';
      qtyInput?.closest('.input-group')?.appendChild(rangeHint);
    }
    if (targetVal > 0 && qtyVal > 0) {
      const lo = targetVal * 0.95, hi = targetVal * 1.05;
      if (qtyVal >= lo && qtyVal <= hi) {
        rangeHint.innerHTML = `<span style="color:var(--suc)">✓ 허용 범위 내 (${lo.toFixed(1)}~${hi.toFixed(1)}kg)</span>`;
      } else {
        rangeHint.innerHTML = `<span style="color:var(--err)">✗ 목표 대비 ±5% 초과 (허용: ${lo.toFixed(1)}~${hi.toFixed(1)}kg)</span>`;
        allValid = false;
      }
    } else if (targetVal > 0) {
      const lo = targetVal * 0.95, hi = targetVal * 1.05;
      rangeHint.innerHTML = `<span style="color:var(--gray)">허용 범위: ${lo.toFixed(1)}~${hi.toFixed(1)}kg (±5%)</span>`;
    }

    // Check: 사진 첨부됨?
    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) allValid = false;

    // Check: 체크항목 전부 체크됨?
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    checks.forEach((_, i) => {
      const cb = $id(`check-${stepNo}-${i}`);
      if (cb && cb.textContent !== '✓') allValid = false;
    });

    // Check: QR 스캔됨? (물 제외)
    if (!isWater) {
      const scanned = State.woExec._scannedLots?.[stepNo]?.length || 0;
      if (scanned === 0) allValid = false;
    }
  }

  // process 타입 검증
  if (stepType === 'process') {
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    const isMixing = (step[2]||'').includes('믹싱');
    const allChecks = [...checks];
    if (isMixing) {
      if (!allChecks.includes('RPM 확인')) allChecks.push('RPM 확인');
      if (!allChecks.includes('믹싱 시간 확인')) allChecks.push('믹싱 시간 확인');
    }
    allChecks.forEach((_, i) => {
      const cb = $id(`check-${stepNo}-${i}`);
      if (cb && cb.textContent !== '✓') allValid = false;
    });
    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) allValid = false;
  }

  // inspect 타입 검증 (CCP 격자) — 감시시각 1건↑ · 각 행 시각 · 이탈 시 개선조치 · 통과량
  if (stepType === 'inspect') {
    const grid = State.woExec._ccpGrid?.[stepNo];
    if (!grid || !grid.rows.length) allValid = false;
    else {
      if (grid.rows.some(r => !r.시각)) allValid = false;
      // 시편/제품+시편 '불검출' = 검출기 결함 → 완료(통과) 불가 (이탈기록으로도 우회 불가)
      if (ccpHasDetectFail(grid)) allValid = false;
      const hasDev = grid.rows.some(r => ccpRowJudge(r) === '부적합');
      if (hasDev && (!$id(`ccp-dev-${stepNo}`)?.value || !$id(`ccp-action-${stepNo}`)?.value)) allValid = false;
    }
    if (!$id(`ccp-passQty-${stepNo}`)?.value) allValid = false;
  }

  // pack 타입 검증
  if (stepType === 'pack') {
    const packQty = parseInt($id(`pack-qty-${stepNo}`)?.value);
    if (!packQty || packQty <= 0) allValid = false;
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-s${n}`);
      if (!prev || !prev.innerHTML.trim()) allValid = false;
      const wt = parseFloat($id(`sample-wt-${stepNo}-${n}`)?.value);
      if (!wt || wt <= 0) allValid = false;
    }
  }

  // seal 타입 검증
  if (stepType === 'seal') {
    const sealCheck0 = $id(`check-seal-${stepNo}-0`);
    const sealCheck1 = $id(`check-seal-${stepNo}-1`);
    if (!sealCheck0 || sealCheck0.textContent !== '✓') allValid = false;
    if (!sealCheck1 || sealCheck1.textContent !== '✓') allValid = false;
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-seal${n}`);
      if (!prev || !prev.innerHTML.trim()) allValid = false;
      const wt = parseFloat($id(`seal-weight-${stepNo}-${n}`)?.value);
      if (!wt || wt <= 0) allValid = false;
    }
    const sealQty = parseInt($id(`seal-qty-${stepNo}`)?.value);
    if (!sealQty || sealQty <= 0) allValid = false;
  }

  // qr-label 타입 검증
  if (stepType === 'qr-label') {
    const qrQty = parseInt($id(`qr-label-qty-${stepNo}`)?.value);
    if (!qrQty || qrQty <= 0) allValid = false;
  }

  // store 타입 검증 — 사진·투입온도 요구 제거(센서 자동기록·종료온도는 출하승인에서). 보관시작은 자동.

  // Enable/disable next button
  const nextBtn = document.querySelector('#step-content ~ div .btn-pri, #step-content ~ div .btn-suc');
  // Find the bottom buttons container
  const bottomBtns = document.querySelectorAll('#content > div:last-child button');
  bottomBtns.forEach(btn => {
    if (btn.textContent.includes('공정 완료') || btn.textContent.includes('전체 완료')) {
      btn.dataset.valid = allValid ? 'true' : 'false';
      btn.style.opacity = allValid ? '1' : '0.4';
    }
  });
}

    if (stepData.packQty) bodyHtml += `<div class="input-group mt-8"><label>포장 수량</label><div class="input-suffix"><input type="number" value="${stepData.packQty}" readonly disabled style="background:var(--gray-l);opacity:0.8"><span>개</span></div></div>`;
    if (stepData.samples?.length) {
      bodyHtml += `<div class="fs-13 fw-7 mb-8 mt-12">샘플 무게 기록</div>`;
      stepData.samples.forEach((s,si) => {
        bodyHtml += `<div class="card" style="padding:10px;border-left:3px solid #e65100;margin-bottom:6px">
          <div class="fs-13 fw-6 mb-4">샘플 #${si+1}</div>
          ${photoUrls[si] ? `<a href="${photoUrls[si]}" target="_blank" rel="noopener"><img src="${photoUrls[si]}" style="width:100%;max-height:150px;object-fit:contain;border-radius:6px;border:1px solid var(--gray-l)" onerror="this.style.display='none'"></a>` : ''}
          <div class="input-group mt-4"><label style="font-size:12px">무게</label><div class="input-suffix"><input type="number" value="${s.weight||'-'}" readonly disabled style="background:var(--gray-l);opacity:0.8"><span>kg</span></div></div>
        </div>`;
      });
    }
  }
  else {
    if (stepData.checks?.length) {
      bodyHtml += `<div class="fs-12 fw-6 c-txt-l mb-4">체크항목</div>`;
      bodyHtml += stepData.checks.map(c => `<div class="check-item"><div class="check-box ${c.checked?'checked':''}" style="pointer-events:none">${c.checked?'✓':''}</div><span>${c.name}</span></div>`).join('');
    }
    if (photoUrls.length) {
      bodyHtml += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${photoUrls.map((url,pi) => `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-l)" onerror="this.style.display='none'"></a>`).join('')}</div>`;
    }
  }

  return `
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">
      <div style="padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;background:${typeColor}08"
           onclick="const d=this.nextElementSibling;d.style.display=d.style.display==='none'?'block':'none';this.querySelector('.arrow').textContent=d.style.display==='none'?'▸':'▾'">

        </div>
        <span style="background:${typeColor}15;color:${typeColor};font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600">${typeLabel}</span>
        <span class="arrow" style="color:var(--txt-l);font-size:12px">▾</span>
      </div>
      <div style="padding:12px;border-top:1px solid var(--gray-l)">
        ${bodyHtml}
        <div class="fs-11 c-txt-l mt-8" style="border-top:1px solid var(--gray-l);padding-top:6px">기록: ${r[11]||'-'} · ${worker.split('@')[0]}</div>
      </div>
    </div>`;
}

/* PDF 미리보기 — 저장 없이 로컬 생성 후 새 탭으로 열기 */
async function previewWOPdf(woId) {
  try {
    showLoading();
    const { pdfBlob, fileName } = await generateWOPdf(woId);
    const url = URL.createObjectURL(pdfBlob);
    const w = window.open(url, '_blank');
    if (!w) {
      const a = document.createElement('a');
      a.href = url; a.download = fileName; a.click();
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    hideLoading();
    toast('📄 PDF 미리보기 생성 완료', 'suc', 2000);
  } catch (e) {
    hideLoading();
    toast('PDF 생성 실패: ' + e.message, 'err');
  }
}

/* ═══════════════════════════════════════════════
   PDF 생성 (HACCP 작업지시서 보고서) v4
   — 라벨 짤림 수정, 빈페이지 제거, 사진 Drive API,
     CCP JSON 파싱, PDF 폴더 분리
   ═══════════════════════════════════════════════ */
async function generateWOPdf(woId) {
  const { jsPDF } = window.jspdf;

  /* ── 데이터 로드 ── */
  const wos = await SheetsAPI.getAll('작업지시서', false);
  const wo = wos.find(w => w[0] === woId);
  if (!wo) throw new Error('작업지시서를 찾을 수 없습니다');

  const records = (await SheetsAPI.getAll('공정기록', false)).filter(r => r[0] === woId);
  records.sort((a, b) => parseInt(a[1]) - parseInt(b[1]));
  // 동결공정 일지의 '투입 시 냉동고 온도' — Tuya 센서 자동기록(동결온도로그)에서 보충
  const tempLogs = await SheetsAPI.getAll('동결온도로그').catch(() => []) || [];
  // 출하 이력 — 이 WO의 완제품LOT(wo[14]) 출하기록(제품번호별 출하시각·냉동창고온도)
  const shipRecs = wo[14] ? (await SheetsAPI.getAll('출하기록').catch(() => [])).filter(s => s[1] === wo[14]).sort((a, b) => String(a[6]).localeCompare(String(b[6]))) : [];

  /* ── 한글 폰트 로드 ── */
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const PW = 210, PH = 297, M = 15, CW = PW - M * 2;
  let y = M;

  let fontLoaded = false;
  try {
    const fontUrls = [
      'https://fonts.gstatic.com/s/nanumgothic/v23/PN_3Rfi-oW3hYwmKDpxS7F_z_tLfxno73g.ttf',
      'https://cdn.jsdelivr.net/gh/nicecai/nanum-font@master/NanumGothic.ttf',
      'https://fastly.jsdelivr.net/gh/nicecai/nanum-font@master/NanumGothic.ttf'
    ];
    let fontBuf = null;
    for (const fUrl of fontUrls) {
      try {
        const resp = await fetch(fUrl, { signal: AbortSignal.timeout(8000) });
        if (resp.ok) { fontBuf = await resp.arrayBuffer(); break; }
      } catch(e) { continue; }
    }
    if (fontBuf) {
      let binary = '';
      const bytes = new Uint8Array(fontBuf);
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      const b64Font = btoa(binary);
      doc.addFileToVFS('NanumGothic.ttf', b64Font);
      doc.addFont('NanumGothic.ttf', 'NanumGothic', 'normal');
      doc.addFont('NanumGothic.ttf', 'NanumGothic', 'bold');
      doc.setFont('NanumGothic', 'normal');
      fontLoaded = true;
      console.log('[PDF] 한글 폰트 로드 성공');
    }
  } catch(e) { console.warn('[PDF] 폰트 로드 실패:', e); }

  /* ── Canvas fallback ── */
  const _cfont = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const SC = 4;

  const canvasTextImg = (text, fs, fw, mw, color) => {
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    ctx.font = `${fw||'normal'} ${fs*SC}px ${_cfont}`;
    const lines = []; let rem = String(text||'');
    while (rem.length > 0) {
      let end = rem.length;
      while (end > 0 && ctx.measureText(rem.substring(0, end)).width > mw*SC) end--;
      if (end === 0) end = 1;
      lines.push(rem.substring(0, end)); rem = rem.substring(end);
    }
    if (lines.length === 0) lines.push('');
    const lh = fs * SC * 1.35;
    c.width = mw * SC + 4;
    c.height = lh * lines.length + fs * SC * 0.2;
    ctx.font = `${fw||'normal'} ${fs*SC}px ${_cfont}`;
    ctx.fillStyle = color || '#000'; ctx.textBaseline = 'top';
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 0, i * lh);
    return { d: c.toDataURL('image/png'), w: c.width / SC, h: c.height / SC, lines: lines.length };
  };

  /* ── 텍스트 렌더링 ── */
  const LH_FACTOR = 0.55; // 줄 높이 계수 (겹침 방지)

  const drawText = (text, x, yy, fs, fw, color, mw, align) => {
    if (!text && text !== 0) return { h: 0, y: yy };
    const str = String(text);
    const maxW = mw || CW;
    if (fontLoaded) {
      doc.setFont('NanumGothic', fw === 'bold' ? 'bold' : 'normal');
      doc.setFontSize(fs); doc.setTextColor(color || '#000');
      const splitLines = doc.splitTextToSize(str, maxW);
      const lineH = fs * LH_FACTOR;
      const totalH = splitLines.length * lineH;
      if (yy + totalH > PH - 12) { doc.addPage(); yy = M; }
      for (let i = 0; i < splitLines.length; i++) {
        const tx = align === 'center' ? x + maxW / 2 : (align === 'right' ? x + maxW : x);
        const opt = align ? { align } : {};
        doc.text(splitLines[i], tx, yy + i * lineH + fs * 0.28, opt);
      }
      return { h: totalH, y: yy };
    } else {
      const img = canvasTextImg(str, fs, fw, maxW, color);
      if (yy + img.h > PH - 12) { doc.addPage(); yy = M; }
      doc.addImage(img.d, 'PNG', x, yy, img.w, img.h);
      return { h: img.h, y: yy };
    }
  };

  const measureH = (text, fs, fw, mw) => {
    if (!text && text !== 0) return 0;
    const str = String(text); const maxW = mw || CW;
    if (fontLoaded) {
      doc.setFont('NanumGothic', fw === 'bold' ? 'bold' : 'normal');
      doc.setFontSize(fs);
      return doc.splitTextToSize(str, maxW).length * fs * LH_FACTOR;
    } else {
      const c = document.createElement('canvas'), ctx = c.getContext('2d');
      ctx.font = `${fw||'normal'} ${fs*SC}px ${_cfont}`;
      let rem = str, lines = 0;
      while (rem.length > 0) {
        let end = rem.length;
        while (end > 0 && ctx.measureText(rem.substring(0, end)).width > maxW*SC) end--;
        if (end === 0) end = 1;
        rem = rem.substring(end); lines++;
      }
      return lines * (fs * 1.35) / SC + fs * 0.2 / SC;
    }
  };

  const hLine = (yy, color, w) => {
    doc.setDrawColor(...(color||[21,101,192])); doc.setLineWidth(w||0.4);
    doc.line(M, yy, PW - M, yy);
  };

  /* ── Drive 사진 로드 (재시도 + 토큰 갱신) ── */
  const loadPhoto = async (url) => {
    try {
      if (!url || !url.trim()) return null;
      const u = url.trim();
      let fileId = null;
      const m1 = u.match(/\/d\/([^\/\?]+)/);
      const m2 = u.match(/[?&]id=([^&]+)/);
      const m3 = u.match(/^([a-zA-Z0-9_-]{20,})$/);
      if (m1) fileId = m1[1];
      else if (m2) fileId = m2[1];
      else if (m3) fileId = m3[1];
      else return null;

      const MAX_RETRIES = 2;
      for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
        let token = localStorage.getItem('mt_token') || State.token;
        if (!token) return null;
        try {
          const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&supportsAllDrives=true`, {
            headers: { 'Authorization': `Bearer ${token}` },
            signal: AbortSignal.timeout(15000)
          });
          if (resp.status === 401 && attempt < MAX_RETRIES) {
            // 토큰 만료 → 갱신 시도
            if (typeof refreshToken === 'function') {
              try { await refreshToken(); } catch(e) { console.warn('[PDF] 토큰 갱신 실패:', e); }
            }
            continue;
          }
          if (!resp.ok) {
            if (attempt < MAX_RETRIES) { await new Promise(r => setTimeout(r, 1000)); continue; }
            return null;
          }
          const blob = await resp.blob();
          if (blob.size < 100) {
            if (attempt < MAX_RETRIES) continue;
            return null;
          }
          // Canvas로 리사이즈 & 압축 (jsPDF 대용량 이미지 렌더링 오류 방지)
          const rawUrl = URL.createObjectURL(blob);
          try {
            const img = await new Promise((resolve, reject) => {
              const i = new Image();
              i.onload = () => resolve(i);
              i.onerror = reject;
              i.src = rawUrl;
            });
            const MAX_DIM = 800; // PDF에 충분한 해상도
            let w = img.width, h = img.height;
            if (w > MAX_DIM || h > MAX_DIM) {
              const scale = MAX_DIM / Math.max(w, h);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            const cvs = document.createElement('canvas');
            cvs.width = w; cvs.height = h;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const compressed = cvs.toDataURL('image/jpeg', 0.85);
            console.log(`[PDF] 사진 압축: ${(blob.size/1024).toFixed(0)}KB → ${(compressed.length*0.75/1024).toFixed(0)}KB (${w}x${h})`);
            return compressed;
          } finally {
            URL.revokeObjectURL(rawUrl);
          }
        } catch(e) {
          console.warn(`[PDF] 사진 로드 시도 ${attempt+1}/${MAX_RETRIES+1} 실패:`, e);
          if (attempt < MAX_RETRIES) { await new Promise(r => setTimeout(r, 1000)); continue; }
        }
      }
      return null;
    } catch { return null; }
  };

  /* ── 테이블 행 ── */
  const ROW_FS = 15, ROW_PAD = 3, MIN_ROW_H = 11;
  const LABEL_W = 50; // 라벨 너비 (큰 폰트 대응)

  const tableRow = (label, value, yy, labelW) => {
    const lw = labelW || LABEL_W;
    const vw = CW - lw;
    const valStr = (!value && value !== 0) || value === '-' || value === '' ? '내용 없음' : String(value);
    const lh = measureH(label, ROW_FS, 'bold', lw - 3);
    const vh = measureH(valStr, ROW_FS, 'normal', vw - 3);
    const rh = Math.max(lh + ROW_PAD * 2, vh + ROW_PAD * 2, MIN_ROW_H);
    if (yy + rh > PH - 12) { doc.addPage(); yy = M; }
    doc.setFillColor(240, 244, 250);
    doc.rect(M, yy, lw, rh, 'F');
    doc.setDrawColor(200, 210, 230); doc.setLineWidth(0.15);
    doc.rect(M, yy, CW, rh);
    doc.line(M + lw, yy, M + lw, yy + rh);
    const lTextY = yy + (rh - lh) / 2;
    const vTextY = yy + (rh - vh) / 2;
    drawText(label, M + 1.5, lTextY, ROW_FS, 'bold', '#333', lw - 3);
    const vColor = valStr === '내용 없음' ? '#999' : '#222';
    drawText(valStr, M + lw + 1.5, vTextY, ROW_FS, 'normal', vColor, vw - 3);
    return { nextY: yy + rh, height: rh };
  };

  /* ── 섹션 제목 ── */
  const sectionTitle = (text, yy, color) => {
    const h = measureH(text, 18, 'bold', CW);
    if (yy + h + 5 > PH - 12) { doc.addPage(); yy = M; }
    const r = drawText(text, M, yy, 18, 'bold', color || '#1565c0', CW);
    yy = r.y + r.h + 2;
    hLine(yy); yy += 3;
    return yy;
  };

  /* ── 공정 페이지 헤더 (높이 확대, 겹침 방지) ── */
  const processHeader = (title, subtitle) => {
    const headerH = 48;
    doc.setFillColor(21, 101, 192);
    doc.rect(0, 0, PW, headerH, 'F');
    drawText(title, M, 5, 18, 'bold', '#ffffff', CW * 0.55);
    if (subtitle) drawText(subtitle, M, 28, 12, 'normal', '#bbdefb', CW * 0.55);
    drawText(woId, PW - M - 60, 6, 12, 'normal', '#bbdefb', 60);
    drawText(wo[4]||'', PW - M - 60, 24, 12, 'normal', '#e3f2fd', 60);
    return headerH + 4;
  };

  /* ═══════════════════════════════════════════
     PAGE 1: 표지 + 기본 정보 + HACCP 요약
     ═══════════════════════════════════════════ */
  doc.setFillColor(21, 101, 192);
  doc.rect(0, 0, PW, 65, 'F');
  drawText('HACCP 생산 기록서', M, 6, 28, 'bold', '#ffffff', CW);
  drawText('작업지시서 (Work Order Report)', M, 28, 16, 'normal', '#bbdefb', CW);
  drawText(woId, M, 42, 14, 'normal', '#e3f2fd', CW);
  drawText(`${formatDateTime()}`, PW - M - 60, 52, 12, 'normal', '#90caf9', 60, 'right');
  y = 70;

  // ── 1. 기본 정보 ──
  y = sectionTitle('1. 기본 정보', y);

  const infoData = [
    ['제품명', wo[4] || '-'],
    ['제품코드', wo[3] || '-'],
    ['SOP', wo[1] || '-'],
    ['생산량', `${wo[5] || '-'} kg`],
    ['포장단위', wo[6] || '-'],
    ['포장수량', `${wo[7] || '-'} 개`],
    ['작업자', wo[8] || '-'],
    ['시작일시', (wo[9] || '-').substring(0, 16)],
    ['완료일시', (wo[10] || '-').substring(0, 16)],
    ['냉동시작', wo[11] || '-'],
    ['상태', wo[12] || '-'],
    ['완제품LOT', wo[14] || '-'],
    ['승인자', wo[15] || ''],
    ['승인일시', wo[16] ? wo[16].substring(0, 16) : ''],
  ];
  for (const [label, value] of infoData) {
    const r = tableRow(label, value, y);
    y = r.nextY;
  }
  y += 5;

  // ── 2. HACCP 관리 요약 ──
  const ccpRecords = records.filter(r => r[3] === 'inspect');
  const inputRecords = records.filter(r => r[3] === 'input');
  const storeRecords = records.filter(r => r[3] === 'store');

  y = sectionTitle('2. HACCP 관리 요약', y);

  const hacInfo = [
    ['총 공정', `${records.length}단계`],
    ['CCP 검사', `${ccpRecords.length}건`],
    ['원재료투입', `${inputRecords.length}건`],
    ['냉동보관', `${storeRecords.length}건`],
    ['LOT 추적', inputRecords.length > 0 ? '기록됨' : '해당 없음'],
    ['완료여부', records.every(r => r[10] === '완료') ? '전체 완료' : '일부 미완료'],
  ];
  for (const [label, value] of hacInfo) {
    const r = tableRow(label, value, y);
    y = r.nextY;
  }
  y += 4;

  // ── 3. 공정 결과 요약 ──
  y = sectionTitle('3. 공정 결과 요약', y);
  for (const rec of records) {
    const typeMap = {input:'투입',process:'믹싱',seal:'포장',inspect:'CCP','qr-label':'라벨',store:'보관',pack:'계량'};
    // 각 공정의 주요 정량 지표 추출
    let metric = '';
    try {
      const sd = rec[5] ? JSON.parse(rec[5]) : {};
      if (sd.targetQty != null || sd.inputQty != null) metric = `투입 ${sd.inputQty||'-'}kg / 목표 ${sd.targetQty||'-'}kg`;
      else if (sd.ccpTotal != null) metric = `검사 ${sd.ccpTotal}개, 합격 ${sd.passCount||0}, 불합격 ${sd.failCount||0}`;
      else if (sd.sealQty != null) metric = `밀봉 ${sd.sealQty}개`;
      else if (sd.packQty != null) metric = `포장 ${sd.packQty}개`;
      else if (sd.samples && sd.samples.length > 0) {
        const ws = sd.samples.map(s => s.weight).filter(w => w);
        if (ws.length > 0) metric = `샘플 ${ws.length}건, 평균 ${(ws.reduce((a,b)=>a+Number(b),0)/ws.length).toFixed(1)}g`;
      }
      else if (sd.qrQty) metric = `QR ${sd.qrQty}매`;
      else if (sd.freezeStart) metric = `냉동 ${sd.freezeStart}`;
      if (sd.checks && sd.checks.length > 0) {
        const passed = sd.checks.filter(c => c.checked).length;
        metric += (metric ? ' / ' : '') + `점검 ${passed}/${sd.checks.length}`;
      }
    } catch(e) {}
    const status = rec[10] || '미완료';
    const time = (rec[11] || '').substring(11, 16) || '-';
    const stepVal = `${typeMap[rec[3]]||rec[3]} | ${status} | ${time}` + (metric ? `\n${metric}` : '');
    const r = tableRow(`${rec[1]}. ${rec[2]||''}`, stepVal, y, 65);
    y = r.nextY;
  }

  /* ═══════════════════════════════════════════
     각 공정별 페이지
     ═══════════════════════════════════════════ */
  for (let ri = 0; ri < records.length; ri++) {
    const rec = records[ri];
    const stepNo = rec[1] || '';
    const stepName = rec[2] || '';
    const stepType = rec[3] || '';
    const usedLots = rec[4] || '';
    const stepDataRaw = rec[5] || '';
    const photoUrlsRaw = rec[6] || '';
    const actualValue = rec[7] || '';
    const photoUrl = rec[8] || '';
    const checkResult = rec[9] || '';
    const recordStatus = rec[10] || '내용 없음';
    const completedAt = rec[11] || '';
    const worker = rec[12] || '내용 없음';

    const typeLabel = {input:'원재료 투입',process:'믹싱 공정',seal:'포장/밀봉',inspect:'CCP 검사(금속검출)','qr-label':'QR 라벨 출력',store:'냉동보관',pack:'계량/소분'}[stepType] || stepType;
    const isCCP = stepType === 'inspect';

    // ── 공정별 페이지 배치 전략 ──
    // 사진/LOT/CCP/seal/pack이 있으면 무조건 새 페이지, 아니면 남은 공간 확인
    const hasPhotos = !!(photoUrlsRaw || photoUrl);
    const hasLots = !!usedLots;
    const isHeavy = isCCP || hasPhotos || hasLots || stepType === 'seal' || stepType === 'pack';
    if (isHeavy || ri === 0 || y > PH - 100) {
      doc.addPage();
      y = processHeader(`공정 ${stepNo}. ${stepName}`, `${typeLabel}  |  ${recordStatus}`);
    } else {
      // 같은 페이지에 구분선 + 미니 헤더
      y += 5;
      doc.setDrawColor(21, 101, 192); doc.setLineWidth(0.8);
      doc.line(M, y, PW - M, y);
      y += 5;
      const hdr = drawText(`공정 ${stepNo}. ${stepName}`, M, y, 20, 'bold', '#1565c0', CW * 0.6);
      drawText(`${typeLabel} | ${recordStatus}`, M + CW * 0.62, y + 2, 14, 'normal', '#666', CW * 0.38);
      y = hdr.y + hdr.h + 4;
    }

    // CCP 배너
    if (isCCP) {
      doc.setFillColor(255, 235, 238);
      doc.rect(M, y, CW, 16, 'F');
      doc.setDrawColor(211, 47, 47); doc.setLineWidth(0.5);
      doc.rect(M, y, CW, 16);
      drawText('⚠ HACCP CCP (Critical Control Point) — 중요관리점', M + 3, y + 2, 18, 'bold', '#c62828', CW - 6);
      y += 19;
    }

    // ── 기록 정보 ──
    y = sectionTitle('기록 정보', y);
    const baseInfo = [
      ['공정번호', stepNo],
      ['공정명', stepName],
      ['유형', typeLabel],
      ['작업자', worker],
      ['기록시간', completedAt ? completedAt.substring(0, 19) : '-'],
      ['상태', recordStatus],
    ];
    if (actualValue) baseInfo.push(['측정값', actualValue]);
    if (checkResult) baseInfo.push(['판정', checkResult]);

    for (const [l, v] of baseInfo) {
      const r = tableRow(l, v, y);
      y = r.nextY;
    }
    y += 4;

    // ── Step Data (작업자 기입 내용) ──
    let stepData = {};
    try { if (stepDataRaw) stepData = JSON.parse(stepDataRaw); } catch(e) {}
    const hasStepData = Object.keys(stepData).length > 0;

    if (hasStepData) {
      y = sectionTitle('작업자 기입 내용', y);

      // ★ 투입량: 목표 먼저, 실제 투입 나중 (순서 수정)
      if (stepData.inputQty != null || stepData.targetQty != null) {
        if (stepData.targetQty != null) {
          const r1 = tableRow('목표 투입량', `${stepData.targetQty} kg`, y);
          y = r1.nextY;
        }
        if (stepData.inputQty != null) {
          const r2 = tableRow('실제 투입량', `${stepData.inputQty} kg`, y);
          y = r2.nextY;
        }
        if (stepData.useType) {
          const r3 = tableRow('사용 구분', stepData.useType === 'full' ? '전량 사용' : '부분 사용', y);
          y = r3.nextY;
        }
      }

      // 체크항목 (HACCP 위생 점검) — 단, CCP 격자(checks=격자행 {구분,시편Fe…})는 제외. 아래 isCCP 블록에서 종이양식 기록부로 렌더한다.
      if (stepData.checks && stepData.checks.length > 0 && !(stepData.checks[0] && (stepData.checks[0].구분 || stepData.checks[0].시편Fe))) {
        y += 3;
        const chkR = drawText('체크항목 (위생/품질 점검)', M, y, 18, 'bold', '#333', CW);
        y = chkR.y + chkR.h + 3;
        for (const c of stepData.checks) {
          if (y > PH - 12) { doc.addPage(); y = M; }
          const icon = c.checked ? '☑' : '☐';
          const txt = `${icon}  ${c.name}`;
          const chColor = c.checked ? '#2e7d32' : '#c62828';
          doc.setFillColor(c.checked ? 232 : 255, c.checked ? 245 : 235, c.checked ? 233 : 238);
          doc.rect(M + 2, y, CW - 4, 14, 'F');
          drawText(txt, M + 4, y + 2, 15, 'normal', chColor, CW - 8);
          y += 13;
        }
        y += 3;
      }

      // 계량/포장
      if (stepData.packQty != null) {
        const r = tableRow('포장 수량', `${stepData.packQty} 개`, y);
        y = r.nextY;
      }
      if (stepData.samples && stepData.samples.length > 0) {
        y += 2;
        const sr = drawText('중량 검사 샘플 (HACCP 계량 검증)', M, y, 18, 'bold', '#333', CW);
        y = sr.y + sr.h + 2;
        for (let si = 0; si < stepData.samples.length; si++) {
          if (y > PH - 12) { doc.addPage(); y = M; }
          const s = stepData.samples[si];
          const r = tableRow(`샘플 #${si+1}`, `${s.weight||'-'} g`, y);
          y = r.nextY;
        }
        y += 2;
      }

      // 밀봉/라벨
      if (stepData.sealQty != null) {
        let r;
        r = tableRow('최종 수량', `${stepData.sealQty} 개`, y); y = r.nextY;
        r = tableRow('라벨 부착 확인', stepData.labelCheck ? '확인 완료 ✓' : '미확인 ✗', y); y = r.nextY;
        r = tableRow('밀봉 상태 확인', stepData.sealCheck ? '확인 완료 ✓' : '미확인 ✗', y); y = r.nextY;
        // 샘플 무게 기록
        if (stepData.samples && stepData.samples.length > 0) {
          stepData.samples.forEach((s, si) => {
            if (y > PH - 10) { doc.addPage(); y = M; }
            r = tableRow(`샘플 #${si+1} 무게`, `${s.weight || '-'} g`, y); y = r.nextY;
          });
        }
      }

      // CCP 검사 (금속검출 — HACCP 핵심)
      if (isCCP) {
        // 신 양식(격자) 자동 감지: _fmt 마커 또는 checks 행이 격자 구조(구분/시편Fe)인지
        const isGrid = stepData._fmt === 'ccpGrid-v1' ||
          (Array.isArray(stepData.checks) && stepData.checks[0] && (stepData.checks[0].구분 || stepData.checks[0].시편Fe));
        if (isGrid) {
          /* ── 종이 '금속검출기(CCP) 모니터링 기록부' 1:1 재현 ──
             실물 양식과 동일: 제목+결재칸 / ◆점검방법·일자·점검자 / 위해요소 / 모니터링(대상·방법·빈도)
             / 개선조치(감도미흡·이물발견·기계고장) / □검출/□불검출 체크박스 격자(고정 스켈레톤 행)
             / 금속검출기 제품통과 표 / 이탈내역·인수인계. 이탈 체크만 빨간 잉크. */
          const NM = { 시편Fe: '검출', 시편SUS: '검출', 제품통과: '불검출', 제품시편Fe: '검출', 제품시편SUS: '검출' };
          // 종이 셀은 그룹당 □검출/□불검출 1쌍 — 위치(좌중우·상하) 전부 정상일 때만 '검출'(시편) / 하나라도 검출이면 '검출'(제품통과)
          const g3 = a => (!Array.isArray(a) || !a.length) ? null : (a.every(v => v === '검출') ? '검출' : '불검출');
          const g6 = o => !o ? null : (['상', '하'].every(s => (o[s] || []).every(v => v === '검출')) ? '검출' : '불검출');
          const LN = () => { doc.setDrawColor(70, 70, 70); doc.setLineWidth(0.28); };
          const bx = (x, yy, w, h) => { LN(); doc.rect(x, yy, w, h); };
          const vline = (x, yy, h) => { LN(); doc.line(x, yy, x, yy + h); };

          // □검출/□불검출 체크쌍 (셀 중앙) — val null=빈 쌍(미기재), abn=이탈 시 빨간 체크·글씨
          const ckPair = (cx, cw, cy, val, nm) => {
            const bs = 2.4, fs = 6.5, abn = val != null && val !== nm;
            const total = 21.5; let x = cx + (cw - total) / 2;
            const markBox = (bxx, on) => {
              doc.setDrawColor(abn && on ? 198 : 45, abn && on ? 40 : 45, abn && on ? 40 : 45);
              doc.setLineWidth(0.25); doc.rect(bxx, cy, bs, bs);
              if (on) { doc.setLineWidth(0.55); doc.line(bxx + 0.4, cy + 1.3, bxx + 1.0, cy + 2.0); doc.line(bxx + 1.0, cy + 2.0, bxx + 2.2, cy + 0.3); }
            };
            markBox(x, val === '검출');
            drawText('검출', x + bs + 0.6, cy - 0.5, fs, 'normal', abn && val === '검출' ? '#c62828' : '#222', 7);
            x += bs + 0.6 + 4.8; drawText('/', x, cy - 0.5, fs, 'normal', '#222', 2); x += 1.8;
            markBox(x, val === '불검출');
            drawText('불검출', x + bs + 0.6, cy - 0.5, fs, 'normal', abn && val === '불검출' ? '#c62828' : '#222', 9.5);
          };

          // ── 데이터 → 종이 스켈레톤 행 매핑 (빈 행도 종이처럼 빈 체크쌍 인쇄) ──
          const checks = stepData.checks || [];
          const byG = g => checks.filter(c => (c.구분 || '') === g);
          const starts = byG('작업시작전'), works = byG('작업명'), twos = byG('작업중2h'), ends = byG('작업종료');
          const prodName = stepData.제품명 || wo[4] || '';
          // 신 양식(종이 1:1) — 입력 격자 구분 순서 그대로. 오전/오후 구분 폐지.
          // 작업 시작 전(시편만) → 작업명(품목명·전체검출) → 작업 중 2h(품목명·전체검출) → 작업 종료(시편만)
          const mkRow = (label, d, spec) => ({ label, d: d || null, spec: !!spec });
          const skel = [];
          (starts.length ? starts : [null]).forEach((c, i) => skel.push(mkRow(i ? '' : '작업 시작 전', c, true)));
          works.forEach((c) => skel.push(mkRow(prodName, c)));   // 작업명 = 품목명 행: 데이터 있을 때만(빈 작업명 행 방지 — 구 변환본엔 작업명 구분 없음)
          twos.forEach(c => skel.push(mkRow(prodName, c)));                                  // 2시간마다: 품목명 + 검출 기록
          (ends.length ? ends : [null]).forEach((c, i) => skel.push(mkRow(i ? '' : '작업 종료', c, true)));
          checks.filter(c => !['작업시작전', '작업명', '작업중2h', '작업종료'].includes(c.구분 || '')).forEach(c => skel.push(mkRow(c.구분 || '', c)));

          // 양식 시작 — 남은 공간 부족하면 새 페이지(제목~개선조치 상단블록 ~105mm가 통째로 들어가야 함)
          if (y + 115 > PH - 12) { doc.addPage(); y = M; }

          // ① 제목 밴드 + 결재칸 (작성/승인)
          const AP_W = 44, AP_L = 8, AP_C = (AP_W - AP_L) / 2, T_H = 15;
          bx(M, y, CW, T_H);
          drawText(`금속검출공정(${CCP.METAL.no}) 모니터링 기록부`, M + 3, y + 4, 15, 'bold', '#111', CW - AP_W - 6);
          const apx = M + CW - AP_W;
          vline(apx, y, T_H); vline(apx + AP_L, y, T_H); vline(apx + AP_L + AP_C, y, T_H);
          drawText('결', apx + 2.2, y + 3, 7.5, 'normal', '#333', AP_L); drawText('재', apx + 2.2, y + 8.5, 7.5, 'normal', '#333', AP_L);
          LN(); doc.line(apx + AP_L, y + 5, M + CW, y + 5);
          drawText('작성', apx + AP_L, y + 1, 7, 'normal', '#333', AP_C, 'center');
          drawText('승인', apx + AP_L + AP_C, y + 1, 7, 'normal', '#333', AP_C, 'center');
          drawText((stepData.점검자 || wo[8] || '').split('@')[0], apx + AP_L, y + 8, 7.5, 'normal', '#222', AP_C, 'center');
          drawText(wo[15] ? wo[15].split('@')[0] : '', apx + AP_L + AP_C, y + 8, 7.5, 'normal', '#222', AP_C, 'center');
          y += T_H;

          // ② ◆ 점검방법 / 점검일자 / 점검자
          const verdict = stepData.판정종합 || (checks.every(c => (c.판정 || '적합') === '적합') ? '적합' : '부적합');
          const vok = verdict === '적합';
          bx(M, y, CW, 11);
          drawText('◆ 점검방법 : 판정(적합/부적합)  →', M + 3, y + 1.2, 8.5, 'normal', '#222', 70);
          drawText(verdict, M + 62, y + 0.8, 10, 'bold', vok ? '#1b5e20' : '#c62828', 20);
          const _d10 = (wo[9] || '').substring(0, 10).split('-');
          const dateStr = _d10.length === 3 ? `20${_d10[0].slice(2)}년 ${Number(_d10[1])}월 ${Number(_d10[2])}일` : '-';
          drawText(`◆ 점검일자 : ${dateStr}      ◆ 점검자 : ${(stepData.점검자 || wo[8] || '-').split('@')[0]}`, M + 3, y + 6.3, 8.5, 'normal', '#222', CW - 6);
          y += 11;

          // ③ 위해요소
          bx(M, y, CW, 7); vline(M + 26, y, 7);
          drawText('위해요소', M + 2, y + 1.8, 8, 'bold', '#222', 23);
          drawText('금속성 이물질 잔존(SUS, Fe의 나사, 칼날, 톱날, 못 등)', M + 29, y + 1.8, 8, 'normal', '#222', CW - 32);
          y += 7;

          // ④ 모니터링 (대상 | 방법 | 빈도) — 좌측 세로 라벨
          const SUB_X = M + 26, SUB_W = 14, CON_X = SUB_X + SUB_W;
          const monTopY = y;
          // 대상 행 (대상 | 내용 | 전제품 | 한계기준 | 기준내용)
          const tgtH = 13;
          bx(M, y, CW, tgtH); vline(SUB_X, y, tgtH); vline(CON_X, y, tgtH);
          drawText('대상', SUB_X + 2, y + 4, 8, 'normal', '#222', SUB_W - 3);
          drawText('-금속성 이물질 검출 여부\n-금속검출기의 검출력 유지\n (정상작동 유무)', CON_X + 2, y + 1.4, 7.2, 'normal', '#222', 54);
          vline(CON_X + 57, y, tgtH); drawText('전제품', CON_X + 59, y + 4.5, 7.5, 'normal', '#222', 14);
          vline(CON_X + 74, y, tgtH); drawText('한계기준', CON_X + 75.5, y + 4.5, 7.5, 'bold', '#222', 15);
          vline(CON_X + 91, y, tgtH);
          drawText('Fe 2.5mm / SUS 4.0mm 이상의\n금속성이물질 100% 검출할 것', CON_X + 93, y + 2.6, 7.2, 'normal', '#222', CW - 26 - SUB_W - 95);
          y += tgtH;
          // 방법 행
          const mTxt = '1. ' + CCP.METAL.no + ' 모니터링 담당자는 금속검출기의 정상작동 유무를 확인한다.\n- 작업시작 전: 시편만 통과 시 감지확인\n- 2시간마다: 시편만 통과, 제품 단독통과, 시편과 제품을 동시에 통과 시 감지확인\n- 작업종료(마지막공정품): 시편과 마지막 제품을 동시에 통과 시 감지 확인\n2. 시편을 이용하여 금속검출기의 가운데(제품위쪽가운데)에 놓고 점검한다.\n   시편과 제품을 이용하여 금속검출기를 통과 시킨 후 모니터링일지에 기록한다.';
          const mH = Math.max(measureH(mTxt, 7.2, 'normal', CW - 26 - SUB_W - 4) + 3, 24);
          bx(M, y, CW, mH); vline(SUB_X, y, mH); vline(CON_X, y, mH);
          drawText('방법', SUB_X + 2, y + mH / 2 - 2, 8, 'normal', '#222', SUB_W - 3);
          drawText(mTxt, CON_X + 2, y + 1.5, 7.2, 'normal', '#222', CW - 26 - SUB_W - 4);
          y += mH;
          // 빈도 행
          bx(M, y, CW, 6.5); vline(SUB_X, y, 6.5); vline(CON_X, y, 6.5);
          drawText('빈도', SUB_X + 2, y + 1.6, 8, 'normal', '#222', SUB_W - 3);
          drawText('작업시작 전, 작업 중 2시간마다 및 작업종료 후', CON_X + 2, y + 1.6, 7.5, 'normal', '#222', CW - 26 - SUB_W - 4);
          y += 6.5;
          drawText('모니터링\n방법', M + 4, monTopY + (y - monTopY) / 2 - 5, 8, 'bold', '#222', 20);

          // ⑤ 개선조치 (감도미흡시 | 이물발견시 | 기계고장시)
          const impTopY = y;
          const impRows = [
            ['감도\n미흡시', '금속검출기 부저가 울리면 해당제품을 2~3회 반복하여 통과시켜 적정 감도로 조정한다.'],
            ['이물\n발견시', '-금속검출기가 작동한 제품을 금속검출기에 재 통과하여 이물질 확인 후 제거\n-이물질 오염된 제품은 폐기  -금속검출 재 실시 후 이상 없을 때 재사용'],
            ['기계\n고장시', '-기기고장 2시간 전 생산제품 별도보관  -기기수리 후 재검사 실시'],
          ];
          impRows.forEach(([l, t]) => {
            const h = Math.max(measureH(t, 7.2, 'normal', CW - 26 - SUB_W - 4) + 2.6, 8);
            bx(M, y, CW, h); vline(SUB_X, y, h); vline(CON_X, y, h);
            drawText(l, SUB_X + 2, y + h / 2 - 4, 7.2, 'normal', '#222', SUB_W - 3);
            drawText(t, CON_X + 2, y + 1.4, 7.2, 'normal', '#222', CW - 26 - SUB_W - 4);
            y += h;
          });
          drawText('개선\n조치', M + 6, impTopY + (y - impTopY) / 2 - 5, 8, 'bold', '#222', 16);
          y += 2;

          // ⑥ 체크박스 격자 — 제품명 | 감시시각 | 시편Fe | 시편SUS | 제품통과 | 제품+시편Fe | 제품+시편SUS
          const gx = [M, M + 26, M + 40, M + 67, M + 94, M + 117, M + 148.5, M + 180];
          const gridLine = (yy, h) => { bx(M, yy, CW, h); for (let i = 1; i < gx.length - 1; i++) vline(gx[i], yy, h); };
          const gridHead = () => {
            if (y + 12 > PH - 12) { doc.addPage(); y = M; }
            gridLine(y, 12);
            const hd = (t, i, dy) => drawText(t, gx[i], y + dy, 7, 'bold', '#222', gx[i + 1] - gx[i], 'center');
            hd('제품명', 0, 4.5); hd('감시시각', 1, 4.5);
            hd('시편 철(Fe)', 2, 2); hd('좌 . 중 . 우', 2, 6.5);
            hd('시편 써스(SUS)', 3, 2); hd('좌 . 중 . 우', 3, 6.5);
            hd('제품 통과', 4, 4.5);
            hd('제품+시편(Fe)', 5, 1.2); hd('상단 + 하단', 5, 4.8); hd('좌 . 중 . 우', 5, 8.2);
            hd('제품+시편(Sus)', 6, 1.2); hd('상단 + 하단', 6, 4.8); hd('좌 . 중 . 우', 6, 8.2);
            y += 12;
          };
          gridHead();
          const RH = 8.6;
          skel.forEach(row => {
            if (y + RH > PH - 12) { doc.addPage(); y = M; gridHead(); }
            gridLine(y, RH);
            const d = row.d;
            const specOnly = row.spec || (d && d.제품통과 == null && !d.제품시편Fe);
            drawText(row.label, gx[0] + 1, y + 2.6, 7.2, row.label === prodName && row.label ? 'bold' : 'normal', '#222', gx[1] - gx[0] - 2);
            drawText(d && d.시각 ? d.시각 : ':', gx[1], y + 2.6, 7.5, 'normal', '#222', gx[2] - gx[1], 'center');
            const cy = y + (RH - 2.4) / 2;
            ckPair(gx[2], gx[3] - gx[2], cy, d ? g3(d.시편Fe) : null, NM.시편Fe);
            ckPair(gx[3], gx[4] - gx[3], cy, d ? g3(d.시편SUS) : null, NM.시편SUS);
            if (!specOnly) {
              ckPair(gx[4], gx[5] - gx[4], cy, d ? (d.제품통과 || null) : null, NM.제품통과);
              ckPair(gx[5], gx[6] - gx[5], cy, d ? g6(d.제품시편Fe) : null, NM.제품시편Fe);
              ckPair(gx[6], gx[7] - gx[6], cy, d ? g6(d.제품시편SUS) : null, NM.제품시편SUS);
            }
            y += RH;
          });

          // ⑦ 금속검출기 제품통과 표
          if (y + 34 > PH - 12) { doc.addPage(); y = M; }
          bx(M, y, CW, 6.5);
          drawText('금속검출기 제품통과', M, y + 1.6, 8.5, 'bold', '#222', CW, 'center');
          y += 6.5;
          const px = [M, M + 46, M + 92, M + 136, M + 180];
          const pline = (yy, h) => { bx(M, yy, CW, h); for (let i = 1; i < px.length - 1; i++) vline(px[i], yy, h); };
          pline(y, 6);
          ['품  명', '통과량', '통과수량', '특이사항'].forEach((t, i) => drawText(t, px[i], y + 1.4, 7.5, 'bold', '#222', px[i + 1] - px[i], 'center'));
          y += 6;
          pline(y, 7);
          [prodName, stepData.통과량 || '', stepData.통과량 || stepData.검출량 || '', stepData.특이사항 || 'X'].forEach((t, i) => drawText(String(t), px[i], y + 2, 7.5, 'normal', '#222', px[i + 1] - px[i], 'center'));
          y += 7;
          pline(y, 7); y += 7;

          // ⑧ 이탈내역 및 개선조치 인수인계, 특이사항
          const devTxt = [stepData.이탈내용 ? `이탈내용: ${stepData.이탈내용}` : '', stepData.개선조치 ? `개선조치: ${stepData.개선조치}` : ''].filter(Boolean).join('\n');
          const dvH = Math.max(measureH(devTxt || ' ', 7.5, 'normal', CW - 50) + 4, 13);
          if (y + dvH > PH - 12) { doc.addPage(); y = M; }
          bx(M, y, CW, dvH); vline(M + 46, y, dvH);
          drawText('이탈내역 및 개선조치\n인수인계, 특이사항', M + 4, y + dvH / 2 - 5, 7.5, 'normal', '#222', 40);
          if (devTxt) drawText(devTxt, M + 49, y + 2, 7.5, 'normal', '#c62828', CW - 52);
          y += dvH;
          if (stepData._migrated) { const mr = drawText('※ 구(舊) 7단계 기록에서 자동 변환됨 — 위치값은 정상 기본값으로 보정', M, y + 1, 8, 'normal', '#999', CW); y = mr.y + mr.h + 1; }
          y += 3;
        } else {
          // ── 구 양식 (legacy: ccpTotal / passCount / failCount / times) ──

        const endT = normFreezeTemp(stepData.종료온도), prodT = normFreezeTemp(stepData.제품온도);

        y += 6;

        y += 3;
        // ⑥ 출하 이력 — 제품번호(LOT개별)별 출하 시 냉동창고 온도 (출하기록 연동)
        if (shipRecs && shipRecs.length) {

// PDF 생성 → Drive 저장 → 작업지시서 URL 기록
async function generateAndSaveWOPdf(woId) {
  console.log(`[PDF] 작업지시서 PDF 생성 시작: ${woId}`);
  try {
    const { pdfBlob, fileName } = await generateWOPdf(woId);
    console.log(`[PDF] PDF 생성 완료: ${fileName} (${(pdfBlob.size/1024).toFixed(1)}KB)`);

    // 기존 pdfUrl 의 파일을 덮어쓰기(중복 방지) — fileId 추출
    let existingFileId = null;
    try {
      const _wos = await SheetsAPI.getAll('작업지시서');
      const _wo = _wos.find(w => w[0] === woId);
      if (_wo && _wo[19]) existingFileId = (typeof extractFileId === 'function' ? extractFileId(String(_wo[19])) : ((String(_wo[19]).match(/\/d\/([\w-]+)/) || [])[1] || null));
    } catch (e) {}

    // Drive 업로드 (기존 파일 있으면 덮어쓰기 → 같은 링크 유지)
    const { url } = await DriveAPI.uploadPdf(pdfBlob, fileName, existingFileId);
    console.log(`[PDF] Drive 업로드 완료: ${url}`);

    // 작업지시서 col 19 (pdfUrl) 에 저장
    await SheetsAPI.updateRow('작업지시서', 0, woId, { 19: url });
    console.log(`[PDF] 작업지시서 pdfUrl 저장 완료`);

    return url;
  } catch (e) {
    console.error(`[PDF] PDF 생성/저장 실패:`, e);
    throw e;
  }
}

/* 전체 작업지시서 PDF 일괄 재생성 (관리자) — 저장된 PDF(pdfUrl 있는 WO)를 모두 최신 양식으로 다시 생성·Drive 갱신 */
async function regenerateAllWOPdfs() {
  if (State.user?.role !== 'admin') { toast('관리자 전용입니다', 'err'); return; }
  const wos = await SheetsAPI.getAll('작업지시서', false).catch(() => []);
  const targets = wos.filter(w => w[19] && String(w[19]).trim() && w[12] !== '삭제');
  if (!targets.length) { toast('재생성 대상(저장된 PDF)이 없습니다', 'warn'); return; }
  confirm('전체 PDF 재생성', `저장된 작업지시서 PDF ${targets.length}건을 모두 최신 양식으로 다시 생성합니다.\n건당 수 초 걸리며 완료까지 화면을 닫지 마세요.\n\n진행하시겠습니까?`, async () => {
    if (!acquireLock('regenAll')) return;
    const prog = $id('regen-progress');
    let done = 0, fail = 0;
    for (const wo of targets) {
      if (prog) prog.innerHTML = `<b>재생성 중...</b> ${done + fail + 1}/${targets.length} — ${wo[0]} (성공 ${done} · 실패 ${fail})`;
      try { await generateAndSaveWOPdf(wo[0]); done++; }
      catch (e) { fail++; console.warn('[재생성 실패]', wo[0], e); }
    }
    SheetsAPI.invalidateCache('작업지시서');
    if (prog) prog.innerHTML = `✅ 완료 — 성공 ${done}건 · 실패 ${fail}건`;
    toast(`전체 PDF 재생성 완료 — 성공 ${done} · 실패 ${fail}`, fail ? 'warn' : 'suc', 5000);
    releaseLock('regenAll');
  });
}

// 냉동 온도 정규화 — 냉동고 온도는 항상 영하: 양수 입력(예: "18")은 −로 자동 보정, 소수 1자리 고정.
// 예: '18'→-18, '-18.25'→-18.3, '18°C'→-18, ''→null
function normFreezeTemp(v) {
  if (v === '' || v == null) return null;
  let t = parseFloat(String(v).replace(/°C|℃/g, '').trim());
  if (isNaN(t)) return null;
  if (t > 0) t = -t;
  return -(Math.round(-t * 10) / 10);   // 음수 .5 도 통상 반올림(−18.25→−18.3, JS Math.round 의 +∞ 편향 보정)
}
function fmtFreezeTemp(v) { const t = normFreezeTemp(v); return t == null ? '-' : `${t.toFixed(1)}°C`; }

// 동결온도 CCP-1 판정: 제품온도 ≤ −18℃ AND 냉동 ≥ 12h → 적합 (양수 오입력은 정규화 후 판정)
function ccpFreezeJudge(prodTemp, freezeHours) {
  const t = normFreezeTemp(prodTemp);
  if (t == null) return '';
  return (t <= -18 && freezeHours >= 12) ? '적합' : '부적합';
}

async function ccpFillSave(woId) {

      if (!time) { toast(`${gb} 시각을 입력하세요`, 'err'); releaseLock('ccpFill'); return; }
      const ok = $id(`cf-${woId}-${gb}-ok`)?.checked;
      if (!ok) { toast(`${gb}: 이탈(불검출)은 작업 화면에서 정밀 입력하세요 — 보완입력은 정상 기록 전용`, 'warn', 5000); releaseLock('ccpFill'); return; }
      const row = { 구분: gb, 시각: time, 시편Fe: a3(), 시편SUS: a3() };
      if (gb !== '작업시작전' && gb !== '작업종료') { row.제품통과 = '불검출'; row.제품시편Fe = { 상: a3(), 하: a3() }; row.제품시편SUS = { 상: a3(), 하: a3() }; }
      newRows.push(row);
    }

    const order = { 작업시작전: 0, 작업명: 1, 작업중2h: 2, 작업종료: 3 };
    sd.checks.sort((a, b) => (order[a.구분] ?? 9) - (order[b.구분] ?? 9));
    if (!sd.제품명) sd.제품명 = '물반죽';
    sd._ccpFill = 'manual-v1';
    await SheetsAPI.updateRowByIndex('공정기록', d.rowIdx, { 5: JSON.stringify(sd) });

  finally { hideLoading(); releaseLock('ccpFill'); }

async function approveWO(woId) {
  confirm('출하승인', '냉동 12시간이 경과되었습니다.\n출하승인하시겠습니까? 완제품 재고로 등록됩니다.', async () => {
    if (!acquireLock('approveWO')) return;
    try {
      showLoading();
      // 캐시 무효화 후 최신 상태 확인 (동시 승인/거부 경합 방지)
      SheetsAPI.invalidateCache('작업지시서');
      const wos = await SheetsAPI.getAll('작업지시서', false);
      const wo = wos.find(w => w[0] === woId && w[12] !== '삭제');
      if (!wo) throw new Error('WO not found');
      // 상태 전이 검증: 냉동보관중/승인대기에서만 승인 가능
      const validStatuses = ['냉동보관중', '승인대기'];
      if (!validStatuses.includes(wo[12])) {
        toast(`현재 상태가 "${wo[12]}"입니다. 승인할 수 없는 상태입니다.`, 'err', 4000);
        hideLoading(); return;
      }

      // 12시간 재검증
      const freezeStart = wo[11] ? new Date(wo[11]) : null;
      const freezeHours = freezeStart ? (new Date() - freezeStart) / (1000*60*60) : 0;
      if (freezeHours < 12) {
        toast(`냉동 ${freezeHours.toFixed(1)}시간 경과. 12시간 이후 승인 가능합니다.`, 'err');
        hideLoading();
        return;
      }

      // 동결온도 CCP-1: 출하 승인 시점에 자동 판정·기록 (수기 종료기록 단계 제거).
      //   종료 냉동고 온도 = 센서 최근값(getShipFreezerStamp). 제품온도 = 냉동고온도와 동일(12h+ 평형).
      //   실제 출하 시점 온도는 각 제품 출하 시 출하기록에 별도로 남는다(콜드체인 증빙).
      try {
        const _stamp = await getShipFreezerStamp();
        const _endTempN = _stamp ? normFreezeTemp(_stamp.temp) : null;
        // 센서 온도가 없으면 '적합'으로 위장하지 않는다 — 온도 근거 없는 CCP 적합 판정 금지.
        //   (업무 중단을 막기 위해 승인 자체는 허용하되, 기록은 '온도미확인'으로 사실대로 남기고 경고한다.
        //    비상계획: 수기 실측 → 이탈내용/개선조치란에 측정값·사유 기재)
        const _judge = _endTempN != null ? ccpFreezeJudge(_endTempN, freezeHours) : '온도미확인';
        if (_judge === '온도미확인') {
          toast(`⚠ ${CCP.FREEZE.no} 온도 근거 없음 — 냉동고 센서값 미수집. 비상계획에 따라 수기 실측값을 기록하세요.`, 'err', 6000);
        }
        if (_judge === '부적합') {
          toast(`동결온도 CCP 부적합 — 냉동고 온도 ${_endTempN.toFixed(1)}℃ (한계 −18℃). 냉동 상태 점검 후 재시도하세요.`, 'err', 5000);
          hideLoading(); return;
        }
        // store 공정기록 stepData 에 동결 완료기록 자동 병합 (종료시각 = 승인시각)
        const _srows = await SheetsAPI.getAll('공정기록', false);
        const _gi = _srows.findIndex(r => r[0] === woId && r[3] === 'store');
        if (_gi >= 0) {
          let _sd = {}; try { _sd = JSON.parse(_srows[_gi][5] || '{}'); } catch (e) {}
          Object.assign(_sd, {
            종료시각: formatDateTime(),
            종료온도: _endTempN != null ? `${_endTempN.toFixed(1)}°C` : '',
            제품온도: _endTempN != null ? `${_endTempN.toFixed(1)}°C` : '',
            제품온도근거: '냉동고 온도와 동일(12h+ 동결 평형) · 실제 출하 시점 온도는 각 제품 출하기록 참조',
            판정: _judge,
            이탈내용: $id('freeze-dev')?.value || _sd.이탈내용 || '',
            개선조치: $id('freeze-action')?.value || _sd.개선조치 || '',
            _fmt: 'ccpFreeze-v1', _sensorAuto: _endTempN != null, _autoOnApprove: true,
            _tempMissing: _endTempN == null   // 온도 근거 없음(센서 미수집) — 감사 시 식별용
          });
          await SheetsAPI.updateRowByIndex('공정기록', _gi + 2, { 5: JSON.stringify(_sd) });
        }
      } catch (e) { console.warn('[승인] 동결 종료기록 자동 저장 실패(비차단):', e); }

      const packCount = parseInt(wo[7]) || 50;
      const qty = parseFloat(wo[5]) || 50;
      const fgItemCode = wo[3] || 'FG002';

      // 생산일 = WO 시작시간(wo[9]) 기준 (실제 제조일)
      const prodDateStr = wo[9] || wo[10] || formatDate();
      const prodDate = new Date(prodDateStr);
      // 소비기한 = 생산일 + 6개월
      const expDt = new Date(prodDate);
      expDt.setMonth(expDt.getMonth() + 6);
      const expDate = formatDate(expDt);
      const productionDate = formatDate(prodDate);

      // FG LOT ID: QR라벨 단계에서 사전 생성된 ID가 있으면 재사용, 없으면 새로 채번
      let fgLotId = wo[14] || '';
      if (!fgLotId || !fgLotId.startsWith('FG-')) {
        fgLotId = await generateLotId('FG', fgItemCode, expDate, '완제품LOT', 0, productionDate);
      } else {
        console.log(`[승인] 사전 생성된 FG LOT ID 재사용: ${fgLotId}`);
      }

      // ⚠ Race-condition Self-Healing (PR #27)
      //   동시 채번으로 같은 ID 가 다른 WO 와 겹쳤는지 검증.
      //   내 WO 의 row 가 시트에서 첫째가 아니면 새 ID 자동 발급.
      //   채번 atomicity 불가한 Sheets API 한계를 승인 시점 정정으로 보완.
      SheetsAPI.invalidateCache('완제품LOT');
      const allFgLots = await SheetsAPI.getAll('완제품LOT', false);
      const sameIdRows = allFgLots.filter(l => l[0] === fgLotId);
      const myRowIdx = sameIdRows.findIndex(l => l[7] === woId);
      if (sameIdRows.length > 0 && myRowIdx !== 0) {
        // 충돌 — 다른 WO 가 같은 ID 를 먼저 점유한 상태
        console.warn(`[승인] LOT ID ${fgLotId} 충돌 감지 (다른 WO 가 점유) → 새 ID 자동 발급`);
        toast(`⚠ LOT ID 충돌 감지 — 새 ID 자동 발급`, 'warn', 3000);
        const newId = await generateLotId('FG', fgItemCode, expDate, '완제품LOT', 0, productionDate);
        // 안전 검증: 새 ID 도 비어있어야 함
        const newIdConflict = allFgLots.find(l => l[0] === newId);
        if (newIdConflict) {
          // 극히 드문 경우 — 한 번 더 짧은 지연 후 재발급
          await new Promise(r => setTimeout(r, 500 + Math.random() * 300));
          fgLotId = await generateLotId('FG', fgItemCode, expDate, '완제품LOT', 0, productionDate);
        } else {
          fgLotId = newId;
        }
        console.log(`[승인] 충돌 정정: ${wo[14]} → ${fgLotId}`);
      }

      // 1. Update WO — 출하가능 상태로 (충돌 정정된 fgLotId 반영)
      await SheetsAPI.updateRow('작업지시서', 0, woId, {
        12: '출하가능',
        14: fgLotId,
        15: State.user?.email,
        16: formatDateTime(),
      });

      // 2. FG LOT 생성 또는 placeholder 갱신
      //    QR라벨 단계에서 atomic claim으로 placeholder('채번예약') 적재된 경우 → updateRow
      //    없으면(레거시 경로) → append
      SheetsAPI.invalidateCache('완제품LOT');
      const existingFgLot = (await SheetsAPI.getAll('완제품LOT', false)).find(l => l[0] === fgLotId);
      if (existingFgLot && existingFgLot[9] === '채번예약') {
        // placeholder 행 갱신 — 이미 row 존재 (race-safe)
        await SheetsAPI.updateRow('완제품LOT', 0, fgLotId, {
          2: wo[4] || '앙호두 (호두과자 전용반죽)',
          3: qty,
          4: wo[6] || '1kg',
          5: productionDate,
          6: expDate,
          7: woId,
          8: String(packCount),
          9: '출하가능',
          10: packCount,
          11: '냉동 -18°C'
        });
        console.log(`[승인] placeholder 갱신: ${fgLotId}`);
      } else if (!existingFgLot) {
        // 레거시 경로 — placeholder 없으면 신규 append
        await SheetsAPI.append('완제품LOT', [
          fgLotId, fgItemCode, wo[4] || '앙호두 (호두과자 전용반죽)', qty, wo[6] || '1kg',
          productionDate, expDate, woId, String(packCount), '출하가능', packCount, '냉동 -18°C'
        ]);
        console.log(`[승인] FG LOT 신규 append: ${fgLotId}`);
      } else {
        // 같은 ID 의 row 가 '채번예약' 이외 상태로 있음 — 중복 방지: append 하지 않고 갱신
        console.warn(`[승인] FG LOT 이미 존재 (status=${existingFgLot[9]}) — append 스킵, 갱신만`);
        await SheetsAPI.updateRow('완제품LOT', 0, fgLotId, {
          3: qty, 7: woId, 8: String(packCount), 9: '출하가능', 10: packCount
        });
      }

      // 3. Create FG individual QR records
      //    재발 방지: 같은 lotId 의 개별이 이미 있으면 중복 생성 차단 (idempotent)
      //    원인이 될 수 있는 경로: 더블 클릭 / 네트워크 재시도 / race
      SheetsAPI.invalidateCache('완제품개별');
      const existingIndivs = await SheetsAPI.getAll('완제품개별', false);
      const existingForLot = existingIndivs.filter(iv => iv[1] === fgLotId);
      if (existingForLot.length > 0) {
        console.warn(`[승인] FG LOT ${fgLotId} 의 개별 ${existingForLot.length}개 이미 존재 — 중복 생성 차단`);
        toast(`⚠ 개별 이미 존재 (${existingForLot.length}개) — 중복 생성 차단`, 'warn', 3000);
      } else {
        const indivRows = [];
        for (let i = 1; i <= packCount; i++) {
          const fgIndivId = `${fgLotId}-${String(i).padStart(2,'0')}`;
          indivRows.push([fgIndivId, fgLotId, fgItemCode, '출하가능', '', '', qrImageUrl(fgIndivId)]);
        }
        await SheetsAPI.append('완제품개별', indivRows);
      }

      toast(`출하승인 완료! ${fgLotId} 완제품 재고 등록 (QR ${packCount}개)`, 'suc', 5000);

      // PDF 자동 생성 (백그라운드 — 실패해도 승인 흐름 중단하지 않음)
      generateAndSaveWOPdf(woId).then(pdfUrl => {
        toast('📄 작업지시서 PDF 저장 완료', 'suc', 3000);
      }).catch(e => {
        console.error('[PDF] 자동 생성 실패:', e);
        toast('⚠️ PDF 생성 실패 — 상세 화면에서 재시도 가능', 'warn', 4000);
      });

      Router.go('production');

    } catch (e) {
      toast('승인 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
      releaseLock('approveWO');
    }
  });
}

async function rejectWO(woId, action) {
  const reason = $id('reject-reason')?.value || '';
  if (!reason.trim()) { toast('거부 사유를 입력하세요', 'err'); return; }
  if (!acquireLock('rejectWO')) return;

  try {
    showLoading();
    // 거부 처리 전 — 연결된 FG LOT placeholder 가 있으면 정리 (atomic claim 잔여물 방지)
    const wos = await SheetsAPI.getAll('작업지시서').catch(() => []);
    const wo = wos.find(w => w[0] === woId);
    const fgLotId = wo?.[14] || '';
    if (fgLotId && fgLotId.startsWith('FG-')) {

    toast('처리 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
    releaseLock('rejectWO');
  }
}

// ─── 폐기 처리 (스캔 후) ───
async function processDisposal(itemId, lotId, type, itemName) {
  // 폐기 사유 입력 — 커스텀 모달 (CON-013: prompt() 대체)
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog" style="max-width:340px">
      <div class="d-title">폐기 사유 입력</div>
      <div class="d-msg">${itemId} · ${itemName}</div>
      <div class="input-group" style="margin-bottom:12px">
        <textarea id="disposal-reason" rows="3" placeholder="폐기 사유를 입력하세요" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px"></textarea>
      </div>
      <div class="d-actions">
        <button class="btn btn-sm btn-outline btn-gray" id="disposal-cancel">취소</button>
        <button class="btn btn-sm btn-err" id="disposal-ok">폐기 진행</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#disposal-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#disposal-ok').onclick = () => {
    const reason = overlay.querySelector('#disposal-reason').value?.trim();
    if (!reason) { toast('폐기 사유를 입력해야 합니다', 'err'); return; }
    overlay.remove();
    _executeDisposal(itemId, lotId, type, itemName, reason);
  };
}

async function _executeDisposal(itemId, lotId, type, itemName, reason) {

  confirm('폐기 처리', `${itemId}\n${itemName}\n사유: ${reason}\n\n정말 폐기하시겠습니까?`, async () => {
    if (!acquireLock('executeDisposal')) return;
    try {
      showLoading();
      const isFG = type === '완제품';
      const isRM = type === '원재료';
      const isSP = type === '소모품';

      // 개별 레코드 상태 변경
      if (isFG) {
        await SheetsAPI.updateRow('완제품개별', 0, itemId, { 3: '폐기', 4: formatDateTime(), 5: `폐기:${reason}` });
      } else if (isRM) {
        await SheetsAPI.updateRow('원재료개별', 0, itemId, { 3: '폐기', 4: formatDateTime(), 5: `폐기:${reason}` });
      } else if (isSP && lotId) {
        // 소모품은 LOT 단위
        await SheetsAPI.updateRow('소모품LOT', 0, lotId, { 7: '폐기' });
      }

      // LOT 잔량 + 상태 업데이트 (개별 폐기 시) — 캐시 무효화 후 fresh 데이터 (CON-014)
      if ((isRM || isFG) && lotId) {
        const lotTab = isFG ? '완제품LOT' : '원재료LOT';
        const indivTab = isFG ? '완제품개별' : '원재료개별';
        SheetsAPI.invalidateCache(indivTab);
        SheetsAPI.invalidateCache(lotTab);
        const lots = await SheetsAPI.getAll(lotTab, false);
        const lot = lots.find(l => l[0] === lotId);
        if (lot) {
          const indivs = await SheetsAPI.getAll(indivTab, false);
          const activeIndivs = indivs.filter(iv => iv[1] === lotId && !['폐기','소진','출하완료','입고취소'].includes(iv[3]));
          const newStatus = activeIndivs.length === 0 ? '소진' : lot[9];
          if (isFG) {
            // 완제품: 잔량 = 활성 개별 수
            await SheetsAPI.updateRow(lotTab, 0, lotId, { 8: String(activeIndivs.length), 9: newStatus });
          } else {
            // 원재료: 잔량 = 활성 개별 수 × perUnit (개별 실제 수량 기반)
            const sampleIndiv = indivs.find(iv => iv[1] === lotId);
            const totalQty = parseFloat(lot[4]) || 0;
            const perUnit = sampleIndiv ? (parseFloat(sampleIndiv[4]) || totalQty / (parseInt(lot[10]) || 1))
                                        : totalQty / (parseInt(lot[10]) || 1);
            const newRemain = Math.round(activeIndivs.length * perUnit * 100) / 100;
            await SheetsAPI.updateRow(lotTab, 0, lotId, { 8: String(newRemain), 9: newStatus });
          }
        }
      }

      toast(`폐기 완료: ${itemId}`, 'suc');
      setTimeout(() => Router.go('qr-scan'), 1500);
    } catch (e) {
      toast('폐기 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
      releaseLock('executeDisposal');
    }
  });
}

// ─── 출하 처리 (스캔 후) ───
/* 출하시점 냉동창고 온도 자동 스탬프 — 동결온도로그(Tuya 센서 10분 자동기록)에서 최신 '냉동창고' 값.
   출하기록 I·J열에 온도·측정시각으로 적재(수동 입력 0·누락 0). 반환 null=기록 없음. */
async function getShipFreezerStamp() {
  try {
    const rows = (await SheetsAPI.getAll('동결온도로그', false).catch(() => [])) || [];
    /* 최근 6시간 안의 값을 쓰되, 성애 제거·문 열림처럼 <b>사유가 기록된 순간 이탈</b>은 건너뛴다.
       (제상 중 한 건이 잡혀 CCP 부적합 → 출하 차단되던 문제. 사유 없는 이탈은 그대로 채택해 차단된다) */
    let pick = pickFreezerTemp(rows, Date.now(), { mode: 'latest', beforeMs: 6 * 3600 * 1000, afterMs: 0 });
    if (!pick) {   // 6시간 내 기록 없음 → 예전처럼 전 구간 최근값(오래된 값은 warnShipStamp 가 경고)
      let best = null;
      rows.forEach(r => {
        if (!String(r[2] || r[1] || '').includes('냉동창고')) return;
        const ts = parseLogTs(r[0]), t = tempNum(r[3]);
        if (!ts || isNaN(t)) return;
        if (!best || ts > best.ts) best = { ts, temp: t, at: String(r[0] || '') };
      });
      if (!best) return null;
      pick = { temp: best.temp, at: best.at, dev: best.temp > -18, basis: '최근값', excluded: [] };
    }
    const ts = parseLogTs(pick.at);
    // productTemp = 냉동창고 온도와 동일 (12h+ 동결로 심부온도 평형 — 별도 탐침 측정 없이 센서 온도 참조; 작업기록서 출하시점 추적과 일치)
    return { temp: pick.temp.toFixed(1), at: pick.at, ageMin: Math.round((Date.now() - ts) / 60000),
             productTemp: pick.temp.toFixed(1), method: '냉동창고와 동일', excluded: pick.excluded || [] };
  } catch (e) { console.warn('[출하온도]', e); return null; }
}
function warnShipStamp(stamp) {
  if (!stamp) toast('⚠ 냉동창고 온도 기록 없음 — 출하기록에 온도 없이 진행(센서 확인)', 'warn', 4000);
  else if (stamp.ageMin > 30) toast(`⚠ 냉동창고 온도가 ${stamp.ageMin}분 전 측정값입니다 (센서 확인 권장)`, 'warn', 4000);
}

/* LOT 전체 출하 실행 — 모든 '출하가능' 개별을 출하완료로 일괄 갱신.
   각 개별별 출하기록 행 + 상태 변경 + LOT 잔량/상태 업데이트 + WO 출하완료 전환. */
async function executeLotShipment(lotId, itemName, customerName, customerCode) {
  if (!acquireLock('executeLotShipment')) return;
  try {
    showLoading();
    SheetsAPI.invalidateCache('완제품개별');
    SheetsAPI.invalidateCache('완제품LOT');
    const allIndivs = await SheetsAPI.getAll('완제품개별', false);
    const targetIndivs = allIndivs.filter(iv => iv[1] === lotId && iv[3] === '출하가능');
    if (targetIndivs.length === 0) {
      toast(`${lotId}: 출하가능 상태인 개별이 없습니다`, 'err');
      return;
    }
    const shipTime = formatDateTime();
    const shipperEmail = State.user?.email || '';
    const tempStamp = await getShipFreezerStamp();   // 출하시점 냉동창고 온도 자동 스탬프
    warnShipStamp(tempStamp);

    // 1. 출하기록 일괄 append + 각 개별 행 인덱스 수집
    const shipRows = [];
    const indivUpdates = [];
    for (const iv of targetIndivs) {
      const shipId = await generateSeqId('SHP', '출하기록');
      shipRows.push([shipId, lotId, iv[0], customerName, '1', 'ea', shipTime, shipperEmail, tempStamp ? `${tempStamp.temp}°C` : '', tempStamp ? tempStamp.at : '', tempStamp ? `${tempStamp.productTemp}°C` : '', tempStamp ? tempStamp.method : '']);
      const idx = await SheetsAPI.findRowIndex('완제품개별', 0, iv[0]);
      if (idx > 0) {
        indivUpdates.push({ range: `완제품개별!D${idx}`, values: [['출하완료']] });
        indivUpdates.push({ range: `완제품개별!E${idx}`, values: [[shipTime]] });
        indivUpdates.push({ range: `완제품개별!F${idx}`, values: [[shipperEmail]] });
      }
    }
    // 출하기록 한꺼번에 append
    if (shipRows.length > 0) await SheetsAPI.append('출하기록', shipRows);
    // 개별 상태 batchUpdate
    if (indivUpdates.length > 0) await SheetsAPI.batchUpdate(indivUpdates);

    // 2. LOT 잔량/상태 갱신
    SheetsAPI.invalidateCache('완제품개별');
    const refreshed = await SheetsAPI.getAll('완제품개별', false);
    const lotIndivs = refreshed.filter(iv => iv[1] === lotId);
    const remainCount = lotIndivs.filter(iv => !['출하완료','폐기','입고취소','삭제'].includes(iv[3])).length;
    const lotIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
    if (lotIdx > 0) {
      const lotBatch = [{ range: `완제품LOT!I${lotIdx}`, values: [[String(remainCount)]] }];
      if (remainCount === 0) lotBatch.push({ range: `완제품LOT!J${lotIdx}`, values: [['출하완료']] });
      await SheetsAPI.batchUpdate(lotBatch);
    }

    // 3. WO 출하완료 전환 (LOT 전체 소진 시)
    if (remainCount === 0) {
      try {
        const wos = await SheetsAPI.getAll('작업지시서');
        const wo = wos.find(w => w[14] === lotId && (w[12] === '출하가능' || w[12] === '냉동보관중'));
        if (wo) await SheetsAPI.updateCell('작업지시서', 0, wo[0], 12, '출하완료');
      } catch (e) { console.warn('WO 상태 전환 실패:', e); }
    }

    SheetsAPI.invalidateCache('완제품LOT');
    SheetsAPI.invalidateCache('완제품개별');
    toast(`${lotId} 전체 출하 완료 — ${targetIndivs.length}개 → ${customerName}${tempStamp ? ` · 냉동고 ${tempStamp.temp}°C 자동기록` : ''}`, 'suc', 4000);
    refreshAfterShipment(lotId, 800);
  } catch (e) {
    toast('전체 출하 실패: ' + e.message, 'err', 5000);
    console.error('[executeLotShipment]', e);
  } finally {
    hideLoading();
    releaseLock('executeLotShipment');
  }
}

async function executeShipment(indivId, lotId, itemName, customerName, customerCode) {
  if (!acquireLock('executeShipment')) return;
  try {
    showLoading();

    // ── 서버 사이드 상태 재검증 (중복 출하/이미 폐기된 항목 차단) ──
    SheetsAPI.invalidateCache('완제품개별');
    const freshIndivs = await SheetsAPI.getAll('완제품개별', false);
    const currentIndiv = freshIndivs.find(iv => iv[0] === indivId);
    if (!currentIndiv) { toast('해당 항목을 찾을 수 없습니다', 'err'); return; }
    if (['출하완료','폐기','소진'].includes(currentIndiv[3])) {
      toast(`이미 ${currentIndiv[3]} 처리된 항목입니다. 중복 처리가 방지되었습니다.`, 'err', 4000);
      return;
    }

    const shipTime = formatDateTime();
    const tempStamp = await getShipFreezerStamp();   // 출하시점 냉동창고 온도 자동 스탬프
    warnShipStamp(tempStamp);

    // 1. 완제품개별 상태 + 출하기록을 병렬로 처리
    const shipId = await generateSeqId('SHP', '출하기록');
    const [indivRowIdx] = await Promise.all([
      SheetsAPI.findRowIndex('완제품개별', 0, indivId),
      SheetsAPI.append('출하기록', [
        shipId, lotId, indivId, customerName, '1', 'ea', shipTime, State.user?.email, tempStamp ? `${tempStamp.temp}°C` : '', tempStamp ? tempStamp.at : '', tempStamp ? `${tempStamp.productTemp}°C` : '', tempStamp ? tempStamp.method : ''
      ])
    ]);

    // 2. 개별 상태 업데이트 (batchUpdate)
    if (indivRowIdx > 0) {
      await SheetsAPI.batchUpdate([
        { range: `완제품개별!D${indivRowIdx}`, values: [['출하완료']] },
        { range: `완제품개별!E${indivRowIdx}`, values: [[shipTime]] },
        { range: `완제품개별!F${indivRowIdx}`, values: [[State.user?.email || '']] },
      ]);
    }

    // 3. LOT 잔량 업데이트 (캐시 무효화 후 fresh 데이터)
    SheetsAPI.invalidateCache('완제품개별');
    const allIndivs = await SheetsAPI.getAll('완제품개별', false);
    const lotIndivs = allIndivs.filter(iv => iv[1] === lotId);
    const activeCount = lotIndivs.filter(iv => !['출하완료','폐기','입고취소','삭제'].includes(iv[3])).length;

    // 4. LOT remain + 상태를 한 번에 업데이트
    const lotRowIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
    if (lotRowIdx > 0) {
      const lotBatch = [{ range: `완제품LOT!I${lotRowIdx}`, values: [[String(activeCount)]] }];
      if (activeCount === 0) {
        lotBatch.push({ range: `완제품LOT!J${lotRowIdx}`, values: [['출하완료']] });
      }
      await SheetsAPI.batchUpdate(lotBatch);
    }

    // 5. LOT 전체 출하 시 WO 상태도 '출하완료'로 전환 (CON-010)
    if (activeCount === 0) {
      try {
        const wos = await SheetsAPI.getAll('작업지시서');
        const wo = wos.find(w => w[14] === lotId && (w[12] === '출하가능' || w[12] === '냉동보관중'));
        if (wo) {
          await SheetsAPI.updateCell('작업지시서', 0, wo[0], 12, '출하완료');
        }
      } catch (e) { console.warn('WO 상태 전환 실패:', e); }
    }

    toast(`출하 완료: ${indivId} → ${customerName}`, 'suc');
    if (State.currentScreen === 'qr-scan') {
      setTimeout(() => Router.go('qr-scan'), 1000);
    } else {
      refreshAfterShipment(lotId, 600);
    }
  } catch (e) {
    toast('출하 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
    releaseLock('executeShipment');
  }
}

/* ═══════════════════════════════════════════════
   APP INITIALIZATION
   ═══════════════════════════════════════════════ */
async function initApp() {
  // Load settings
  CONFIG.SHEET_ID = localStorage.getItem('mt_sheet_id') || CONFIG.SHEET_ID;
  // ⚠️ 키에 _v2 — 구 `mt_drive_folder` 에 저장된 Maynager 폴더 ID 가 07_공장 기본값을 덮어쓰면
  //    이미 설정을 저장한 기기만 계속 옛 위치에 업로드한다. 새 키로 갈아 그 경로를 끊는다.
  CONFIG.DRIVE_FOLDER_ID = localStorage.getItem('mt_drive_folder_v2') || CONFIG.DRIVE_FOLDER_ID;
  CONFIG.PDF_FOLDER_ID = localStorage.getItem('mt_pdf_folder_v2') || CONFIG.PDF_FOLDER_ID;

  // Check auth FIRST (before replaceState, to preserve OAuth callback hash)
  let hasToken = Auth.init();
  // SSO: 저장 토큰이 없으면(런처에서 막 진입 등) 동일 구글 세션으로 무화면 silent 로그인 1회 시도.
  // 성공 시 로그인 화면·버튼 클릭 없이 바로 진입(재로그인 번거로움 제거). 실패 시에만 아래 로그인 화면.
  if (!hasToken) {
    hasToken = await Auth.trySilentBoot();
  }

  // Set initial browser history state AFTER auth (prevents immediate exit on first back press)
  history.replaceState({ screen: 'init' }, '', window.location.href.split('#')[0] + '#init');

  if (hasToken) {
    showLoading();
    // Load user info
    const savedUser = localStorage.getItem('mt_user');
    if (savedUser) {
      State.user = JSON.parse(savedUser);
      applyRolePreview();
    }

    // Validate token
    const valid = await Auth.validateToken();
    if (!valid) {
      hideLoading();
      Auth.logout();
      return;
    }

    // If no user info yet, load it
    if (!State.user) {
      await Auth.loadUserInfo();
    }

    hideLoading();
    _checkFgLotIdIntegrity();   // 재발 방지: 시작 시 완제품LOT lotId 손상 비차단 점검

    // Check if Sheet ID is set
    if (!CONFIG.SHEET_ID) {
      Router.go('settings');
      toast('Google Sheets ID를 설정해주세요', 'warn');
      return;
    }

    // 풀투리프레시 / 페이지 리로드 후 마지막 화면 복원 시도, 없으면 dashboard
    if (!restoreLastScreen()) {
      Router.go('dashboard');
    }

    // LiveSync 초기화 — PC↔모바일 실시간 동기화
    LiveSync.init();

    // 새 버전 자동 감지 (배포 후 단말 캐시 stale 방지 — 서비스워커 없는 PWA 보완)
    setTimeout(() => { try { checkForUpdate(); } catch (e) {} }, 4000);

    // [제거됨] 냉동 상태 체크 — 관리자 승인 경로만 사용

    // ── 마이그레이션: 진행중 WO에 FG LOT ID 사전 채번 ──
    if (!localStorage.getItem('mt_migr_fg_lot_preassign')) {
      (async () => {
        try {
          const targetWOs = ['WO-20260421-001', 'WO-20260422-001', 'WO-20260422-002'];
          const allWO = await SheetsAPI.getAll('작업지시서');
          for (const woId of targetWOs) {
            const wo = allWO.find(r => r[0] === woId);
            if (!wo) { console.log(`[마이그레이션] ${woId} 미발견, skip`); continue; }
            if (wo[14] && wo[14].startsWith('FG-')) {
              console.log(`[마이그레이션] ${woId} 이미 FG LOT ID 존재: ${wo[14]}, skip`);
              continue;
            }
            // 생산일 = WO 시작시간(col9) 기준
            const prodDateStr = wo[9] || formatDate();
            const prodDate = new Date(prodDateStr);
            const productionDate = formatDate(prodDate);
            // 소비기한 = 생산일 + 6개월
            const expDate = new Date(prodDate);
            expDate.setMonth(expDate.getMonth() + 6);
            const expStr = formatDate(expDate);
            const fgItemCode = wo[3] || 'FG002';
            const fgLotId = await generateLotId('FG', fgItemCode, expStr, '완제품LOT', 0, productionDate);
            await SheetsAPI.updateCell('작업지시서', 0, woId, 14, fgLotId);
            console.log(`[마이그레이션] ${woId} → FG LOT ID 사전 채번 완료: ${fgLotId} (생산일: ${productionDate})`);
          }
          localStorage.setItem('mt_migr_fg_lot_preassign', '1');
          console.log('[마이그레이션] FG LOT ID 사전 채번 마이그레이션 완료');
        } catch (e) {
          console.error('[마이그레이션] FG LOT ID 사전 채번 실패:', e.message);
          // 실패 시 플래그 미설정 → 다음 로그인 시 재시도
        }
      })();
    }

    // ── LOT 잔량-개별 정합성 자동 체크 (매 로그인 시) ──
    (async () => {
      try {
        const rmLots = await SheetsAPI.getAll('원재료LOT');
        const rmIndivs = await SheetsAPI.getAll('원재료개별');
        const fgLots = await SheetsAPI.getAll('완제품LOT');
        const fgIndivs = await SheetsAPI.getAll('완제품개별');
        let fixCount = 0;

        // 원재료 LOT: 잔량 = 활성개별수 × perUnit, 상태 = 활성개별 기반
        for (const lot of rmLots) {
          const lotId = lot[0], totalQty = parseFloat(lot[4]) || 0;
          const remain = parseFloat(lot[8]) || 0;
          const status = lot[9] || '';
          const myIndivs = rmIndivs.filter(iv => iv[1] === lotId);
          const active = myIndivs.filter(iv => !['폐기','소진','입고취소'].includes(iv[3]));
          const consumed = myIndivs.filter(iv => iv[3] === '소진');
          // perUnit: 개별 항목의 실제 수량 우선 사용 (lot[10] 의존 제거)
          const sampleIndiv = myIndivs[0];
          const perUnit = sampleIndiv ? (parseFloat(sampleIndiv[4]) || totalQty / (parseInt(lot[10]) || 1))
                                      : totalQty / (parseInt(lot[10]) || 1);
          const correctRemain = Math.round(active.length * perUnit * 100) / 100;
          const correctStatus = active.length === 0 ? '소진' : (consumed.length > 0 ? '사용중' : '미사용');
          if (Math.abs(remain - correctRemain) > 0.01 || status !== correctStatus) {
            await SheetsAPI.updateRow('원재료LOT', 0, lotId, { 8: String(correctRemain), 9: correctStatus });
            console.log(`[정합성] ${lotId}: 잔량 ${remain}→${correctRemain}, 상태 ${status}→${correctStatus}`);
            fixCount++;
          }
        }

        // 완제품 LOT: remainQty = 활성개별수(냉동보관중+출하가능)
        for (const lot of fgLots) {
          const lotId = lot[0];
          const dbRemain = parseInt(lot[8]) || 0;
          const active = fgIndivs.filter(iv => iv[1] === lotId && ['냉동보관중','출하가능'].includes(iv[3]));
          if (dbRemain !== active.length) {
            await SheetsAPI.updateRow('완제품LOT', 0, lotId, { 8: String(active.length) });
            console.log(`[정합성] ${lotId}: remainQty ${dbRemain}→${active.length}`);
            fixCount++;
          }
        }

        if (fixCount > 0) {
          SheetsAPI.invalidateAllCache();
          console.log(`[정합성] ${fixCount}건 자동 보정 완료`);
        }
      } catch (e) {
        console.warn('[정합성] 체크 실패:', e.message);
      }
    })();

    // ── 완료된 마이그레이션 플래그 설정 (더 이상 실행 불필요) ──
    ['mt_migr_step2_check','mt_migr_qr_url_cleanup','mt_migr_gen_indiv_v2','mt_migr_lot_id_v1']
      .forEach(k => { if (!localStorage.getItem(k)) localStorage.setItem(k, '1'); });

  } else {
    Router.go('login');
  }
}

// ── 네트워크 상태 감지 (오프라인 작업 방지) ──
let _offlineBanner = null;
window.addEventListener('offline', () => {
  if (_offlineBanner) return;
  _offlineBanner = document.createElement('div');
  _offlineBanner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:var(--err,#e24b4a);color:#fff;text-align:center;padding:10px;font-size:14px;font-weight:600';
  _offlineBanner.textContent = '⚠ 네트워크 연결이 끊겼습니다. 데이터 저장이 불가능합니다.';
  document.body.prepend(_offlineBanner);
  // 모든 잠금 해제 (오프라인 상태에서 영구 잠금 방지)
  Object.keys(_actionLocks).forEach(k => { _actionLocks[k] = false; });
});
window.addEventListener('online', () => {
  if (_offlineBanner) { _offlineBanner.remove(); _offlineBanner = null; }
  toast('네트워크 연결이 복원되었습니다. 데이터를 새로고침합니다.', 'suc', 3000);
  // 캐시 전체 무효화 + 현재 화면 새로고침
  SheetsAPI.invalidateAllCache();
  setTimeout(() => Router.go(State.currentScreen || 'dashboard'), 1000);
});

// ── 브라우저 닫기/새로고침 시 진행 중 작업 경고 ──
window.addEventListener('beforeunload', (e) => {
  const hasActiveLock = Object.values(_actionLocks).some(v => v);
  if (hasActiveLock) {
    e.preventDefault();
    e.returnValue = '작업이 진행 중입니다. 페이지를 나가면 데이터가 손실될 수 있습니다.';
  }
});

// Start the app
initApp();

</script>
