let _selectedSopId = null;

function selectSOP(sopId) {
  _selectedSopId = sopId;

  // Show steps preview
  const steps = State.sopSteps.filter(s => s[0] === sopId);
  $id('wo-steps-preview').innerHTML = steps.map(s =>
    `<div style="padding:4px 0;border-bottom:1px solid var(--bg)">${s[1]}. ${s[2]||''}</div>`
  ).join('');

  updateWOCalc();
}

function updateWOCalc() {
  const qty = parseFloat($id('wo-qty')?.value) || 0;
  const unitSize = parseInt($id('wo-unit')?.value) || 1;
  const calcEl = $id('wo-calc');
  const totalEl = $id('wo-total-production');

  if (qty <= 0 || !_selectedSopId) {
    calcEl.style.display = 'none';
    if (totalEl) totalEl.style.display = 'none';
    return;
  }

  const totalKg = qty * unitSize;
  const recipes = State.sopRecipes.filter(r => r[0] === _selectedSopId);

  // 총 생산량 표시
  if (totalEl) {
    totalEl.style.display = '';
    totalEl.innerHTML = `
      <div class="info-box suc" style="margin-bottom:12px">
        <div class="fs-12 fw-6 c-suc">총 생산량</div>
        <div class="fs-20 fw-8 c-suc mt-4">${totalKg} kg</div>
        <div class="fs-11 c-txt-l mt-2">${qty}개 × ${unitSize}kg = ${totalKg}kg</div>
      </div>
    `;
  }

  calcEl.style.display = '';
  calcEl.innerHTML = `
    <div class="card info-box suc">
      <div class="fs-13 fw-7 c-suc mb-8">원재료 투입 목표 (배합비 × ${totalKg}kg × 1.01)</div>
      <div class="fs-12 c-txt-l mb-4">+1% 여유분 자동 반영</div>
      ${recipes.map(r => {
        const target = (parseFloat(r[3]) || 0) * totalKg * 1.01;
        const isEgg = (r[1]||'') === 'RM001';
        const eggCnt = isEgg ? Math.ceil(target * 1000 / 50) : 0;
        const eggPan = Math.floor(eggCnt / 30);
        const eggAl = eggCnt % 30;
        const eggTxt = eggCnt > 0 ? (eggPan > 0 && eggAl > 0 ? eggPan + '판 ' + eggAl + '알' : eggPan > 0 ? eggPan + '판' : eggAl + '알') : '';
        return `
          <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--gray-l)">
            <span class="fs-13">${r[2]||''} (${r[1]||''})</span>
            <span class="fs-13 fw-7 c-suc">${target.toFixed(2)} kg${eggTxt ? ' <span style="background:#fff8e1;border:1px solid #ffe082;border-radius:4px;padding:1px 6px;font-size:11px;color:#e65100">🥚 ' + eggTxt + '</span>' : ''}</span>
          </div>
        `;
      }).join('')}
      <div class="fs-11 c-txt-l mt-8">예상 포장 수: ${qty}개</div>
    </div>
  `;

  updateWOBomCheck();
}

/* ─── BOM 검증 + 권장 배치 사이즈 (200~350kg, 프리믹스 정수 포대) ───
   - 자재 부족 자재 빨간 카드로 경고 (작업 시작 차단 X — 정보 제공만)
   - 주 자재(배합비 최대 = 프리믹스) 기준 정수 ${포대} 단위로 가능한
     봉수 후보 중 200~350kg 범위 + 잔여 자재 최소 순 상위 3개 표시
   - "적용" 버튼으로 wo-qty input 갱신 → updateWOCalc 재호출 */
function updateWOBomCheck() {
  const bomEl = $id('wo-bom-rec');
  if (!bomEl) return;
  const qty = parseFloat($id('wo-qty')?.value) || 0;
  const unitSize = parseInt($id('wo-unit')?.value) || 5;
  const totalKg = qty * unitSize;
  if (!_selectedSopId || qty <= 0) { bomEl.style.display = 'none'; return; }

  const recipes = State.sopRecipes.filter(r => r[0] === _selectedSopId);
  if (recipes.length === 0) { bomEl.style.display = 'none'; return; }

  const rmLots = State.rawMaterialLots || [];
  const rmItems = State.rawMaterialItems || [];

  // 자재별 재고 비교 (물 RM002 는 관리대상 외 — 부족 표시 안 함)
  const checks = recipes.map(r => {
    const code = r[1];
    const ratio = parseFloat(r[3]) || 0;
    const need = ratio * totalKg * 1.01;
    const isWater = code === 'RM002';
    if (isWater) {
      return { code, name: r[2], ratio, need, stock: Infinity, isShort: false, shortKg: 0, isWater: true };
    }
    const stock = rmLots.filter(l => l[1] === code && !['폐기','입고취소'].includes(l[9]))
                       .reduce((s, l) => s + (parseFloat(l[8])||0), 0);
    return { code, name: r[2], ratio, need, stock,
             isShort: stock < need, shortKg: Math.max(0, need - stock), isWater: false };
  });
  const shortItems = checks.filter(c => c.isShort);

  // 주 자재 = 배합비 최대인 자재(= 프리믹스). 코드를 박지 않는다 — 공급사가 바뀌면 코드도 바뀐다.
  const main = recipes.reduce((a, b) => parseFloat(a[3]||0) > parseFloat(b[3]||0) ? a : b, recipes[0]);
  const mainItem = rmItems.find(i => i[0] === main[1]);
  const mainSkuP = parseSkuUnit(mainItem?.[3] || '');
  const mainRatio = parseFloat(main[3]) || 0;

  const recommendations = [];
  if (mainSkuP && mainSkuP.perUnit > 0 && mainRatio > 0) {
    // 정수 포대 단위로 200~350kg 완제품 가능한 후보 탐색
    for (let units = 1; units <= 50; units++) {
      const totalMixKg = units * mainSkuP.perUnit;
      // 이 포대 수로 만들 수 있는 최대 완제품 kg
      const maxFinishedKg = totalMixKg / (mainRatio * 1.01);
      if (maxFinishedKg < 200) continue;
      if (maxFinishedKg > 360) break;  // 후보 초과
      // 정수 봉수 (내림) — 잔여 자재 발생
      const bags = Math.floor(maxFinishedKg / unitSize);
      const finishedKg = bags * unitSize;
      if (finishedKg < 200 || finishedKg > 350) continue;
      const mixUsed = mainRatio * finishedKg * 1.01;
      const waste = totalMixKg - mixUsed;
      recommendations.push({ units, totalMixKg, finishedKg, bags, mixUsed, waste });
    }
    // 잔여 최소 → bags 큰 순으로 동률 분리
    recommendations.sort((a, b) => (a.waste - b.waste) || (b.bags - a.bags));
  }
  const top3 = recommendations.slice(0, 3);

  bomEl.style.display = '';
  bomEl.innerHTML = `
    <div class="card ${shortItems.length ? 'bl-err' : 'bl-suc'}" style="background:${shortItems.length ? '#fff5f5' : '#e8f5e9'};margin-top:12px">
      <div class="fs-13 fw-7 ${shortItems.length ? 'c-err' : 'c-suc'} mb-4">
        ${shortItems.length ? '⚠ 자재 재고 부족' : '✓ 자재 재고 충분'}
      </div>
      ${shortItems.length ? `
        ${shortItems.map(c => `
          <div class="fs-12" style="padding:3px 0">
            <span class="fw-6">${c.name} (${c.code})</span>
            <span class="c-err"> · 부족 ${c.shortKg.toFixed(2)}kg</span>
            <div class="fs-11 c-txt-l" style="margin-left:8px">필요 ${c.need.toFixed(2)}kg / 재고 ${c.stock.toFixed(2)}kg</div>
          </div>
        `).join('')}
        <div class="fs-11 c-txt-l mt-8" style="font-style:italic">⚠ 부족해도 작업 시작은 가능합니다 — 시작 전 입고 권장</div>
      ` : `
        <div class="fs-11 c-txt-l">필요 자재 모두 현재고 내 충족 (총 ${checks.length}종)</div>
      `}
    </div>

    ${top3.length > 0 ? `
      <div class="card" style="background:#f0f7ff;border-left:3px solid var(--pri);margin-top:8px">
        <div class="fs-13 fw-7 mb-4">📐 권장 배치 (${main[2]} 정수 ${mainSkuP.unitName} 단위)</div>
        <div class="fs-11 c-txt-l mb-8">200~350kg 범위 · 잔여 자재 최소 순 상위 3건</div>
        ${top3.map((r, i) => {
          const isCurrent = (qty === r.bags);
          return `
            <div class="row between" style="padding:8px 0;${i < top3.length-1 ? 'border-bottom:1px solid var(--bg)' : ''};align-items:center">
              <div style="flex:1">
                <div class="fs-13 fw-7">${r.bags}봉 (${r.finishedKg}kg)</div>
                <div class="fs-11 c-txt-l">${main[2]} ${r.units}${mainSkuP.unitName} (${r.totalMixKg}kg) · 잔여 ${r.waste.toFixed(2)}kg</div>
              </div>
              ${isCurrent ? '<span class="badge badge-suc">현재 입력</span>' :
                `<button class="btn btn-sm btn-pri" onclick="document.getElementById('wo-qty').value=${r.bags};updateWOCalc()" style="white-space:nowrap">적용</button>`}
            </div>
          `;
        }).join('')}
      </div>
    ` : (mainSkuP && mainSkuP.perUnit > 0 ? `
      <div class="card bl-warn" style="background:#fff8e1;margin-top:8px;padding:10px">
        <div class="fs-12 c-warn">⚠ 200~350kg 범위에서 ${main[2]} 정수 ${mainSkuP.unitName} 조합이 없습니다</div>
        <div class="fs-11 c-txt-l mt-4">SOP·SKU 조합 또는 안전계수 확인 필요</div>
      </div>
    ` : '')}
  `;
}

async function startWorkOrder() {
  if (!acquireLock('startWorkOrder')) return;
  const qty = parseFloat($id('wo-qty')?.value) || 0;
  const unitSize = parseInt($id('wo-unit')?.value) || 1;
  const reqId = $id('wo-req')?.value || '';
  const totalKg = qty * unitSize;

  if (!_selectedSopId) { toast('SOP를 선택하세요', 'err'); releaseLock('startWorkOrder'); return; }
  if (qty <= 0) { toast('생산 수량을 입력하세요', 'err'); releaseLock('startWorkOrder'); return; }

  try {
    showLoading();
    const woId = await generateSeqId('WO', '작업지시서');
    const sop = State.sops.find(s => s[0] === _selectedSopId);

    await SheetsAPI.append('작업지시서', [
      woId, _selectedSopId, reqId, sop?.[2] || 'FG002', sop?.[1]?.replace('제조','').trim() || '앙호두 (호두과자 전용반죽)',
      totalKg, `${unitSize}kg`, qty, State.user?.email,
      formatDateTime(), '', '', '진행중', '0', '', '', '', '', ''
    ]);

    // Update production request if linked
    if (reqId) {
      await SheetsAPI.updateCell('생산요청', 0, reqId, 7, '배정완료');
    }

    toast(`작업지시서 ${woId} 생성 완료`, 'suc');
    Router.go('wo-execute', { woId });
  } catch (e) {
    toast('생성 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
    releaseLock('startWorkOrder');
  }
}

/* ═══════════════════════════════════════════════
   WORK ORDER EXECUTION (Phase 4 - 핵심)
   ═══════════════════════════════════════════════ */
Screens['wo-execute'] = async (params = {}) => {
  const { woId } = params;
  showLoading();

  try {
    // Load WO data — 항상 최신 데이터 (캐시 bypass)
    // PC에서 열 때 휴대폰에서 업데이트된 데이터를 즉시 반영하기 위함
    SheetsAPI.invalidateCache('작업지시서');
    SheetsAPI.invalidateCache('공정기록');
    const wos = await SheetsAPI.getAll('작업지시서', false);
    const wo = wos.find(w => w[0] === woId) || wos.find(w => w[12] === '진행중');
    if (!wo) { toast('작업지시서를 찾을 수 없습니다', 'err'); hideLoading(); Router.go('production'); return; }

    // Load SOP steps & recipes
    const sopId = wo[1];
    const [steps, recipes, records] = await Promise.all([
      SheetsAPI.getAll('SOP공정단계').then(all => all.filter(s => s[0] === sopId)),
      SheetsAPI.getAll('SOP레시피').then(all => all.filter(r => r[0] === sopId)),
      SheetsAPI.getAll('공정기록').then(all => all.filter(r => r[0] === wo[0])),
    ]);

    const lastSaved = parseInt(wo[13]) || 0;
    const targetQty = parseFloat(wo[5]) || 50;

    // maxStep: 공정기록에서 '완료' 상태인 최대 stepNo 기반으로 계산 (DB 기준 진실)
    let maxStepFromRecords = lastSaved;
    records.forEach(r => {
      if (r[10] === '완료' || r[10] === '임시저장') {
        const sIdx = steps.findIndex(s => String(s[1]) === String(r[1]));
        if (sIdx >= 0 && (sIdx + 1) > maxStepFromRecords) maxStepFromRecords = sIdx + 1;
      }
    });
    // maxStep = max(lastSaved, records 기반 계산값) — 데이터 무결성 보장
    const maxStep = Math.max(lastSaved, maxStepFromRecords);
    console.log(`[WO실행] woId=${wo[0]}, lastSaved=${lastSaved}, maxStepFromRecords=${maxStepFromRecords}, maxStep=${maxStep}`);

    // Store in state
    // currentStep: 현재 보고 있는 단계 (viewing position)
    // maxStep: 완료된 최대 단계 (navigation boundary) — 절대 감소하지 않음
    // ── 기존 인메모리 데이터 보존 (LiveSync 리로드 시 스캔/사진 데이터 유실 방지) ──
    const prevScannedLots = State.woExec?._scannedLots;
    const prevPendingPhotos = State.woExec?._pendingPhotos;
    const prevUseType = State.woExec?._useType;
    const prevCurrentStep = State.woExec?.currentStep;
    const isSameWo = State.woExec?.woId === wo[0];

    State.woExec = {
      woId: wo[0], wo, sopId, steps, recipes, records, targetQty,
      currentStep: isSameWo ? (prevCurrentStep ?? lastSaved) : lastSaved,
      maxStep: maxStep,
      unit: wo[6] || '1kg',
      packCount: parseInt(wo[7]) || 50,
    };

    // 같은 WO 리로드 시 인메모리 데이터 복원
    if (isSameWo) {
      if (prevScannedLots) State.woExec._scannedLots = prevScannedLots;
      if (prevPendingPhotos) State.woExec._pendingPhotos = prevPendingPhotos;
      if (prevUseType) State.woExec._useType = prevUseType;
    }

    hideLoading();
    renderWOExecute();
  } catch (e) {
    hideLoading();
    toast('작업지시서 로드 실패: ' + e.message, 'err');
    Router.go('production');
  }
};

function renderWOExecute() {
  const { woId, steps, currentStep, maxStep, targetQty, unit, packCount } = State.woExec;
  const total = steps.length;
  const step = steps[currentStep];
  if (!step) return;

  const stepType = step[3] || 'input';
  const isMixingStep = stepType === 'process' && (step[2]||'').includes('믹싱');
  const typeColor = { input: 'info', process: isMixingStep ? 'teal' : 'pri', inspect: 'warn', pack: 'gray-d', store: 'teal', heat: 'err' };
  const typeLabel = { input: '투입', process: isMixingStep ? '믹싱' : '공정', inspect: '검사(CCP)', pack: '포장', store: '보관', heat: `가열(${CCP.HEAT.no})` };

  // Header
  renderHeader(woId, `${State.woExec.wo?.[4] || ''} ${targetQty}kg · ${unit}포장`);

  $id('content').innerHTML = `
    <!-- Progress: maxStep 기준으로 진행률 표시 -->
    <div style="background:var(--white);padding:8px 16px">
      <div class="row between mb-4">
        <span class="fs-11 fw-6 c-txt-l">공정 ${currentStep + 1} / ${total} ${currentStep < maxStep ? '<span style="color:var(--info);font-size:10px">(이전 공정 보기 중)</span>' : ''}</span>
        <span class="fs-11 c-txt-l">${Math.round((maxStep / total) * 100)}% 완료</span>
      </div>
      <div class="progress-bar"><div class="fill" style="width:${(maxStep / total) * 100}%"></div></div>
    </div>

    <!-- Step dots: maxStep 기준으로 done/locked, currentStep 기준으로 current -->
    <div class="step-nav">
      ${steps.map((s, i) => {
        const isDone = i < maxStep && i !== currentStep;
        const isCurrent = i === currentStep;
        const isAccessible = i <= maxStep; // maxStep 이하는 클릭 가능
        const dotClass = isCurrent ? 'current' : isDone ? 'done' : 'locked';
        const dotStyle = !isAccessible ? 'style="opacity:0.3;cursor:not-allowed"' : '';
        return `<div class="step-dot ${dotClass}" onclick="goToStep(${i})" ${dotStyle}>${i + 1}</div>`;
      }).join('')}
    </div>

    <!-- Step content -->
    <div style="flex:1;padding:16px;overflow-y:auto" id="step-content"></div>

    <!-- Bottom nav -->
    <div style="display:flex;gap:6px;padding:10px 12px;background:var(--white);border-top:1px solid var(--gray-l)">
      <button class="btn btn-sm btn-outline btn-gray" style="min-width:56px;white-space:nowrap"
              onclick="goToStep(${currentStep - 1})" ${currentStep === 0 ? 'disabled' : ''}>← 이전</button>
      <button class="btn btn-sm btn-outline btn-info" style="min-width:64px;white-space:nowrap"
              onclick="tempSaveWO()">임시저장</button>
      ${currentStep < total - 1 ? `
        <button class="btn btn-sm btn-pri flex-1" style="white-space:nowrap"
                onclick="handleCompleteStep()">공정 완료 · 다음 →</button>
      ` : `
        <button class="btn btn-sm btn-suc flex-1" style="white-space:nowrap"
                onclick="handleCompleteStep(true)">전체 완료 · 냉동보관 시작</button>
      `}
    </div>
  `;

  // Render step-specific content
  renderStepContent(step, stepType);

  // Validate inputs on initial render (disable next button until all filled)
  setTimeout(() => validateStepInputs(State.woExec.currentStep + 1), 100);
}

/**
 * restoreSavedStepData: 공정기록(records)에서 해당 stepNo의 저장 데이터를 DOM에 복원
 * — 이전 단계로 돌아갔을 때 입력값, 체크상태, CCP 결과 등이 유지되도록 함
 */
function restoreSavedStepData(stepNo, stepType, step) {
  try {
    const { records } = State.woExec;
    if (!records || records.length === 0) return;

    // 해당 stepNo의 기존 기록 찾기 (완료 우선, 임시저장 차선)
    const stepRecords = records.filter(r => String(r[1]) === String(stepNo));
    if (stepRecords.length === 0) return;

    // 완료 기록 우선, 없으면 임시저장
    const rec = stepRecords.find(r => r[10] === '완료') || stepRecords.find(r => r[10] === '임시저장') || stepRecords[0];
    const savedDataStr = rec[5] || ''; // stepData (col 5)
    if (!savedDataStr) return;

    let data;
    try {
      data = JSON.parse(savedDataStr);
    } catch (e) {
      console.warn(`[WO복원] stepNo=${stepNo} JSON 파싱 실패:`, e.message);
      return;
    }

    console.log(`[WO복원] stepNo=${stepNo}, type=${stepType}, status=${rec[10]}, data keys=${Object.keys(data).join(',')}`);

    if (stepType === 'input') {
      // 투입량 복원
      if (data.inputQty) {
        const qtyEl = $id(`input-qty-${stepNo}`);
        if (qtyEl) qtyEl.value = data.inputQty;
      }
      // 체크항목 복원
      if (Array.isArray(data.checks)) {
        data.checks.forEach((c, i) => {
          if (c.checked) {
            const chkEl = $id(`check-${stepNo}-${i}`);
            if (chkEl) { chkEl.classList.add('checked'); chkEl.textContent = '✓'; }
          }
        });
      }

      // ── 스캔된 LOT 리스트 UI 복원 (State._scannedLots에서) ──
      if (State.woExec._scannedLots?.[stepNo]?.length > 0) {
        renderScannedList(stepNo);
      }
      // DB 기록(usedLotIds)에서 스캔 데이터 복원 (State에 없을 때)
      else if (rec[4]) {
        const lotIds = rec[4].split(',').filter(Boolean);
        if (lotIds.length > 0 && (!State.woExec._scannedLots || !State.woExec._scannedLots[stepNo]?.length)) {
          // DB에 저장된 LOT ID로 State 복원 (비동기)
          (async () => {
            try {
              if (!State.woExec._scannedLots) State.woExec._scannedLots = {};
              if (!State.woExec._scannedLots[stepNo]) State.woExec._scannedLots[stepNo] = [];
              const indivs = await SheetsAPI.getAll('원재료개별');
              const lots = await SheetsAPI.getAll('원재료LOT');
              lotIds.forEach(qrId => {
                if (State.woExec._scannedLots[stepNo].find(s => s.qrId === qrId)) return;
                const indiv = indivs.find(r => r[0] === qrId);
                const lot = indiv ? lots.find(l => l[0] === indiv[1]) : null;
                State.woExec._scannedLots[stepNo].push({
                  qrId, lotId: indiv?.[1] || '', name: lot?.[2] || '',
                  remain: indiv?.[4] || '0', expiry: (lot?.[7]||'').substring(0,10), status: indiv?.[3] || ''
                });
              });
              renderScannedList(stepNo);
            } catch (e) { console.warn('[WO복원] LOT 복원 실패:', e.message); }
          })();
        }
      }
      // ── useType UI 복원 (스캔 리스트 유무와 무관) ──
      if (State.woExec._useType?.[stepNo]) {
        setUseType(stepNo, State.woExec._useType[stepNo]);
      }
    }

    else if (stepType === 'process') {
      // 체크항목 복원
      if (Array.isArray(data.checks)) {
        data.checks.forEach((c, i) => {
          if (c.checked) {
            const chkEl = $id(`check-${stepNo}-${i}`);
            if (chkEl) { chkEl.classList.add('checked'); chkEl.textContent = '✓'; }
          }
        });
      }
    }

    else if (stepType === 'pack') {
      if (data.packQty) {
        const el = $id(`pack-qty-${stepNo}`);
        if (el) el.value = data.packQty;
      }
      if (Array.isArray(data.samples)) {
        data.samples.forEach((s, i) => {
          if (s.weight) {
            const el = $id(`sample-wt-${stepNo}-${i + 1}`);
            if (el) el.value = s.weight;
          }
        });
      }
    }

    else if (stepType === 'seal') {
      if (data.sealQty) {
        const el = $id(`seal-qty-${stepNo}`);
        if (el) el.value = data.sealQty;
      }
      if (data.labelCheck) {
        const el = $id(`check-seal-${stepNo}-0`);
        if (el) { el.classList.add('checked'); el.textContent = '✓'; }
      }
      if (data.sealCheck) {
        const el = $id(`check-seal-${stepNo}-1`);
        if (el) { el.classList.add('checked'); el.textContent = '✓'; }
      }
      // 샘플 무게 복원
      if (data.samples) {
        data.samples.forEach((s, si) => {
          const wEl = $id(`seal-weight-${stepNo}-${si+1}`);
          if (wEl && s.weight) wEl.value = s.weight;
        });
      }
    }

    else if (stepType === 'inspect') {
      // 신 격자(checks) 또는 구 7단계(step2..) 모두 복원 — ccpGridRestore가 구형도 흡수
      if (Array.isArray(data.checks)) {
        ccpGridRestore(stepNo, data);
      } else if (data.step1Time || data.step2 || data.step6) {
        // 구 7단계 임시저장 → 격자로 변환 복원(위치값 없는 칸은 정상 기본)
        ccpGridRestore(stepNo, migrate7stepToGrid(data));
      }
    }

    else if (stepType === 'qr-label') {
      if (data.qrQty) {
        const el = $id(`qr-label-qty-${stepNo}`);
        if (el) el.value = data.qrQty;
      }
    }

    else if (stepType === 'store') {
      if (data.freezeStart) {
        const el = $id('freeze-start');
        if (el) el.value = data.freezeStart;
      }
    }

    // ── 사진 복원 (모든 stepType 공통) ──
    const savedPhotoUrls = rec[6] || '';
    if (savedPhotoUrls) {
      const urls = savedPhotoUrls.split(' | ').filter(u => u.trim());
      if (urls.length > 0) {
        restorePhotoThumbnails(stepNo, stepType, urls);
      }
    }

    // ── 인메모리 _pendingPhotos blob URL 복원 (아직 업로드되지 않은 사진) ──
    restorePendingPhotos(stepNo, stepType);

    // 복원 완료 로그
    console.log(`[WO복원] stepNo=${stepNo} 데이터 복원 완료 (사진 ${savedPhotoUrls ? savedPhotoUrls.split(' | ').length : 0}장)`);
  } catch (err) {
    console.error(`[WO복원] stepNo=${stepNo} 복원 중 오류:`, err);
    // 복원 실패해도 시스템은 정상 동작 — 빈 폼으로 표시됨
  }
}

/**
 * restorePendingPhotos: State._pendingPhotos에 남아있는 미업로드 파일의 blob URL을 DOM에 복원
 * — DOM 재렌더(goToStep, LiveSync 등) 후 사진 미리보기가 사라지는 문제 방지
 */
function restorePendingPhotos(stepNo, stepType) {
  const pendingPhotos = State.woExec?._pendingPhotos;
  if (!pendingPhotos) return;

  // 단일 preview 복원 헬퍼
  const fillPreview = (key, previewId) => {
    const files = pendingPhotos[key];
    if (!files || files.length === 0) return;
    const preview = $id(previewId);
    if (!preview || preview.innerHTML.trim()) return; // 이미 Drive URL 썸네일이 있으면 skip
    preview.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';
    files.forEach(f => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      img.style.cssText = 'width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-l)';
      preview.appendChild(img);
    });
    // photo-upload 컨테이너에 has-photo 클래스 추가
    const uploadEl = preview.closest('.photo-upload');
    if (uploadEl) uploadEl.classList.add('has-photo');
  };

  // stepType별 preview 요소 매핑
  if (stepType === 'pack') {
    for (let n = 1; n <= 3; n++) fillPreview(`${stepNo}-s${n}`, `photo-preview-${stepNo}-s${n}`);
  } else if (stepType === 'seal') {
    for (let n = 1; n <= 3; n++) fillPreview(`${stepNo}-seal${n}`, `photo-preview-${stepNo}-seal${n}`);
  } else if (stepType === 'inspect') {
    fillPreview(`${stepNo}-ccp7`, `photo-preview-${stepNo}-ccp7`);
  } else {
    fillPreview(String(stepNo), `photo-preview-${stepNo}`);
  }
}

/**
 * restorePhotoThumbnails: 저장된 Drive URL에서 사진 썸네일을 복원
 */
function restorePhotoThumbnails(stepNo, stepType, urls) {
  const extractFileId = (url) => {
    const m = url.match(/\/d\/([^/]+)\//);
    return m ? m[1] : null;
  };

  const createThumb = (url) => {
    const fileId = extractFileId(url);
    const img = document.createElement('img');
    img.src = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w128` : url;
    img.style.cssText = 'width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--suc);cursor:pointer';
    img.title = '저장된 사진 (터치하여 보기)';
    img.onclick = (e) => { e.stopPropagation(); window.open(url, '_blank'); };
    img.onerror = () => {
      img.style.cssText = 'width:64px;height:64px;border-radius:6px;border:1px solid var(--suc);display:flex;align-items:center;justify-content:center;background:#e8f5e9;font-size:10px;color:var(--suc)';
      img.outerHTML = `<div style="width:64px;height:64px;border-radius:6px;border:1px solid var(--suc);display:flex;align-items:center;justify-content:center;background:#e8f5e9;font-size:20px;cursor:pointer" title="저장된 사진" onclick="window.open('${url}','_blank')">📷✓</div>`;
    };
    return img;
  };

  const fillPreview = (previewId, thumbUrls) => {
    const preview = $id(previewId);
    if (!preview) return;
    preview.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';
    thumbUrls.forEach(u => preview.appendChild(createThumb(u)));
    // photo-upload 상위에 has-photo 표시
    preview.closest('.photo-upload')?.classList.add('has-photo');
  };

  if (stepType === 'input' || stepType === 'process' || stepType === 'store') {
    fillPreview(`photo-preview-${stepNo}`, urls);
  } else if (stepType === 'pack') {
    // 3개 샘플에 분배
    for (let n = 0; n < 3; n++) {
      if (urls[n]) fillPreview(`photo-preview-${stepNo}-s${n+1}`, [urls[n]]);
    }
    // 3개 초과 시 나머지는 마지막 샘플에
    if (urls.length > 3) fillPreview(`photo-preview-${stepNo}-s3`, urls.slice(2));
  } else if (stepType === 'seal') {
    for (let n = 0; n < 3; n++) {
      if (urls[n]) fillPreview(`photo-preview-${stepNo}-seal${n+1}`, [urls[n]]);
    }
    if (urls.length > 3) fillPreview(`photo-preview-${stepNo}-seal3`, urls.slice(2));
  } else if (stepType === 'inspect') {
    fillPreview(`photo-preview-${stepNo}-ccp7`, urls);
  }
}

// ── CCP 합격/불합격 토글 (Step 2,3,6 공용) ──
function ccpToggle(boxId, result, stepNo) {
  const box = $id(boxId);
  if (!box) return;
  const btns = box.querySelectorAll('button');
  const timeEl = $id(boxId + '-time');

  box.dataset.result = result;
  if (result === '합격') {
    btns[0].style.background = 'var(--suc)';
    btns[0].style.color = '#fff';
    btns[1].style.background = 'var(--gray-l)';
    btns[1].style.color = 'var(--txt)';
    box.style.borderColor = 'var(--suc)';
    // Auto-record time
    const now = new Date().toTimeString().substring(0, 5);
    if (timeEl) {
      timeEl.style.display = 'block';
      timeEl.querySelector('span').textContent = now;
      timeEl.dataset.time = now;
    }
  } else {

// ── CCP Step5 합격/불합격 토글 ──

// ── Step4 시간 변경 시 Step5 검증 시간 자동 계산 ──
function ccpCalcStep5Time(stepNo) {
  const t4 = $id('ccp-time-4')?.value;
  if (!t4) return;
  const container = $id('ccp5-records-' + stepNo);
  if (!container) return;
  const records = container.querySelectorAll('.ccp5-record');
  records.forEach((rec, i) => {
    const display = rec.querySelector('.ccp5-time-display');
    if (display) {
      const calcTime = addHoursToTime(t4, (i + 1) * 2);
      display.textContent = calcTime;
      display.dataset.time = calcTime;
    }
  });
}

// ── 시간 문자열에 N시간 더하기 ──
function addHoursToTime(timeStr, hours) {
  const [h, m] = timeStr.split(':').map(Number);
  const totalMin = h * 60 + m + hours * 60;
  const nh = Math.floor(totalMin / 60) % 24;
  const nm = totalMin % 60;
  return String(nh).padStart(2, '0') + ':' + String(nm).padStart(2, '0');
}

function addCCP5Record(stepNo) {
  const container = $id('ccp5-records-' + stepNo);
  if (!container) return;
  const count = container.querySelectorAll('.ccp5-record').length + 1;

  // Calculate time: Step4 start + (count * 2h)
  const t4 = $id('ccp-time-4')?.value;
  let calcTime = '';
  let calcDisplay = 'Step4 입력 대기...';
  if (t4) {
    calcTime = addHoursToTime(t4, count * 2);
    calcDisplay = calcTime;
  }

  const div = document.createElement('div');
  div.className = 'ccp5-record';
  div.dataset.result = '';
  div.style.cssText = 'border:1px solid var(--gray-l);border-radius:8px;padding:8px;margin-bottom:6px';
  div.innerHTML = `

    <div class="row mb-8" style="gap:8px">

      <button class="btn btn-sm flex-1" style="padding:4px 6px;font-size:11px;background:var(--gray-l);color:var(--txt)" onclick="ccpToggle5(this.closest('.ccp5-record'),'불합격',${stepNo})">불합격</button>

    </div>
  `;
  container.appendChild(div);
  toast(`검증 #${count} 추가됨 (예정: ${calcDisplay})`, 'suc');
}

// ── 공정 사진 수집 (File 객체 배열 리턴) ──
function collectStepPhotos(stepNo, stepType) {
  const files = [];
  const addFilesFrom = (inputEl) => {
    if (inputEl?.files) Array.from(inputEl.files).forEach(f => files.push(f));
  };

  if (stepType === 'input') {
    addFilesFrom($id(`photo-camera-${stepNo}`));
    addFilesFrom($id(`photo-gallery-${stepNo}`));
  } else if (stepType === 'process' || stepType === 'store') {
    const preview = $id(`photo-preview-${stepNo}`);
    if (preview) {
      const fileInput = preview.closest('.photo-upload')?.querySelector('input[type="file"]');
      addFilesFrom(fileInput);
    }
  } else if (stepType === 'pack') {
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-s${n}`);
      if (prev) {
        const fi = prev.closest('.photo-upload')?.querySelector('input[type="file"]');
        addFilesFrom(fi);
      }
    }
  } else if (stepType === 'seal') {
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-seal${n}`);
      if (prev) {
        const fi = prev.closest('.photo-upload')?.querySelector('input[type="file"]');
        addFilesFrom(fi);
      }
    }
  } else if (stepType === 'inspect') {
    const ccpPrev = $id(`photo-preview-${stepNo}-ccp7`);
    if (ccpPrev) {
      const fi = ccpPrev.closest('.photo-upload')?.querySelector('input[type="file"]');
      addFilesFrom(fi);
    }
  }

  // ── DOM file input이 비어있으면 State에 보관된 파일 사용 (단계 이동 후 복귀 시) ──
  if (files.length === 0 && State.woExec?._pendingPhotos) {
    // 단일 프리뷰 타입
    const singleKey = String(stepNo);
    if (State.woExec._pendingPhotos[singleKey]?.length > 0) {
      files.push(...State.woExec._pendingPhotos[singleKey]);
    }
    // 멀티 프리뷰 타입 (pack: s1~s3, seal: seal1~seal3, inspect: ccp7)
    if (stepType === 'pack') {
      for (let n = 1; n <= 3; n++) {
        const key = `${stepNo}-s${n}`;
        if (State.woExec._pendingPhotos[key]?.length > 0) files.push(...State.woExec._pendingPhotos[key]);
      }
    } else if (stepType === 'seal') {
      for (let n = 1; n <= 3; n++) {
        const key = `${stepNo}-seal${n}`;
        if (State.woExec._pendingPhotos[key]?.length > 0) files.push(...State.woExec._pendingPhotos[key]);
      }
    } else if (stepType === 'inspect') {
      const key = `${stepNo}-ccp7`;
      if (State.woExec._pendingPhotos[key]?.length > 0) files.push(...State.woExec._pendingPhotos[key]);
    }
  }
  return files;
}

// ── CCP 금속검출 격자 (신 양식 · 종이 100% 동일) — 정상이 기본값, 이탈만 탭 ──

function migrate7stepToGrid(d) {
  const a3 = v => [v, v, v];
  const sp = r => r === '불합격' ? '불검출' : '검출';   // 시편: 합격→검출(정상), 불합격→불검출(이탈)
  const rows = [];
  if (d.step1Time || d.step2 || d.step3) rows.push({
    구분: '작업시작전', 시각: d.step1Time || '',
    시편Fe: a3(sp(d.step2 && d.step2.fe && d.step2.fe.result)), 시편SUS: a3(sp(d.step2 && d.step2.sus && d.step2.sus.result)),
    제품통과: '불검출',
    제품시편Fe: { 상: a3(sp(d.step3 && d.step3.fe && d.step3.fe.result)), 하: a3(sp(d.step3 && d.step3.fe && d.step3.fe.result)) },
    제품시편SUS: { 상: a3(sp(d.step3 && d.step3.sus && d.step3.sus.result)), 하: a3(sp(d.step3 && d.step3.sus && d.step3.sus.result)) }
  });
  (d.step5 || []).forEach(s => rows.push({
    구분: '작업중2h', 시각: s.time || d.step4Time || '',
    시편Fe: a3(sp(s.result)), 시편SUS: a3(sp(s.result)), 제품통과: '불검출',
    제품시편Fe: { 상: a3('검출'), 하: a3('검출') }, 제품시편SUS: { 상: a3('검출'), 하: a3('검출') }
  }));
  if (d.step6) rows.push({
    구분: '작업종료', 시각: '',
    시편Fe: a3(sp(d.step6 && d.step6.fe && d.step6.fe.result)), 시편SUS: a3(sp(d.step6 && d.step6.sus && d.step6.sus.result)),
    제품통과: '불검출',
    제품시편Fe: { 상: a3('검출'), 하: a3('검출') }, 제품시편SUS: { 상: a3('검출'), 하: a3('검출') }
  });
  return { checks: rows, 통과량: d.ccpTotal ? d.ccpTotal + '개' : '', _fmt: 'ccpGrid-v1', _migrated: '7step' };
}

// ── 상세(읽기) 화면용: 신 격자(ccpGrid-v1) 기록을 종이양식 격자 그대로 비편집 렌더 ──
function ccpGridReadView(d) {
  const rows = Array.isArray(d.checks) ? d.checks : [];
  const cell = (g, v, label) => {
    const ok = ccpCellNormal(g, v);
    const txt = g === '제품통과' ? (v || '') : label;
    return `<span style="flex:1;min-width:28px;text-align:center;padding:5px 2px;border-radius:5px;font-size:11px;color:#fff;background:${ok ? '#1e8e3e' : '#d93025'}">${txt}</span>`;
  };
  const grp3 = (r, g, glabel, hint) => {
    let h = `<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:5px"><span style="width:92px;font-size:11px;flex-shrink:0;line-height:1.2">${glabel}<br><span style="font-size:10px;color:var(--txt-l)">${hint}</span></span><div style="display:flex;gap:4px;flex:1">`;
    for (let i = 0; i < 3; i++) h += cell(g, (r[g] || [])[i], CCP_POS3[i]);
    return h + `</div></div>`;
  };
  const grpP = (r) => `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><span style="width:92px;font-size:11px;flex-shrink:0;line-height:1.2">제품 통과<br><span style="font-size:10px;color:var(--txt-l)">정상=불검출</span></span><div style="display:flex;flex:1">${cell('제품통과', r.제품통과, '')}</div></div>`;
  const grp6 = (r, g, glabel, hint) => {
    let h = `<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:5px"><span style="width:92px;font-size:11px;flex-shrink:0;line-height:1.2">${glabel}<br><span style="font-size:10px;color:var(--txt-l)">${hint}</span></span><div style="flex:1">`;
    ['상', '하'].forEach(s => {
      h += `<div style="display:flex;gap:4px;align-items:center;margin-bottom:4px"><span style="width:24px;font-size:10px;color:var(--txt-l);flex-shrink:0">${s}단</span>`;
      for (let i = 0; i < 3; i++) h += cell(g, ((r[g] || {})[s] || [])[i], CCP_POS3[i]);
      h += `</div>`;
    });
    return h + `</div></div>`;
  };
  let html = '';
  if (d.제품명) html += `<div class="fs-11 c-txt-l mt-4">제품명: <strong>${d.제품명}</strong></div>`;
  rows.forEach(r => {
    const ok = ccpRowJudge(r) === '적합';
    const badge = ok
      ? `<span style="margin-left:auto;font-size:11px;padding:2px 8px;border-radius:6px;background:#e6f4ea;color:#137333">정상</span>`
      : `<span style="margin-left:auto;font-size:11px;padding:2px 8px;border-radius:6px;background:#fce8e6;color:#c5221f">⚠ 이탈</span>`;
    const glabel = r.구분 === '작업중2h' ? '작업 중(2h)' : (r.구분 === '작업명' ? (d.제품명 || '작업명') : (r.구분 || ''));
    html += `<div class="card" style="padding:10px;margin:8px 0;border-left:3px solid ${ok ? '#1e8e3e' : '#d93025'}">` +
      `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="font-size:13px">${glabel}</b>` +
      `${r.시각 ? `<span class="fs-11 c-txt-l">${r.시각}</span>` : ''}${badge}</div>`;
    html += grp3(r, '시편Fe', '시편 철(Fe)', '정상=검출');
    html += grp3(r, '시편SUS', '시편 SUS', '정상=검출');
    if (r.제품통과 != null) html += grpP(r);
    if (r.제품시편Fe) html += grp6(r, '제품시편Fe', '제품+시편(Fe)', '정상=검출');
    if (r.제품시편SUS) html += grp6(r, '제품시편SUS', '제품+시편(SUS)', '정상=검출');
    html += `</div>`;
  });
  const sum = [];
  if (d.통과량) sum.push(['통과량', d.통과량]);
  if (d.검출량) sum.push(['검출량', d.검출량]);
  if (d.특이사항) sum.push(['특이사항', d.특이사항]);
  if (d.이탈내용) sum.push(['이탈내용', d.이탈내용]);
  if (d.개선조치) sum.push(['개선조치', d.개선조치]);
  if (sum.length) html += sum.map(([k, v]) => `<div class="fs-11 c-txt-l">${k}: ${v}</div>`).join('');
  const verdict = rows.length ? (rows.every(r => ccpRowJudge(r) === '적합') ? '적합' : '부적합') : (d.판정종합 || '');
  if (verdict) html += `<div class="info-box" style="margin-top:8px"><div class="fs-13 fw-6">판정종합: <span class="fw-8" style="color:${verdict === '적합' ? '#1e8e3e' : '#d93025'}">${verdict}</span></div></div>`;
  if (d._migrated) html += `<div class="fs-10 c-txt-l mt-4" style="font-style:italic">※ 구 7단계 기록 자동 변환본 (위치값 없는 칸은 정상 기본)</div>`;
  return html;
}

// ── 공정 입력값 수집 (JSON string 리턴) ──
/* ── 가열공정 CCP-3B 기록 ────────────────────────────────────────────────
   종이 양식 「중요관리점(CCP-3B)점검표 [가열공정]」 1:1
   열: 품명 · 측정시각 · 호기 · 시작온도 · 가열시간 · 종료온도 · 가열후품온 · 판정 · 서명
   주기: 매 작업 전 · 작업 종료 시 (중간 측정은 행 추가)
   한계기준은 CCP.HEAT.limit — 숫자를 여기 다시 쓰지 말 것            */
const HEAT_PHASES = ['작업 전', '작업 종료'];

/** 한 행 판정 — 한계기준을 벗어난 항목명을 그대로 돌려준다(이탈 사유 기재용) */
function heatJudge(r) {
  const L = CCP.HEAT.limit, bad = [];
  const num = v => (v === '' || v == null) ? NaN : parseFloat(v);
  const s = num(r.startC), e = num(r.endC), c = num(r.coreC), sec = num(r.sec);
  if (isNaN(s) || s < L.minC || s > L.maxC) bad.push('시작온도');
  if (isNaN(e) || e < L.minC || e > L.maxC) bad.push('종료온도');
  if (isNaN(sec) || sec < L.secMin || sec > L.secMax) bad.push('가열시간');
  if (isNaN(c) || c < L.coreC) bad.push('가열후품온');
  return { ok: bad.length === 0, bad };
}

function heatRowHtml(stepNo, i, phase) {
  const ip = 'width:100%;padding:7px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px';
  const id = f => `heat-${stepNo}-${i}-${f}`;
  return `
    <div class="card" data-heat-row="${stepNo}" style="padding:10px 12px;margin-bottom:8px;border-left:3px solid #c62828">
      <div class="row between mb-8">
        <div class="fs-13 fw-7">${i + 1}. ${phase || '추가 측정'}</div>
        <span class="badge badge-gray" id="${id('verdict')}">미입력</span>
      </div>
      <input type="hidden" id="${id('phase')}" value="${phase || '추가 측정'}">
      <div class="grid-2" style="gap:8px">
        <div class="input-group"><label>호기</label>
          <input type="text" id="${id('unit')}" placeholder="예: 1호기" style="${ip}" oninput="heatSync(${stepNo},${i})"></div>
        <div class="input-group"><label>측정시각</label>
          <input type="time" id="${id('at')}" style="${ip}" oninput="heatSync(${stepNo},${i})"></div>
        <div class="input-group"><label>시작온도 (℃)</label>
          <input type="number" inputmode="decimal" step="0.1" id="${id('start')}" placeholder="175~190" style="${ip}" oninput="heatSync(${stepNo},${i})"></div>
        <div class="input-group"><label>종료온도 (℃)</label>
          <input type="number" inputmode="decimal" step="0.1" id="${id('end')}" placeholder="175~190" style="${ip}" oninput="heatSync(${stepNo},${i})"></div>
      </div>
      <div class="grid-2" style="gap:8px;margin-top:8px">
        <div class="input-group"><label>가열시간</label>
          <div class="row" style="gap:6px">
            <div class="input-suffix" style="flex:1"><input type="number" inputmode="numeric" id="${id('min')}" placeholder="2" style="${ip}" oninput="heatSync(${stepNo},${i})"><span>분</span></div>
            <div class="input-suffix" style="flex:1"><input type="number" inputmode="numeric" id="${id('sec')}" placeholder="30" style="${ip}" oninput="heatSync(${stepNo},${i})"><span>초</span></div>
          </div></div>
        <div class="input-group"><label>가열 후 품온 (℃)</label>
          <input type="number" inputmode="decimal" step="0.1" id="${id('core')}" placeholder="90 이상" style="${ip}" oninput="heatSync(${stepNo},${i})"></div>
      </div>
      <div class="fs-11 mt-4" id="${id('why')}" style="color:var(--err,#c62828)"></div>
    </div>`;
}

/** 입력 즉시 판정 배지 갱신 — 작업자가 이탈을 바로 본다 */
function heatSync(stepNo, i) {
  const g = f => $id(`heat-${stepNo}-${i}-${f}`)?.value ?? '';
  const filled = ['start', 'end', 'core', 'min', 'sec'].some(f => g(f) !== '');
  const r = { startC: g('start'), endC: g('end'), coreC: g('core'), sec: (parseInt(g('min')) || 0) * 60 + (parseInt(g('sec')) || 0) };
  const badge = $id(`heat-${stepNo}-${i}-verdict`), why = $id(`heat-${stepNo}-${i}-why`);
  if (!badge) return;
  if (!filled) { badge.className = 'badge badge-gray'; badge.textContent = '미입력'; if (why) why.textContent = ''; return; }
  const v = heatJudge(r);
  badge.className = 'badge badge-' + (v.ok ? 'suc' : 'err');
  badge.textContent = v.ok ? '적합' : '부적합';
  if (why) why.textContent = v.ok ? '' : `한계기준 이탈: ${v.bad.join(', ')} — 즉시 작업 중지 후 개선조치를 기재하세요`;
  validateStepInputs(stepNo);
}

function heatAddRow(stepNo) {
  const box = $id(`heat-rows-${stepNo}`); if (!box) return;
  const i = box.querySelectorAll('[data-heat-row]').length;
  box.insertAdjacentHTML('beforeend', heatRowHtml(stepNo, i, ''));
}

function heatCollect(stepNo) {
  const box = $id(`heat-rows-${stepNo}`);
  const cnt = box ? box.querySelectorAll('[data-heat-row]').length : 0;
  const rows = [];
  for (let i = 0; i < cnt; i++) {
    const g = f => $id(`heat-${stepNo}-${i}-${f}`)?.value ?? '';
    const sec = (parseInt(g('min')) || 0) * 60 + (parseInt(g('sec')) || 0);
    const r = { 구분: g('phase'), 호기: g('unit'), 시각: g('at'), startC: g('start'), endC: g('end'), coreC: g('core'), sec };
    const v = heatJudge(r);
    rows.push({ ...r, 판정: v.ok ? '적합' : '부적합', 이탈항목: v.bad });
  }
  return {
    ccpNo: CCP.HEAT.no,
    limit: CCP.HEAT.limit,
    rows,
    판정: rows.length && rows.every(r => r.판정 === '적합') ? '적합' : '부적합',
    이탈내용: $id(`heat-dev-${stepNo}`)?.value || '',
    개선조치: $id(`heat-act-${stepNo}`)?.value || '',
    _fmt: 'ccpHeat-v1',
  };
}

function collectStepData(stepNo, stepType, step) {
  const data = {};

  if (stepType === 'input') {
    data.inputQty = $id(`input-qty-${stepNo}`)?.value || '';
    data.targetQty = $id(`input-qty-${stepNo}`)?.dataset?.target || '';
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    data.checks = checks.map((c, i) => ({
      name: c.trim(),
      checked: $id(`check-${stepNo}-${i}`)?.textContent === '✓'
    }));
  }
  else if (stepType === 'process') {
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    const isMixing = (step[2]||'').includes('믹싱');
    if (isMixing) {
      if (!checks.includes('RPM 확인')) checks.push('RPM 확인');
      if (!checks.includes('믹싱 시간 확인')) checks.push('믹싱 시간 확인');
    }
    data.checks = checks.map((c, i) => ({
      name: c.trim(),
      checked: $id(`check-${stepNo}-${i}`)?.textContent === '✓'
    }));
  }
  else if (stepType === 'pack') {
    data.packQty = $id(`pack-qty-${stepNo}`)?.value || '';
    data.samples = [];
    for (let n = 1; n <= 3; n++) {
      data.samples.push({
        weight: $id(`sample-wt-${stepNo}-${n}`)?.value || ''
      });
    }
  }
  else if (stepType === 'seal') {
    data.sealQty = $id(`seal-qty-${stepNo}`)?.value || '';
    data.labelCheck = $id(`check-seal-${stepNo}-0`)?.textContent === '✓';
    data.sealCheck = $id(`check-seal-${stepNo}-1`)?.textContent === '✓';
    // 샘플별 무게 기록
    data.samples = [];
    for (let n = 1; n <= 3; n++) {
      const w = $id(`seal-weight-${stepNo}-${n}`)?.value || '';
      data.samples.push({ weight: w, photoKey: `seal${n}` });
    }
  }
  else if (stepType === 'inspect') {
    Object.assign(data, ccpGridCollect(stepNo));   // 신 격자(checks·판정·통과량 등) 수집
  }
  else if (stepType === 'heat') {
    Object.assign(data, heatCollect(stepNo));      // 가열공정 CCP-3B (호기별 행)
  }
  else if (stepType === 'qr-label') {
    data.qrQty = $id(`qr-label-qty-${stepNo}`)?.value || '';
  }
  else if (stepType === 'store') {
    data.freezeStart = $id('freeze-start')?.value || '';
    // freezeTemp(투입온도) 수집 제거 — 센서 자동기록(동결온도로그)으로 대체, 종료온도는 출하승인에서
    data._fmt = 'ccpFreeze-v1';
  }

  return JSON.stringify(data);
}

// ── 사진 일괄 업로드 → URL 배열 리턴 ──
async function uploadStepPhotos(files) {
  if (!files || files.length === 0) return '';
  const urls = [];
  let failCount = 0;
  for (const file of files) {
    try {
      const url = await DriveAPI.uploadPhoto(file);
      if (url) urls.push(url);
    } catch (e) {
      failCount++;
      console.error('Photo upload failed:', e);
    }
  }
  if (failCount > 0 && urls.length === 0) {
    toast(`⚠️ 사진 ${failCount}장 업로드 실패. 인증이 만료되었을 수 있습니다.`, 'err', 4000);
  } else if (failCount > 0) {
    toast(`⚠️ 사진 ${failCount}장 업로드 실패 (${urls.length}장 성공)`, 'warn', 3000);
  }
  return urls.join(' | ');
}

// Helper functions for WO execution
function toggleCheck(el) {
  el.classList.toggle('checked');
  el.textContent = el.classList.contains('checked') ? '✓' : '';
}

function previewStepPhoto(input, stepNo) {
  const preview = $id(`photo-preview-${stepNo}`);
  if (!preview) return;
  preview.innerHTML = '';
  preview.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';

  // 파일을 State에 보관 (단계 이동 후에도 유지)
  if (!State.woExec._pendingPhotos) State.woExec._pendingPhotos = {};
  if (!State.woExec._pendingPhotos[stepNo]) State.woExec._pendingPhotos[stepNo] = [];
  Array.from(input.files).forEach(f => {
    // 중복 방지
    if (!State.woExec._pendingPhotos[stepNo].some(p => p.name === f.name && p.size === f.size)) {
      State.woExec._pendingPhotos[stepNo].push(f);
    }
  });

  // 모든 보관된 사진 프리뷰 표시
  State.woExec._pendingPhotos[stepNo].forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.style.cssText = 'width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-l)';
    preview.appendChild(img);
  });
  // Change upload appearance
  input.closest('.photo-upload')?.classList.add('has-photo');
}

// ─────────────────────────────────────────────────────────────────────────────
// 사진 첨부 붙여넣기(Ctrl+V)·드래그앤드롭 + HEIC 안전변환 (ADDITIVE·GUARDED)
//   · 기존 file input 의 onchange 경로(previewStepPhoto→_pendingPhotos)를 그대로 재사용.
//     붙여넣기/드롭한 파일을 input 에 DataTransfer 로 주입 후 native 'change' 를 발생시켜
//     파일 선택과 100% 동일하게 동작. 카메라 촬영 경로는 손대지 않음.
//   · HEIC(아이폰 기본 사진)·기타 비-JPEG/PNG 이미지는 canvas→JPEG 로 정규화하여
//     프리뷰·업로드가 실패하지 않도록 함(카메라 촬영 File 은 변환 대상 아님).
// ─────────────────────────────────────────────────────────────────────────────
let _sfActivePhotoInput = null;   // 현재 붙여넣기 대상 file input

// 이미지 File 을 프리뷰·업로드 안전한 형식으로 정규화. JPEG/PNG 는 그대로,
// HEIC/HEIF·기타(webp 등)만 canvas 로 JPEG 변환. 실패 시 원본 File 반환(무해).
async function _sfNormalizeImageFile(file) {
  try {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) return file;
    const t = file.type.toLowerCase();
    // 브라우저가 직접 렌더 가능한 포맷은 변환 불필요
    if (t === 'image/jpeg' || t === 'image/jpg' || t === 'image/png') return file;
    // HEIC 는 대부분 브라우저에서 <img> 디코딩 불가 → createImageBitmap 시도 후 실패 시 원본 유지
    let bmp = null;
    try { bmp = await createImageBitmap(file); } catch (e) { bmp = null; }
    if (!bmp) {
      // 디코딩 불가(예: 데스크톱 브라우저의 HEIC) → 변환 포기, 원본 반환.
      // Drive 업로드는 원본 mimeType 으로 진행되므로 저장 자체는 성공.
      return file;
    }
    const canvas = document.createElement('canvas');
    canvas.width = bmp.width; canvas.height = bmp.height;
    canvas.getContext('2d').drawImage(bmp, 0, 0);
    if (bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
    if (!blob) return file;
    const base = (file.name || 'pasted').replace(/\.[^.]+$/, '');
    return new File([blob], base + '.jpg', { type: 'image/jpeg', lastModified: Date.now() });
  } catch (e) {
    console.warn('[사진첨부] 이미지 정규화 실패, 원본 사용:', e && e.message);
    return file;
  }
}

// 이 input 이 받는 파일인가 — 이미지로 하드코딩하면 PDF 성적서를 붙여넣기·드롭했을 때
// 아무 반응 없이 사라진다. accept 를 그대로 해석한다(mime, `image/*`, `.pdf` 확장자 모두).
function _sfAcceptsFile(input, file) {
  const acc = String((input && input.accept) || '').toLowerCase().trim();
  if (!acc) return true;
  const type = String((file && file.type) || '').toLowerCase();
  const name = String((file && file.name) || '').toLowerCase();
  return acc.split(',').map(s => s.trim()).filter(Boolean).some(rule =>
    rule.startsWith('.') ? name.endsWith(rule)
      : rule.endsWith('/*') ? type.startsWith(rule.slice(0, -1))
      : type === rule);
}

// 정규화한 File 목록을 input 에 주입하고 기존 onchange 경로를 그대로 발동.
async function _sfFeedFilesToInput(input, rawFiles) {
  try {
    if (!input || !rawFiles || !rawFiles.length) return;
    const dt = new DataTransfer();
    // multiple 아니면 첫 파일만
    const list = input.multiple ? Array.from(rawFiles) : [rawFiles[0]];
    for (const f of list) {
      const norm = await _sfNormalizeImageFile(f);
      dt.items.add(norm);
    }
    input.files = dt.files;
    // 파일 선택과 동일: input 의 인라인 onchange(previewStepPhoto + validateStepInputs) 실행
    input.dispatchEvent(new Event('change', { bubbles: true }));
  } catch (e) {
    console.warn('[사진첨부] 파일 주입 실패:', e && e.message);
  }
}

// 개별 file input 에 드래그앤드롭 + 활성타깃 등록 배선 (install-once 가드)
function enablePhotoPaste(input) {
  try {
    if (!input || input.dataset.sfPasteWired === '1') return;
    input.dataset.sfPasteWired = '1';

    const markActive = () => { _sfActivePhotoInput = input; };
    input.addEventListener('focus', markActive);
    input.addEventListener('pointerdown', markActive);
    // 파일 선택 후에도 이 input 이 붙여넣기 대상이 되도록
    input.addEventListener('change', markActive);

    // 드롭 영역 = 보이는 컨테이너(label.photo-upload) 또는 부모, 없으면 input 자신
    const zone = input.closest('.photo-upload') || input.parentElement || input;
    if (zone && zone.dataset.sfDropWired !== '1') {
      zone.dataset.sfDropWired = '1';
      const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
      zone.addEventListener('dragenter', stop);
      zone.addEventListener('dragover', (e) => { stop(e); _sfActivePhotoInput = input; });
      zone.addEventListener('drop', (e) => {
        stop(e);
        try {
          const files = e.dataTransfer && e.dataTransfer.files
            ? Array.from(e.dataTransfer.files).filter(f => _sfAcceptsFile(input, f))
            : [];
          if (files.length) { _sfActivePhotoInput = input; _sfFeedFilesToInput(input, files); }
        } catch (err) { console.warn('[사진첨부] 드롭 처리 실패:', err && err.message); }
      });
    }
  } catch (e) {
    console.warn('[사진첨부] enablePhotoPaste 실패(무시):', e && e.message);
  }
}

// 컨테이너 내 모든 이미지 file input 을 일괄 배선 + 전역 paste 리스너 1회 설치
function enablePhotoPasteAll(root) {
  try {
    const scope = root || document;
    const inputs = scope.querySelectorAll('input[type="file"][accept*="image"]');
    inputs.forEach(enablePhotoPaste);

    // 전역 paste 리스너 (install-once)
    if (!window._sfPasteInstalled) {
      window._sfPasteInstalled = true;
      document.addEventListener('paste', (e) => {
        try {
          const target = _sfActivePhotoInput;
          if (!target || !document.body.contains(target)) return;
          const items = (e.clipboardData && e.clipboardData.items) ? e.clipboardData.items : [];
          const files = [];
          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            if (it.kind === 'file') {
              const f = it.getAsFile();
              if (f && _sfAcceptsFile(target, f)) files.push(f);
            }
          }
          if (files.length) {
            e.preventDefault();
            _sfFeedFilesToInput(target, files);
          }
        } catch (err) { console.warn('[사진첨부] paste 처리 실패:', err && err.message); }
      });
    }
  } catch (e) {
    console.warn('[사진첨부] enablePhotoPasteAll 실패(무시):', e && e.message);
  }
}

async function previewQRLabels(stepNo) {
  const qty = parseInt($id(`qr-label-qty-${stepNo}`)?.value) || 0;
  if (qty <= 0) { toast('라벨 수량을 입력하세요', 'err'); return; }
  if (qty > 200) { toast('라벨 수량이 너무 많습니다 (최대 200매)', 'err'); return; }

  const { woId, wo } = State.woExec;
  const productName = wo ? wo[4] : '';
  const fgItemCode = wo ? (wo[3] || 'FG002') : 'FG002';

  // 생산일 = WO 시작시간 기준 (실제 제조일)
  const prodDateStr = wo ? (wo[9] || formatDate()) : formatDate();
  const prodDate = new Date(prodDateStr);
  const productionDate = formatDate(prodDate);

  // 소비기한 = 생산일 + 6개월
  const expDate = new Date(prodDate);
  expDate.setMonth(expDate.getMonth() + 6);
  const expStr = formatDate(expDate);

  showLoading();

  try {
    // FG LOT ID 사전 채번 — approveWO에서 동일 ID 재사용됨
    // ★ 동시 채번 race condition 차단을 위해 채번 직후 placeholder row 즉시 적재 (atomic claim).
    //   다른 WO가 같은 시점에 generateLotId 를 호출해도 이 placeholder 를 보고 다음 일련번호로 발급.
    let fgLotId = wo ? wo[14] : '';
    if (!fgLotId || !fgLotId.startsWith('FG-')) {
      fgLotId = await generateLotId('FG', fgItemCode, expStr, '완제품LOT', 0, productionDate);
      // 채번 즉시 placeholder row 적재 — 다른 동시 호출이 즉시 인지 가능
      try {
        SheetsAPI.invalidateCache('완제품LOT');
        const existing = (await SheetsAPI.getAll('완제품LOT', false)).find(l => l[0] === fgLotId);
        if (!existing) {
          await SheetsAPI.append('완제품LOT', [
            fgLotId, fgItemCode, productName, '0', '5kg',
            productionDate, expStr, woId, '0', '채번예약', '0', '냉동 -18°C'
          ]);
          console.log(`[QR라벨] placeholder row 적재 완료: ${fgLotId}`);
        } else {
          console.log(`[QR라벨] placeholder row 이미 존재: ${fgLotId} (status=${existing[9]||'-'})`);
        }
      } catch (e) {
        console.warn('[QR라벨] placeholder 적재 실패 (계속 진행):', e.message);
      }
      // WO에 ID 저장 — 승인 시 이 ID 의 placeholder row 를 갱신
      await SheetsAPI.updateCell('작업지시서', 0, woId, 14, fgLotId);
      if (wo) wo[14] = fgLotId;
      console.log(`[QR라벨] FG LOT ID 사전 채번 및 저장: ${fgLotId}`);
    } else {
      console.log(`[QR라벨] 기존 FG LOT ID 재사용: ${fgLotId}`);
    }

    // FG LOT ID 기반 개별 QR 라벨 생성 — approveWO와 동일 형식
    const labels = [];
    for (let i = 1; i <= qty; i++) {
      const indivId = `${fgLotId}-${String(i).padStart(2, '0')}`;
      labels.push({
        indivId: indivId,
        itemName: productName,
        lotId: fgLotId,
        date: `제조일자: ${productionDate}`,
        exp: `소비기한: ${expStr}`,
        storage: '보관: 냉동 -18°C 이하',
        company: '',
      });
    }

    hideLoading();

    // renderLabelCards 사용 (기존 라벨 시스템과 동일한 QR 미리보기)
    applyPrintCSS();
    renderLabelCards(labels);

    // 인쇄 버튼 표시
    const btnPrint = $id(`btn-wo-print-${stepNo}`);
    if (btnPrint) btnPrint.style.display = '';

    toast(`QR 라벨 ${qty}매 미리보기 생성 완료 (${fgLotId})`, 'suc');
  } catch (e) {
    hideLoading();
    console.error('[QR라벨] 미리보기 생성 실패:', e);
    toast('라벨 생성 실패: ' + e.message, 'err');
  }
}

function goToStep(idx) {
  if (idx < 0 || idx >= State.woExec.steps.length) return;
  const { maxStep, currentStep } = State.woExec;
  // maxStep 이하는 자유 이동, maxStep 초과는 불가 (완료되지 않은 미래 공정)
  if (idx > maxStep) {
    toast('해당 공정은 아직 완료되지 않았습니다. 순서대로 진행해주세요.', 'err', 3000);
    return;
  }
  console.log(`[WO실행] goToStep: ${currentStep} → ${idx} (maxStep=${maxStep})`);
  State.woExec.currentStep = idx;
  renderWOExecute();
}

async function tempSaveWO() {
  try {
    showLoading();
    const { woId, currentStep, steps } = State.woExec;
    const step = steps[currentStep];
    const stepNo = parseInt(step[1]);
    const stepType = step[3] || 'input';

    // 사진 업로드
    const photos = collectStepPhotos(stepNo, stepType);
    let photoUrls = '';
    if (photos.length > 0) {
      toast('사진 업로드 중...', 'info', 2000);
      photoUrls = await uploadStepPhotos(photos);
    }

    // 새 사진이 없으면 기존 저장된 사진 URL 유지
    const allRecords = await SheetsAPI.getAll('공정기록').catch(() => []);
    const existingIdx = allRecords.findIndex(r => r[0] === woId && r[1] === String(stepNo));
    if (!photoUrls && existingIdx >= 0) {
      photoUrls = allRecords[existingIdx][6] || '';
    }

    // 입력값 수집
    const stepData = collectStepData(stepNo, stepType, step);
    const usedLotIds = (stepType === 'input') ?
      (State.woExec._scannedLots?.[stepNo] || []).map(s => s.lotId).filter(Boolean).join(',') : '';

    // 공정기록 임시 저장 (기존 기록 있으면 덮어쓰기)
    // ⚠️ 이미 '완료'된 기록은 상태를 유지 (다운그레이드 방지)
    const existingStatus = existingIdx >= 0 ? (allRecords[existingIdx][10] || '') : '';
    const saveStatus = existingStatus === '완료' ? '완료' : '임시저장';
    if (existingStatus === '완료') {
      console.log(`[WO실행] 임시저장: stepNo=${stepNo} 이미 완료된 공정 — 데이터만 갱신, 상태 유지`);
    }
    if (existingIdx >= 0) {
      await SheetsAPI.updateRowByIndex('공정기록', existingIdx + 2, {
        0: woId, 1: String(stepNo), 2: step[2], 3: stepType,
        4: usedLotIds, 5: stepData, 6: photoUrls,
        7: '', 8: '', 9: '', 10: saveStatus,
        11: formatDateTime(), 12: State.user?.email
      });
    } else {
      await SheetsAPI.append('공정기록', [
        woId, String(stepNo), step[2], stepType,
        usedLotIds, stepData, photoUrls,
        '', '', '', '임시저장',
        formatDateTime(), State.user?.email
      ]);
    }
    SheetsAPI.invalidateCache('공정기록');

    // lastSavedStep: 절대 감소하지 않도록 방어 — maxStep과 현재 위치 중 큰 값만 기록
    const { maxStep } = State.woExec;
    const newLastSaved = Math.max(currentStep, maxStep);
    await SheetsAPI.updateCell('작업지시서', 0, woId, 13, String(newLastSaved));
    console.log(`[WO실행] 임시저장: step=${currentStep}, maxStep=${maxStep}, lastSavedStep=${newLastSaved}`);

    // records 캐시 갱신 — 이후 단계 이동 시 최신 데이터 복원 가능하도록
    try {
      const freshRecords = await SheetsAPI.getAll('공정기록', false);
      State.woExec.records = freshRecords.filter(r => r[0] === woId);
    } catch (e) { console.warn('[WO실행] records 갱신 실패:', e.message); }

    const statusMsg = saveStatus === '완료' ? ' (완료 상태 유지)' : '';
    toast(`저장 완료${statusMsg}${photos.length > 0 ? ` (사진 ${photos.length}장 업로드됨)` : ''}`, 'suc');
  } catch (e) {
    toast('임시저장 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
  }
}

async function handleCompleteStep(isFinal = false) {
  const step = State.woExec?.steps?.[State.woExec?.currentStep];
  if (!step) return;
  // 미리보기 모드: 검증·저장 없이 화면 흐름만 다음 단계로 (실데이터 생성 안 함)
  if (isPreviewing()) {
    const we = State.woExec;
    if (isFinal || !we || we.currentStep >= (we.steps?.length || 0) - 1) {
      toast('👁 미리보기 — 마지막 단계 (저장 없음)', 'info', 1600); Router.go('production'); return;
    }
    we.currentStep++;
    toast('👁 미리보기 — 저장 없이 다음 단계', 'info', 1300);
    renderWOExecute();
    return;
  }
  const stepNo = parseInt(step[1]);
  const stepType = step[3] || 'input';
  const isWater = (step[4] || '') === 'RM002';

  const missing = [];

  if (stepType === 'input') {
    const qtyInput = $id(`input-qty-${stepNo}`);
    const qtyVal = parseFloat(qtyInput?.value);
    if (!qtyVal || qtyVal <= 0) missing.push('실제 투입량');

    // ±5% 범위 검증
    if (qtyVal > 0 && qtyInput?.dataset?.target) {
      const targetVal = parseFloat(qtyInput.dataset.target);
      if (targetVal > 0) {
        const lo = targetVal * 0.95, hi = targetVal * 1.05;
        if (qtyVal < lo || qtyVal > hi) {
          missing.push(`투입량 범위 초과 (목표 ${targetVal}kg 의 ±5%: ${lo.toFixed(2)}~${hi.toFixed(2)}kg, 입력값 ${qtyVal}kg)`);
        }
      }
    }

    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) missing.push('저울 사진');

    const checks = (step[6] || '').split(',').filter(c => c.trim());
    let unchecked = 0;
    checks.forEach((_, i) => {
      const cb = $id(`check-${stepNo}-${i}`);
      if (cb && cb.textContent !== '✓') unchecked++;
    });
    if (unchecked > 0) missing.push(`체크항목 (${unchecked}건 미체크)`);

    if (!isWater) {
      const scanned = State.woExec._scannedLots?.[stepNo]?.length || 0;
      if (scanned === 0) missing.push('QR 스캔 (원재료 LOT)');
    }
  }

  if (stepType === 'process') {
    // 체크항목 전부 체크 확인
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    const isMixing = (step[2]||'').includes('믹싱');
    const allChecks = [...checks];
    if (isMixing) {
      if (!allChecks.includes('RPM 확인')) allChecks.push('RPM 확인');
      if (!allChecks.includes('믹싱 시간 확인')) allChecks.push('믹싱 시간 확인');
    }
    let unchecked = 0;
    allChecks.forEach((_, i) => {
      const cb = $id(`check-${stepNo}-${i}`);
      if (cb && cb.textContent !== '✓') unchecked++;
    });
    if (unchecked > 0) missing.push(`체크항목 (${unchecked}건 미체크)`);
    // 사진 필수
    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) missing.push('공정 사진');
  }

  if (stepType === 'inspect') {
    // CCP 금속검출 격자 — 감시시각 1건↑ · 각 행 시각 입력 · 이탈 시 개선조치 · 통과량
    const grid = State.woExec._ccpGrid?.[stepNo];
    if (!grid || !grid.rows.length) missing.push('CCP 감시시각 기록 (1건 이상)');
    else {
      grid.rows.forEach((r) => { if (!r.시각) missing.push(`${r.구분 === '작업중2h' ? '작업 중(2h)' : r.구분} 감시시각 입력`); });
      const hasDev = grid.rows.some(r => ccpRowJudge(r) === '부적합');
      if (hasDev && !$id(`ccp-dev-${stepNo}`)?.value) missing.push('이탈 발생 — 이탈내용 입력');
      if (hasDev && !$id(`ccp-action-${stepNo}`)?.value) missing.push('이탈 발생 — 개선조치 입력');
    }
    if (!$id(`ccp-passQty-${stepNo}`)?.value) missing.push('통과량');
  }

  if (stepType === 'pack') {
    // 실제 생산 수량
    const packQty = parseInt($id(`pack-qty-${stepNo}`)?.value);
    if (!packQty || packQty <= 0) missing.push('실제 생산 수량');
    // 3개 샘플 사진
    let photoCount = 0;
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-s${n}`);
      if (prev && prev.innerHTML.trim()) photoCount++;
    }
    if (photoCount < 3) missing.push(`샘플 사진 (${3-photoCount}건 미촬영)`);
    // 3개 샘플 무게
    let weightCount = 0;
    for (let n = 1; n <= 3; n++) {
      const wt = parseFloat($id(`sample-wt-${stepNo}-${n}`)?.value);
      if (wt && wt > 0) weightCount++;
    }
    if (weightCount < 3) missing.push(`샘플 무게 (${3-weightCount}건 미입력)`);
  }

  if (stepType === 'seal') {
    // 밀봉 체크항목 확인
    const sealCheck0 = $id(`check-seal-${stepNo}-0`);
    const sealCheck1 = $id(`check-seal-${stepNo}-1`);
    if (!sealCheck0 || sealCheck0.textContent !== '✓') missing.push('제품 라벨 부착 확인');
    if (!sealCheck1 || sealCheck1.textContent !== '✓') missing.push('밀봉 상태 확인');
    // 사진 확인
    let photoCount = 0;
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-seal${n}`);
      if (prev && prev.innerHTML.trim()) photoCount++;
    }
    if (photoCount < 3) missing.push(`샘플 사진 (${3-photoCount}건 미촬영)`);
    // 샘플 무게 확인
    let sealWeightCount = 0;
    for (let n = 1; n <= 3; n++) {
      const wt = parseFloat($id(`seal-weight-${stepNo}-${n}`)?.value);
      if (wt && wt > 0) sealWeightCount++;
    }
    if (sealWeightCount < 3) missing.push(`샘플 무게 (${3-sealWeightCount}건 미입력)`);
    // 수량 확인
    const sealQty = parseInt($id(`seal-qty-${stepNo}`)?.value);
    if (!sealQty || sealQty <= 0) missing.push('최종 완제품 수량');
    else State.woExec.packCount = sealQty; // 최종 재고 인정 수량 반영
  }

  if (stepType === 'qr-label') {
    const qrQty = parseInt($id(`qr-label-qty-${stepNo}`)?.value);
    if (!qrQty || qrQty <= 0) missing.push('QR 라벨 수량');
  }

  // store: 사진·투입온도 요구 제거 — 냉동고 온도는 센서 자동기록, 종료온도는 출하승인에서 (CCP-1)

  if (missing.length > 0) {
    toast('미입력 항목:\n• ' + missing.join('\n• '), 'err', 4000);
    return;
  }

  if (isFinal) {
    // 전체 완료 전 이전 공정 기록 사전 검증
    try {
      showLoading();
      const allRecs = await SheetsAPI.getAll('공정기록').catch(() => []);
      const woRecs = allRecs.filter(r => r[0] === State.woExec.woId);
      const incompSteps = [];
      for (let i = 0; i < State.woExec.steps.length - 1; i++) {
        const sNo = State.woExec.steps[i][1];
        const rec = woRecs.find(r => r[1] === String(sNo) && r[10] === '완료');
        if (!rec) incompSteps.push(`${sNo}. ${State.woExec.steps[i][2] || ''}`);
      }
      hideLoading();
      if (incompSteps.length > 0) {
        toast(`⚠️ 이전 공정 ${incompSteps.length}건 미완료:\n• ${incompSteps.join('\n• ')}\n\n모든 공정을 순서대로 완료해주세요.`, 'err', 6000);
        return;
      }
    } catch (e) {
      hideLoading();
    }
    submitForApproval();
  } else {
    completeStep();
  }
}

async function completeStep() {
  if (!acquireLock('completeStep')) return;
  const { woId, steps, currentStep } = State.woExec;
  const step = steps[currentStep];
  const stepNo = parseInt(step[1]);
  const stepType = step[3] || 'input';

  try {
    showLoading();

    // ⚠️ 이전 공정 완료 여부 사전 검증 (건너뛰기 방지)
    if (currentStep > 0) {
      const allRecs = await SheetsAPI.getAll('공정기록').catch(() => []);
      const woRecs = allRecs.filter(r => r[0] === woId);
      const incompSteps = [];
      for (let i = 0; i < currentStep; i++) {
        const sNo = steps[i][1];
        const rec = woRecs.find(r => r[1] === String(sNo) && r[10] === '완료');
        if (!rec) incompSteps.push(`${sNo}. ${steps[i][2] || ''}`);
      }
      if (incompSteps.length > 0) {
        hideLoading();
        releaseLock('completeStep');
        toast(`⚠️ 이전 공정 ${incompSteps.length}건 미완료:\n• ${incompSteps.join('\n• ')}\n\n이전 공정을 먼저 완료해주세요.`, 'err', 5000);
        return;
      }
    }

    // input step: 원재료 재고 차감 (스캔된 LOT) — 개별 항목별 전량/잔여분 처리
    let usedLotIds = '';
    if (stepType === 'input') {
      const scannedItems = State.woExec._scannedLots?.[stepNo] || [];
      const itemUseTypes = State.woExec._itemUseType?.[stepNo] || {};
      const qtyInput = $id(`input-qty-${stepNo}`);
      const consumedQty = parseFloat(qtyInput?.value) || 0;

      // ── 서버 사이드 상태 재검증: 이미 소진/폐기된 재료 중복 투입 차단 ──
      SheetsAPI.invalidateCache('원재료개별');
      const freshRmIndivs = await SheetsAPI.getAll('원재료개별', false);
      const alreadyUsed = scannedItems.filter(item => {
        const fresh = freshRmIndivs.find(iv => iv[0] === item.qrId);
        return fresh && ['소진','폐기','입고취소'].includes(fresh[3]);
      });
      if (alreadyUsed.length > 0) {
        const usedIds = alreadyUsed.map(i => i.qrId).join(', ');
        toast(`⚠ 이미 사용/폐기/입고취소된 원재료가 포함되어 있습니다:\n${usedIds}\n\n해당 항목을 제거 후 다시 시도하세요.`, 'err', 6000);
        hideLoading(); releaseLock('completeStep'); return;
      }

      // ① 개별 항목별 상태 업데이트 — 전량:'소진', 잔여분:'잔여'(활성 유지)
      await Promise.all(scannedItems.map((item, idx) => {
        const ut = itemUseTypes[idx] || 'full';
        const newStatus = ut === 'partial' ? '잔여' : '소진';
        return SheetsAPI.updateRow('원재료개별', 0, item.qrId, { 3: newStatus });
      }));

      // ② LOT별 그룹핑 → 전량 소진 항목만 카운트하여 잔량 차감
      const lotGroups = {};
      scannedItems.forEach((item, idx) => {
        const ut = itemUseTypes[idx] || 'full';
        if (item.lotId && ut === 'full') {
          if (!lotGroups[item.lotId]) lotGroups[item.lotId] = 0;
          lotGroups[item.lotId]++;
        }
      });

      SheetsAPI.invalidateCache('원재료LOT');
      SheetsAPI.invalidateCache('원재료개별');
      const lots = await SheetsAPI.getAll('원재료LOT', false);
      const allIndivs = await SheetsAPI.getAll('원재료개별');

      for (const [lotId, count] of Object.entries(lotGroups)) {
        const lot = lots.find(l => l[0] === lotId);
        if (!lot) continue;
        const totalQty = parseFloat(lot[4]) || 0;
        // perUnit: 개별 항목의 실제 수량 우선, 없으면 LOT 총량/원래개수 사용
        const sampleIndiv = allIndivs.find(iv => iv[1] === lotId);
        const perUnit = sampleIndiv ? (parseFloat(sampleIndiv[4]) || totalQty / (parseInt(lot[10]) || 1))
                                    : totalQty / (parseInt(lot[10]) || 1);
        // 활성 개별 수 기준으로 잔량 직접 산출 (누적 오차 방지)
        const activeIndivs = allIndivs.filter(iv => iv[1] === lotId && !['폐기','소진','입고취소'].includes(iv[3]));
        const newRemain = Math.round(activeIndivs.length * perUnit * 100) / 100;
        const prevRemain = parseFloat(lot[8]) || 0;
        const newStatus = activeIndivs.length === 0 ? '소진' : '사용중';
        await SheetsAPI.updateRow('원재료LOT', 0, lotId, {
          8: String(newRemain),
          9: newStatus,
        });
        console.log(`[재고차감] ${lotId}: -${count}개(${(perUnit*count).toFixed(2)}kg), 잔량 ${prevRemain}→${newRemain}, 활성 ${activeIndivs.length}개, 상태 ${newStatus}`);
      }
      // 잔여분 항목도 기록에 포함 (개별 QR ID로 저장)
      usedLotIds = scannedItems.map(s => s.qrId).filter(Boolean).join(',');
    }

    // qr-label step: QR 라벨 수량 저장
    if (stepType === 'qr-label') {
      const qrQty = parseInt($id(`qr-label-qty-${stepNo}`)?.value) || State.woExec.packCount || 0;
      if (qrQty > 0) {
        await SheetsAPI.updateCell('작업지시서', 0, woId, 7, String(qrQty));
        State.woExec.packCount = qrQty;
      }
    }

    // seal step: 최종 완제품 수량 반영
    if (stepType === 'seal') {
      const sealQty = parseInt($id(`seal-qty-${stepNo}`)?.value);
      if (sealQty > 0) {
        await SheetsAPI.updateCell('작업지시서', 0, woId, 7, String(sealQty));
        State.woExec.packCount = sealQty;
      }
    }

    // 사진 업로드
    const photos = collectStepPhotos(stepNo, stepType);
    let photoUrls = '';
    if (photos.length > 0) {
      toast('사진 업로드 중...', 'info', 2000);
      photoUrls = await uploadStepPhotos(photos);
    }

    // 새 사진이 없으면 기존 저장된 사진 URL 유지
    const allRecords = await SheetsAPI.getAll('공정기록').catch(() => []);
    const existingIdx = allRecords.findIndex(r => r[0] === woId && r[1] === String(stepNo));
    if (!photoUrls && existingIdx >= 0) {
      photoUrls = allRecords[existingIdx][6] || '';
    }

    // 입력값 수집
    const stepData = collectStepData(stepNo, stepType, step);

    // 기존 임시저장 기록 있으면 덮어쓰기, 없으면 새로 추가
    if (existingIdx >= 0) {
      await SheetsAPI.updateRowByIndex('공정기록', existingIdx + 2, {
        0: woId, 1: step[1], 2: step[2], 3: step[3],
        4: usedLotIds, 5: stepData, 6: photoUrls,
        7: '', 8: '', 9: '', 10: '완료',
        11: formatDateTime(), 12: State.user?.email
      });
    } else {
      await SheetsAPI.append('공정기록', [
        woId, step[1], step[2], step[3],
        usedLotIds, stepData, photoUrls,
        '', '', '', '완료',
        formatDateTime(), State.user?.email
      ]);
    }
    SheetsAPI.invalidateCache('공정기록');

    // Update lastSavedStep — 절대 감소하지 않음 (maxStep 보호)
    const prevMaxStep = State.woExec.maxStep || 0;
    const newMaxStep = Math.max(currentStep + 1, prevMaxStep);
    State.woExec.maxStep = newMaxStep;
    await SheetsAPI.updateCell('작업지시서', 0, woId, 13, String(newMaxStep));
    console.log(`[WO실행] completeStep: step=${currentStep}, prevMaxStep=${prevMaxStep}, newMaxStep=${newMaxStep}`);

    // 업로드 완료된 사진 State에서 제거 (재업로드 방지)
    if (State.woExec._pendingPhotos) {
      delete State.woExec._pendingPhotos[stepNo];
      if (stepType === 'pack') { for (let n=1;n<=3;n++) delete State.woExec._pendingPhotos[`${stepNo}-s${n}`]; }
      if (stepType === 'seal') { for (let n=1;n<=3;n++) delete State.woExec._pendingPhotos[`${stepNo}-seal${n}`]; }
      if (stepType === 'inspect') delete State.woExec._pendingPhotos[`${stepNo}-ccp7`];
    }

    // records 캐시 갱신 — 이후 단계 이동 시 최신 데이터 복원 가능하도록
    try {
      const freshRecords = await SheetsAPI.getAll('공정기록', false);
      State.woExec.records = freshRecords.filter(r => r[0] === woId);
    } catch (e) { console.warn('[WO실행] records 갱신 실패:', e.message); }

    // 다음 공정으로 이동
    State.woExec.currentStep = currentStep + 1;
    hideLoading();
    renderWOExecute();
  } catch (e) {
    hideLoading();
    toast('공정 기록 실패: ' + e.message, 'err');
  } finally {
    releaseLock('completeStep');
  }
}

async function submitForApproval() {
  confirm('냉동보관 시작', '모든 공정이 완료되었습니다. 냉동보관을 시작하시겠습니까?\n12시간 이후 관리자가 출하승인하면 완제품 재고로 등록됩니다.', async () => {
    if (!acquireLock('submitForApproval')) return;
    try {
      showLoading();
      const { woId, steps } = State.woExec;

      // ── 전체 공정기록 완료 검증 ──
      const allRecords = await SheetsAPI.getAll('공정기록').catch(() => []);
      const woRecords = allRecords.filter(r => r[0] === woId);
      const missingSteps = [];
      // 마지막 스텝(현재 스텝)은 아래에서 저장하므로 제외하고 검증
      for (let i = 0; i < steps.length - 1; i++) {
        const sNo = steps[i][1]; // stepNo (string)
        const rec = woRecords.find(r => r[1] === String(sNo) && r[10] === '완료');
        if (!rec) missingSteps.push(`${sNo}. ${steps[i][2] || ''}`);
      }
      if (missingSteps.length > 0) {
        hideLoading();
        toast(`⚠️ 미완료 공정이 있습니다:\n• ${missingSteps.join('\n• ')}\n\n모든 공정을 순서대로 완료해주세요.`, 'err', 6000);
        return;
      }

      const freezeStart = formatDateTime();

      // Save last step record with photos and data
      const step = steps[State.woExec.currentStep];
      const stepNo = parseInt(step[1]);
      const stepType = step[3] || 'store';
      const photos = collectStepPhotos(stepNo, stepType);
      let photoUrls = '';
      if (photos.length > 0) {
        toast('사진 업로드 중...', 'info', 2000);
        photoUrls = await uploadStepPhotos(photos);
      }
      // 새 사진이 없으면 기존 저장된 사진 URL 유지
      const existingIdx = allRecords.findIndex(r => r[0] === woId && r[1] === String(stepNo));
      if (!photoUrls && existingIdx >= 0) {
        photoUrls = allRecords[existingIdx][6] || '';
      }
      const stepData = collectStepData(stepNo, stepType, step);

      if (existingIdx >= 0) {
        await SheetsAPI.updateRowByIndex('공정기록', existingIdx + 2, {
          0: woId, 1: step[1], 2: step[2], 3: step[3],
          4: '', 5: stepData, 6: photoUrls,
          7: '', 8: '', 9: '', 10: '완료',
          11: formatDateTime(), 12: State.user?.email
        });
      } else {
        await SheetsAPI.append('공정기록', [
          woId, step[1], step[2], step[3],
          '', stepData, photoUrls,
          '', '', '', '완료',
          formatDateTime(), State.user?.email
        ]);
      }
      SheetsAPI.invalidateCache('공정기록');

      // Update WO status → 냉동보관중
      await SheetsAPI.updateRow('작업지시서', 0, woId, {
        10: formatDateTime(),   // endTime
        11: freezeStart,        // freezeStartTime
        12: '냉동보관중',        // status
        13: String(State.woExec.steps.length), // lastSavedStep
      });

      toast('냉동보관이 시작되었습니다. 12시간 후 출하승인 가능합니다.', 'suc');
      Router.go('production');
    } catch (e) {
      toast('냉동보관 시작 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
      releaseLock('submitForApproval');
    }
  });
}
