        <button class="btn btn-suc btn-full mt-12" id="btn-print" style="display:none;font-size:15px;padding:14px" onclick="printLabels()">🖨️ 인쇄</button>
      </div>
    `;
    applyPrintCSS();
    setTimeout(() => {
      renderLabelCards(preLabels);
      toast(`${srcLotId || ''} ${preLabels.length}매 라벨 생성 완료`, 'suc');
    }, 100);
    return;
  }

  // 일반 모드 — 기존 폼 표시
  $id('content').innerHTML = `
    <div style="padding:16px">

      <!-- 모드 토글 -->
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn btn-full ${mode === 'lot' ? 'btn-pri' : 'btn-out'}" id="mode-lot-btn"
          onclick="switchLabelMode('lot')">📦 LOT 일괄 발행</button>
        <button class="btn btn-full ${mode === 'indiv' ? 'btn-pri' : 'btn-out'}" id="mode-indiv-btn"
          onclick="switchLabelMode('indiv')">🏷️ 개별 재프린트</button>
      </div>

      <!-- LOT 일괄 모드 -->
      <div id="label-mode-lot" style="display:${mode === 'lot' ? 'block' : 'none'}">
        <div class="input-group">
          <label>LOT 번호</label>
          <input type="text" id="lbl-lot" value="${lotId || ''}" placeholder="예: RM-001-260406-260706-001">
        </div>
        <div class="input-group">
          <label>라벨 수량</label>
          <input type="number" id="lbl-count" value="${count || 1}" placeholder="라벨 수" min="1" max="50">
        </div>
        <div class="input-group">
          <label>품목명 (자동조회 / 직접입력)</label>
          <input type="text" id="lbl-item-name" value="${itemName || ''}" placeholder="LOT 입력 시 자동 조회됩니다">
        </div>
        <button class="btn btn-pri btn-full" onclick="generateLabelsLot()">라벨 미리보기 생성</button>
      </div>

      <!-- 개별 재프린트 모드 -->
      <div id="label-mode-indiv" style="display:${mode === 'indiv' ? 'block' : 'none'}">
        <div class="card" style="border:1px solid var(--gray-l);padding:12px">
          <div class="fs-12 fw-6 mb-8">직접 입력 / QR 스캔</div>
          <div style="display:flex;gap:8px">
            <input type="text" id="lbl-indiv-id" placeholder="예: RM-001-260406-260706-001-01" style="flex:1;font-size:13px">
            <button class="btn btn-out" onclick="scanForReprint()" style="white-space:nowrap">📷</button>
          </div>
          <div class="fs-11 c-txt-l mt-4">쉼표(,)로 여러 ID 입력 가능</div>
          <button class="btn btn-pri btn-full mt-8" onclick="generateLabelsIndiv()">ID로 라벨 생성</button>
        </div>
        <div class="mt-12">
          <div class="fs-13 fw-7 mb-8">📋 재고에서 선택</div>
          <div id="reprint-stock-area">
            <button class="btn btn-out btn-full" onclick="loadReprintStock()">현재 재고 불러오기</button>
          </div>
        </div>
      </div>

      <div id="label-preview" class="mt-16"></div>
      <button class="btn btn-suc btn-full mt-12" id="btn-print" style="display:none;font-size:15px;padding:14px" onclick="printLabels()">🖨️ 인쇄</button>
    </div>
  `;

  applyPrintCSS();
  if (mode === 'indiv') setTimeout(() => loadReprintStock(), 100);
};

function switchLabelMode(mode) {
  $id('label-mode-lot').style.display = mode === 'lot' ? 'block' : 'none';
  $id('label-mode-indiv').style.display = mode === 'indiv' ? 'block' : 'none';
  $id('mode-lot-btn').className = `btn btn-full ${mode === 'lot' ? 'btn-pri' : 'btn-out'}`;
  $id('mode-indiv-btn').className = `btn btn-full ${mode === 'indiv' ? 'btn-pri' : 'btn-out'}`;
  $id('label-preview').innerHTML = '';
  const bp = $id('btn-print');
  if (bp) bp.style.display = 'none';
  // 개별 모드 전환 시 재고 로드
  if (mode === 'indiv') loadReprintStock();
}

// ── 재고 기반 드릴다운: Step 1 - 품목 리스트 ──
async function loadReprintStock() {
  const area = $id('reprint-stock-area');
  if (!area) return;
  area.innerHTML = '<div class="loading-inline"><div class="spinner-s"></div> 재고 조회 중...</div>';

  try {
    // 원재료/완제품/소모품 LOT 시트에서 잔량 > 0 인 품목 집계
    const [rmLots, fgLots, spLots] = await Promise.all([
      SheetsAPI.getAll('원재료LOT').catch(() => []),
      SheetsAPI.getAll('완제품LOT').catch(() => []),
      SheetsAPI.getAll('소모품LOT').catch(() => []),
    ]);

    // 캐시에 저장 (LOT 선택 단계에서 재사용)
    window._reprintCache = { rmLots, fgLots, spLots };

    // 품목별 집계: { code: { name, type, totalStock, lotCount } }
    const items = {};

    rmLots.forEach(l => {
      const remain = parseFloat(l[8]) || 0;
      if (remain <= 0) return;
      const key = `rm:${l[1]}`;
      if (!items[key]) items[key] = { code: l[1], name: l[2], type: 'rm', typeLabel: '원재료', totalStock: 0, lotCount: 0, unit: l[5] || 'kg' };
      items[key].totalStock += remain;
      items[key].lotCount++;
    });

    fgLots.forEach(l => {
      // 완제품 잔량 = col8(remain). ⚠ 구버그: col7(=woId)를 잔량으로 합산 → woId가 문자열이면 전부 skip돼 완제품이 목록에서 누락.
      const remain = parseFloat(l[8]) || 0;
      if (remain <= 0) return;
      const key = `fg:${l[1]}`;
      // 완제품 단위 = 개(봉). col4(=packUnit '5kg')를 단위로 쓰면 '732 5kg'처럼 오표시됨.
      if (!items[key]) items[key] = { code: l[1], name: l[2], type: 'fg', typeLabel: '완제품', totalStock: 0, lotCount: 0, unit: '개' };
      items[key].totalStock += remain;
      items[key].lotCount++;
    });

    spLots.forEach(l => {
      const remain = parseFloat(l[6]) || 0;
      if (remain <= 0) return;
      const key = `sp:${l[1]}`;
      if (!items[key]) items[key] = { code: l[1], name: l[2], type: 'sp', typeLabel: '소모품', totalStock: 0, lotCount: 0, unit: l[4] || '' };
      items[key].totalStock += remain;
      items[key].lotCount++;
    });

    const itemList = Object.values(items);
    if (itemList.length === 0) {
      area.innerHTML = '<div class="empty-state"><div class="es-icon">📭</div><div class="es-title">재고 없음</div><div class="es-desc">현재 잔량이 있는 LOT가 없습니다</div></div>';
      return;
    }

    // 유형 뱃지 색상
    const typeBg = { rm: 'var(--pri-bg)', fg: 'var(--suc-bg)', sp: '#fff8e1' };
    const typeColor = { rm: 'var(--pri)', fg: 'var(--suc)', sp: '#f57f17' };

    area.innerHTML = `
      <div class="fs-11 c-txt-l mb-8">품목을 선택하면 해당 LOT와 개별 제품을 확인할 수 있습니다</div>
      ${itemList.map(it => `
        <div class="card" style="cursor:pointer;border:1px solid var(--gray-l);transition:all .15s"
             onclick="loadReprintLots('${it.type}','${it.code}','${it.name}')"
             onmousedown="this.style.transform='scale(.98)'" onmouseup="this.style.transform=''">
          <div class="row between" style="align-items:center">
            <div>
              <span class="badge" style="background:${typeBg[it.type]};color:${typeColor[it.type]};font-size:10px">${it.typeLabel}</span>
              <span class="fw-6 fs-13 ml-4">${it.name}</span>
              <span class="fs-11 c-txt-l ml-4">${it.code}</span>
            </div>
            <div style="text-align:right">
              <div class="fw-7 fs-13">${it.totalStock}${it.unit}</div>
              <div class="fs-10 c-txt-l">LOT ${it.lotCount}건</div>
            </div>
          </div>
        </div>
      `).join('')}
    `;
  } catch (e) {
    area.innerHTML = `<div class="card" style="color:var(--err)">재고 조회 실패: ${e.message}</div>`;
  }
}

// ── Step 2 - 선택한 품목의 LOT 리스트 ──
async function loadReprintLots(type, itemCode, itemName) {
  const area = $id('reprint-stock-area');
  area.innerHTML = '<div class="loading-inline"><div class="spinner-s"></div> LOT 조회 중...</div>';

  try {
    const cache = window._reprintCache || {};
    let lots = [];
    if (type === 'rm') lots = (cache.rmLots || await SheetsAPI.getAll('원재료LOT')).filter(l => l[1] === itemCode && (parseFloat(l[8]) || 0) > 0 && !['폐기','입고취소'].includes(l[9]));
    else if (type === 'fg') lots = (cache.fgLots || await SheetsAPI.getAll('완제품LOT')).filter(l => l[1] === itemCode && (parseFloat(l[8]) || 0) > 0 && !['삭제','채번예약','출하완료','폐기','소진'].includes(l[9]));
    else if (type === 'sp') lots = (cache.spLots || await SheetsAPI.getAll('소모품LOT')).filter(l => l[1] === itemCode && (parseFloat(l[6]) || 0) > 0 && l[7] !== '폐기');

    area.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <button class="btn btn-out" onclick="loadReprintStock()" style="padding:6px 10px;font-size:12px">← 품목목록</button>
        <div class="fw-7 fs-13">${itemName}</div>
        <span class="fs-11 c-txt-l">${itemCode}</span>
      </div>
      ${lots.length === 0 ? '<div class="fs-12 c-txt-l">잔량이 있는 LOT가 없습니다</div>' : lots.map(l => {
        const lotId = l[0];
        // 완제품: 잔량 col8(remain), 단위 '개'(봉). ⚠ 구버그: col7(=woId)를 잔량으로 표시.
        const remain = type === 'rm' ? l[8] : type === 'fg' ? l[8] : l[6];
        const unit = type === 'rm' ? (l[5]||'kg') : type === 'fg' ? '개' : (l[4]||'');
        const exp = type === 'rm' ? (l[7]||'') : type === 'fg' ? (l[6]||'') : '';
        const indivCnt = type === 'rm' ? (l[10]||'') : '';
        const date = type === 'rm' ? (l[6]||'') : (l[5]||'');
        return `
          <div class="card" style="cursor:pointer;border:1px solid var(--gray-l);transition:all .15s"
               onclick="loadReprintIndivs('${type}','${lotId}','${itemName}')"
               onmousedown="this.style.transform='scale(.98)'" onmouseup="this.style.transform=''">
            <div class="row between" style="align-items:center">
              <div>
                <div class="fw-6 fs-13">${lotId}</div>
                <div class="fs-11 c-txt-l">${date ? '입고: '+date : ''}${exp ? ' · EXP: '+exp : ''}${indivCnt ? ' · 개별 '+indivCnt+'개' : ''}</div>
              </div>
              <div class="fw-7 fs-14" style="color:var(--pri)">${remain}${unit}</div>
            </div>
          </div>
        `;
      }).join('')}
    `;
  } catch (e) {
    area.innerHTML = `<div class="card" style="color:var(--err)">LOT 조회 실패: ${e.message}<br><button class="btn btn-out mt-8" onclick="loadReprintStock()">← 돌아가기</button></div>`;
  }
}

// ── Step 3 - 선택한 LOT의 개별 제품 리스트 (체크박스 선택) ──
async function loadReprintIndivs(type, lotId, itemName) {
  const area = $id('reprint-stock-area');
  area.innerHTML = '<div class="loading-inline"><div class="spinner-s"></div> 개별 제품 조회 중...</div>';

  try {
    const tabMap = { rm: '원재료개별', fg: '완제품개별', sp: '소모품개별' };
    const lotTabMap = { rm: '원재료LOT', fg: '완제품LOT', sp: '소모품LOT' };
    const allIndivs = await SheetsAPI.getAll(tabMap[type]).catch(() => []);
    const indivs = allIndivs.filter(r => r[1] === lotId);

    // LOT 정보도 가져와서 라벨에 활용
    const cache = window._reprintCache || {};
    let lotRow = null;
    if (type === 'rm') lotRow = (cache.rmLots || []).find(l => l[0] === lotId);
    else if (type === 'fg') lotRow = (cache.fgLots || []).find(l => l[0] === lotId);
    else if (type === 'sp') lotRow = (cache.spLots || []).find(l => l[0] === lotId);
    if (!lotRow) {
      const lotData = await SheetsAPI.getAll(lotTabMap[type]).catch(() => []);
      lotRow = lotData.find(l => l[0] === lotId);
    }

    // 캐시에 LOT 정보 저장
    window._reprintLotRow = lotRow;
    window._reprintType = type;

    const statusBadge = (s) => {
      const map = { '미사용': { bg: 'var(--suc-bg)', c: 'var(--suc)' }, '사용중': { bg: 'var(--pri-bg)', c: 'var(--pri)' }, '소진': { bg: '#f5f5f5', c: 'var(--gray)' } };
      const st = map[s] || map['미사용'];
      return `<span class="badge" style="background:${st.bg};color:${st.c};font-size:10px">${s || '미사용'}</span>`;
    };

    // 개별제품 컬럼: [0]=개별ID, [1]=LOT ID, [2]=품목코드, [3]=상태, [4]=수량, [5]=비고
    area.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <button class="btn btn-out" onclick="loadReprintLots('${type}','${lotRow?.[1]||''}','${itemName}')" style="padding:6px 10px;font-size:12px">← LOT목록</button>
        <div class="fw-7 fs-13">${itemName}</div>
      </div>
      <div class="fs-12 c-txt-l mb-8">${lotId} · 개별 ${indivs.length}건</div>

      ${indivs.length === 0 ? '<div class="fs-12 c-txt-l">개별 제품이 없습니다</div>' : `
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn btn-out" onclick="toggleReprintAll(true)" style="flex:1;font-size:12px">전체 선택</button>
          <button class="btn btn-out" onclick="toggleReprintAll(false)" style="flex:1;font-size:12px">전체 해제</button>
        </div>
        <div id="reprint-indiv-list" style="max-height:300px;overflow-y:auto">
          ${indivs.map((ind, i) => `
            <label class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid var(--gray-l);padding:10px 12px;margin-bottom:4px">
              <input type="checkbox" class="reprint-chk" value="${ind[0]}" data-idx="${i}" style="width:20px;height:20px;accent-color:var(--pri)">
              <div style="flex:1;min-width:0">
                <div class="fw-6 fs-12" style="word-break:break-all">${ind[0]}</div>
                <div class="fs-11 c-txt-l">${ind[4] ? ind[4] + (type==='rm'?(lotRow?.[5]||'kg'):'') : ''} ${statusBadge(ind[3])}</div>
              </div>
            </label>
          `).join('')}
        </div>
        <div class="mt-12" style="display:flex;gap:8px">
          <button class="btn btn-pri btn-full" onclick="generateReprintSelected('${type}','${lotId}','${itemName}')">
            선택 항목 라벨 생성
          </button>
        </div>
      `}
    `;
  } catch (e) {
    area.innerHTML = `<div class="card" style="color:var(--err)">개별 제품 조회 실패: ${e.message}<br><button class="btn btn-out mt-8" onclick="loadReprintStock()">← 처음으로</button></div>`;
  }
}

function toggleReprintAll(checked) {
  document.querySelectorAll('.reprint-chk').forEach(cb => cb.checked = checked);
}

// ── Step 4 - 선택된 개별 제품으로 라벨 생성 ──
function generateReprintSelected(type, lotId, itemName) {
  const checked = [...document.querySelectorAll('.reprint-chk:checked')];
  if (checked.length === 0) { toast('라벨을 출력할 제품을 선택하세요', 'warn'); return; }

  const lotRow = window._reprintLotRow;
  const labels = checked.map(cb => {
    const indivId = cb.value;
    let exp = '', storage = '', date = '', qty = '', unit = '';

    if (type === 'rm' && lotRow) {
      date = lotRow[6] || formatDate();
      exp = lotRow[7] ? `EXP: ${lotRow[7]}` : '';
      storage = lotRow[11] ? `보관: ${lotRow[11]}` : '';
      unit = lotRow[5] || 'kg';
    } else if (type === 'fg' && lotRow) {
      date = lotRow[5] || formatDate();
      exp = lotRow[6] ? `EXP: ${lotRow[6]}` : '';
    } else if (type === 'sp' && lotRow) {
      date = lotRow[5] || formatDate();
      unit = lotRow[4] || '';
    }

    // 개별 수량은 체크박스 부모에서 가져옴
    const parentLabel = cb.closest('label');
    const qtyText = parentLabel?.querySelector('.fs-11')?.textContent?.trim() || '';

    return { indivId, itemName, date, exp, storage, lotId, qty: '' };
  });

  renderLabelCards(labels);
  toast(`${labels.length}매 라벨 미리보기가 생성되었습니다`, 'suc');
}

// ── LOT 일괄 발행 (기존 로직 개선) ──
async function generateLabelsLot() {
  const lotId = $id('lbl-lot')?.value?.trim();
  const count = parseInt($id('lbl-count')?.value) || 1;
  if (!lotId) { toast('LOT 번호를 입력하세요', 'err'); return; }

  let itemNameVal = $id('lbl-item-name')?.value?.trim();
  let expDate = '', storageTemp = '', unit = 'kg';

  // 시트에서 LOT 정보 자동조회 (소비기한·보관온도는 항상 조회)
  showLoading();
  try {
    let lots = [];
    if (lotId.startsWith('RM-')) lots = await SheetsAPI.getAll('원재료LOT').catch(() => []);
    else if (lotId.startsWith('FG-')) lots = await SheetsAPI.getAll('완제품LOT').catch(() => []);
    else if (lotId.startsWith('SP-')) lots = await SheetsAPI.getAll('소모품LOT').catch(() => []);
    const lot = lots.find(l => l[0] === lotId);
    if (lot) {
      if (!itemNameVal) itemNameVal = lot[2] || '품목명 미확인';
      if (lotId.startsWith('RM-')) { expDate = lot[7] || ''; storageTemp = lot[11] || ''; unit = lot[5] || 'kg'; }
      else if (lotId.startsWith('FG-')) { expDate = lot[6] || ''; }
      $id('lbl-item-name').value = itemNameVal;
    }
  } catch(e) { console.warn(e); }
  hideLoading();
  if (!itemNameVal) itemNameVal = '품목명 미확인';

  const isFGLot = lotId.startsWith('FG-');
  renderLabelCards(
    Array.from({length: count}, (_, i) => ({
      indivId: `${lotId}-${String(i + 1).padStart(2, '0')}`,
      itemName: itemNameVal,
      lotId: isFGLot ? '' : lotId,
      date: isFGLot ? `생산날짜: ${formatDate()}` : formatDate(),
      exp: expDate ? (isFGLot ? `소비기한: ${expDate}까지` : `EXP: ${expDate}`) : '',
      storage: storageTemp ? (isFGLot ? `보관: ${storageTemp} 이하` : `보관: ${storageTemp}`) : '',
      company: isFGLot ? '' : undefined,
    }))
  );
}

// ── 개별 재프린트 (직접 ID 입력) ──
async function generateLabelsIndiv() {
  const raw = $id('lbl-indiv-id')?.value?.trim();
  if (!raw) { toast('개별 QR ID를 입력하세요', 'err'); return; }

  const ids = raw.split(/[,\n]+/).map(s => s.trim()).filter(Boolean);
  if (ids.length === 0) { toast('유효한 ID를 입력하세요', 'err'); return; }

  showLoading();
  const labels = [];

  try {
    const rmIndivs = ids.some(id => id.startsWith('RM-')) ? await SheetsAPI.getAll('원재료개별').catch(() => []) : [];
    const rmLots = ids.some(id => id.startsWith('RM-')) ? await SheetsAPI.getAll('원재료LOT').catch(() => []) : [];
    const fgIndivs = ids.some(id => id.startsWith('FG-')) ? await SheetsAPI.getAll('완제품개별').catch(() => []) : [];
    const fgLots = ids.some(id => id.startsWith('FG-')) ? await SheetsAPI.getAll('완제품LOT').catch(() => []) : [];
    const spIndivs = ids.some(id => id.startsWith('SP-')) ? await SheetsAPI.getAll('소모품개별').catch(() => []) : [];
    const spLots = ids.some(id => id.startsWith('SP-')) ? await SheetsAPI.getAll('소모품LOT').catch(() => []) : [];

    for (const qrId of ids) {
      let found = false;
      if (qrId.startsWith('RM-')) {
        const indiv = rmIndivs.find(r => r[0] === qrId);
        if (indiv) {
          const lot = rmLots.find(l => l[0] === indiv[1]);
          labels.push({ indivId: qrId, itemName: lot?.[2] || '원재료', date: lot?.[6] || formatDate(),
            exp: lot?.[7] ? `EXP: ${lot[7]}` : '', storage: lot?.[11] ? `보관: ${lot[11]}` : '', lotId: indiv[1] });
          found = true;
        }
      } else if (qrId.startsWith('FG-')) {
        const indiv = fgIndivs.find(r => r[0] === qrId);
        if (indiv) {
          const lot = fgLots.find(l => l[0] === indiv[1]);
          const fgDate = lot?.[5] || formatDate();
          const fgExp = lot?.[6] || '';
          const fgStorage = lot?.[11] || '냉동 -18°C';
          labels.push({ indivId: qrId, itemName: lot?.[2] || '완제품',
            date: `생산날짜: ${fgDate}`, exp: fgExp ? `소비기한: ${fgExp}까지` : '',
            storage: `보관: ${fgStorage} 이하`, lotId: '', company: '' });
          found = true;
        }
      } else if (qrId.startsWith('SP-')) {
        const indiv = spIndivs.find(r => r[0] === qrId);
        if (indiv) {
          const lot = spLots.find(l => l[0] === indiv[1]);
          labels.push({ indivId: qrId, itemName: lot?.[2] || '소모품', date: lot?.[5] || formatDate(),
            exp: '', storage: '', lotId: indiv[1] });
          found = true;
        }
      }
      if (!found) labels.push({ indivId: qrId, itemName: '⚠ 미등록 ID', date: '', exp: '', storage: '', lotId: '', error: true });
    }
  } catch (e) { toast('데이터 조회 실패: ' + e.message, 'err'); hideLoading(); return; }
  hideLoading();

  const errors = labels.filter(l => l.error);
  if (errors.length > 0) toast(`${errors.length}개 ID를 찾을 수 없습니다`, 'warn');
  const validLabels = labels.filter(l => !l.error);
  if (validLabels.length === 0) { toast('출력 가능한 라벨이 없습니다', 'err'); return; }
  renderLabelCards(validLabels);
}

// ── Canvas 텍스트 말줄임 헬퍼 ──
function canvasTruncate(ctx, text, maxW) {
  if (!text) return '';
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

// ── 라벨 1장을 Canvas에 그려서 dataURL 반환 ──
function renderLabelToCanvas(lb) {
  return new Promise(resolve => {
    const _logTag = '[Label]';
    try {
      // ── 입력 검증 ──
      const safeId = (lb && lb.indivId) ? String(lb.indivId).trim() : '';
      const safeName = (lb && lb.itemName) ? String(lb.itemName).trim() : '(품목명 없음)';
      const safeLotId = (lb && lb.lotId) ? String(lb.lotId).trim() : '';
      const safeDate = (lb && lb.date) ? String(lb.date).trim() : '';
      const safeExp = (lb && lb.exp) ? String(lb.exp).trim() : '';
      const safeStorage = (lb && lb.storage) ? String(lb.storage).trim() : '';
      const safeCompany = lb ? lb.company : '';

      if (!safeId) console.warn(_logTag, '개별ID(indivId) 누락 — 빈 QR 생성됨', lb);

      // SLP-DX220: 203 DPI, 60×40mm
      const DPI = 203;
      const mm = (v) => Math.round(v * DPI / 25.4);
      const W = mm(60), H = mm(40);

      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      // 흰 배경
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      // QR 코드 생성 (임시 div에)
      const qrBox = document.createElement('div');
      qrBox.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
      document.body.appendChild(qrBox);
      const qrPx = mm(26);
      try {
        new QRCode(qrBox, { text: safeId || 'N/A', width: qrPx, height: qrPx, correctLevel: QRCode.CorrectLevel.M });
      } catch (qrErr) {
        console.error(_logTag, 'QR 생성 실패:', safeId, qrErr);
      }

      // 자간 축소(80%) 텍스트 그리기 헬퍼
      function drawCondensed(ctx, text, x, y, scale) {
        if (!text) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, 1);
        ctx.fillText(text, 0, 0);
        ctx.restore();
      }
      // 자간 축소 시 실제 폭 계산
      function condensedWidth(ctx, text, scale) {
        if (!text) return 0;
        return ctx.measureText(text).width * scale;
      }
      // 자간 축소 말줄임
      function condensedTruncate(ctx, text, maxW, scale) {
        if (!text) return '';
        if (condensedWidth(ctx, text, scale) <= maxW) return text;
        let t = text;
        while (t.length > 1 && condensedWidth(ctx, t + '…', scale) > maxW) t = t.slice(0, -1);
        return t + '…';
      }
      // y좌표 하단 초과 방어 — 남은 공간 체크
      function canDrawLine(y, lineH) { return (y + lineH) <= H + mm(1); }

      // QR 렌더 대기 후 canvas에 그리기 (저사양 기기 고려 500ms)
      setTimeout(() => {
        try {
          const qrCanvas = qrBox.querySelector('canvas');
          const topMargin = mm(5);
          const qrMarginX = mm(1.5);
          const qrY = topMargin + Math.round(((H - topMargin) - qrPx) / 2);
          if (qrCanvas) {
            ctx.drawImage(qrCanvas, qrMarginX, qrY, qrPx, qrPx);
          } else {
            console.warn(_logTag, 'QR canvas 미생성 — 빈 영역으로 진행:', safeId);
          }
          // DOM 정리 — 안전하게
          try { document.body.removeChild(qrBox); } catch (e) { qrBox.remove && qrBox.remove(); }

          // 텍스트 영역 — QR 상단과 정렬
          const textX = qrMarginX + qrPx + mm(2.5);
          const textMaxW = W - textX - mm(1.5);
          let y = qrY;  // QR코드 상단에 맞춤
          const cScale = 0.8;

          const fontTitle = `bold ${mm(3.5)}px "Malgun Gothic","맑은 고딕",sans-serif`;
          const fontMain  = `bold ${mm(2.8)}px "Malgun Gothic","맑은 고딕",sans-serif`;
          const fontSub   = `bold ${mm(2.4)}px "Malgun Gothic","맑은 고딕",sans-serif`;
          const lineH = mm(4.2);

          // ── 품목명 (길면 2줄 분할) ──
          ctx.fillStyle = '#000000';
          ctx.font = fontTitle;
          const nameW = condensedWidth(ctx, safeName, cScale);
          if (nameW > textMaxW && safeName.length > 6) {
            let splitIdx = safeName.indexOf(' (');
            if (splitIdx < 0) splitIdx = safeName.indexOf('(');
            if (splitIdx < 0) splitIdx = Math.floor(safeName.length / 2);
            const line1 = safeName.substring(0, splitIdx).trim();
            const line2 = safeName.substring(splitIdx).trim();
            drawCondensed(ctx, condensedTruncate(ctx, line1, textMaxW, cScale), textX, y + mm(2.5), cScale);
            y += lineH - mm(0.5);
            ctx.font = fontMain;
            drawCondensed(ctx, condensedTruncate(ctx, line2, textMaxW, cScale), textX, y + mm(2), cScale);
            y += lineH;
          } else {
            drawCondensed(ctx, condensedTruncate(ctx, safeName, textMaxW, cScale), textX, y + mm(2.5), cScale);
            y += lineH + mm(0.5);
          }

          // ── LOT 번호 ──
          ctx.font = fontMain;
          if (safeLotId && canDrawLine(y, lineH)) {
            drawCondensed(ctx, condensedTruncate(ctx, 'LOT: ' + safeLotId, textMaxW, cScale), textX, y + mm(2), cScale);
            y += lineH;
          }

          // ── 입고일/생산일 ──
          if (safeDate && canDrawLine(y, lineH)) {
            drawCondensed(ctx, condensedTruncate(ctx, safeDate, textMaxW, cScale), textX, y + mm(2), cScale);
            y += lineH;
          }

          // ── 사용기한/소비기한 ──
          if (safeExp && canDrawLine(y, lineH)) {
            drawCondensed(ctx, condensedTruncate(ctx, safeExp, textMaxW, cScale), textX, y + mm(2), cScale);
            y += lineH;
          }

          // ── 보관조건 ──
          if (safeStorage && canDrawLine(y, lineH)) {
            drawCondensed(ctx, condensedTruncate(ctx, safeStorage, textMaxW, cScale), textX, y + mm(2), cScale);
            y += lineH;
          }

          // ── 개별 ID — 긴 ID는 3번째 '-' 기준 2줄 분할 ──
          if (safeId && canDrawLine(y, lineH)) {
            ctx.font = fontSub;
            const idW = condensedWidth(ctx, safeId, cScale);
            if (idW > textMaxW) {
              let dashCount = 0, idSplit = -1;
              for (let i = 0; i < safeId.length; i++) {
                if (safeId[i] === '-') { dashCount++; if (dashCount === 3) { idSplit = i; break; } }
              }
              if (idSplit > 0) {
                const idLine1 = safeId.substring(0, idSplit);
                const idLine2 = safeId.substring(idSplit);
                drawCondensed(ctx, condensedTruncate(ctx, idLine1, textMaxW, cScale), textX, y + mm(2), cScale);
                y += lineH - mm(0.8);
                if (canDrawLine(y, lineH)) {
                  drawCondensed(ctx, condensedTruncate(ctx, idLine2, textMaxW, cScale), textX, y + mm(2), cScale);
                  y += lineH;
                }
              } else {
                drawCondensed(ctx, condensedTruncate(ctx, safeId, textMaxW, cScale), textX, y + mm(2), cScale);
                y += lineH;
              }
            } else {
              drawCondensed(ctx, safeId, textX, y + mm(2), cScale);
              y += lineH;
            }
          }

          // ── 회사명 ──
          if (safeCompany !== '' && canDrawLine(y, lineH)) {
            ctx.font = `bold ${mm(2.6)}px "Malgun Gothic","맑은 고딕",sans-serif`;
            drawCondensed(ctx, safeCompany || '메이투투', textX, y + mm(2), cScale);
          }

          resolve(canvas.toDataURL('image/png'));
        } catch (drawErr) {
          console.error(_logTag, '라벨 Canvas 그리기 실패:', safeId, drawErr);
          // 에러 시에도 흰 캔버스라도 반환 — 전체 인쇄 중단 방지
          resolve(canvas.toDataURL('image/png'));
        }
      }, 500);
    } catch (initErr) {
      console.error('[Label] 라벨 초기화 실패:', initErr);
      // 빈 1x1 캔버스로 fallback — Promise reject 방지
      const fb = document.createElement('canvas'); fb.width = 1; fb.height = 1;
      resolve(fb.toDataURL('image/png'));
    }
  });
}

// ── 라벨 인쇄 (Canvas→이미지→iframe 인쇄 — WYSIWYG) ──
function printLabels() {
  const labels = window._currentLabels;
  if (!labels || labels.length === 0) { toast('인쇄할 라벨이 없습니다', 'err'); return; }

  const sz = getLabelSize();
  const pk = getSavedPrinter();
  const pName = (PRINTER_PRESETS[pk] || PRINTER_PRESETS['slp-dx220']).name;

  toast(`${pName} | ${sz.w}×${sz.h}mm | ${labels.length}매 이미지 생성 중...`, 'info');

  // 모든 라벨을 Canvas 이미지로 변환
  Promise.all(labels.map(lb => renderLabelToCanvas(lb))).then(images => {
    // 이미지가 페이지 전체를 100% 채우도록 — 프린터 드라이버가 용지 크기 제어
    const imgsHtml = images.map(src =>
      '<div class="page">' +
      '<img src="' + src + '">' +
      '</div>'
    ).join('');

    const iframeDoc = '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' +
      '*{margin:0;padding:0;box-sizing:border-box}' +
      '@page{margin:0}' +
      'html,body{margin:0;padding:0}' +
      '.page{page-break-after:always;page-break-inside:avoid}' +
      '.page:last-child{page-break-after:auto}' +
      '.page img{width:100%;display:block}' +
      '</style></head><body>' + imgsHtml + '</body></html>';

    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:800px;height:600px;border:none;visibility:hidden';
    document.body.appendChild(iframe);

    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(iframeDoc);
    doc.close();

    setTimeout(() => {
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch(e) { window.print(); }
      setTimeout(() => {
        try { document.body.removeChild(iframe); } catch(e) {}
        toast('인쇄가 완료되었습니다', 'suc');
      }, 2000);
    }, 500);
  });
}

        <div class="fs-11 c-txt-l mb-8">구 7단계 금속검출 기록을 신 격자 양식으로 변환합니다. <b>원본 7단계는 <code>_legacy</code>에 보존</b>(되돌리기 가능)되고, 구형에 없던 위치값은 추론(정상)이라 <code>_migrated</code>로 표기됩니다. <b>스캔(dry-run)으로 대상을 먼저 확인</b>한 뒤 실행하세요.</div>
        <button class="btn btn-outline btn-full" onclick="ccpMigrateScan()">대상 스캔 (dry-run)</button>
        <div id="ccp-migrate-result"></div>
      </div>
      <div id="audit-result"></div>
    </div>
  `;
};

/* ── P3: 공정기록 구 7단계 → 신 격자 일괄변환 ──
   비파괴: 원본 7단계를 _legacy 에 보존(되돌리기 가능) · idempotent(이미 격자/변환됨 skip) · admin.
   주의: migrate7stepToGrid 는 구형에 없던 위치값을 '정상'으로 추론 → _migrated 표기 유지. */
function ccpClassifyRecord(r) {
  // 'grid'(이미 격자) | 'migrated'(이미 변환·_legacy 보유) | 'old'(구 7단계·변환대상) | 'other'
  if ((r[3] || '') !== 'inspect') return 'other';
  let d; try { d = JSON.parse(r[5] || 'null'); } catch (e) { return 'other'; }
  if (!d || typeof d !== 'object') return 'other';
  if (d._legacy) return 'migrated';
  if (Array.isArray(d.checks)) return 'grid';
  if (d.step1Time || d.step2 || d.step3 || d.step4Time || d.step5 || d.step6 || d.ccpTotal) return 'old';
  return 'other';
}

async function ccpMigrateScan() {
  const el = $id('ccp-migrate-result');
  el.innerHTML = '<div class="loading-inline mt-8"><div class="spinner-s"></div> 공정기록 스캔 중…</div>';
  try {
    SheetsAPI.invalidateCache('공정기록');
    const records = await SheetsAPI.getAll('공정기록', false);
    const buckets = { grid: [], migrated: [], old: [], other: [] };
    records.forEach((r, i) => { buckets[ccpClassifyRecord(r)].push({ r, i }); });
    const old = buckets.old;
    const inspectCnt = records.filter(r => (r[3] || '') === 'inspect').length;
    const sample = old.slice(0, 2).map(({ r, i }) => {
      let d = {}; try { d = JSON.parse(r[5] || '{}'); } catch (e) {}
      const g = migrate7stepToGrid(d);
      return `<div class="fs-11 mt-4" style="border-top:1px dashed var(--gray-l);padding-top:4px">
        <b>${r[0] || '-'} / ${r[1] || '-'}단계</b> <span class="c-txt-l">(시트행 F${i + 2})</span><br>
        before: 7단계(step1~6) → after: 격자 <b>${g.checks.length}</b>행 · <code>_migrated</code> · 원본 <code>_legacy</code> 보존</div>`;
    }).join('');
    el.innerHTML = `
      <div class="card mt-8" style="background:#fffbf0">
        <div class="fs-12 fw-7 mb-4">스캔 결과 (inspect 기록 ${inspectCnt}건 중)</div>
        <div class="fs-13">변환 대상(구 7단계): <b class="c-warn">${old.length}건</b></div>
        <div class="fs-11 c-txt-l mt-2">이미 격자 ${buckets.grid.length} · 이미 변환됨 ${buckets.migrated.length} · 기타 ${buckets.other.length}</div>
        ${old.length ? sample + `<button class="btn btn-pri btn-full mt-8" onclick="ccpMigrateRun()">격자로 변환 실행 (${old.length}건)</button>`
                     : '<div class="fs-12 c-suc mt-8">✓ 변환할 구 7단계 기록 없음</div>'}
      </div>`;
  } catch (e) {
    el.innerHTML = `<div class="card bl-err mt-8"><div class="c-err">스캔 실패: ${e.message}</div></div>`;
  }
}

async function ccpMigrateRun() {
  confirm('공정기록 격자 변환', '구 7단계 금속검출 기록을 격자 양식으로 변환합니다.\n\n• 원본 7단계는 _legacy 에 보존됩니다(되돌리기 가능)\n• 구형에 없던 위치값은 추론(정상)이라 _migrated 로 표기됩니다\n\n진행하시겠습니까?', async () => {
    try {
      showLoading();
      // 확인 시점 fresh 재조회 → 인덱스 재계산(삭제로 인한 행 밀림 창 최소화)
      SheetsAPI.invalidateCache('공정기록');
      const records = await SheetsAPI.getAll('공정기록', false);
      const now = formatDateTime();
      const by = State.user?.email || '';
      const batch = [];
      records.forEach((r, i) => {
        if (ccpClassifyRecord(r) !== 'old') return;
        let d; try { d = JSON.parse(r[5] || '{}'); } catch (e) { return; }
        const g = migrate7stepToGrid(d);
        g._legacy = d;          // 원본 7단계 보존(비파괴·되돌리기 근거)
        g._migratedAt = now;    // 감사: 변환시각(KST)
        g._migratedBy = by;     // 감사: 변환자
        batch.push({ range: `공정기록!F${i + 2}`, values: [[JSON.stringify(g)]] }); // col5=stepData=F, getAll 인덱스 i → 시트행 i+2
      });
      if (!batch.length) { hideLoading(); toast('변환할 대상이 없습니다', 'info'); return; }
      await SheetsAPI.batchUpdate(batch);
      SheetsAPI.invalidateCache('공정기록');
      hideLoading();
      toast(`${batch.length}건 변환 완료 — 원본은 _legacy 보존`, 'suc', 3000);
      ccpMigrateScan();   // 재스캔: idempotent 확인(대상 0건이어야)
    } catch (e) {
      hideLoading();
      toast('변환 실패: ' + e.message, 'err');
    }
  });
}

async function runDataAudit() {
  const resultEl = $id('audit-result');
  resultEl.innerHTML = '<div class="card"><div class="loading-inline"><div class="spinner-s"></div> 데이터 로드 중…</div></div>';
  try {
    SheetsAPI.invalidateCache('원재료LOT');
    SheetsAPI.invalidateCache('원재료개별');
    SheetsAPI.invalidateCache('완제품LOT');
    SheetsAPI.invalidateCache('완제품개별');
    SheetsAPI.invalidateCache('작업지시서');
    SheetsAPI.invalidateCache('공정기록');
    const [rmLots, rmIndivs, fgLots, fgIndivs, wos, records] = await Promise.all([
      SheetsAPI.getAll('원재료LOT', false).catch(()=>[]),
      SheetsAPI.getAll('원재료개별', false).catch(()=>[]),
      SheetsAPI.getAll('완제품LOT', false).catch(()=>[]),
      SheetsAPI.getAll('완제품개별', false).catch(()=>[]),
      SheetsAPI.getAll('작업지시서', false).catch(()=>[]),
      SheetsAPI.getAll('공정기록', false).catch(()=>[]),
    ]);
    State._auditData = { rmLots, rmIndivs, fgLots, fgIndivs, wos, records };
    const sections = [
      auditRmLotRemain(rmLots, rmIndivs),
      auditRmLotCanceled(rmLots, rmIndivs),
      auditFgLotRemain(fgLots, fgIndivs),
      auditFgLotPackCount(fgLots, fgIndivs),
      auditDuplicateLotIds(rmLots, fgLots, rmIndivs, fgIndivs, wos),
      auditDuplicateIndivIds(rmIndivs, fgIndivs),
      auditPhantomRenumberRows(fgLots, fgIndivs, wos),
      auditStaleReserved(fgLots, wos),
      auditWoFgLotLink(wos, fgLots),
      auditWoStatusStep(wos, records),
      auditOrphanRecords(wos, records),
    ];
    State._auditSections = sections;
    renderAuditResult();
  } catch (e) {
    resultEl.innerHTML = `<div class="card bl-err"><div class="c-err">로드 실패: ${e.message}</div></div>`;
  }
}

                  <div style="flex:1">
                    <div class="fs-12 fw-6">${iss.id}</div>

                  ${iss.autoFix ? `<button class="btn btn-sm btn-pri" onclick="runAuditFixOne(${si},${ii})" style="white-space:nowrap">🔧 수정</button>` : '<span class="fs-10 c-txt-l">수동 확인</span>'}

async function runAuditFixOne(secIdx, issIdx) {
  const sec = State._auditSections?.[secIdx];
  const iss = sec?.issues?.[issIdx];
  if (!iss?.autoFix) return;
  confirm('자동 수정', `${iss.id}\n${iss.message}\n\n수정하시겠습니까?`, async () => {
    try {
      showLoading();
      await iss.autoFix();
      toast(`수정 완료: ${iss.id} — audit 자동 재실행 중...`, 'suc', 2000);
      // 전역 영향 가능한 autoFix(예: LOT 단위 중복 정리)는 다른 issue 들도 함께 정정됨.
      // 정확한 현황 반영을 위해 audit 자동 재실행.
      await runDataAudit();
    } catch (e) {
      toast('수정 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
    }
  });
}

async function runAuditAutoFix() {
  const sections = State._auditSections || [];
  const fixable = sections.flatMap((sec, si) => sec.issues.map((iss, ii) => ({ sec, iss, si, ii })).filter(x => x.iss.autoFix));
  if (fixable.length === 0) { toast('수정 가능 항목 없음', 'info'); return; }
  confirm('전체 자동 수정', `${fixable.length}건을 일괄 수정하시겠습니까?\n각 항목은 데이터 정합성을 자동 보정합니다.`, async () => {
    try {
      showLoading();
      let okCount = 0, errCount = 0;
      for (const { iss } of fixable) {
        try { await iss.autoFix(); okCount++; }
        catch (e) { errCount++; console.error('수정 실패:', iss.id, e); }
      }
      SheetsAPI.invalidateAllCache();
      toast(`수정 ${okCount}건 완료${errCount?` · 실패 ${errCount}건`:''} — 재검사 중...`, errCount?'warn':'suc', 2500);
      // 전역 영향 가능한 autoFix 결과를 정확히 반영하기 위해 audit 자동 재실행
      await runDataAudit();
    } catch (e) {
      toast('일괄 수정 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
    }
  });
}

// ─── 검사 함수들 (각각 { name, desc, issues:[{id, message, autoFix?}] }) ───
function auditRmLotRemain(rmLots, rmIndivs) {
  const issues = [];
  for (const lot of rmLots) {
    const lotId = lot[0], totalQty = parseFloat(lot[4])||0;
    const remain = parseFloat(lot[8])||0, status = lot[9]||'';
    if (['폐기','입고취소'].includes(status)) continue;  // 종결 상태 제외
    const myIndivs = rmIndivs.filter(iv => iv[1] === lotId);
    if (myIndivs.length === 0) continue;
    const active = myIndivs.filter(iv => !['폐기','소진','입고취소'].includes(iv[3]));
    const consumed = myIndivs.filter(iv => iv[3] === '소진');
    const sample = myIndivs[0];
    const perUnit = sample ? (parseFloat(sample[4])||totalQty/(parseInt(lot[10])||1)) : totalQty/(parseInt(lot[10])||1);
    const correctRemain = Math.round(active.length * perUnit * 100)/100;
    const correctStatus = active.length === 0 ? '소진' : (consumed.length > 0 ? '사용중' : '미사용');
    const remainOff = Math.abs(remain - correctRemain) > 0.01;
    const statusOff = status !== correctStatus;
    if (remainOff || statusOff) {
      const msg = [];
      if (remainOff) msg.push(`잔량 ${remain}→${correctRemain}`);
      if (statusOff) msg.push(`상태 "${status}"→"${correctStatus}"`);
      issues.push({
        id: lotId,
        message: msg.join(' / '),
        autoFix: async () => {
          await SheetsAPI.updateRow('원재료LOT', 0, lotId, { 8: String(correctRemain), 9: correctStatus });
        }
      });
    }
  }
  return { name: '원재료 LOT 잔량·상태 정합성', desc: '활성 개별 수 × perUnit = 잔량, 상태 일치 검증', issues };
}

function auditRmLotCanceled(rmLots, rmIndivs) {
  const issues = [];
  for (const lot of rmLots) {
    const lotId = lot[0], status = lot[9]||'';
    if (!['폐기','입고취소'].includes(status)) continue;
    const myIndivs = rmIndivs.filter(iv => iv[1] === lotId);
    const wrong = myIndivs.filter(iv => iv[3] !== status && iv[3] !== '소진');
    if (wrong.length > 0) {
      issues.push({
        id: lotId,
        message: `LOT 상태 "${status}"인데 개별 ${wrong.length}건이 다른 상태 (${wrong.map(w=>w[3]||'(빈값)').join(', ')})`,
        autoFix: async () => {
          for (const iv of wrong) {
            await SheetsAPI.updateRow('원재료개별', 0, iv[0], { 3: status });
          }
        }
      });
    }
  }
  return { name: '입고취소·폐기 LOT 개별 일관성', desc: 'LOT이 종결 상태면 모든 개별도 동일/소진 상태여야 함', issues };
}

function auditFgLotRemain(fgLots, fgIndivs) {
  const issues = [];
  for (const lot of fgLots) {
    const lotId = lot[0];
    const status = lot[9]||'';
    if (['삭제','폐기','출하완료'].includes(status)) continue;
    const dbRemain = parseInt(lot[8])||0;
    const active = fgIndivs.filter(iv => iv[1] === lotId && ['냉동보관중','출하가능'].includes(iv[3]));
    if (dbRemain !== active.length) {
      issues.push({
        id: lotId,
        message: `잔량 ${dbRemain}개 → 실제 활성 ${active.length}개`,
        autoFix: async () => {
          await SheetsAPI.updateRow('완제품LOT', 0, lotId, { 8: String(active.length) });
        }
      });
    }
  }
  return { name: '완제품 LOT 잔량 정합성', desc: 'remainQty = 활성(냉동보관중+출하가능) 개별 수', issues };
}

/* FG LOT packCount(col 10) vs 실제 개별 row 수 검사
   상단 요약(재고 메인)에서 'l[10]' 을 사용하는 반면, LOT 상세는 실제 row 수를 카운트.
   두 값이 다르면 표시 불일치 발생. autoFix 는 col 10 을 실제 개수로 갱신. */
function auditFgLotPackCount(fgLots, fgIndivs) {
  const issues = [];
  for (const lot of fgLots) {
    const lotId = lot[0];
    const status = lot[9]||'';
    if (['삭제','채번예약'].includes(status)) continue;
    const dbPackCount = parseInt(lot[10])||0;
    const actual = fgIndivs.filter(iv => iv[1] === lotId).length;
    if (dbPackCount !== actual && actual > 0) {
      issues.push({
        id: lotId,
        message: `packCount(col 10) ${dbPackCount}개 → 실제 개별 row ${actual}개 (상단 요약과 상세가 다르게 보임)`,
        autoFix: async () => {
          await SheetsAPI.updateRow('완제품LOT', 0, lotId, { 10: actual });
        }
      });
    }
  }
  return { name: '완제품 LOT packCount 정합성', desc: 'lot[10] = 실제 개별 row 수 (재고 메인 상단 요약 ↔ 상세 일치)', issues };
}

function auditWoFgLotLink(wos, fgLots) {
  const issues = [];
  const fgLotById = new Map(fgLots.map(l => [l[0], l]));
  for (const wo of wos) {
    const status = wo[12]||'', fgLotId = wo[14]||'';
    if (['출하가능','출하완료','승인완료'].includes(status) && fgLotId && !fgLotById.has(fgLotId)) {
      issues.push({
        id: wo[0],
        message: `WO 상태 "${status}" / fgLotId "${fgLotId}" 가 완제품LOT 시트에 없음 (orphan reference)`
      });
    }
  }
  return { name: 'WO ↔ 완제품 LOT 연결', desc: '출하 단계 WO의 fgLotId 가 실제 LOT으로 존재해야 함', issues };
}

function auditWoStatusStep(wos, records) {
  const issues = [];
  const stepsByWo = new Map();
  for (const r of records) {
    const woId = r[0], step = parseInt(r[1])||0;
    const cur = stepsByWo.get(woId) || 0;
    if (step > cur) stepsByWo.set(woId, step);
  }
  for (const wo of wos) {
    const woId = wo[0], status = wo[12]||'', dbLastStep = parseInt(wo[13])||0;
    if (['삭제'].includes(status)) continue;
    const realMax = stepsByWo.get(woId) || 0;
    if (dbLastStep !== realMax) {
      issues.push({
        id: woId,
        message: `lastStep DB ${dbLastStep} → 실제 공정기록 max ${realMax}`,
        autoFix: async () => {
          await SheetsAPI.updateRow('작업지시서', 0, woId, { 13: String(realMax) });
        }
      });
    }
  }
  return { name: 'WO lastStep 정합성', desc: 'wo[13] 이 실제 공정기록의 최대 단계와 일치', issues };
}

function auditOrphanRecords(wos, records) {
  const issues = [];
  const woIds = new Set(wos.map(w => w[0]));
  for (const r of records) {
    const woId = r[0];
    if (!woIds.has(woId)) {
      issues.push({
        id: `${woId}/${r[1]||'?'}.${r[2]||'?'}`,
        message: `공정기록의 woId "${woId}" 가 작업지시서에 없음`
      });
    }
  }
  return { name: '공정기록 고아 (orphan)', desc: '공정기록의 woId 가 작업지시서에 존재해야 함', issues };
}

/* 중복 LOT ID 검사 — race condition 으로 동일 ID 가 2회 이상 채번된 경우.
   자동 분리는 위험 (개별 ID들이 어느 row 소속인지 데이터로 구분 불가) — 수동 가이드만. */
function auditDuplicateLotIds(rmLots, fgLots, rmIndivs, fgIndivs, wos) {
  const issues = [];
  const groups = [
    { tab: '원재료LOT', indivTab: '원재료개별', lots: rmLots, indivs: rmIndivs, dateCol: 6 },
    { tab: '완제품LOT', indivTab: '완제품개별', lots: fgLots, indivs: fgIndivs, dateCol: 5, woCol: 7 },
  ];
  for (const g of groups) {
    const byId = new Map();
    g.lots.forEach(l => {
      const id = l[0];
      if (!id) return;
      const arr = byId.get(id) || [];
      arr.push(l);
      byId.set(id, arr);
    });
    for (const [id, arr] of byId.entries()) {
      if (arr.length < 2) continue;
      arr.sort((a, b) => (a[g.dateCol]||'').localeCompare(b[g.dateCol]||''));
      const detail = arr.map((rec, i) => {
        const wo = g.woCol ? (rec[g.woCol] || '-') : '-';
        const qty = rec[g.tab==='완제품LOT' ? 3 : 4] || '?';
        const rem = rec[8] || '?';
        const date = rec[g.dateCol] || '?';
        return `${i+1}) ${g.woCol?`WO ${wo} · `:''}수량 ${qty} · 잔 ${rem} · 일자 ${date}`;
      }).join('\n');
      const myIndivCount = (g.indivs || []).filter(iv => iv[1] === id).length;
      const isFG = g.tab === '완제품LOT';
      issues.push({
        id,
        message: `${g.tab}에 ${arr.length}건 중복 row · 개별 ID ${myIndivCount}건 묶임\n${detail}\n\n자동 분리: 첫 row 유지, 2번째 이후를 새 일련번호(-002, -003...)로 분리.\n${isFG ? '완제품개별은 시트 append 순서 가정으로 packCount 기준 분리.' : ''}`,
        autoFix: isFG ? async () => { await autoSplitDupFgLot(id); } : undefined
      });
    }
  }
  return {
    name: '중복 LOT ID (race condition)',
    desc: '동시 채번으로 같은 ID 가 2회 이상 — 완제품 LOT 은 🔧 자동 분리 가능 (원재료는 수동)',
    issues
  };
}

/* 중복 FG LOT 자동 분리 — 첫 row 유지, 나머지는 새 일련번호로 분리.
   알고리즘:
   1. 완제품LOT 에서 동일 lotId 의 모든 row 인덱스 찾기 (시트 순서 = 채번 순서 가정)
   2. 첫 row 외 각 row 별로 새 ID 발급
   3. 해당 row 의 [0] 셀 변경 + 해당 row 의 woId (col 7) 의 작업지시서 wo[14] 변경
   4. 완제품개별 시트에서 같은 lotId 의 모든 row 인덱스 찾기 (시트 순서 = WO 승인 순서 가정)
   5. 첫 row 의 packCount 만큼 유지, 다음 packCount 만큼 두 번째 새 ID 로, ... */
async function autoSplitDupFgLot(lotId) {
  // 1. 완제품LOT 모든 row 조회 (인덱스 보존을 위해 raw 시트 데이터 사용)
  SheetsAPI.invalidateCache('완제품LOT');
  const fgLots = await SheetsAPI.getAll('완제품LOT', false);
  // getAll 은 헤더 1행을 slice 한 결과 — 시트 row 인덱스 = getAll 인덱스 + 2 (1-based + 헤더 보정)
  const dupRows = [];
  fgLots.forEach((row, i) => {
    if (row[0] === lotId) dupRows.push({ row, sheetRowIdx: i + 2 });
  });
  if (dupRows.length < 2) throw new Error('중복 row 없음 (이미 정리됨?)');

  // 2. 첫 row 외 새 ID 발급
  const parts = lotId.split('-');
  const seqLen = (parts[parts.length - 1] || '').length || 3;
  const prefix = parts.slice(0, -1).join('-') + '-';
  // 동일 prefix 중 현재 max seq 확인
  let maxSeq = 0;
  fgLots.forEach(l => {
    if (l[0] && l[0].startsWith(prefix)) {
      const s = parseInt(l[0].split('-').slice(-1)[0]) || 0;
      if (s > maxSeq) maxSeq = s;
    }
  });

  const assignments = [{ oldId: lotId, newId: lotId, sheetRowIdx: dupRows[0].sheetRowIdx, woId: dupRows[0].row[7] || '', packCount: parseInt(dupRows[0].row[10]) || 0 }];
  for (let i = 1; i < dupRows.length; i++) {
    maxSeq++;
    const newId = `${prefix}${String(maxSeq).padStart(seqLen, '0')}`;
    assignments.push({
      oldId: lotId,
      newId,
      sheetRowIdx: dupRows[i].sheetRowIdx,
      woId: dupRows[i].row[7] || '',
      packCount: parseInt(dupRows[i].row[10]) || 0
    });
  }

  // 3. 완제품LOT row 의 col A (lotId) 변경 (batchUpdate)
  const lotUpdates = assignments.slice(1).map(a => ({
    range: `완제품LOT!A${a.sheetRowIdx}`,
    values: [[a.newId]]
  }));
  if (lotUpdates.length > 0) await SheetsAPI.batchUpdate(lotUpdates);

  // 4. 해당 WO 의 wo[14] (col O = 15번째) 변경
  for (const a of assignments.slice(1)) {
    if (!a.woId) continue;
    const woIdx = await SheetsAPI.findRowIndex('작업지시서', 0, a.woId);
    if (woIdx > 0) {
      await SheetsAPI.batchUpdate([{ range: `작업지시서!O${woIdx}`, values: [[a.newId]] }]);
    }
  }

  // 5. 완제품개별 분리 — 시트 순서 기준 packCount 만큼 그룹 분리
  SheetsAPI.invalidateCache('완제품개별');
  const fgIndivs = await SheetsAPI.getAll('완제품개별', false);
  const targetIndivs = [];
  fgIndivs.forEach((row, i) => {
    if (row[1] === lotId) targetIndivs.push({ row, sheetRowIdx: i + 2 });
  });

  // 시트 순서대로 분할: 첫 packCount → assignment[0] (변경 없음), 다음 packCount → assignment[1], ...
  const indivUpdates = [];
  let cursor = 0;
  for (const a of assignments) {
    if (a.newId === a.oldId) { cursor += a.packCount; continue; }
    const segment = targetIndivs.slice(cursor, cursor + a.packCount);
    for (let k = 0; k < segment.length; k++) {
      const { row, sheetRowIdx } = segment[k];
      const newIndivId = `${a.newId}-${String(k + 1).padStart(2, '0')}`;
      // col A (indivId) + col B (lotId) 변경
      indivUpdates.push({ range: `완제품개별!A${sheetRowIdx}`, values: [[newIndivId]] });
      indivUpdates.push({ range: `완제품개별!B${sheetRowIdx}`, values: [[a.newId]] });
    }
    cursor += a.packCount;
  }
  if (indivUpdates.length > 0) await SheetsAPI.batchUpdate(indivUpdates);

  // 캐시 무효화 + 로그
  SheetsAPI.invalidateCache('완제품LOT');
  SheetsAPI.invalidateCache('완제품개별');
  SheetsAPI.invalidateCache('작업지시서');
  console.log(`[중복분리] ${lotId} 분리 완료:`, assignments.slice(1).map(a => `${a.oldId}→${a.newId} (WO ${a.woId}, ${a.packCount}개)`).join(', '));
}

/* 채번예약 placeholder 가 24시간 이상 stale — 거부됐는데 정리 안된 경우 또는 채번 후 작업 미완료 */
function auditStaleReserved(fgLots, wos) {
  const issues = [];
  const now = Date.now();
  for (const lot of fgLots) {
    if (lot[9] !== '채번예약') continue;
    const woId = lot[7] || '';
    const wo = wos.find(w => w[0] === woId);
    const woStatus = wo?.[12] || '(WO 없음)';
    const prodDate = lot[5] ? new Date(lot[5]).getTime() : 0;
    const ageH = prodDate ? (now - prodDate) / 3600000 : 999;
    if (ageH < 24 && ['진행중','승인대기','냉동보관중'].includes(woStatus)) continue;  // 정상 진행중
    issues.push({
      id: lot[0],
      message: `WO ${woId} 상태 "${woStatus}" / 채번 ${ageH.toFixed(0)}시간 경과 — placeholder 정리 필요`,
      autoFix: woStatus.startsWith('거부') || woStatus === '삭제' || !wo ? async () => {
        await SheetsAPI.updateRow('완제품LOT', 0, lot[0], { 9: woStatus.startsWith('거부') ? woStatus : '삭제' });
      } : undefined
    });
  }
  return { name: '채번예약 placeholder 잔여', desc: 'atomic claim 후 거부/삭제로 정리 안 된 placeholder', issues };
}

/* 중복 개별 ID 검사 — autoFix: 첫 발생 유지(출하기록 보존), 후순 발생을 새 일련번호로 renumber.
   같은 lotId 의 max(suffix seq) 찾아 그 다음 번호부터 부여. lotId 는 그대로. */
function auditDuplicateIndivIds(rmIndivs, fgIndivs) {
  const issues = [];
  const groups = [
    { tab: '원재료개별', indivs: rmIndivs },
    { tab: '완제품개별', indivs: fgIndivs },
  ];
  for (const g of groups) {
    const byId = new Map();
    g.indivs.forEach(iv => {
      const id = iv[0];
      if (!id) return;
      byId.set(id, (byId.get(id)||0) + 1);
    });
    for (const [id, count] of byId.entries()) {
      if (count < 2) continue;
      issues.push({
        id,
        message: `${g.tab} 시트에 동일 개별 ID 가 ${count}건 — 🔧 수정: 같은 LOT 의 중복 행을 soft-delete (출하기록 보존)`,
        autoFix: g.tab === '완제품개별' ? async () => {
          // 중복 indivId 의 lotId 추출 (마지막 -NN 제거) → 해당 LOT 의 중복 일괄 soft-delete
          const lotId = id.replace(/-\d+$/, '');
          await autoDeleteDupFgIndivs(lotId);
        } : undefined
      });
    }
  }
  return { name: '중복 개별 ID', desc: '동일 indivId 가 시트에 다중 row — 🔧 수정 시 중복 행 soft-delete (\'삭제\') + packCount/잔량 자동 보정', issues };
}

/* phantom renumber 행 검사 — WO 의 packCount 보다 큰 suffix 를 가진 완제품개별 행 탐지
   배경: PR #33 의 C안 renumber autoFix 가 중복 indivId 를 -41~-80 등 새 번호로 옮긴 잔재
        또는 다른 경로로 정원 초과 채번된 phantom 행
   판정: 완제품LOT[7]=woId → 작업지시서[7]=packCount (의도된 봉수)
        해당 LOT 의 비-삭제 개별 중 suffix > packCount 인 행을 phantom 으로 분류
   autoFix: phantom 행 soft-delete + LOT packCount/remain 정정
            출하완료 행은 절대 삭제 안 함 (HACCP 보존) — 있으면 수동 점검 안내 */
function auditPhantomRenumberRows(fgLots, fgIndivs, wos) {
  const issues = [];
  for (const lot of fgLots) {
    const lotId = lot[0];
    if (lot[9] === '삭제' || lot[9] === '채번예약') continue;
    const woId = lot[7] || '';
    if (!woId) continue;
    const wo = wos.find(w => w[0] === woId);
    if (!wo) continue;
    const expected = parseInt(wo[7]);
    if (!expected || expected <= 0) continue;
    const lotIndivs = fgIndivs.filter(iv => iv[1] === lotId && iv[3] !== '삭제');
    let phantomCount = 0;
    let phantomShipped = 0;
    for (const iv of lotIndivs) {
      const m = (iv[0] || '').match(/-(\d+)$/);
      if (!m) continue;
      const seq = parseInt(m[1]);
      if (seq > expected) {
        phantomCount++;
        if (iv[3] === '출하완료') phantomShipped++;
      }
    }
    if (phantomCount === 0) continue;
    issues.push({
      id: lotId,
      message: `WO ${woId} packCount=${expected} 인데 suffix > ${expected} 인 개별 ${phantomCount}건` +
               (phantomShipped > 0 ? ` (⚠️ 출하완료 ${phantomShipped}건 포함 — 자동 정리 불가, 수동 점검 필요)` : ''),
      autoFix: phantomShipped === 0 ? async () => {
        await autoDeletePhantomFgRows(lotId, expected);
      } : undefined
    });
  }
  return { name: 'phantom 개별 행 (정원 초과)', desc: 'WO packCount 보다 큰 suffix 를 가진 완제품개별 행 — 🔧 수정 시 soft-delete + LOT packCount/remain 정정 (출하완료 행은 보호)', issues };
}

/* phantom 행 일괄 soft-delete + LOT packCount/remain 보정.
   출하완료 행은 안전망으로 무조건 보호 (HACCP 출하기록 무결성). */
async function autoDeletePhantomFgRows(lotId, expectedPackCount) {
  SheetsAPI.invalidateCache('완제품개별');
  SheetsAPI.invalidateCache('완제품LOT');
  const allIndivs = await SheetsAPI.getAll('완제품개별', false);
  const toDelete = [];
  allIndivs.forEach((row, i) => {
    if (row[1] !== lotId) return;
    if (row[3] === '삭제' || row[3] === '출하완료') return;
    const m = (row[0] || '').match(/-(\d+)$/);
    if (!m) return;
    const seq = parseInt(m[1]);
    if (seq > expectedPackCount) toDelete.push({ sheetRowIdx: i + 2, oldId: row[0] });
  });
  if (toDelete.length === 0) {
    console.log(`[phantom정리] ${lotId}: 대상 없음`);
    return;
  }
  const nowStr = formatDateTime();
  const updates = [];
  for (const d of toDelete) {
    updates.push({ range: `완제품개별!D${d.sheetRowIdx}`, values: [['삭제']] });
    updates.push({ range: `완제품개별!E${d.sheetRowIdx}`, values: [[nowStr]] });
    updates.push({ range: `완제품개별!F${d.sheetRowIdx}`, values: [[`phantom정리:${d.oldId}`]] });
  }
  for (let i = 0; i < updates.length; i += 50) {
    await SheetsAPI.batchUpdate(updates.slice(i, i + 50));
  }
  SheetsAPI.invalidateCache('완제품개별');
  const refreshed = await SheetsAPI.getAll('완제품개별', false);
  const lotIndivsAfter = refreshed.filter(iv => iv[1] === lotId && iv[3] !== '삭제');
  const activeAfter = lotIndivsAfter.filter(iv => ['냉동보관중','출하가능'].includes(iv[3])).length;
  const lotIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
  if (lotIdx > 0) {
    await SheetsAPI.batchUpdate([
      { range: `완제품LOT!I${lotIdx}`, values: [[String(activeAfter)]] },
      { range: `완제품LOT!K${lotIdx}`, values: [[String(lotIndivsAfter.length)]] }
    ]);
  }
  SheetsAPI.invalidateCache('완제품LOT');
  SheetsAPI.invalidateCache('완제품개별');
  console.log(`[phantom정리] ${lotId}: ${toDelete.length}건 soft-delete · packCount → ${lotIndivsAfter.length} · remain → ${activeAfter}`);
}

/* 완제품개별 중복 indivId 일괄 정리:
   - 시트 행 인덱스 보존하여 같은 indivId 그룹 찾기
   - 첫 발생 유지 (출하기록 등 외부 참조 보존)
   - 두 번째 이후는 같은 LOT 의 max(suffix) + 1, +2 ... 로 renumber
   - lotId 는 그대로 (개별 분리만, LOT 분리는 별도) */

/* [B안 — 사용자 선호] 중복 개별 row 를 soft-delete.
   - 같은 LOT 안의 indivId 그룹별로 처리
   - 출하완료된 행이 있으면 그 행을 유지 (출하기록 보존)
   - 없으면 시트 첫 발생 row 유지
   - 나머지는 status='삭제' + 노트로 soft-delete
   - LOT packCount(col 10) / remain(col 8) 도 실제 비-삭제 / 활성 개수로 자동 보정 */
async function autoDeleteDupFgIndivs(lotId) {
  SheetsAPI.invalidateCache('완제품개별');
  SheetsAPI.invalidateCache('완제품LOT');
  const allIndivs = await SheetsAPI.getAll('완제품개별', false);
  // 해당 LOT 의 모든 row + 시트 행 인덱스 보존
  const lotRows = [];
  allIndivs.forEach((row, i) => {
    if (row[1] === lotId) lotRows.push({ row, sheetRowIdx: i + 2 });
  });
  if (lotRows.length === 0) {
    console.log(`[중복삭제] ${lotId}: 개별 없음`);
    return;
  }
  // indivId 별 그룹
  const byId = new Map();
  for (const e of lotRows) {
    const id = e.row[0];
    if (!id) continue;
    const arr = byId.get(id) || [];
    arr.push(e);
    byId.set(id, arr);
  }
  // 중복 그룹 → 삭제할 행 결정
  const toDelete = [];
  for (const [id, group] of byId.entries()) {
    if (group.length < 2) continue;
    group.sort((a, b) => a.sheetRowIdx - b.sheetRowIdx);
    // 출하완료 행 우선 유지
    let keepIdx = group.findIndex(g => g.row[3] === '출하완료');
    if (keepIdx === -1) keepIdx = 0;  // 없으면 첫 발생 유지
    for (let i = 0; i < group.length; i++) {
      if (i === keepIdx) continue;
      toDelete.push({ sheetRowIdx: group[i].sheetRowIdx, oldId: id });
    }
  }
  if (toDelete.length === 0) {
    console.log(`[중복삭제] ${lotId}: 중복 없음`);
    return;
  }
  // soft-delete via batchUpdate (status='삭제', 일자/노트 기록)
  const nowStr = formatDateTime();
  const updates = [];
  for (const d of toDelete) {
    updates.push({ range: `완제품개별!D${d.sheetRowIdx}`, values: [['삭제']] });
    updates.push({ range: `완제품개별!E${d.sheetRowIdx}`, values: [[nowStr]] });
    updates.push({ range: `완제품개별!F${d.sheetRowIdx}`, values: [[`중복정리:${d.oldId}`]] });
  }
  for (let i = 0; i < updates.length; i += 50) {
    await SheetsAPI.batchUpdate(updates.slice(i, i + 50));
  }
  // LOT packCount / remain 자동 보정
  SheetsAPI.invalidateCache('완제품개별');
  const refreshed = await SheetsAPI.getAll('완제품개별', false);
  const lotIndivsAfter = refreshed.filter(iv => iv[1] === lotId && iv[3] !== '삭제');
  const activeAfter = lotIndivsAfter.filter(iv => ['냉동보관중','출하가능'].includes(iv[3])).length;
  const lotIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
  if (lotIdx > 0) {
    await SheetsAPI.batchUpdate([
      { range: `완제품LOT!I${lotIdx}`, values: [[String(activeAfter)]] },         // col I = remain (col 8)
      { range: `완제품LOT!K${lotIdx}`, values: [[String(lotIndivsAfter.length)]] }  // col K = packCount (col 10)
    ]);
  }
  SheetsAPI.invalidateCache('완제품LOT');
  SheetsAPI.invalidateCache('완제품개별');
  console.log(`[중복삭제] ${lotId}: ${toDelete.length}건 soft-delete · packCount → ${lotIndivsAfter.length} · remain → ${activeAfter}`);
}

async function autoFixDupFgIndivIds() {
  SheetsAPI.invalidateCache('완제품개별');
  const allIndivs = await SheetsAPI.getAll('완제품개별', false);

  // 행 인덱스 보존 + 같은 indivId 그룹화
  const byId = new Map();
  allIndivs.forEach((row, i) => {
    const id = row[0];
    if (!id) return;
    const arr = byId.get(id) || [];
    arr.push({ row, sheetRowIdx: i + 2 });
    byId.set(id, arr);
  });

  // LOT 별 max seq 계산 (renumber 시 다음 번호 부여용)
  const lotMaxSeq = new Map();
  allIndivs.forEach(iv => {
    const lotId = iv[1];
    if (!lotId) return;
    const m = (iv[0]||'').match(/-(\d+)$/);
    if (!m) return;
    const seq = parseInt(m[1]);
    if (!isNaN(seq)) {
      const cur = lotMaxSeq.get(lotId) || 0;
      if (seq > cur) lotMaxSeq.set(lotId, seq);
    }
  });

  const updates = [];
  let renamedCount = 0;
  for (const [id, group] of byId.entries()) {
    if (group.length < 2) continue;
    // group 을 시트 인덱스 순으로 정렬 (낮은 게 먼저)
    group.sort((a, b) => a.sheetRowIdx - b.sheetRowIdx);
    // 첫 발생 유지, 두 번째 이후 renumber
    for (let k = 1; k < group.length; k++) {
      const { row, sheetRowIdx } = group[k];
      const lotId = row[1] || '';
      if (!lotId) continue;
      let nextSeq = (lotMaxSeq.get(lotId) || 0) + 1;
      lotMaxSeq.set(lotId, nextSeq);
      // suffix 자릿수 추정 — 기존 ID 의 마지막 -NN 길이 보존
      const m = id.match(/-(\d+)$/);
      const padLen = m ? m[1].length : 2;
      const newId = `${lotId}-${String(nextSeq).padStart(padLen, '0')}`;
      updates.push({ range: `완제품개별!A${sheetRowIdx}`, values: [[newId]] });
      renamedCount++;
    }
  }

  if (updates.length === 0) {
    console.log('[중복개별정리] 변경 사항 없음');
    return;
  }
  // batchUpdate 분할 (200건 단위)
  for (let i = 0; i < updates.length; i += 200) {
    await SheetsAPI.batchUpdate(updates.slice(i, i + 200));
  }
  SheetsAPI.invalidateCache('완제품개별');
  console.log(`[중복개별정리] ${renamedCount}건 renumber 완료`);
}

/* 시트의 모든 row 를 JSON 으로 클립보드에 복사 (채팅 붙여넣기용) */
async function dbCopyAllJSON(tab) {
  try {
    const rows = await SheetsAPI.getAll(tab, false).catch(() => []);
    const headers = DB_SHEETS[tab] || (rows[0]||[]).map((_,i) => `col${i}`);
    const objs = rows.map(r => {
      const o = {};
      headers.forEach((h, i) => { if (r[i] !== undefined && r[i] !== '') o[h] = r[i]; });
      return o;
    });
    const text = JSON.stringify({ tab, count: objs.length, rows: objs }, null, 2);
    await navigator.clipboard.writeText(text);
    toast(`📋 ${objs.length}건 JSON 복사됨 — 채팅에 붙여넣어 분석 요청 가능`, 'suc', 4000);
  } catch(e) {
    toast('복사 실패: ' + e.message, 'err');
  }
}

    });
  };
}

const PNL_DEFAULT_PRICE = 21591;   // 원/봉 공급가(VAT 제외) = 마켓봄 판매가 23,750 ÷ 1.1
/** 사업주 부담 4대보험 추정 가산율 — 급여대장 '지급합계' 에 곱해 노무비를 만든다.
