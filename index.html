// ─── DASHBOARD ───
Screens.dashboard = async () => {
  const role = State.user?.role || 'worker';
  const isAdmin = role === 'admin';
  const today = new Date();

  renderHeader('메이투투 스마트팩토리', `${isAdmin ? '관리자' : '작업자'} · ${displayDate(today)} (${dayOfWeek(today)})`,
    { right: `<div style="width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer" onclick="Router.go('settings')">👤</div>` });

  // Load data for dashboard
  let pendingApproval = 0, inProgress = 0, lowStock = 0, upcomingChecks = 0;
  let orderAlertItems = [], pendingWOs = [], recentActivity = [], calAlerts = [];
  let certAlerts = [], openDevCount = 0;

  try {
    const [woData, rmItems, rmLots, eqData, certData, devData] = await Promise.all([
      SheetsAPI.getAll('작업지시서').catch(() => []),
      SheetsAPI.getAll('원재료품목').catch(() => []),
      SheetsAPI.getAll('원재료LOT').catch(() => []),
      SheetsAPI.getAll('기기관리').catch(() => []),
      SheetsAPI.getAll('시험성적서').catch(() => []),   // 시트 없으면 [] — 화면은 그대로 동작
      SheetsAPI.getAll('기준편차').catch(() => []),
    ]);

    // 시험성적서 만료·임박 (검교정 알림과 동일 정책)
    certData.forEach(c => {
      if ((c[12] || '유효') === '폐기') return;
      const st = HaccpStd.certStatus(c[7]);
      if (st.badge === 'err' || st.badge === 'warn') {
        certAlerts.push({ name: c[3] || c[2] || '-', code: c[2] || '', lab: c[4] || '', until: c[7] || '-', ...st });
      }
    });
    certAlerts.sort((a, b) => (a.days ?? 9999) - (b.days ?? 9999));
    openDevCount = devData.filter(d => d[7] && d[7] !== '완료').length;

    State.workOrders = woData;
    State.rawMaterialItems = rmItems.filter(i => i[12] !== '비활성');
    State.rawMaterialLots = rmLots;
    State.equipment = eqData;

    if (isAdmin) {
      pendingApproval = woData.filter(r => r[12] === '냉동보관중' || r[12] === '승인대기').length;
      inProgress = woData.filter(r => r[12] === '진행중').length;
    } else {
      const myEmail = State.user?.email;
      pendingApproval = woData.filter(r => r[8] === myEmail && (r[12] === '냉동보관중' || r[12] === '승인대기')).length;
      inProgress = woData.filter(r => r[8] === myEmail && r[12] === '진행중').length;
    }

    // Check reorder point (발주 필요 통합 알림)
    rmItems.forEach(item => {
      const code = item[0];
      const reorderPoint = parseFloat(item[9]) || parseFloat(item[6]) || 0;
      const threshold = reorderPoint;
      if (threshold <= 0) return;
      const totalRemain = rmLots.filter(l => l[1] === code && !['폐기','입고취소'].includes(l[9])).reduce((sum, l) => sum + (parseFloat(l[8]) || 0), 0);
      const sku = item[3] || '';
      const skuP = parseSkuUnit(sku);
      let remainDisp = totalRemain + 'kg', threshDisp = threshold + 'kg';
      if (skuP && skuP.perUnit > 0) {
        const sr = Math.floor(totalRemain / skuP.perUnit), srr = Math.round(totalRemain % skuP.perUnit * 10) / 10;
        remainDisp = srr > 0 ? sr + skuP.unitName + ' ' + srr + 'kg' : sr + skuP.unitName;
        threshDisp = Math.round(threshold / skuP.perUnit) + skuP.unitName;
      }
      if (totalRemain <= threshold) {
        lowStock++;
        // 부족분(kg) 및 권장 발주량(= 발주점까지 채움 + 50% 안전여유)
        const gapKg = Math.max(0, threshold - totalRemain);
        const recommendOrderKg = Math.ceil(gapKg + threshold * 0.5);
        let gapDisp = gapKg.toFixed(1) + 'kg', recDisp = recommendOrderKg + 'kg';
        if (skuP && skuP.perUnit > 0) {
          gapDisp = Math.ceil(gapKg / skuP.perUnit) + skuP.unitName;
          recDisp = Math.ceil(recommendOrderKg / skuP.perUnit) + skuP.unitName;
        }
        orderAlertItems.push({ name: item[1], code, remain: totalRemain, threshold, remainDisp, threshDisp, gapDisp, recDisp });
      }
    });

    upcomingChecks = eqData.filter(e => {
      if (!e[6]) return false;
      const next = new Date(e[6]);
      const diff = (next - today) / (1000*60*60*24);
      return diff <= 7 && diff >= 0;
    }).length;

    // 검교정 알람: 30일 이내 도래 또는 만료
    calAlerts.length = 0;
    eqData.forEach(e => {
      if (!e[6]) return;
      const next = new Date(e[6]);
      const diff = Math.ceil((next - today) / (1000*60*60*24));
      if (diff < 0) {
        calAlerts.push({ code: e[0], name: e[1], type: e[2], nextDate: e[6], diff, status: '만료', badge: 'err' });
      } else if (diff <= 30) {
        calAlerts.push({ code: e[0], name: e[1], type: e[2], nextDate: e[6], diff, status: diff === 0 ? '오늘' : diff + '일 후', badge: diff <= 7 ? 'warn' : 'info' });
      }
    });
    calAlerts.sort((a, b) => a.diff - b.diff);

    pendingWOs = woData.filter(r => r[12] === '냉동보관중' || r[12] === '승인대기').slice(0, 3);

    // ── 알림 체크 ──
    const lastCheck = localStorage.getItem('lastNotifCheck') || '2000-01-01';
    const now = new Date().toISOString();
    if (isAdmin) {
      // 관리자: 새 승인요청 알림
      const newRequests = woData.filter(r => (r[12] === '냉동보관중' || r[12] === '승인대기') && r[10] > lastCheck);
      if (newRequests.length > 0) {
        toast(`🔔 새 승인요청 ${newRequests.length}건이 있습니다`, 'warn');
      }
    } else {
      // 작업자: 승인완료 알림 (승인완료 또는 냉동보관중 = 승인됨)
      const myApproved = woData.filter(r => r[8] === State.user?.email && (r[12] === '승인완료' || r[12] === '냉동보관중') && r[16] > lastCheck);
      if (myApproved.length > 0) {
        toast(`🔔 작업지시서 ${myApproved.length}건이 승인완료 되었습니다`, 'suc');
      }
      // 작업자: 거부 알림
      const myRejected = woData.filter(r => r[8] === State.user?.email && r[12]?.startsWith('거부') && r[16] > lastCheck);
      if (myRejected.length > 0) {
        toast(`🔔 작업지시서 ${myRejected.length}건이 거부되었습니다`, 'err');
      }
    }
    // 검교정 알림 토스트 (관리자 + 작업자 모두)
    if (calAlerts.length > 0) {
      const overdue = calAlerts.filter(a => a.badge === 'err');
      const upcoming = calAlerts.filter(a => a.badge !== 'err');
      if (overdue.length > 0) {
        toast(`🔧 검교정 만료 ${overdue.length}건: ${overdue.map(a=>a.name).join(', ')}`, 'err');
      }
      if (upcoming.length > 0) {
        toast(`🔧 검교정 임박 ${upcoming.length}건: ${upcoming.map(a=>a.name).join(', ')}`, 'warn');
      }
    }
    // 시험성적서 알림 — 만료는 입고검사 기준 미충족이므로 즉시 알린다
    // 🔕 CertNotif.off() = 이 기기에서 껐다(FR-20260813-3ZC). 토스트만 멈추고 현황 카드는 남는다.
    if (certAlerts.length > 0 && !CertNotif.off()) {
      const expired = certAlerts.filter(a => a.badge === 'err');
      if (expired.length > 0) toast(`🧪 시험성적서 만료 ${expired.length}건: ${expired.map(a=>a.name).join(', ')}`, 'err', 6000);
      const soon = certAlerts.filter(a => a.badge !== 'err');
      if (soon.length > 0) toast(`🧪 시험성적서 갱신 임박 ${soon.length}건: ${soon.map(a=>a.name).join(', ')}`, 'warn', 5000);
    }

    localStorage.setItem('lastNotifCheck', now);
  } catch (e) {
    console.warn('Dashboard data load error:', e);
  }

  // ── 빠른 작업 (역할별) — 홈 하단 여백 활용·핵심 기능 1탭 진입 ──
  const quickActions = isAdmin ? [
    { ic: '🏭', lb: '생산요청', screen: 'production', tab: '생산요청' },
    { ic: '🧊', lb: '출하승인', screen: 'production', tab: '승인대기' },
    { ic: '📦', lb: '재고', screen: 'inventory' },
    { ic: '📷', lb: 'QR스캔', screen: 'qr-scan' },
    { ic: '✅', lb: 'HACCP', screen: 'haccp' },
    { ic: '🌡️', lb: '온도', screen: 'temp-log' },
    { ic: '🏷️', lb: '라벨', screen: 'label-print' },
    { ic: '☰', lb: '더보기', screen: 'more' },
  ] : [
    { ic: '▶️', lb: '새 작업', screen: 'production', tab: '새 작업' },
    { ic: '📋', lb: '작업현황', screen: 'production', tab: '작업 현황' },
    { ic: '📦', lb: '재고', screen: 'inventory' },
    { ic: '📷', lb: 'QR스캔', screen: 'qr-scan' },
    { ic: '✅', lb: 'HACCP', screen: 'haccp' },
    { ic: '🌡️', lb: '온도', screen: 'temp-log' },
    { ic: '🏷️', lb: '라벨', screen: 'label-print' },
    { ic: '☰', lb: '더보기', screen: 'more' },
  ];
  const qaHtml = quickActions.map(q => {
    const nav = q.tab ? `State._prodActiveTab='${q.tab}';Router.go('${q.screen}')` : `Router.go('${q.screen}')`;
    return `<div class="qa-tile" onclick="${nav}"><div class="qa-ic">${q.ic}</div><div class="qa-lb">${q.lb}</div></div>`;
  }).join('');

  $id('content').innerHTML = `
    <div style="padding:16px">
      <!-- Summary Cards -->
      <div class="grid-2 mb-12">
        <div class="card clickable stat-card" style="border-left:3px solid ${inProgress === 0 ? 'var(--warn)' : 'var(--suc)'}" onclick="Router.go('production');setTimeout(()=>{const t=document.querySelector('.tab-filter .tab:nth-child(${isAdmin ? 3 : 2})');if(t)t.click();},200)">
          <div class="stat-icon">${inProgress === 0 ? '⚠️' : '🏭'}</div>
          <div class="stat-num ${inProgress === 0 ? 'c-warn' : 'c-suc'}">${inProgress}건</div>
          <div class="stat-label">${inProgress === 0 ? '생산 없음' : '생산 진행'}</div>
        </div>
        <div class="card clickable stat-card" style="border-left:3px solid ${pendingApproval > 0 ? 'var(--warn)' : 'var(--suc)'}" onclick="Router.go('production');setTimeout(()=>{const t=document.querySelector('.tab-filter .tab:nth-child(2)');if(t)t.click();},200)">
          <div class="stat-icon">${pendingApproval > 0 ? '📋' : '✅'}</div>
          <div class="stat-num ${pendingApproval > 0 ? 'c-warn' : 'c-suc'}">${pendingApproval}건</div>
          <div class="stat-label">${isAdmin ? '승인 대기' : '내 작업'}</div>
        </div>
        <div class="card clickable stat-card" style="border-left:3px solid ${lowStock > 0 ? 'var(--warn)' : 'var(--suc)'}" onclick="Router.go('inventory')">
          <div class="stat-icon">${lowStock > 0 ? '📦' : '✅'}</div>
          <div class="stat-num ${lowStock > 0 ? 'c-warn' : 'c-suc'}">${lowStock}건</div>
          <div class="stat-label">${lowStock > 0 ? '발주 필요' : '재고 정상'}</div>
        </div>
        <div class="card clickable stat-card" style="border-left:3px solid ${calAlerts.length > 0 ? (calAlerts.some(a=>a.badge==='err') ? 'var(--err)' : 'var(--warn)') : 'var(--suc)'}" onclick="Router.go('equip')">
          <div class="stat-icon">${calAlerts.length > 0 ? '🔧' : '✅'}</div>
          <div class="stat-num ${calAlerts.length > 0 ? (calAlerts.some(a=>a.badge==='err') ? 'c-err' : 'c-warn') : 'c-suc'}">${calAlerts.length}건</div>
          <div class="stat-label">${calAlerts.length > 0 ? '검교정 알림' : '검교정 정상'}</div>
        </div>
        ${CertNotif.off() && certAlerts.length > 0 ? '' : `
        <div class="card clickable stat-card" style="border-left:3px solid ${certAlerts.length > 0 ? (certAlerts.some(a=>a.badge==='err') ? 'var(--err)' : 'var(--warn)') : 'var(--suc)'}" onclick="State._hsTab='성적서';Router.go('haccp-std',{tab:'성적서'})">
          <div class="stat-icon">${certAlerts.length > 0 ? '🧪' : '✅'}</div>
          <div class="stat-num ${certAlerts.length > 0 ? (certAlerts.some(a=>a.badge==='err') ? 'c-err' : 'c-warn') : 'c-suc'}">${certAlerts.length}건</div>
          <div class="stat-label">${certAlerts.length > 0 ? '성적서 알림' : '성적서 정상'}</div>
        </div>`}
        <div class="card clickable stat-card" style="border-left:3px solid ${openDevCount > 0 ? 'var(--warn)' : 'var(--suc)'}" onclick="State._hsTab='편차';Router.go('haccp-std',{tab:'편차'})">
          <div class="stat-icon">${openDevCount > 0 ? '📑' : '✅'}</div>
          <div class="stat-num ${openDevCount > 0 ? 'c-warn' : 'c-suc'}">${openDevCount}건</div>
          <div class="stat-label">${openDevCount > 0 ? '기준편차 처리중' : 'HACCP 기준 정상'}</div>
        </div>
      </div>

      ${isAdmin && pendingWOs.length > 0 ? `
        <div class="fs-14 fw-7 mb-8">🔔 냉동보관 · 출하승인</div>
        ${pendingWOs.map(wo => {
          const fs = wo[11] ? new Date(wo[11]) : null;
          const fh = fs ? ((Date.now() - fs.getTime()) / (1000*60*60)).toFixed(1) : 0;
          const ca = fh >= 12;
          return `
          <div class="card clickable" onclick="Router.go('approval-detail', {woId:'${wo[0]}'})">
            <div class="row between">
              <div>
                <div class="fs-14 fw-6">${wo[4] || '앙호두 (호두과자 전용반죽)'} ${wo[5] || ''}kg</div>
                <div class="fs-12 c-txt-l">${wo[0]} · ${wo[8] || ''} · 냉동 ${fh}h/12h</div>
              </div>
              <span class="badge badge-${ca ? 'suc' : 'warn'}">${ca ? '출하승인 가능' : '냉동보관중'}</span>
            </div>
          </div>
        `}).join('')}
      ` : ''}

      ${!isAdmin ? (() => {
        const myEmail = State.user?.email;
        const myPending = State.workOrders.filter(r => r[8] === myEmail && (r[12] === '냉동보관중' || r[12] === '승인대기'));
        const myRecent = State.workOrders.filter(r => r[8] === myEmail && (r[12] === '승인완료' || r[12]?.startsWith('거부'))).slice(0, 3);
        let notifHtml = '';
        if (myPending.length > 0) {
          notifHtml += '<div class="fs-14 fw-7 mb-8">⏳ 승인 대기 중</div>' +
            myPending.map(wo => '<div class="card bl-warn"><div class="row between"><div><div class="fs-14 fw-6">' + (wo[4]||'') + ' ' + (wo[5]||'') + 'kg</div><div class="fs-12 c-txt-l">' + wo[0] + ' · 승인 대기 중</div></div><span class="badge badge-warn">승인 대기</span></div></div>').join('');
        }
        if (myRecent.length > 0) {
          notifHtml += '<div class="fs-14 fw-7 mb-8 mt-8">🔔 최근 승인 결과</div>' +
            myRecent.map(wo => '<div class="card bl-' + (wo[12]==='승인완료'?'suc':'err') + '"><div class="row between"><div><div class="fs-14 fw-6">' + (wo[4]||'') + ' ' + (wo[5]||'') + 'kg</div><div class="fs-12 c-txt-l">' + wo[0] + ' · ' + (wo[16]||'').substring(0,16) + '</div></div><span class="badge badge-' + (wo[12]==='승인완료'?'suc':'err') + '">' + wo[12] + '</span></div></div>').join('');
        }
        return notifHtml;
      })() : ''}

      ${orderAlertItems.length > 0 ? `
        <div class="fs-14 fw-7 mb-8 mt-8">📦 발주 필요 (${orderAlertItems.length}건)</div>
        ${orderAlertItems.map(item => `
          <div class="card clickable" onclick="Router.go('inventory')" style="border-left:3px solid var(--warn)">
            <div class="row between">
              <div style="flex:1">
                <div class="fs-14 fw-6" style="color:var(--warn)">${item.name}</div>
                <div class="fs-12 c-txt-l">현재고 ${item.remainDisp} / 발주점 ${item.threshDisp}</div>
                <div class="fs-12 c-err mt-2 fw-6">부족 ${item.gapDisp} · 권장 발주 ${item.recDisp}</div>
              </div>
              <span class="badge badge-warn">발주</span>
            </div>
          </div>
        `).join('')}
      ` : ''}

      ${calAlerts.length > 0 ? `
        <div class="fs-14 fw-7 mb-8 mt-8">🔧 검교정 알림</div>
        ${calAlerts.map(a => `
          <div class="card clickable" onclick="Router.go('equip')" style="border-left:3px solid ${a.badge==='err'?'var(--err,#c62828)':a.badge==='warn'?'var(--warn,#e65100)':'var(--info,#1565c0)'}">
            <div class="row between">
              <div>
                <div class="fs-14 fw-6" style="color:${a.badge==='err'?'var(--err,#c62828)':a.badge==='warn'?'var(--warn,#e65100)':'var(--txt,#222)'}">${a.name}</div>
                <div class="fs-12 c-txt-l">${a.code} · ${a.type || ''} · 다음 검교정: ${a.nextDate}</div>
              </div>
              <span class="badge badge-${a.badge}">${a.status}</span>
            </div>
          </div>
        `).join('')}
      ` : ''}

      ${certAlerts.length > 0 && CertNotif.off() ? `
        <div class="card mt-8" style="border-left:3px solid var(--gray-l)">
          <div class="row between">
            <div>
              <div class="fs-13 fw-6 c-txt-l">🔕 시험성적서 알림 꺼짐 (${certAlerts.length}건)</div>
              <div class="fs-11 c-txt-l">만료·임박 성적서는 그대로 있습니다 — 성적서 탭에서 확인할 수 있어요.</div>
            </div>
            <button class="btn btn-sm btn-outline btn-gray" onclick="setCertAlertOff(false)">🔔 켜기</button>
          </div>
        </div>
      ` : ''}

      ${certAlerts.length > 0 && !CertNotif.off() ? `
        <div class="row between mb-8 mt-8">
          <div class="fs-14 fw-7">🧪 시험성적서 알림 (${certAlerts.length}건)</div>
          <button class="btn btn-sm btn-outline btn-gray" onclick="setCertAlertOff(true)" title="이 기기에서 시험성적서 알림만 끕니다. 성적서 현황은 그대로 남습니다.">🔕 끄기</button>
        </div>
        ${certAlerts.map(a => `
          <div class="card clickable" onclick="State._hsTab='성적서';Router.go('haccp-std',{tab:'성적서'})" style="border-left:3px solid ${a.badge==='err'?'var(--err,#c62828)':'var(--warn,#e65100)'}">
            <div class="row between">
              <div>
                <div class="fs-14 fw-6" style="color:${a.badge==='err'?'var(--err,#c62828)':'var(--warn,#e65100)'}">${a.name}</div>
                <div class="fs-12 c-txt-l">${a.code} ${a.lab} · 유효기한: ${a.until}</div>
              </div>
              <span class="badge badge-${a.badge}">${a.label}</span>
            </div>
          </div>
        `).join('')}
      ` : ''}

      <!-- Drive 서류 부족 — 렌더 후 hsLoadHomeDocAlert() 가 채운다 -->
      <div id="home-prod-plan"></div>

      <!-- Drive 서류 부족 -->
      <div id="home-doc-alert"></div>

      <!-- 빠른 작업 -->
      <div class="sec-title mb-8 mt-8">⚡ 빠른 작업</div>
      <div class="qa-grid">${qaHtml}</div>
    </div>
  `;

  // ── 로그인 시 발주 알림 팝업 (하루 1회) ──
  if (orderAlertItems.length > 0) {
    const todayStr = new Date().toISOString().substring(0, 10);
    const lastPopup = localStorage.getItem('invAlertPopupDate');
    if (lastPopup !== todayStr) {
      const alertRows = orderAlertItems.map(item => `
          <div style="padding:10px 12px;border-radius:8px;margin-bottom:8px;background:#f57f1710;border-left:3px solid var(--warn)">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:700;font-size:14px;color:var(--warn)">📦 ${item.name}</span>
              <span class="badge badge-warn" style="font-size:10px">발주필요</span>
            </div>
            <div style="font-size:12px;color:var(--txt-l);margin-top:4px">현재고 ${item.remainDisp} / 발주점 ${item.threshDisp}</div>
            <div style="font-size:12px;color:var(--err);margin-top:2px;font-weight:600">부족 ${item.gapDisp} · 권장 발주 ${item.recDisp}</div>
          </div>`).join('');

      // 팝업 닫기 함수를 전역에 등록 (inline onclick에서 호출)
      window._closeInvAlertPopup = function() {
        try {
          localStorage.setItem('invAlertPopupDate', todayStr);
          const el = document.getElementById('inv-alert-popup');
          if (el) el.remove();
          console.log('[발주알림] 팝업 닫힘');
        } catch (err) { console.error('[발주알림] 닫기 실패:', err); }

  loadHomeProdPlan();     // 마켓봄 실판매(ERP API) 는 느리다 — 홈을 다 그린 뒤 뒤에서 채운다
  hsLoadHomeDocAlert();   // Drive 는 느리다 — 홈을 다 그린 뒤 뒤에서 채운다

/** 홈 「챙겨야 할 서류」 — Drive 에 원본이 없는 성적서·검교정 성적서를 실무자에게 알린다.
    실패해도 홈은 그대로여야 하므로 조용히 접는다. */
async function hsLoadHomeDocAlert() {
  const el = $id('home-doc-alert');
  if (!el) return;
  try {
    const [scan, certs, equip] = await Promise.all([
      DriveDocs.scan(),
      SheetsAPI.getAll('시험성적서').catch(() => []),
      SheetsAPI.getAll('기기관리').catch(() => []),
    ]);
    const findings = HaccpStd.docFindings({ scan, certs, equip });
    if (!findings.length) return;
    const errN = findings.filter(f => f.sev === 'err').length;
    const top = findings.slice(0, 5);
    el.innerHTML = `
      <div class="fs-14 fw-7 mb-8 mt-8">📂 챙겨야 할 서류 (${findings.length}건)</div>
      ${top.map(f => `
        <div class="card clickable" onclick="State._hsTab='성적서';Router.go('haccp-std',{tab:'성적서'})"
             style="border-left:3px solid ${f.sev === 'err' ? 'var(--err,#c62828)' : 'var(--warn,#e65100)'}">
          <div class="row between">
            <div style="flex:1">
              <div class="fs-14 fw-6" style="color:${f.sev === 'err' ? 'var(--err,#c62828)' : 'var(--warn,#e65100)'}">${HS_ESC(f.title)}</div>
              <div class="fs-12 c-txt-l">${HS_ESC(f.detail)}</div>
            </div>
            <span class="badge badge-${f.sev}">${f.kind}</span>
          </div>
        </div>`).join('')}
      ${findings.length > top.length
        ? `<div class="card clickable" onclick="State._hsTab='성적서';Router.go('haccp-std',{tab:'성적서'})"><div class="fs-12 c-txt-l" style="text-align:center">외 ${findings.length - top.length}건 모두 보기 ›</div></div>`
        : ''}`;
    if (errN > 0) toast(`📂 서류 미보관 ${errN}건 — 성적서 탭에서 확인하세요`, 'err', 6000);
  } catch (e) {
    console.warn('[홈] Drive 문서 현황 조회 실패:', e);
  }
}

/* ── 주간 생산량 제안 ──────────────────────────────────────────────────────────
   「이번 주 몇 배치 만들까」를 감이 아니라 실판매에서 뽑는다.

     D(예측 주간소비) = 마켓봄 실판매 최근 8주 **선형가중** 이동평균(봉)
                        최근 주에 더 무게를 준다 — 단순평균은 두 달 전 값이 지난주와 같은 힘을 갖는다.
     가용재고 S       = 완제품LOT 출하가능 잔량 + 냉동보관중·진행중 WO 예정 봉수(12h 뒤 합류)
     목표 T           = D × (안전재고 2주 + 다음 주 소비 1주) = 3D
     권장 생산        = max(0, T − S)  → 작업지시 1건 = 40봉(200kg) 단위로 올림

   ⚠️ 재고가 목표보다 많으면 **0배치가 정답**이다. 늘 뭔가 만들라고 말하는 제안은 과잉재고를 굳힌다.
   ⚠️ 수요는 **마켓봄 실판매**(가맹점 주문)를 쓴다. 공장 출하는 물류로 «밀어낸» 양이라 실수요보다
      크고(2026-08 실측 주 17봉·12주 누적 207봉), 그 숫자로 계획하면 과잉생산이 스스로를 정당화한다.
      마켓봄을 못 읽으면 출하 실적으로 떨어지고 화면에 「출하 기준」이라고 밝힌다.
   ⚠️ 마켓봄↔완제품 연결은 **품명 추측이 아니라 `완제품품목[19] 마켓봄코드`**(쉼표구분)로만 한다.
      품명은 실제로 안 맞는다 — 마켓봄 "앙호두 전용반죽" vs 마스터 "앙호두(호두과자 전용반죽)".
      앞글자 일치로 풀면 앞치마·모자·쿠폰 같은 굿즈가 반죽 수요로 딸려 들어온다.
   검증: node tests/prod-plan.test.js                                             */
// <prod-plan>
const PLAN_CFG = {
  WEEKS: 8,          // 수요 관측 창(완결주)
  SAFETY_WEEKS: 2,   // 본사 정책 「완제품은 2주치 안전재고 유지」
  BATCH_PACKS: 40,   // 작업지시 1건 = 40봉 = 200kg
  TREND_WEEKS: 4,    // 추세 비교 구간(최근 4주 vs 직전 4주)
  UNIT_PRICE: 21591, // 봉당 공급가(VAT 제외) — 품명에 규격 표기가 없는 옛 SKU 의 봉수 역산용
  CHART_BACK: 4,     // 그래프에 그릴 과거 주수 — 예측 관측창(WEEKS=8)과 별개다. 화면은 앞뒤 4주씩만 본다.
  CHART_AHEAD: 4,    // 그래프에 그릴 미래 주수
};
function planWeekStart(d) { const t = new Date(d); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t; }
function planDate(v) { const s = String(v || '').trim(); if (!s) return null; const d = new Date(s.replace(/-/g, '/')); return isFinite(d) ? d : null; }

/** 마켓봄 판매행 1건의 **봉수/박스** — ① 품명의 규격 표기 `(5kg*3ea)` ② 없으면 박스 공급가 ÷ 봉당 단가 역산.
    박스 규격이 SKU 마다 달라(ANG00266 4봉·20kg → ANG00276 3봉·15kg) 박스수만으로는 봉수를 못 낸다. */
function planPacksPerBox(row) {
  const m = String(row && row.name || '').match(/\d+(?:\.\d+)?\s*kg\s*[*x×]\s*(\d+)\s*(?:ea|개|팩|pack)?/i);
  if (m) { const n = parseInt(m[1], 10); if (n >= 1 && n <= 12) return n; }
  const qty = parseFloat(row && row.qty) || 0, sup = parseFloat(row && row.supply) || 0;
  if (qty > 0 && sup > 0) { const n = Math.round((sup / qty) / PLAN_CFG.UNIT_PRICE); if (n >= 1 && n <= 12) return n; }
  return 1;
}

/** 마켓봄 판매행 → {date, packs} 이벤트. 연결은 **마켓봄코드로만** 한다 — 품명 추측 금지. */
function planSalesEvents(mbRows, mbCodes) {
  const codes = new Set((mbCodes || []).map(c => String(c).trim()).filter(Boolean));
  if (!codes.size) return [];
  return (mbRows || []).filter(r => r && codes.has(String(r.code || '').trim()))
    .map(r => ({ date: r.date, packs: (parseFloat(r.qty) || 0) * planPacksPerBox(r) }));
}

/** {date, packs} 이벤트 → 완결주만의 주간 시계열(빈 주는 0).
    진행 중인 주는 반쪽이라 뺀다 — 안 빼면 주 초마다 수요가 폭락한 것처럼 보인다. */
function planWeeklySeries(events, asOf) {
  const cur = planWeekStart(asOf).getTime(), by = new Map();
  for (const e of events || []) {
    const d = e && (e.date instanceof Date ? e.date : planDate(e.date));
    const packs = e ? parseFloat(e.packs) : 0;
    if (!d || !(packs > 0)) continue;
    const w = planWeekStart(d).getTime();
    if (w >= cur) continue;
    by.set(w, (by.get(w) || 0) + packs);
  }
  const ws = [...by.keys()].sort((a, b) => a - b);
  const out = [];
  for (let w = ws[0]; w < cur; w += 7 * 86400000) out.push({ week: w, packs: Math.round((by.get(w) || 0) * 100) / 100 });
  return out;
}

/** 이번 주 권장 생산. 판매 이력이 없으면 null — 감으로 배치를 뽑지 않는다. */
function calcProductionPlan({ series, stock, pending, safetyWeeks, batchPacks }) {
  const all = (series || []).filter(x => x && isFinite(parseFloat(x.packs)));
  if (!all.length) return null;
  const packs = all.slice(-PLAN_CFG.WEEKS).map(x => parseFloat(x.packs) || 0);
  let num = 0, den = 0;
  packs.forEach((v, i) => { num += v * (i + 1); den += (i + 1); });   // 선형가중 — 최근 주가 무겁다
  const demand = num / den;
  if (!(demand > 0)) return null;
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const k = PLAN_CFG.TREND_WEEKS;
  const trend = packs.length >= 2 * k ? (avg(packs.slice(-k)) / avg(packs.slice(-2 * k, -k)) - 1) : null;
  const sw = parseFloat(safetyWeeks) > 0 ? parseFloat(safetyWeeks) : PLAN_CFG.SAFETY_WEEKS;
  const bp = parseFloat(batchPacks) > 0 ? parseFloat(batchPacks) : PLAN_CFG.BATCH_PACKS;
  const st = parseFloat(stock) || 0, pd = parseFloat(pending) || 0, avail = st + pd;
  const target = demand * (sw + 1);                                  // 안전재고 + 다음 주 소비
  const need = Math.max(0, target - avail);
  const batches = Math.ceil(need / bp);
  const daily = demand / 7;
  return {
    weeks: packs.length, series: packs, demand, mean: avg(packs), trend,
    stock: st, pending: pd, avail, weeksOnHand: avail / demand,
    safetyLine: demand * sw, daysToSafety: Math.max(0, (avail - demand * sw) / daily),
    target, need, batches, produce: batches * bp,
    balanceBatches: Math.round(demand / bp * 10) / 10,               // 소비만큼 만들면 몇 배치
    surplus: avail - target,
  };
}

/** 그래프용 시계열 — 과거 실적 + 「지금」 + 향후 계획. 단위는 전부 **봉**(축 하나로 읽힌다).
      · 사용량  = 과거는 실제 출하(재고를 실제로 깎은 양) · 미래는 예측 소비 D(가맹점 실판매 기준)
      · 생산량  = 과거는 실제 생산 · 미래는 매주 order-up-to 시뮬레이션(= 이 산식이 권하는 양)
      · 보유재고 = 현재고를 앵커로 과거는 역산(재고ᵢ₋₁ = 재고ᵢ − 생산ᵢ + 출하ᵢ), 미래는 시뮬레이션
      · 안전재고선 = D × 안전주수 (기본 2주) — 재고 선이 이 선 위에 있으면 안전
    ⚠️ 과거 재고는 «현재고에서 역산한 추정»이다. 날짜별 재고원장이 없어서이고, 최신 값만 실측과 일치한다. */
function buildPlanChartSeries({ useEvents, prodEvents, stockNow, demand, asOf, weeksBack, weeksAhead, safetyWeeks, batchPacks }) {
  const d = parseFloat(demand);
  if (!(d > 0)) return null;
  const DAY = 86400000, now = asOf || new Date(), cur = planWeekStart(now).getTime();
  const back = weeksBack > 0 ? weeksBack : PLAN_CFG.CHART_BACK;
  const ahead = weeksAhead > 0 ? weeksAhead : PLAN_CFG.CHART_AHEAD;
  const sw = parseFloat(safetyWeeks) > 0 ? parseFloat(safetyWeeks) : PLAN_CFG.SAFETY_WEEKS;
  const bp = parseFloat(batchPacks) > 0 ? parseFloat(batchPacks) : PLAN_CFG.BATCH_PACKS;
  const bucket = evs => {
    const m = new Map();
    for (const e of evs || []) {
      const dt = e && (e.date instanceof Date ? e.date : planDate(e.date));
      const p = e ? parseFloat(e.packs) || 0 : 0;
      if (!dt || !(p > 0)) continue;
      const w = planWeekStart(dt).getTime();
      m.set(w, (m.get(w) || 0) + p);
    }
    return m;
  };
  const U = bucket(useEvents), P = bucket(prodEvents);
  const wks = []; for (let i = back; i >= 1; i--) wks.push(cur - i * 7 * DAY);
  // 마지막 완결주말 재고 = 현재고에서 «이번 주 진행분»을 되돌린 값
  const ends = new Array(wks.length);
  ends[wks.length - 1] = Math.max(0, (parseFloat(stockNow) || 0) + (U.get(cur) || 0) - (P.get(cur) || 0));
  for (let i = wks.length - 1; i >= 1; i--) ends[i - 1] = Math.max(0, ends[i] - (P.get(wks[i]) || 0) + (U.get(wks[i]) || 0));
  const lab = w => { const t = new Date(w + 6 * DAY); return String(t.getMonth() + 1).padStart(2, "0") + "." + String(t.getDate()).padStart(2, "0"); };
  const labels = wks.map(lab), use = wks.map(w => Math.round(U.get(w) || 0)), prod = wks.map(w => Math.round(P.get(w) || 0)), stock = ends.map(v => Math.round(v));
  const splitIndex = labels.length;                       // 「지금」 위치
  labels.push("지금"); use.push(null); prod.push(null); stock.push(Math.round(parseFloat(stockNow) || 0));
  const target = d * (sw + 1);
  let s = parseFloat(stockNow) || 0;
  const plan = [];
  for (let i = 1; i <= ahead; i++) {
    const p = Math.ceil(Math.max(0, target - s) / bp) * bp;
    s = s + p - d;
    plan.push(p);
    labels.push("+" + i + "주"); use.push(Math.round(d)); prod.push(p); stock.push(Math.round(Math.max(0, s)));
  }
  return {
    labels, use, prod, stock, splitIndex,
    safety: labels.map(() => Math.round(d * sw)),
    demand: d, safetyWeeks: sw, batchPacks: bp, targetStock: target,
    nextIndex: splitIndex + 1,                                       // 「바로 다음 주」 — 화면에서 강조하는 칸
    nextPacks: plan.length ? plan[0] : 0,
    nextBatches: plan.length ? plan[0] / bp : 0,
    steadyBatches: Math.round(d / bp * 10) / 10,
    weeksOnHand: stock.map(v => Math.round(v / d * 100) / 100),
  };
}
// </prod-plan>

/** 생산 계획 그래프(SVG) — 축 하나(봉)에 사용량·생산량 막대 + 보유재고 선 + 안전재고선.
    차트 라이브러리를 새로 안 들이는 이유: 이 앱은 오프라인 PWA 단일 파일이라 CDN 이 막히면 그래프가 통째로 사라진다. */
function planSvgChart(s) {
  const W = 720, H = 240, L = 46, R = 8, T = 12, B = 38;
  const n = s.labels.length, iw = W - L - R, ih = H - T - B;
  const raw = Math.max(1, ...s.use.map(v => v || 0), ...s.prod.map(v => v || 0), ...s.stock, ...s.safety) * 1.05;
  // 눈금이 1141 같은 숫자가 되지 않게 — 5칸 기준으로 1·2·2.5·5·10 배수 중 하나로 맞춘다
  const rough = raw / 5, mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = ([1, 2, 2.5, 5, 10].find(m => rough <= m * mag) || 10) * mag;
  const maxV = Math.ceil(raw / step) * step;
  const cw = iw / n, bw = Math.min(cw * 0.3, 22);
  const cx = i => L + cw * (i + 0.5), cy = v => T + ih * (1 - v / maxV);
  const bar = (v, i, dx, fill, op) => (v == null || v <= 0) ? '' :
    `<rect x="${(cx(i) + dx - bw / 2).toFixed(1)}" y="${cy(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ih - cy(v)).toFixed(1)}" rx="1.5" fill="${fill}" fill-opacity="${op}"/>`;
  const line = (from, to) => s.stock.slice(from, to + 1)
    .map((v, k) => `${k ? 'L' : 'M'}${cx(from + k).toFixed(1)},${cy(v).toFixed(1)}`).join('');
  const tickVals = []; for (let v = 0; v <= maxV + 0.001; v += step) tickVals.push(v);
  const ticks = tickVals.map(v =>
    `<line x1="${L}" y1="${cy(v).toFixed(1)}" x2="${W - R}" y2="${cy(v).toFixed(1)}" stroke="var(--gray-l)" stroke-width="0.5"/>
     <text x="${L - 5}" y="${(cy(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--txt-l)">${Math.round(v)}</text>`).join('');
  // 「바로 다음 주」 강조 — 이 그래프를 보는 이유가 사실상 이 칸 하나다
  const ni = s.nextIndex, nx = cx(ni), nc = s.nextPacks > 0 ? 'var(--pri)' : 'var(--suc)';
  const hi = `<rect x="${(nx - cw / 2).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ih}" fill="${nc}" opacity="0.08"/>
    <text x="${nx.toFixed(1)}" y="${T + 12}" text-anchor="middle" font-size="14" font-weight="800" fill="${nc}">${s.nextPacks}봉</text>
    <text x="${nx.toFixed(1)}" y="${T + 24}" text-anchor="middle" font-size="9.5" fill="${nc}">${s.nextPacks > 0 ? s.nextBatches + '배치 · 다음 주' : '생산 없어도 됨'}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible" role="img" aria-label="주별 사용량·생산량·보유재고 추이">
    ${hi}
    ${ticks}
    <line x1="${cx(s.splitIndex).toFixed(1)}" y1="${T}" x2="${cx(s.splitIndex).toFixed(1)}" y2="${T + ih}" stroke="var(--txt-l)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    ${s.use.map((v, i) => bar(v, i, -bw * 0.6, 'var(--info)', i < s.splitIndex ? 0.85 : 0.35)).join('')}
    ${s.prod.map((v, i) => bar(v, i, bw * 0.6, i < s.splitIndex ? 'var(--suc)' : 'var(--pri)', i < s.splitIndex ? 0.85 : (i === ni ? 1 : 0.5))).join('')}
    <line x1="${L}" y1="${cy(s.safety[0]).toFixed(1)}" x2="${W - R}" y2="${cy(s.safety[0]).toFixed(1)}" stroke="var(--err)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="${L + 4}" y="${(cy(s.safety[0]) - 5).toFixed(1)}" font-size="9" fill="var(--err)">안전재고 ${s.safetyWeeks}주 · ${s.safety[0]}봉</text>
    <path d="${line(0, s.splitIndex)}" fill="none" stroke="var(--txt)" stroke-width="2"/>
    <path d="${line(s.splitIndex, n - 1)}" fill="none" stroke="var(--txt)" stroke-width="2" stroke-dasharray="5 4" opacity="0.75"/>
    ${s.stock.map((v, i) => `<circle cx="${cx(i).toFixed(1)}" cy="${cy(v).toFixed(1)}" r="${i === s.splitIndex ? 3.5 : 2}" fill="var(--txt)"/>`).join('')}
    ${s.labels.map((t, i) => `<text x="${cx(i).toFixed(1)}" y="${H - B + 14}" text-anchor="middle" font-size="10" fill="${i === s.splitIndex ? 'var(--txt)' : (i === ni ? nc : 'var(--txt-l)')}" font-weight="${i === s.splitIndex || i === ni ? 700 : 400}">${t}</text>`).join('')}
    ${s.weeksOnHand.map((w, i) => `<text x="${cx(i).toFixed(1)}" y="${H - B + 25}" text-anchor="middle" font-size="8.5" fill="var(--txt-l)">${w.toFixed(1)}주</text>`).join('')}
  </svg>`;
}

/** 홈 「생산 계획」 그래프 — 실패해도 홈은 그대로여야 하니 조용히 접는다. */
async function loadHomeProdPlan() {
  const el = $id('home-prod-plan');
  if (!el) return;
  try {
    const [items, lots, wos, ships, mb] = await Promise.all([
      SheetsAPI.getAll('완제품품목').catch(() => []),
      SheetsAPI.getAll('완제품LOT').catch(() => []),
      SheetsAPI.getAll('작업지시서').catch(() => []),
      SheetsAPI.getAll('출하기록').catch(() => []),
      FactoryPnl.fetchMarketbom().catch(() => ({ rows: [] })),
    ]);
    const asOf = new Date();
    const FG_DEAD = new Set(['출하완료', '폐기', '삭제', '소진', '채번예약']);
    const cards = [];
    for (const it of items) {
      if (!it || !it[0] || it[7] === '비활성') continue;
      const code = it[0];
      const myLots = new Set(lots.filter(l => l && l[1] === code).map(l => l[0]));
      // 출하 = 재고를 실제로 깎은 양(그래프의 과거 사용량·재고 역산은 이걸 써야 앞뒤가 맞는다)
      const shipEv = ships.filter(s => s && myLots.has(s[1]) && !/테스트|E2E/i.test(String(s[3] || '') + String(s[7] || '')))
        .map(s => ({ date: s[6], packs: parseFloat(s[4]) || 1 }));
      // 수요 예측 = 마켓봄 실판매(가맹점 주문). 연결이 없으면 출하로 떨어진다.
      const mbCodes = String(it[FG_EXT.mbCodes] || '').split(',').map(s => s.trim()).filter(Boolean);
      const saleEv = planSalesEvents(mb.rows, mbCodes);
      const src = saleEv.length ? '실판매' : '출하';
      const stock = lots.filter(l => l && l[1] === code && !FG_DEAD.has(l[9])).reduce((a, l) => a + (parseFloat(l[8]) || 0), 0);
      const pending = wos.filter(w => w && w[3] === code && ['냉동보관중', '진행중'].includes(w[12]))
        .reduce((a, w) => a + (parseFloat(w[7]) || 0), 0);
      const plan = calcProductionPlan({ series: planWeeklySeries(saleEv.length ? saleEv : shipEv, asOf), stock, pending });
      if (!plan) continue;
      const prodEv = lots.filter(l => l && l[1] === code && l[5] && !['폐기', '삭제'].includes(l[9]))
        .map(l => ({ date: l[5], packs: parseFloat(l[10]) || parseFloat(l[3]) || 0 }));
      if (pending > 0) prodEv.push({ date: asOf, packs: pending });   // 냉동중 = 이번 주에 이미 만든 것
      const chart = buildPlanChartSeries({ useEvents: shipEv, prodEvents: prodEv, stockNow: plan.avail, demand: plan.demand, asOf });
      if (chart) cards.push({ name: it[1] || code, kgPer: parseFloat(it[4]) || 5, src, plan, chart });
    }
    if (!cards.length) return;
    el.innerHTML = '<div class="fs-14 fw-7 mb-8 mt-8">🏭 생산 계획 (주별 · 실적 → 예측)</div>' + cards.map(c => {
      const p = c.plan, s = c.chart, tr = p.trend;
      const key = s.nextPacks > 0
        ? `다음 주 <b class="c-pri" style="font-size:15px">${s.nextPacks}봉</b>(${s.nextBatches}배치) 생산`
        : `다음 주 <b class="c-suc">생산 없어도 됨</b>`;
      return `
        <div class="card">
          <div class="fs-14 fw-6">${c.name}</div>
          <div class="fs-11 c-txt-l" style="margin:2px 0 6px">지금 <b>${Math.round(p.avail)}봉 · ${p.weeksOnHand.toFixed(1)}주치</b> · 예측 소비 <b>${Math.round(p.demand)}봉/주</b>(${Math.round(p.demand * c.kgPer).toLocaleString()}kg)${tr == null ? '' : ` · 최근 4주 ${tr >= 0 ? '↑' : '↓'}${Math.abs(tr * 100).toFixed(0)}%`} · ${key}</div>
          ${planSvgChart(s)}
          <div class="fs-10 c-txt-l" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
            <span><span style="display:inline-block;width:9px;height:9px;background:var(--info);border-radius:2px;vertical-align:-1px"></span> 사용량(과거=출하 · 미래=예측)</span>
            <span><span style="display:inline-block;width:9px;height:9px;background:var(--suc);border-radius:2px;vertical-align:-1px"></span> 생산 실적</span>
            <span><span style="display:inline-block;width:9px;height:9px;background:var(--pri);border-radius:2px;vertical-align:-1px"></span> 권장 생산</span>
            <span><span style="display:inline-block;width:12px;height:2px;background:var(--txt);vertical-align:3px"></span> 보유재고(봉)</span>
            <span><span style="display:inline-block;width:12px;height:2px;background:var(--err);vertical-align:3px"></span> 안전재고 ${s.safetyWeeks}주선</span>
          </div>
          <div class="fs-10 c-txt-l" style="margin-top:4px">수요 예측 = 최근 ${p.weeks}주 ${c.src} 선형가중평균 · 미래 생산 = 매주 «안전 ${s.safetyWeeks}주 + 다음주 1주»를 채우는 양(${s.batchPacks}봉 배치 단위) · 안정되면 주 ${s.steadyBatches}배치 · 과거 재고는 현재고에서 역산한 추정</div>
        </div>`;
    }).join('');
  } catch (e) {
    console.warn('[홈] 생산 계획 그래프 실패:', e);
  }
}

// ─── PRODUCTION ───
Screens.production = async () => {
  const role = State.user?.role || 'worker';
  const isAdmin = role === 'admin';

  renderHeader('생산관리');

  try {
    // 캐시 무효화 — 다른 기기에서 업데이트된 WO 목록 반영
    SheetsAPI.invalidateCache('작업지시서');
    State.workOrders = await SheetsAPI.getAll('작업지시서', false).catch(() => []);
    State.productionRequests = await SheetsAPI.getAll('생산요청').catch(() => []);
  } catch (e) { console.warn(e); }

  // 직전 활성 탭 유지 — LiveSync 재렌더 시 무조건 기본 탭으로 튕기는 이슈 방지
  const defaultTab = isAdmin ? '생산요청' : '새 작업';
  const lastTab = State._prodActiveTab || defaultTab;
  renderProductionContent(lastTab, isAdmin);
};

function renderProductionContent(activeTab, isAdmin) {
  // 활성 탭 State 에 저장
  State._prodActiveTab = activeTab;
  const tabs = isAdmin ? ['생산요청', '승인대기', '전체작업'] : ['새 작업', '작업 현황', '완료된 작업'];

  $id('content').innerHTML = `
    <div class="tab-filter">
      ${tabs.map(t => `<div class="tab ${activeTab === t ? 'active' : ''}" onclick="renderProductionContent('${t}', ${isAdmin})">${t}</div>`).join('')}
    </div>
    <div style="padding:16px;position:relative" id="prod-list"></div>
  `;

  const listEl = $id('prod-list');

  if (activeTab === '생산요청') {
    const reqs = State.productionRequests.filter(r => r[7] !== '삭제');
    if (reqs.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><div class="es-icon">📋</div><div class="es-title">생산요청이 없습니다</div><div class="es-desc">+ 버튼을 눌러 새 생산요청을 등록하세요</div></div>`;
    } else {
      listEl.innerHTML = reqs.map(r => `
        <div class="card" oncontextmenu="event.preventDefault();deleteRequest('${r[0]}')" ontouchstart="this._ts=Date.now()" ontouchend="if(Date.now()-this._ts>600){event.preventDefault();deleteRequest('${r[0]}');}">
          <div class="row between mb-4">
            <span class="fs-13 fw-6">${r[2] || ''} ${r[3] || ''}kg</span>
            <span class="badge badge-${r[7]==='대기'?'warn':r[7]==='배정완료'?'info':'gray'}">${r[7] || '대기'}</span>
          </div>
          <div class="fs-11 c-txt-l">${r[0]} · 납기 ${(r[6]||'').substring(5)}</div>
          <div class="long-press-hint">길게 누르면 삭제</div>
        </div>
      `).join('');
    }
    listEl.innerHTML += `<div class="fab" onclick="Router.go('req-form')">+</div>`;
  }

  else if (activeTab === '승인대기') {
    const pending = State.workOrders.filter(r => r[12] === '냉동보관중' || r[12] === '승인대기');
    if (pending.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><div class="es-icon">✅</div><div class="es-title">승인 대기 없음</div></div>`;
    } else {
      listEl.innerHTML = pending.map(wo => {
        const freezeStart = wo[11] ? new Date(wo[11]) : null;
        const elapsed = freezeStart ? ((Date.now() - freezeStart.getTime()) / (1000*60*60)).toFixed(1) : 0;
        const canApprove = elapsed >= 12;
        return `
          <div class="card clickable" onclick="Router.go('approval-detail', {woId:'${wo[0]}'})">
            <div class="row between mb-4">
              <span class="fs-13 fw-6">${wo[4] || ''} ${wo[5] || ''}kg</span>
              <span class="badge badge-${canApprove ? 'suc' : 'warn'}">${canApprove ? '출하승인 가능' : '냉동보관중'}</span>
            </div>
            <div class="fs-11 c-txt-l">${wo[0]} · ${wo[8] || ''} · 포장 ${wo[7]||'-'}개</div>
            ${freezeStart ? `<div class="fs-11 ${canApprove ? 'c-suc fw-6' : 'c-warn'} mt-4">냉동: ${(wo[11]||'').substring(11,16)} · 경과 ${elapsed}시간 / 12시간 ${canApprove ? '✅' : ''}</div>` : ''}
          </div>
        `;
      }).join('');
    }
  }

  else if (activeTab === '작업 현황') {

    if (myWO.length === 0) {

    } else {
      // 반응형 — 작은 폰 ~ 태블릿 가독성. 모든 텍스트 clamp() 로 viewport 비례.
      listEl.innerHTML = myWO.map(wo => {
        const lastStep = parseInt(wo[13]) || 0;
        const progress = Math.round((lastStep / 11) * 100);
        const canDelete = wo[12] !== '진행중' || lastStep === 0 || State.user.role === 'admin';
        const isPending = wo[12] === '승인대기';
        const progColor = progress >= 80 ? 'var(--suc)' : progress >= 40 ? 'var(--info)' : 'var(--warn)';
        const startStr = (wo[9] || '').length >= 16 ? `${wo[9].substring(5,10)} ${wo[9].substring(11,16)}` : '';
        return `
          <div class="card ${isPending ? 'bl-warn' : 'clickable'}" style="padding:clamp(12px,3.5vw,16px);margin-bottom:10px" ${!isPending ? `onclick="Router.go('wo-execute', {woId:'${wo[0]}'})"` : ''}
            ${!isPending ? `oncontextmenu="event.preventDefault();${canDelete ? `deleteWorkOrder('${wo[0]}')` : ''}"
            ontouchstart="this._ts=Date.now()" ontouchend="if(Date.now()-this._ts>600){event.preventDefault();${canDelete ? `deleteWorkOrder('${wo[0]}')` : 'toast(\"진행중인 건은 삭제할 수 없습니다\",\"err\")'}}"` : ''}>
            <div class="row between" style="align-items:flex-start;gap:8px;margin-bottom:8px">
              <div style="flex:1;min-width:0">
                <div style="font-size:clamp(15px,4vw,17px);font-weight:700;line-height:1.3">${wo[4] || ''}</div>
                <div style="font-size:clamp(13px,3.6vw,15px);font-weight:600;color:var(--pri);margin-top:2px">${wo[5] || ''}kg</div>
              </div>
              <span class="badge badge-${isPending?'warn':'info'}" style="font-size:clamp(11px,3vw,13px);padding:4px 10px;flex-shrink:0">${wo[12]}</span>
            </div>
            <div style="font-size:clamp(11px,3vw,13px);color:var(--txt-l);font-family:monospace;margin-bottom:8px;word-break:break-all">${wo[0]}</div>
            <div class="row between" style="align-items:center;margin-bottom:6px">
              <span style="font-size:clamp(12px,3.2vw,14px);font-weight:600">공정 ${lastStep}/11</span>
              <span style="font-size:clamp(13px,3.6vw,15px);font-weight:700;color:${progColor}">${progress}%</span>

            <div class="progress-bar" style="height:8px;background:var(--bg);border-radius:4px;overflow:hidden"><div class="fill" style="width:${progress}%;height:100%;background:${progColor};transition:width 0.3s"></div></div>
            ${isPending ? `
              <div style="margin-top:10px;padding:10px;background:#fff3e0;border-radius:6px;font-size:clamp(12px,3.2vw,14px);color:var(--warn);font-weight:600;text-align:center">⏳ 관리자 승인 대기 중</div>
              <button class="btn btn-sm btn-outline btn-err" style="width:100%;margin-top:8px;font-size:clamp(12px,3.2vw,14px)" onclick="event.stopPropagation();cancelApprovalRequest('${wo[0]}')">승인요청 취소</button>
            ` : lastStep > 0 ? `<div style="margin-top:8px;font-size:clamp(11px,3vw,13px);color:var(--txt-l)">📝 임시저장됨${startStr ? ' · 시작 ' + startStr : ''}</div>` : ''}
            ${!isPending && canDelete ? '<div class="long-press-hint" style="margin-top:6px;font-size:clamp(10px,2.8vw,12px)">길게 누르면 삭제</div>' : ''}
          </div>
        `;
      }).join('');
    }
  }

  else if (activeTab === '새 작업') {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="es-icon">📋</div>
        <div class="es-title">새 작업지시서 생성</div>
        <div class="es-desc">SOP를 선택하여 작업을 시작합니다</div>
        <button class="btn btn-pri btn-full" onclick="Router.go('wo-create')">SOP 선택하여 시작</button>
      </div>
    `;
  }

  else if (activeTab === '완료된 작업') {
    const allDone = State.workOrders.filter(r => r[8] === State.user?.email && (r[12] === '승인완료' || r[12] === '냉동보관중' || r[12] === '출하가능' || r[12] === '출하완료' || r[12]?.startsWith('거부')));

    // Date range filter
    const today = new Date();
    const weekAgo = new Date(today.getTime() - 7*86400000);
    const monthAgo = new Date(today.getTime() - 30*86400000);
    const savedRange = window._doneFilterRange || 'all';

    listEl.innerHTML = `
      <div class="row mb-12" style="gap:6px">
        <button class="btn btn-sm ${savedRange==='week'?'btn-pri':'btn-outline btn-gray'}" onclick="window._doneFilterRange='week';renderProductionContent('완료된 작업',${isAdmin})">최근 1주</button>
        <button class="btn btn-sm ${savedRange==='month'?'btn-pri':'btn-outline btn-gray'}" onclick="window._doneFilterRange='month';renderProductionContent('완료된 작업',${isAdmin})">최근 1개월</button>

    } else {
      innerEl.innerHTML = `<div class="fs-11 c-txt-l mb-8">총 ${filtered.length}건</div>` +

          <div class="card">

            </div>
            <div class="fs-11 c-txt-l">${wo[0]} · ${(wo[16]||'').substring(0,16)}</div>

    const statusCounts = {};

    // 필터/정렬 상태
    const curFilter = window._allWoFilter || '전체';
    const curSort = window._allWoSort || 'desc';

    let filtered = curFilter === '전체' ? all : all.filter(wo => wo[12] === curFilter);

    filtered.sort((a, b) => {
      const da = new Date(a[9] || '2000-01-01'), db = new Date(b[9] || '2000-01-01');

    });

    // 요약 카드
    const summaryCards = statusOrder.filter(s => statusCounts[s]).map(s =>
      `<div style="text-align:center;padding:8px 0;min-width:60px;flex:1;border-radius:8px;background:${curFilter===s?'var(--pri)':'var(--bg)'};color:${curFilter===s?'#fff':'var(--txt)'};cursor:pointer" onclick="window._allWoFilter='${s}';renderProductionContent('전체작업',${isAdmin})">
        <div style="font-size:18px;font-weight:800">${statusCounts[s]}</div>
        <div style="font-size:10px;margin-top:2px">${s}</div>
      </div>`

    listEl.innerHTML = `
      <div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding:2px 0">
        ${summaryCards}
      </div>
      <div class="row between mb-8" style="gap:6px;align-items:center">
        <div style="display:flex;gap:4px;flex-wrap:wrap;flex:1">
          <button class="btn btn-sm ${curFilter==='전체'?'btn-pri':'btn-outline btn-gray'}" onclick="window._allWoFilter='전체';renderProductionContent('전체작업',${isAdmin})">전체 (${all.length})</button>
          ${statusOrder.filter(s => statusCounts[s]).map(s =>
            `<button class="btn btn-sm ${curFilter===s?'btn-pri':'btn-outline btn-gray'}" onclick="window._allWoFilter='${s}';renderProductionContent('전체작업',${isAdmin})">${s}</button>`
          ).join('')}
        </div>
        <button class="btn btn-sm btn-outline btn-gray" onclick="window._allWoSort=window._allWoSort==='desc'?'asc':'desc';renderProductionContent('전체작업',${isAdmin})" style="white-space:nowrap;flex-shrink:0">
          ${curSort === 'desc' ? '↓ 최신순' : '↑ 오래된순'}
        </button>
      </div>
      <div class="fs-11 c-txt-l mb-8">${curFilter !== '전체' ? curFilter + ' · ' : ''}${filtered.length}건</div>
      ${filtered.length === 0 ? `<div class="empty-state"><div class="es-icon">📝</div><div class="es-title">${curFilter} 작업 없음</div></div>` :
        filtered.map(wo => {
          const isDeleted = wo[12] === '삭제';
          if (isDeleted) {
            const auditNote = wo[17] || '';
            return `
              <div class="card bl-gray" style="opacity:0.85;background:#f8f8f8">
                <div class="row between mb-4">
                  <span class="fs-13 fw-6" style="text-decoration:line-through;color:var(--txt-l)">${wo[4] || ''} ${wo[5] || ''}kg</span>
                  <span class="badge badge-gray">삭제</span>
                </div>
                <div class="fs-11 c-txt-l">${wo[0]} · ${wo[8] || ''} · ${(wo[9]||'').substring(0,10)}</div>
                ${auditNote ? `<div class="fs-10 c-txt-l mt-4" style="font-style:italic">${auditNote}</div>` : ''}
                ${isAdmin ? `<button class="btn btn-sm btn-suc mt-8" style="width:100%" onclick="restoreWorkOrder('${wo[0]}')">↩ 복구</button>` : ''}
              </div>
            `;
          }
          return `
            <div class="card clickable" onclick="Router.go('wo-detail',{woId:'${wo[0]}'})">
              <div class="row between mb-4">
                <span class="fs-13 fw-6">${wo[4] || ''} ${wo[5] || ''}kg</span>
                <span class="badge badge-${statusBadgeMap[wo[12]]||'err'}">${wo[12]}</span>
              </div>
              <div class="fs-11 c-txt-l">${wo[0]} · ${wo[8] || ''} · ${(wo[9]||'').substring(0,10)}</div>
            </div>
          `;
        }).join('')}
    `;
  }
}

// Delete handlers
async function deleteRequest(reqId) {
  confirm('생산요청 삭제', `${reqId}을(를) 삭제하시겠습니까?`, async () => {
    try {
      showLoading();
      await SheetsAPI.updateCell('생산요청', 0, reqId, 7, '삭제');
      toast('삭제되었습니다', 'suc');
      Router.go('production');
    } catch (e) {
      toast('삭제 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
    }
  });
}

async function deleteWorkOrder(woId) {
  showLoading();
  try {
    SheetsAPI.invalidateCache('작업지시서');
    const wos = await SheetsAPI.getAll('작업지시서', false);
    const wo = wos.find(w => w[0] === woId);
    if (!wo) { hideLoading(); toast('작업지시서를 찾을 수 없습니다', 'err'); return; }
    if (wo[12] === '삭제') { hideLoading(); toast('이미 삭제된 작업지시서입니다', 'warn'); return; }

    const isAdmin = State.user?.role === 'admin';
    const isOwner = wo[8] === State.user?.email;
    if (!isAdmin && !isOwner) { hideLoading(); toast('본인 또는 관리자만 삭제 가능합니다', 'err'); return; }

    const status = wo[12] || '';
    const fgLotId = wo[14] || '';
    const dangerous = ['진행중','냉동보관중','출하가능','출하완료','승인완료'].includes(status);
    hideLoading();

    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `

        <div class="d-msg">${woId} · ${wo[4]||''} ${wo[5]||''}kg<br><span class="fs-11 c-txt-l">현재 상태: ${status||'-'}</span></div>

          if (cascadeFg && fgLotId) {

          }

          hideLoading();
          releaseLock('deleteWO');
        }
      });
    };

}

/* ─── 작업지시서 복구 (실수 삭제 정정용) ───
   관리자 전용. 삭제된 WO를 선택한 상태로 되돌리고
   감사 노트(wo[17])에 [복구→상태] 항목을 누적 기록.
   캐스케이드 삭제된 FG LOT 도 동시 복구 옵션 제공. */
async function restoreWorkOrder(woId) {
  showLoading();
  try {
    SheetsAPI.invalidateCache('작업지시서');
    const wos = await SheetsAPI.getAll('작업지시서', false);
    const wo = wos.find(w => w[0] === woId);
    if (!wo) { hideLoading(); toast('작업지시서를 찾을 수 없습니다', 'err'); return; }
    if (wo[12] !== '삭제') { hideLoading(); toast(`삭제 상태가 아닙니다 (현재: ${wo[12]||'-'})`, 'warn'); return; }

    const isAdmin = State.user?.role === 'admin';
    if (!isAdmin) { hideLoading(); toast('관리자만 복구할 수 있습니다', 'err'); return; }

    const lastStep = parseInt(wo[13]) || 0;
    const fgLotId = wo[14] || '';
    let fgLotDeleted = false;
    if (fgLotId) {
      try {
        SheetsAPI.invalidateCache('완제품LOT');
        const fgLots = await SheetsAPI.getAll('완제품LOT', false);
        const fgLot = fgLots.find(l => l[0] === fgLotId);
        fgLotDeleted = !!(fgLot && fgLot[9] === '삭제');
      } catch(e) {}
    }
    hideLoading();

    let suggested = '진행중';
    if (lastStep >= 11 && wo[11]) suggested = '냉동보관중';
    const auditNote = wo[17] || '';

    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog" style="max-width:360px">
        <div class="d-title">작업지시서 복구</div>
        <div class="d-msg">${woId} · ${wo[4]||''} ${wo[5]||''}kg<br><span class="fs-11 c-txt-l">현재: 삭제 / 마지막 공정 단계: ${lastStep}/11</span></div>
        ${auditNote ? `<div class="card bl-info" style="background:#e3f2fd;padding:10px;margin-bottom:10px"><div class="fs-11 c-txt-l">기존 감사 기록:<br>${auditNote}</div></div>` : ''}
        <div class="input-group" style="margin-bottom:8px">
          <label>복구 후 상태</label>
          <select id="restore-status" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
            <option value="진행중" ${suggested==='진행중'?'selected':''}>진행중</option>
            <option value="승인대기" ${suggested==='승인대기'?'selected':''}>승인대기</option>
            <option value="냉동보관중" ${suggested==='냉동보관중'?'selected':''}>냉동보관중</option>
          </select>
        </div>
        ${fgLotDeleted ? `<div class="check-item" id="cascade-row" style="margin-bottom:10px;cursor:pointer"><div class="check-box checked" id="cascade-fg" style="background:var(--suc)">✓</div><span class="fs-12">연결된 완제품 LOT (${fgLotId}) 도 함께 복구</span></div>` : ''}
        <div class="input-group" style="margin-bottom:12px">
          <label>복구 사유 (선택, 감사용)</label>
          <textarea id="restore-reason" rows="2" placeholder="예: 실수 삭제 / 잘못 등록 정정" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px"></textarea>
        </div>
        <div class="d-actions">
          <button class="btn btn-sm btn-outline btn-gray" id="restore-cancel">취소</button>
          <button class="btn btn-sm btn-suc" id="restore-ok">복구</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const cascadeRow = overlay.querySelector('#cascade-row');
    if (cascadeRow) {
      cascadeRow.onclick = () => {
        const box = overlay.querySelector('#cascade-fg');
        const checked = box.classList.toggle('checked');
        box.style.background = checked ? 'var(--suc)' : '';
        box.textContent = checked ? '✓' : '';
      };
    }
    overlay.querySelector('#restore-cancel').onclick = () => overlay.remove();
    overlay.querySelector('#restore-ok').onclick = () => {
      const newStatus = overlay.querySelector('#restore-status').value;
      const reason = overlay.querySelector('#restore-reason').value?.trim() || '(사유 없음)';
      const cascadeFg = !!(fgLotDeleted && overlay.querySelector('#cascade-fg')?.classList.contains('checked'));
      overlay.remove();

      confirm('복구하시겠습니까?', `${woId}\n새 상태: ${newStatus}${cascadeFg ? `\n+ 완제품 LOT ${fgLotId} 동시 복구` : ''}\n사유: ${reason}`, async () => {
        if (!acquireLock('restoreWO')) return;
        try {
          showLoading();
          const restoreNote = `${auditNote ? auditNote + ' | ' : ''}[복구→${newStatus}] ${reason} | ${State.user?.email||''} | ${formatDateTime()}`;
          await SheetsAPI.updateRow('작업지시서', 0, woId, {
            12: newStatus,
            17: restoreNote
          });
          if (cascadeFg && fgLotId) {
            const fgRestoreStatus = newStatus === '냉동보관중' ? '냉동보관중' : '출하가능';
            await SheetsAPI.updateRow('완제품LOT', 0, fgLotId, { 9: fgRestoreStatus });
            const fgIndivs = (await SheetsAPI.getAll('완제품개별').catch(()=>[])).filter(iv => iv[1]===fgLotId && iv[3]==='삭제');
            for (const iv of fgIndivs) {
              await SheetsAPI.updateRow('완제품개별', 0, iv[0], { 3: fgRestoreStatus });
            }
            SheetsAPI.invalidateCache('완제품LOT');
            SheetsAPI.invalidateCache('완제품개별');
          }
          SheetsAPI.invalidateCache('작업지시서');
          toast(`복구 완료: ${woId} → ${newStatus}`, 'suc');
          Router.go('production');
        } catch (e) {
          toast('복구 실패: ' + e.message, 'err');
        } finally {
          hideLoading();
          releaseLock('restoreWO');
        }
      });
    };
  } catch (e) {
    hideLoading();
    toast('로드 실패: ' + e.message, 'err');
  }
}

/* ─── 원재료 LOT 입고취소 (오입고 정정용) ───
   '폐기'와 별도 상태값 — HACCP 추적 보고서에서 분리 집계
   조건: 미사용 LOT만 (사용된 개별이 1개라도 있으면 거부) */
async function cancelLotIntake(lotId, itemName) {
  showLoading();
  try {
    SheetsAPI.invalidateCache('원재료LOT');
    SheetsAPI.invalidateCache('원재료개별');
    const lots = await SheetsAPI.getAll('원재료LOT', false);
    const lot = lots.find(l => l[0] === lotId);
    if (!lot) { hideLoading(); toast('LOT을 찾을 수 없습니다', 'err'); return; }
    if (['입고취소','폐기'].includes(lot[9])) { hideLoading(); toast(`이미 ${lot[9]} 처리된 LOT입니다`, 'warn'); return; }

    const indivs = (await SheetsAPI.getAll('원재료개별', false)).filter(iv => iv[1] === lotId);
    const consumedIndivs = indivs.filter(iv => ['사용중','소진','폐기'].includes(iv[3]));
    if (consumedIndivs.length > 0) {
      hideLoading();
      toast(`이미 ${consumedIndivs.length}건이 사용/소진/폐기되어 입고취소 불가합니다.\n잔여만 폐기 처리하세요.`, 'err', 5000);
      return;
    }
    if (lot[9] === '사용중' || lot[9] === '소진') {
      hideLoading();
      toast(`LOT 상태가 "${lot[9]}"여서 입고취소 불가합니다`, 'err');
      return;
    }
    hideLoading();

    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog" style="max-width:360px">
        <div class="d-title">입고 취소 (오입고 정정)</div>
        <div class="d-msg">${lotId}<br>${itemName} · ${lot[4]||''}${lot[5]||''}<br><span class="fs-11 c-txt-l">개별 ${indivs.length}건 모두 미사용 — 취소 가능</span></div>
        <div class="card bl-warn" style="background:#fff8e1;padding:10px;margin-bottom:10px">
          <div class="fs-11 c-txt-l">입고취소는 <strong>실수로 잘못 등록된 입고를 무효화</strong>하는 기능입니다.<br>HACCP 보고서에서 '폐기'와 분리되어 집계됩니다.</div>
        </div>
        <div class="input-group" style="margin-bottom:8px">
          <label>취소 사유 (필수)</label>
          <select id="cancel-reason-preset" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
            <option value="">— 사유 선택 —</option>
            <option value="수량 오입력">수량 오입력</option>
            <option value="잘못된 LOT">잘못된 LOT</option>
            <option value="중복 입고">중복 입고</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="input-group" style="margin-bottom:12px">
          <textarea id="cancel-reason-detail" rows="2" placeholder="상세 사유 (선택)" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px"></textarea>
        </div>
        <div class="d-actions">
          <button class="btn btn-sm btn-outline btn-gray" id="cancel-no">아니오</button>
          <button class="btn btn-sm btn-err" id="cancel-yes">입고취소</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#cancel-no').onclick = () => overlay.remove();
    overlay.querySelector('#cancel-yes').onclick = () => {
      const preset = overlay.querySelector('#cancel-reason-preset').value;
      const detail = overlay.querySelector('#cancel-reason-detail').value?.trim();
      if (!preset) { toast('사유를 선택하세요', 'err'); return; }
      const reason = detail ? `${preset} — ${detail}` : preset;
      overlay.remove();

      confirm('입고를 취소하시겠습니까?', `${lotId}\n사유: ${reason}\n\n해당 LOT과 개별 ${indivs.length}건이 모두 무효화됩니다.`, async () => {
        if (!acquireLock('cancelLotIntake')) return;
        try {
          showLoading();
          const auditNote = `[입고취소] ${reason} | ${State.user?.email||''} | ${formatDateTime()}`;
          await SheetsAPI.updateRow('원재료LOT', 0, lotId, { 8: '0', 9: '입고취소', 11: auditNote });
          for (const iv of indivs) {
            await SheetsAPI.updateRow('원재료개별', 0, iv[0], { 3: '입고취소', 4: formatDateTime(), 5: `입고취소:${reason}` });
          }
          SheetsAPI.invalidateCache('원재료LOT');
          SheetsAPI.invalidateCache('원재료개별');
          toast(`입고 취소 완료: ${lotId}`, 'suc');
          Router.go('inventory');
        } catch (e) {
          toast('입고취소 실패: ' + e.message, 'err');
        } finally {
          hideLoading();
          releaseLock('cancelLotIntake');
        }
      });
    };
  } catch (e) {
    hideLoading();
    toast('로드 실패: ' + e.message, 'err');
  }
}
