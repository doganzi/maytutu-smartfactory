/**
 * restoreSavedStepData: 공정기록(records)에서 해당 stepNo의 저장 데이터를 DOM에 복원
 * — 이전 단계로 돌아갔을 때 입력값, 체크상태, CCP 결과 등이 유지되도록 함
 */
function restoreSavedStepData(stepNo, stepType, step) {
  try {
    const { records } = State.woExec;
    if (!records || records.length === 0) return;

    // 해당 stepNo의 기존 기록 찾기 (완료 우선, 임시저장 차선)
    const stepRecords = records.filter(r => String(r[1]) === String(stepNo));
    if (stepRecords.length === 0) return;

    // 완료 기록 우선, 없으면 임시저장
    const rec = stepRecords.find(r => r[10] === '완료') || stepRecords.find(r => r[10] === '임시저장') || stepRecords[0];
    const savedDataStr = rec[5] || ''; // stepData (col 5)
    if (!savedDataStr) return;

    let data;
    try {
      data = JSON.parse(savedDataStr);
    } catch (e) {
      console.warn(`[WO복원] stepNo=${stepNo} JSON 파싱 실패:`, e.message);
      return;
    }

    console.log(`[WO복원] stepNo=${stepNo}, type=${stepType}, status=${rec[10]}, data keys=${Object.keys(data).join(',')}`);

    if (stepType === 'input') {
      // 투입량 복원
      if (data.inputQty) {
        const qtyEl = $id(`input-qty-${stepNo}`);
        if (qtyEl) qtyEl.value = data.inputQty;
      }
      // 체크항목 복원
      if (Array.isArray(data.checks)) {
        data.checks.forEach((c, i) => {
          if (c.checked) {
            const chkEl = $id(`check-${stepNo}-${i}`);
            if (chkEl) { chkEl.classList.add('checked'); chkEl.textContent = '✓'; }
          }
        });
      }

      // ── 스캔된 LOT 리스트 UI 복원 (State._scannedLots에서) ──
      if (State.woExec._scannedLots?.[stepNo]?.length > 0) {
        renderScannedList(stepNo);
      }
      // DB 기록(usedLotIds)에서 스캔 데이터 복원 (State에 없을 때)
      else if (rec[4]) {
        const lotIds = rec[4].split(',').filter(Boolean);
        if (lotIds.length > 0 && (!State.woExec._scannedLots || !State.woExec._scannedLots[stepNo]?.length)) {
          // DB에 저장된 LOT ID로 State 복원 (비동기)
          (async () => {
            try {
              if (!State.woExec._scannedLots) State.woExec._scannedLots = {};
              if (!State.woExec._scannedLots[stepNo]) State.woExec._scannedLots[stepNo] = [];
              const indivs = await SheetsAPI.getAll('원재료개별');
              const lots = await SheetsAPI.getAll('원재료LOT');
              lotIds.forEach(qrId => {
                if (State.woExec._scannedLots[stepNo].find(s => s.qrId === qrId)) return;
                const indiv = indivs.find(r => r[0] === qrId);
                const lot = indiv ? lots.find(l => l[0] === indiv[1]) : null;
                State.woExec._scannedLots[stepNo].push({
                  qrId, lotId: indiv?.[1] || '', name: lot?.[2] || '',
                  remain: indiv?.[4] || '0', expiry: (lot?.[7]||'').substring(0,10), status: indiv?.[3] || ''
                });
              });
              renderScannedList(stepNo);
            } catch (e) { console.warn('[WO복원] LOT 복원 실패:', e.message); }
          })();
        }
      }
      // ── useType UI 복원 (스캔 리스트 유무와 무관) ──
      if (State.woExec._useType?.[stepNo]) {
        setUseType(stepNo, State.woExec._useType[stepNo]);
      }
    }

    else if (stepType === 'process') {
      // 체크항목 복원
      if (Array.isArray(data.checks)) {
        data.checks.forEach((c, i) => {
          if (c.checked) {
            const chkEl = $id(`check-${stepNo}-${i}`);
            if (chkEl) { chkEl.classList.add('checked'); chkEl.textContent = '✓'; }
          }
        });
      }
    }

    else if (stepType === 'pack') {
      if (data.packQty) {
        const el = $id(`pack-qty-${stepNo}`);
        if (el) el.value = data.packQty;
      }
      if (Array.isArray(data.samples)) {
        data.samples.forEach((s, i) => {
          if (s.weight) {
            const el = $id(`sample-wt-${stepNo}-${i + 1}`);
            if (el) el.value = s.weight;
          }
        });
      }
    }

    else if (stepType === 'seal') {
      if (data.sealQty) {
        const el = $id(`seal-qty-${stepNo}`);
        if (el) el.value = data.sealQty;
      }
      if (data.labelCheck) {
        const el = $id(`check-seal-${stepNo}-0`);
        if (el) { el.classList.add('checked'); el.textContent = '✓'; }
      }
      if (data.sealCheck) {
        const el = $id(`check-seal-${stepNo}-1`);
        if (el) { el.classList.add('checked'); el.textContent = '✓'; }
      }
      // 샘플 무게 복원
      if (data.samples) {
        data.samples.forEach((s, si) => {
          const wEl = $id(`seal-weight-${stepNo}-${si+1}`);
          if (wEl && s.weight) wEl.value = s.weight;
        });
      }
    }

    else if (stepType === 'inspect') {
      // CCP Step 1 — time
      if (data.step1Time) {
        const el = $id('ccp-time-1');
        if (el) el.value = data.step1Time;
      }
      // CCP Step 2 — Fe/SUS toggle 복원
      if (data.step2) {
        if (data.step2.fe?.result) ccpToggle('ccp2-fe', data.step2.fe.result, stepNo);
        if (data.step2.sus?.result) ccpToggle('ccp2-sus', data.step2.sus.result, stepNo);
      }
      // CCP Step 3
      if (data.step3) {
        if (data.step3.fe?.result) ccpToggle('ccp3-fe', data.step3.fe.result, stepNo);
        if (data.step3.sus?.result) ccpToggle('ccp3-sus', data.step3.sus.result, stepNo);
      }
      // CCP Step 4 — time
      if (data.step4Time) {
        const el = $id('ccp-time-4');
        if (el) { el.value = data.step4Time; ccpCalcStep5Time(stepNo); }
      }
      // CCP Step 5 — periodic records
      if (Array.isArray(data.step5) && data.step5.length > 0) {
        const container = $id('ccp5-records-' + stepNo);
        if (container) {
          // 기존 첫 번째 레코드 복원
          const firstRec = container.querySelector('.ccp5-record');
          if (firstRec && data.step5[0]?.result) {
            ccpToggle5(firstRec, data.step5[0].result, stepNo);
          }
          // 추가 레코드 생성 및 복원
          for (let i = 1; i < data.step5.length; i++) {
            addCCP5Record(String(stepNo));
            const allRecs = container.querySelectorAll('.ccp5-record');
            const newRec = allRecs[allRecs.length - 1];
            if (newRec && data.step5[i]?.result) {
              ccpToggle5(newRec, data.step5[i].result, stepNo);
            }
          }
        }
      }
      // CCP Step 6
      if (data.step6) {
        if (data.step6.fe?.result) ccpToggle('ccp6-fe', data.step6.fe.result, stepNo);
        if (data.step6.sus?.result) ccpToggle('ccp6-sus', data.step6.sus.result, stepNo);
      }
      // CCP total
      if (data.ccpTotal) {
        const el = $id('ccp-total');
        if (el) el.value = data.ccpTotal;
      }
    }

    else if (stepType === 'qr-label') {
      if (data.qrQty) {
        const el = $id(`qr-label-qty-${stepNo}`);
        if (el) el.value = data.qrQty;
      }
    }

    else if (stepType === 'store') {
      if (data.freezeStart) {
        const el = $id('freeze-start');
        if (el) el.value = data.freezeStart;
      }
    }

    // ── 사진 복원 (모든 stepType 공통) ──
    const savedPhotoUrls = rec[6] || '';
    if (savedPhotoUrls) {
      const urls = savedPhotoUrls.split(' | ').filter(u => u.trim());
      if (urls.length > 0) {
        restorePhotoThumbnails(stepNo, stepType, urls);
      }
    }

    // ── 인메모리 _pendingPhotos blob URL 복원 (아직 업로드되지 않은 사진) ──
    restorePendingPhotos(stepNo, stepType);

    // 복원 완료 로그
    console.log(`[WO복원] stepNo=${stepNo} 데이터 복원 완료 (사진 ${savedPhotoUrls ? savedPhotoUrls.split(' | ').length : 0}장)`);
  } catch (err) {
    console.error(`[WO복원] stepNo=${stepNo} 복원 중 오류:`, err);
    // 복원 실패해도 시스템은 정상 동작 — 빈 폼으로 표시됨
  }
}

/**
 * restorePendingPhotos: State._pendingPhotos에 남아있는 미업로드 파일의 blob URL을 DOM에 복원
 * — DOM 재렌더(goToStep, LiveSync 등) 후 사진 미리보기가 사라지는 문제 방지
 */
function restorePendingPhotos(stepNo, stepType) {
  const pendingPhotos = State.woExec?._pendingPhotos;
  if (!pendingPhotos) return;

  // 단일 preview 복원 헬퍼
  const fillPreview = (key, previewId) => {
    const files = pendingPhotos[key];
    if (!files || files.length === 0) return;
    const preview = $id(previewId);
    if (!preview || preview.innerHTML.trim()) return; // 이미 Drive URL 썸네일이 있으면 skip
    preview.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';
    files.forEach(f => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      img.style.cssText = 'width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-l)';
      preview.appendChild(img);
    });
    // photo-upload 컨테이너에 has-photo 클래스 추가
    const uploadEl = preview.closest('.photo-upload');
    if (uploadEl) uploadEl.classList.add('has-photo');
  };

  // stepType별 preview 요소 매핑
  if (stepType === 'pack') {
    for (let n = 1; n <= 3; n++) fillPreview(`${stepNo}-s${n}`, `photo-preview-${stepNo}-s${n}`);
  } else if (stepType === 'seal') {
    for (let n = 1; n <= 3; n++) fillPreview(`${stepNo}-seal${n}`, `photo-preview-${stepNo}-seal${n}`);
  } else if (stepType === 'inspect') {
    fillPreview(`${stepNo}-ccp7`, `photo-preview-${stepNo}-ccp7`);
  } else {
    fillPreview(String(stepNo), `photo-preview-${stepNo}`);
  }
}

/**
 * restorePhotoThumbnails: 저장된 Drive URL에서 사진 썸네일을 복원
 */
function restorePhotoThumbnails(stepNo, stepType, urls) {
  const extractFileId = (url) => {
    const m = url.match(/\/d\/([^/]+)\//);
    return m ? m[1] : null;
  };

  const createThumb = (url) => {
    const fileId = extractFileId(url);
    const img = document.createElement('img');
    img.src = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w128` : url;
    img.style.cssText = 'width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--suc);cursor:pointer';
    img.title = '저장된 사진 (터치하여 보기)';
    img.onclick = (e) => { e.stopPropagation(); window.open(url, '_blank'); };
    img.onerror = () => {
      img.style.cssText = 'width:64px;height:64px;border-radius:6px;border:1px solid var(--suc);display:flex;align-items:center;justify-content:center;background:#e8f5e9;font-size:10px;color:var(--suc)';
      img.outerHTML = `<div style="width:64px;height:64px;border-radius:6px;border:1px solid var(--suc);display:flex;align-items:center;justify-content:center;background:#e8f5e9;font-size:20px;cursor:pointer" title="저장된 사진" onclick="window.open('${url}','_blank')">📷✓</div>`;
    };
    return img;
  };

  const fillPreview = (previewId, thumbUrls) => {
    const preview = $id(previewId);
    if (!preview) return;
    preview.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';
    thumbUrls.forEach(u => preview.appendChild(createThumb(u)));
    // photo-upload 상위에 has-photo 표시
    preview.closest('.photo-upload')?.classList.add('has-photo');
  };

  if (stepType === 'input' || stepType === 'process' || stepType === 'store') {
    fillPreview(`photo-preview-${stepNo}`, urls);
  } else if (stepType === 'pack') {
    // 3개 샘플에 분배
    for (let n = 0; n < 3; n++) {
      if (urls[n]) fillPreview(`photo-preview-${stepNo}-s${n+1}`, [urls[n]]);
    }
    // 3개 초과 시 나머지는 마지막 샘플에
    if (urls.length > 3) fillPreview(`photo-preview-${stepNo}-s3`, urls.slice(2));
  } else if (stepType === 'seal') {
    for (let n = 0; n < 3; n++) {
      if (urls[n]) fillPreview(`photo-preview-${stepNo}-seal${n+1}`, [urls[n]]);
    }
    if (urls.length > 3) fillPreview(`photo-preview-${stepNo}-seal3`, urls.slice(2));
  } else if (stepType === 'inspect') {
    fillPreview(`photo-preview-${stepNo}-ccp7`, urls);
  }
}

// ── CCP 합격/불합격 토글 (Step 2,3,6 공용) ──
function ccpToggle(boxId, result, stepNo) {
  const box = $id(boxId);
  if (!box) return;
  const btns = box.querySelectorAll('button');
  const timeEl = $id(boxId + '-time');

  box.dataset.result = result;
  if (result === '합격') {
    btns[0].style.background = 'var(--suc)';
    btns[0].style.color = '#fff';
    btns[1].style.background = 'var(--gray-l)';
    btns[1].style.color = 'var(--txt)';
    box.style.borderColor = 'var(--suc)';
    // Auto-record time
    const now = new Date().toTimeString().substring(0, 5);
    if (timeEl) {
      timeEl.style.display = 'block';
      timeEl.querySelector('span').textContent = now;
      timeEl.dataset.time = now;
    }
  } else {
    btns[1].style.background = 'var(--err)';
    btns[1].style.color = '#fff';
    btns[0].style.background = 'var(--gray-l)';
    btns[0].style.color = 'var(--txt)';
    box.style.borderColor = 'var(--err)';
    // 불합격 — no time recorded
    if (timeEl) {
      timeEl.style.display = 'block';
      timeEl.querySelector('span').textContent = '불합격 — 시간 미기록';
      timeEl.dataset.time = '';
    }
  }
  validateStepInputs(stepNo);
}

// ── CCP Step5 합격/불합격 토글 ──
function ccpToggle5(recordEl, result, stepNo) {
  if (!recordEl) return;
  const btns = recordEl.querySelectorAll('button');
  recordEl.dataset.result = result;
  if (result === '합격') {
    btns[0].style.background = 'var(--suc)';
    btns[0].style.color = '#fff';
    btns[1].style.background = 'var(--gray-l)';
    btns[1].style.color = 'var(--txt)';
    recordEl.style.borderColor = 'var(--suc)';
  } else {
    btns[1].style.background = 'var(--err)';
    btns[1].style.color = '#fff';
    btns[0].style.background = 'var(--gray-l)';
    btns[0].style.color = 'var(--txt)';
    recordEl.style.borderColor = 'var(--err)';
  }
  validateStepInputs(stepNo);
}

// ── Step4 시간 변경 시 Step5 검증 시간 자동 계산 ──
function ccpCalcStep5Time(stepNo) {
  const t4 = $id('ccp-time-4')?.value;
  if (!t4) return;
  const container = $id('ccp5-records-' + stepNo);
  if (!container) return;
  const records = container.querySelectorAll('.ccp5-record');
  records.forEach((rec, i) => {
    const display = rec.querySelector('.ccp5-time-display');
    if (display) {
      const calcTime = addHoursToTime(t4, (i + 1) * 2);
      display.textContent = calcTime;
      display.dataset.time = calcTime;
    }
  });
}

// ── 시간 문자열에 N시간 더하기 ──
function addHoursToTime(timeStr, hours) {
  const [h, m] = timeStr.split(':').map(Number);
  const totalMin = h * 60 + m + hours * 60;
  const nh = Math.floor(totalMin / 60) % 24;
  const nm = totalMin % 60;
  return String(nh).padStart(2, '0') + ':' + String(nm).padStart(2, '0');
}

function addCCP5Record(stepNo) {
  const container = $id('ccp5-records-' + stepNo);
  if (!container) return;
  const count = container.querySelectorAll('.ccp5-record').length + 1;

  // Calculate time: Step4 start + (count * 2h)
  const t4 = $id('ccp-time-4')?.value;
  let calcTime = '';
  let calcDisplay = 'Step4 입력 대기...';
  if (t4) {
    calcTime = addHoursToTime(t4, count * 2);
    calcDisplay = calcTime;
  }

  const div = document.createElement('div');
  div.className = 'ccp5-record';
  div.dataset.result = '';
  div.style.cssText = 'border:1px solid var(--gray-l);border-radius:8px;padding:8px;margin-bottom:6px';
  div.innerHTML = `
    <div class="fs-11 fw-6 c-txt-l mb-4">검증 #${count}</div>
    <div class="row mb-8" style="gap:8px">
      <button class="btn btn-sm flex-1" style="padding:4px 6px;font-size:11px;background:var(--gray-l);color:var(--txt)" onclick="ccpToggle5(this.closest('.ccp5-record'),'합격',${stepNo})">합격</button>
      <button class="btn btn-sm flex-1" style="padding:4px 6px;font-size:11px;background:var(--gray-l);color:var(--txt)" onclick="ccpToggle5(this.closest('.ccp5-record'),'불합격',${stepNo})">불합격</button>
    </div>
    <div class="row" style="gap:8px;align-items:center">
      <span class="fs-12 c-txt-l">검사 시간:</span>
      <span class="ccp5-time-display fs-13 fw-6" style="color:var(--info)" data-time="${calcTime}">${calcDisplay}</span>
    </div>
  `;
  container.appendChild(div);
  toast(`검증 #${count} 추가됨 (예정: ${calcDisplay})`, 'suc');
}

// ── 공정 사진 수집 (File 객체 배열 리턴) ──
function collectStepPhotos(stepNo, stepType) {
  const files = [];
  const addFilesFrom = (inputEl) => {
    if (inputEl?.files) Array.from(inputEl.files).forEach(f => files.push(f));
  };

  if (stepType === 'input') {
    addFilesFrom($id(`photo-camera-${stepNo}`));
    addFilesFrom($id(`photo-gallery-${stepNo}`));
  } else if (stepType === 'process' || stepType === 'store') {
    const preview = $id(`photo-preview-${stepNo}`);
    if (preview) {
      const fileInput = preview.closest('.photo-upload')?.querySelector('input[type="file"]');
      addFilesFrom(fileInput);
    }
  } else if (stepType === 'pack') {
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-s${n}`);
      if (prev) {
        const fi = prev.closest('.photo-upload')?.querySelector('input[type="file"]');
        addFilesFrom(fi);
      }
    }
  } else if (stepType === 'seal') {
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-seal${n}`);
      if (prev) {
        const fi = prev.closest('.photo-upload')?.querySelector('input[type="file"]');
        addFilesFrom(fi);
      }
    }
  } else if (stepType === 'inspect') {
    const ccpPrev = $id(`photo-preview-${stepNo}-ccp7`);
    if (ccpPrev) {
      const fi = ccpPrev.closest('.photo-upload')?.querySelector('input[type="file"]');
      addFilesFrom(fi);
    }
  }

  // ── DOM file input이 비어있으면 State에 보관된 파일 사용 (단계 이동 후 복귀 시) ──
  if (files.length === 0 && State.woExec?._pendingPhotos) {
    // 단일 프리뷰 타입
    const singleKey = String(stepNo);
    if (State.woExec._pendingPhotos[singleKey]?.length > 0) {
      files.push(...State.woExec._pendingPhotos[singleKey]);
    }
    // 멀티 프리뷰 타입 (pack: s1~s3, seal: seal1~seal3, inspect: ccp7)
    if (stepType === 'pack') {
      for (let n = 1; n <= 3; n++) {
        const key = `${stepNo}-s${n}`;
        if (State.woExec._pendingPhotos[key]?.length > 0) files.push(...State.woExec._pendingPhotos[key]);
      }
    } else if (stepType === 'seal') {
      for (let n = 1; n <= 3; n++) {
        const key = `${stepNo}-seal${n}`;
        if (State.woExec._pendingPhotos[key]?.length > 0) files.push(...State.woExec._pendingPhotos[key]);
      }
    } else if (stepType === 'inspect') {
      const key = `${stepNo}-ccp7`;
      if (State.woExec._pendingPhotos[key]?.length > 0) files.push(...State.woExec._pendingPhotos[key]);
    }
  }
  return files;
}

// ── 공정 입력값 수집 (JSON string 리턴) ──
function collectStepData(stepNo, stepType, step) {
  const data = {};

  if (stepType === 'input') {
    data.inputQty = $id(`input-qty-${stepNo}`)?.value || '';
    data.targetQty = $id(`input-qty-${stepNo}`)?.dataset?.target || '';
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    data.checks = checks.map((c, i) => ({
      name: c.trim(),
      checked: $id(`check-${stepNo}-${i}`)?.textContent === '✓'
    }));
  }
  else if (stepType === 'process') {
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    const isMixing = (step[2]||'').includes('믹싱');
    if (isMixing) {
      if (!checks.includes('RPM 확인')) checks.push('RPM 확인');
      if (!checks.includes('믹싱 시간 확인')) checks.push('믹싱 시간 확인');
    }
    data.checks = checks.map((c, i) => ({
      name: c.trim(),
      checked: $id(`check-${stepNo}-${i}`)?.textContent === '✓'
    }));
  }
  else if (stepType === 'pack') {
    data.packQty = $id(`pack-qty-${stepNo}`)?.value || '';
    data.samples = [];
    for (let n = 1; n <= 3; n++) {
      data.samples.push({
        weight: $id(`sample-wt-${stepNo}-${n}`)?.value || ''
      });
    }
  }
  else if (stepType === 'seal') {
    data.sealQty = $id(`seal-qty-${stepNo}`)?.value || '';
    data.labelCheck = $id(`check-seal-${stepNo}-0`)?.textContent === '✓';
    data.sealCheck = $id(`check-seal-${stepNo}-1`)?.textContent === '✓';
    // 샘플별 무게 기록
    data.samples = [];
    for (let n = 1; n <= 3; n++) {
      const w = $id(`seal-weight-${stepNo}-${n}`)?.value || '';
      data.samples.push({ weight: w, photoKey: `seal${n}` });
    }
  }
  else if (stepType === 'inspect') {
    data.ccpTotal = $id('ccp-total')?.value || '';
    // Step 1 time
    data.step1Time = $id('ccp-time-1')?.value || '';
    // Step 2 results (Fe / SUS304)
    data.step2 = {
      fe: { result: $id('ccp2-fe')?.dataset?.result || '', time: $id('ccp2-fe-time')?.dataset?.time || '' },
      sus: { result: $id('ccp2-sus')?.dataset?.result || '', time: $id('ccp2-sus-time')?.dataset?.time || '' }
    };
    // Step 3 results (Fe / SUS304)
    data.step3 = {
      fe: { result: $id('ccp3-fe')?.dataset?.result || '', time: $id('ccp3-fe-time')?.dataset?.time || '' },
      sus: { result: $id('ccp3-sus')?.dataset?.result || '', time: $id('ccp3-sus-time')?.dataset?.time || '' }
    };
    // Step 4 time
    data.step4Time = $id('ccp-time-4')?.value || '';
    // Step 5 periodic records
    const step5Container = document.getElementById('ccp5-records-' + stepNo);
    data.step5 = [];
    if (step5Container) {
      step5Container.querySelectorAll('.ccp5-record').forEach((rec, i) => {
        const timeDisp = rec.querySelector('.ccp5-time-display');
        data.step5.push({
          num: i + 1,
          result: rec.dataset?.result || '',
          time: timeDisp?.dataset?.time || ''
        });
      });
    }
    // Step 6 results (Fe / SUS304)
    data.step6 = {
      fe: { result: $id('ccp6-fe')?.dataset?.result || '', time: $id('ccp6-fe-time')?.dataset?.time || '' },
      sus: { result: $id('ccp6-sus')?.dataset?.result || '', time: $id('ccp6-sus-time')?.dataset?.time || '' }
    };
  }
  else if (stepType === 'qr-label') {
    data.qrQty = $id(`qr-label-qty-${stepNo}`)?.value || '';
  }
  else if (stepType === 'store') {
    data.freezeStart = $id('freeze-start')?.value || '';
  }

  return JSON.stringify(data);
}

// ── 사진 일괄 업로드 → URL 배열 리턴 ──
async function uploadStepPhotos(files) {
  if (!files || files.length === 0) return '';
  const urls = [];
  let failCount = 0;
  for (const file of files) {
    try {
      const url = await DriveAPI.uploadPhoto(file);
      if (url) urls.push(url);
    } catch (e) {
      failCount++;
      console.error('Photo upload failed:', e);
    }
  }
  if (failCount > 0 && urls.length === 0) {
    toast(`⚠️ 사진 ${failCount}장 업로드 실패. 인증이 만료되었을 수 있습니다.`, 'err', 4000);
  } else if (failCount > 0) {
    toast(`⚠️ 사진 ${failCount}장 업로드 실패 (${urls.length}장 성공)`, 'warn', 3000);
  }
  return urls.join(' | ');
}

// Helper functions for WO execution
function toggleCheck(el) {
  el.classList.toggle('checked');
  el.textContent = el.classList.contains('checked') ? '✓' : '';
}

function previewStepPhoto(input, stepNo) {
  const preview = $id(`photo-preview-${stepNo}`);
  if (!preview) return;
  preview.innerHTML = '';
  preview.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px';

  // 파일을 State에 보관 (단계 이동 후에도 유지)
  if (!State.woExec._pendingPhotos) State.woExec._pendingPhotos = {};
  if (!State.woExec._pendingPhotos[stepNo]) State.woExec._pendingPhotos[stepNo] = [];
  Array.from(input.files).forEach(f => {
    // 중복 방지
    if (!State.woExec._pendingPhotos[stepNo].some(p => p.name === f.name && p.size === f.size)) {
      State.woExec._pendingPhotos[stepNo].push(f);
    }
  });

  // 모든 보관된 사진 프리뷰 표시
  State.woExec._pendingPhotos[stepNo].forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.style.cssText = 'width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-l)';
    preview.appendChild(img);
  });
  // Change upload appearance
  input.closest('.photo-upload')?.classList.add('has-photo');
}

async function previewQRLabels(stepNo) {
  const qty = parseInt($id(`qr-label-qty-${stepNo}`)?.value) || 0;
  if (qty <= 0) { toast('라벨 수량을 입력하세요', 'err'); return; }
  if (qty > 200) { toast('라벨 수량이 너무 많습니다 (최대 200매)', 'err'); return; }

  const { woId, wo } = State.woExec;
  const productName = wo ? wo[4] : '';
  const fgItemCode = wo ? (wo[3] || 'FG002') : 'FG002';

  // 생산일 = WO 시작시간 기준 (실제 제조일)
  const prodDateStr = wo ? (wo[9] || formatDate()) : formatDate();
  const prodDate = new Date(prodDateStr);
  const productionDate = formatDate(prodDate);

  // 소비기한 = 생산일 + 6개월
  const expDate = new Date(prodDate);
  expDate.setMonth(expDate.getMonth() + 6);
  const expStr = formatDate(expDate);

  showLoading();

  try {
    // FG LOT ID 사전 채번 — approveWO에서 동일 ID 재사용됨
    // ★ 동시 채번 race condition 차단을 위해 채번 직후 placeholder row 즉시 적재 (atomic claim).
    //   다른 WO가 같은 시점에 generateLotId 를 호출해도 이 placeholder 를 보고 다음 일련번호로 발급.
    let fgLotId = wo ? wo[14] : '';
    if (!fgLotId || !fgLotId.startsWith('FG-')) {
      fgLotId = await generateLotId('FG', fgItemCode, expStr, '완제품LOT', 0, productionDate);
      // 채번 즉시 placeholder row 적재 — 다른 동시 호출이 즉시 인지 가능
      try {
        SheetsAPI.invalidateCache('완제품LOT');
        const existing = (await SheetsAPI.getAll('완제품LOT', false)).find(l => l[0] === fgLotId);
        if (!existing) {
          await SheetsAPI.append('완제품LOT', [
            fgLotId, fgItemCode, productName, '0', '5kg',
            productionDate, expStr, woId, '0', '채번예약', '0', '냉동 -18°C'
          ]);
          console.log(`[QR라벨] placeholder row 적재 완료: ${fgLotId}`);
        } else {
          console.log(`[QR라벨] placeholder row 이미 존재: ${fgLotId} (status=${existing[9]||'-'})`);
        }
      } catch (e) {
        console.warn('[QR라벨] placeholder 적재 실패 (계속 진행):', e.message);
      }
      // WO에 ID 저장 — 승인 시 이 ID 의 placeholder row 를 갱신
      await SheetsAPI.updateCell('작업지시서', 0, woId, 14, fgLotId);
      if (wo) wo[14] = fgLotId;
      console.log(`[QR라벨] FG LOT ID 사전 채번 및 저장: ${fgLotId}`);
    } else {
      console.log(`[QR라벨] 기존 FG LOT ID 재사용: ${fgLotId}`);
    }

    // FG LOT ID 기반 개별 QR 라벨 생성 — approveWO와 동일 형식
    const labels = [];
    for (let i = 1; i <= qty; i++) {
      const indivId = `${fgLotId}-${String(i).padStart(2, '0')}`;
      labels.push({
        indivId: indivId,
        itemName: productName,
        lotId: fgLotId,
        date: `제조일자: ${productionDate}`,
        exp: `소비기한: ${expStr}`,
        storage: '보관: 냉동 -18°C 이하',
        company: '',
      });
    }

    hideLoading();

    // renderLabelCards 사용 (기존 라벨 시스템과 동일한 QR 미리보기)
    applyPrintCSS();
    renderLabelCards(labels);

    // 인쇄 버튼 표시
    const btnPrint = $id(`btn-wo-print-${stepNo}`);
    if (btnPrint) btnPrint.style.display = '';

    toast(`QR 라벨 ${qty}매 미리보기 생성 완료 (${fgLotId})`, 'suc');
  } catch (e) {
    hideLoading();
    console.error('[QR라벨] 미리보기 생성 실패:', e);
    toast('라벨 생성 실패: ' + e.message, 'err');
  }
}

function goToStep(idx) {
  if (idx < 0 || idx >= State.woExec.steps.length) return;
  const { maxStep, currentStep } = State.woExec;
  // maxStep 이하는 자유 이동, maxStep 초과는 불가 (완료되지 않은 미래 공정)
  if (idx > maxStep) {
    toast('해당 공정은 아직 완료되지 않았습니다. 순서대로 진행해주세요.', 'err', 3000);
    return;
  }
  console.log(`[WO실행] goToStep: ${currentStep} → ${idx} (maxStep=${maxStep})`);
  State.woExec.currentStep = idx;
  renderWOExecute();
}

async function tempSaveWO() {
  try {
    showLoading();
    const { woId, currentStep, steps } = State.woExec;
    const step = steps[currentStep];
    const stepNo = parseInt(step[1]);
    const stepType = step[3] || 'input';

    // 사진 업로드
    const photos = collectStepPhotos(stepNo, stepType);
    let photoUrls = '';
    if (photos.length > 0) {
      toast('사진 업로드 중...', 'info', 2000);
      photoUrls = await uploadStepPhotos(photos);
    }

    // 새 사진이 없으면 기존 저장된 사진 URL 유지
    const allRecords = await SheetsAPI.getAll('공정기록').catch(() => []);
    const existingIdx = allRecords.findIndex(r => r[0] === woId && r[1] === String(stepNo));
    if (!photoUrls && existingIdx >= 0) {
      photoUrls = allRecords[existingIdx][6] || '';
    }

    // 입력값 수집
    const stepData = collectStepData(stepNo, stepType, step);
    const usedLotIds = (stepType === 'input') ?
      (State.woExec._scannedLots?.[stepNo] || []).map(s => s.lotId).filter(Boolean).join(',') : '';

    // 공정기록 임시 저장 (기존 기록 있으면 덮어쓰기)
    // ⚠️ 이미 '완료'된 기록은 상태를 유지 (다운그레이드 방지)
    const existingStatus = existingIdx >= 0 ? (allRecords[existingIdx][10] || '') : '';
    const saveStatus = existingStatus === '완료' ? '완료' : '임시저장';
    if (existingStatus === '완료') {
      console.log(`[WO실행] 임시저장: stepNo=${stepNo} 이미 완료된 공정 — 데이터만 갱신, 상태 유지`);
    }
    if (existingIdx >= 0) {
      await SheetsAPI.updateRowByIndex('공정기록', existingIdx + 2, {
        0: woId, 1: String(stepNo), 2: step[2], 3: stepType,
        4: usedLotIds, 5: stepData, 6: photoUrls,
        7: '', 8: '', 9: '', 10: saveStatus,
        11: formatDateTime(), 12: State.user?.email
      });
    } else {
      await SheetsAPI.append('공정기록', [
        woId, String(stepNo), step[2], stepType,
        usedLotIds, stepData, photoUrls,
        '', '', '', '임시저장',
        formatDateTime(), State.user?.email
      ]);
    }
    SheetsAPI.invalidateCache('공정기록');

    // lastSavedStep: 절대 감소하지 않도록 방어 — maxStep과 현재 위치 중 큰 값만 기록
    const { maxStep } = State.woExec;
    const newLastSaved = Math.max(currentStep, maxStep);
    await SheetsAPI.updateCell('작업지시서', 0, woId, 13, String(newLastSaved));
    console.log(`[WO실행] 임시저장: step=${currentStep}, maxStep=${maxStep}, lastSavedStep=${newLastSaved}`);

    // records 캐시 갱신 — 이후 단계 이동 시 최신 데이터 복원 가능하도록
    try {
      const freshRecords = await SheetsAPI.getAll('공정기록', false);
      State.woExec.records = freshRecords.filter(r => r[0] === woId);
    } catch (e) { console.warn('[WO실행] records 갱신 실패:', e.message); }

    const statusMsg = saveStatus === '완료' ? ' (완료 상태 유지)' : '';
    toast(`저장 완료${statusMsg}${photos.length > 0 ? ` (사진 ${photos.length}장 업로드됨)` : ''}`, 'suc');
  } catch (e) {
    toast('임시저장 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
  }
}

async function handleCompleteStep(isFinal = false) {
  const step = State.woExec?.steps?.[State.woExec?.currentStep];
  if (!step) return;
  const stepNo = parseInt(step[1]);
  const stepType = step[3] || 'input';
  const isWater = (step[4] || '') === 'RM002';

  const missing = [];

  if (stepType === 'input') {
    const qtyInput = $id(`input-qty-${stepNo}`);
    const qtyVal = parseFloat(qtyInput?.value);
    if (!qtyVal || qtyVal <= 0) missing.push('실제 투입량');

    // ±5% 범위 검증
    if (qtyVal > 0 && qtyInput?.dataset?.target) {
      const targetVal = parseFloat(qtyInput.dataset.target);
      if (targetVal > 0) {
        const lo = targetVal * 0.95, hi = targetVal * 1.05;
        if (qtyVal < lo || qtyVal > hi) {
          missing.push(`투입량 범위 초과 (목표 ${targetVal}kg 의 ±5%: ${lo.toFixed(2)}~${hi.toFixed(2)}kg, 입력값 ${qtyVal}kg)`);
        }
      }
    }

    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) missing.push('저울 사진');

    const checks = (step[6] || '').split(',').filter(c => c.trim());
    let unchecked = 0;
    checks.forEach((_, i) => {
      const cb = $id(`check-${stepNo}-${i}`);
      if (cb && cb.textContent !== '✓') unchecked++;
    });
    if (unchecked > 0) missing.push(`체크항목 (${unchecked}건 미체크)`);

    if (!isWater) {
      const scanned = State.woExec._scannedLots?.[stepNo]?.length || 0;
      if (scanned === 0) missing.push('QR 스캔 (원재료 LOT)');
    }
  }

  if (stepType === 'process') {
    // 체크항목 전부 체크 확인
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    const isMixing = (step[2]||'').includes('믹싱');
    const allChecks = [...checks];
    if (isMixing) {
      if (!allChecks.includes('RPM 확인')) allChecks.push('RPM 확인');
      if (!allChecks.includes('믹싱 시간 확인')) allChecks.push('믹싱 시간 확인');
    }
    let unchecked = 0;
    allChecks.forEach((_, i) => {
      const cb = $id(`check-${stepNo}-${i}`);
      if (cb && cb.textContent !== '✓') unchecked++;
    });
    if (unchecked > 0) missing.push(`체크항목 (${unchecked}건 미체크)`);
    // 사진 필수
    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) missing.push('공정 사진');
  }

  if (stepType === 'inspect') {
    // CCP 금속검출 — 전체 검증
    if (!$id('ccp-time-1')?.value) missing.push('Step1 시작 시간');
    // Step 2 합격 필수
    if ($id('ccp2-fe')?.dataset?.result !== '합격') missing.push('Step2 Fe 시편 합격');
    if ($id('ccp2-sus')?.dataset?.result !== '합격') missing.push('Step2 SUS304 시편 합격');
    // Step 3 합격 필수
    if ($id('ccp3-fe')?.dataset?.result !== '합격') missing.push('Step3 Fe 초회검증 합격');
    if ($id('ccp3-sus')?.dataset?.result !== '합격') missing.push('Step3 SUS304 초회검증 합격');
    // Step 4 시간
    if (!$id('ccp-time-4')?.value) missing.push('Step4 시작 시간');
    // Step 5 — 모든 기록 합격 필수
    const ccp5Container = document.getElementById('ccp5-records-' + stepNo);
    if (ccp5Container) {
      ccp5Container.querySelectorAll('.ccp5-record').forEach((rec, i) => {
        if (rec.dataset?.result !== '합격') missing.push(`Step5 검증 #${i+1} 합격`);
      });
    }
    // Step 6 합격 필수
    if ($id('ccp6-fe')?.dataset?.result !== '합격') missing.push('Step6 Fe 최종 합격');
    if ($id('ccp6-sus')?.dataset?.result !== '합격') missing.push('Step6 SUS304 최종 합격');
    // Step 7 수량 + 사진
    const ccpTotal = parseInt($id('ccp-total')?.value);
    if (!ccpTotal || ccpTotal <= 0) missing.push('총 검사 수량');
    const ccpPhoto = $id(`photo-preview-${stepNo}-ccp7`);
    if (!ccpPhoto || !ccpPhoto.innerHTML.trim()) missing.push('검출기 기계 화면 사진');
  }

  if (stepType === 'pack') {
    // 실제 생산 수량
    const packQty = parseInt($id(`pack-qty-${stepNo}`)?.value);
    if (!packQty || packQty <= 0) missing.push('실제 생산 수량');
    // 3개 샘플 사진
    let photoCount = 0;
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-s${n}`);
      if (prev && prev.innerHTML.trim()) photoCount++;
    }
    if (photoCount < 3) missing.push(`샘플 사진 (${3-photoCount}건 미촬영)`);
    // 3개 샘플 무게
    let weightCount = 0;
    for (let n = 1; n <= 3; n++) {
      const wt = parseFloat($id(`sample-wt-${stepNo}-${n}`)?.value);
      if (wt && wt > 0) weightCount++;
    }
    if (weightCount < 3) missing.push(`샘플 무게 (${3-weightCount}건 미입력)`);
  }

  if (stepType === 'seal') {
    // 밀봉 체크항목 확인
    const sealCheck0 = $id(`check-seal-${stepNo}-0`);
    const sealCheck1 = $id(`check-seal-${stepNo}-1`);
    if (!sealCheck0 || sealCheck0.textContent !== '✓') missing.push('제품 라벨 부착 확인');
    if (!sealCheck1 || sealCheck1.textContent !== '✓') missing.push('밀봉 상태 확인');
    // 사진 확인
    let photoCount = 0;
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-seal${n}`);
      if (prev && prev.innerHTML.trim()) photoCount++;
    }
    if (photoCount < 3) missing.push(`샘플 사진 (${3-photoCount}건 미촬영)`);
    // 샘플 무게 확인
    let sealWeightCount = 0;
    for (let n = 1; n <= 3; n++) {
      const wt = parseFloat($id(`seal-weight-${stepNo}-${n}`)?.value);
      if (wt && wt > 0) sealWeightCount++;
    }
    if (sealWeightCount < 3) missing.push(`샘플 무게 (${3-sealWeightCount}건 미입력)`);
    // 수량 확인
    const sealQty = parseInt($id(`seal-qty-${stepNo}`)?.value);
    if (!sealQty || sealQty <= 0) missing.push('최종 완제품 수량');
    else State.woExec.packCount = sealQty; // 최종 재고 인정 수량 반영
  }

  if (stepType === 'qr-label') {
    const qrQty = parseInt($id(`qr-label-qty-${stepNo}`)?.value);
    if (!qrQty || qrQty <= 0) missing.push('QR 라벨 수량');
  }

  if (stepType === 'store') {
    // 냉동고 온도계 사진 필수
    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) missing.push('냉동고 온도계 사진');
  }

  if (missing.length > 0) {
    toast('미입력 항목:\n• ' + missing.join('\n• '), 'err', 4000);
    return;
  }

  if (isFinal) {
    // 전체 완료 전 이전 공정 기록 사전 검증
    try {
      showLoading();
      const allRecs = await SheetsAPI.getAll('공정기록').catch(() => []);
      const woRecs = allRecs.filter(r => r[0] === State.woExec.woId);
      const incompSteps = [];
      for (let i = 0; i < State.woExec.steps.length - 1; i++) {
        const sNo = State.woExec.steps[i][1];
        const rec = woRecs.find(r => r[1] === String(sNo) && r[10] === '완료');
        if (!rec) incompSteps.push(`${sNo}. ${State.woExec.steps[i][2] || ''}`);
      }
      hideLoading();
      if (incompSteps.length > 0) {
        toast(`⚠️ 이전 공정 ${incompSteps.length}건 미완료:\n• ${incompSteps.join('\n• ')}\n\n모든 공정을 순서대로 완료해주세요.`, 'err', 6000);
        return;
      }
    } catch (e) {
      hideLoading();
    }
    submitForApproval();
  } else {
    completeStep();
  }
}

async function completeStep() {
  if (!acquireLock('completeStep')) return;
  const { woId, steps, currentStep } = State.woExec;
  const step = steps[currentStep];
  const stepNo = parseInt(step[1]);
  const stepType = step[3] || 'input';

  try {
    showLoading();

    // ⚠️ 이전 공정 완료 여부 사전 검증 (건너뛰기 방지)
    if (currentStep > 0) {
      const allRecs = await SheetsAPI.getAll('공정기록').catch(() => []);
      const woRecs = allRecs.filter(r => r[0] === woId);
      const incompSteps = [];
      for (let i = 0; i < currentStep; i++) {
        const sNo = steps[i][1];
        const rec = woRecs.find(r => r[1] === String(sNo) && r[10] === '완료');
        if (!rec) incompSteps.push(`${sNo}. ${steps[i][2] || ''}`);
      }
      if (incompSteps.length > 0) {
        hideLoading();
        releaseLock('completeStep');
        toast(`⚠️ 이전 공정 ${incompSteps.length}건 미완료:\n• ${incompSteps.join('\n• ')}\n\n이전 공정을 먼저 완료해주세요.`, 'err', 5000);
        return;
      }
    }

    // input step: 원재료 재고 차감 (스캔된 LOT) — 개별 항목별 전량/잔여분 처리
    let usedLotIds = '';
    if (stepType === 'input') {
      const scannedItems = State.woExec._scannedLots?.[stepNo] || [];
      const itemUseTypes = State.woExec._itemUseType?.[stepNo] || {};
      const qtyInput = $id(`input-qty-${stepNo}`);
      const consumedQty = parseFloat(qtyInput?.value) || 0;

      // ── 서버 사이드 상태 재검증: 이미 소진/폐기된 재료 중복 투입 차단 ──
      SheetsAPI.invalidateCache('원재료개별');
      const freshRmIndivs = await SheetsAPI.getAll('원재료개별', false);
      const alreadyUsed = scannedItems.filter(item => {
        const fresh = freshRmIndivs.find(iv => iv[0] === item.qrId);
        return fresh && ['소진','폐기','입고취소'].includes(fresh[3]);
      });
      if (alreadyUsed.length > 0) {
        const usedIds = alreadyUsed.map(i => i.qrId).join(', ');
        toast(`⚠ 이미 사용/폐기/입고취소된 원재료가 포함되어 있습니다:\n${usedIds}\n\n해당 항목을 제거 후 다시 시도하세요.`, 'err', 6000);
        hideLoading(); releaseLock('completeStep'); return;
      }

      // ① 개별 항목별 상태 업데이트 — 전량:'소진', 잔여분:'잔여'(활성 유지)
      await Promise.all(scannedItems.map((item, idx) => {
        const ut = itemUseTypes[idx] || 'full';
        const newStatus = ut === 'partial' ? '잔여' : '소진';
        return SheetsAPI.updateRow('원재료개별', 0, item.qrId, { 3: newStatus });
      }));

      // ② LOT별 그룹핑 → 전량 소진 항목만 카운트하여 잔량 차감
      const lotGroups = {};
      scannedItems.forEach((item, idx) => {
        const ut = itemUseTypes[idx] || 'full';
        if (item.lotId && ut === 'full') {
          if (!lotGroups[item.lotId]) lotGroups[item.lotId] = 0;
          lotGroups[item.lotId]++;
        }
      });

      SheetsAPI.invalidateCache('원재료LOT');
      SheetsAPI.invalidateCache('원재료개별');
      const lots = await SheetsAPI.getAll('원재료LOT', false);
      const allIndivs = await SheetsAPI.getAll('원재료개별');

      for (const [lotId, count] of Object.entries(lotGroups)) {
        const lot = lots.find(l => l[0] === lotId);
        if (!lot) continue;
        const totalQty = parseFloat(lot[4]) || 0;
        // perUnit: 개별 항목의 실제 수량 우선, 없으면 LOT 총량/원래개수 사용
        const sampleIndiv = allIndivs.find(iv => iv[1] === lotId);
        const perUnit = sampleIndiv ? (parseFloat(sampleIndiv[4]) || totalQty / (parseInt(lot[10]) || 1))
                                    : totalQty / (parseInt(lot[10]) || 1);
        // 활성 개별 수 기준으로 잔량 직접 산출 (누적 오차 방지)
        const activeIndivs = allIndivs.filter(iv => iv[1] === lotId && !['폐기','소진','입고취소'].includes(iv[3]));
        const newRemain = Math.round(activeIndivs.length * perUnit * 100) / 100;
        const prevRemain = parseFloat(lot[8]) || 0;
        const newStatus = activeIndivs.length === 0 ? '소진' : '사용중';
        await SheetsAPI.updateRow('원재료LOT', 0, lotId, {
          8: String(newRemain),
          9: newStatus,
        });
        console.log(`[재고차감] ${lotId}: -${count}개(${(perUnit*count).toFixed(2)}kg), 잔량 ${prevRemain}→${newRemain}, 활성 ${activeIndivs.length}개, 상태 ${newStatus}`);
      }
      // 잔여분 항목도 기록에 포함 (개별 QR ID로 저장)
      usedLotIds = scannedItems.map(s => s.qrId).filter(Boolean).join(',');
    }

    // qr-label step: QR 라벨 수량 저장
    if (stepType === 'qr-label') {
      const qrQty = parseInt($id(`qr-label-qty-${stepNo}`)?.value) || State.woExec.packCount || 0;
      if (qrQty > 0) {
        await SheetsAPI.updateCell('작업지시서', 0, woId, 7, String(qrQty));
        State.woExec.packCount = qrQty;
      }
    }

    // seal step: 최종 완제품 수량 반영
    if (stepType === 'seal') {
      const sealQty = parseInt($id(`seal-qty-${stepNo}`)?.value);
      if (sealQty > 0) {
        await SheetsAPI.updateCell('작업지시서', 0, woId, 7, String(sealQty));
        State.woExec.packCount = sealQty;
      }
    }

    // 사진 업로드
    const photos = collectStepPhotos(stepNo, stepType);
    let photoUrls = '';
    if (photos.length > 0) {
      toast('사진 업로드 중...', 'info', 2000);
      photoUrls = await uploadStepPhotos(photos);
    }

    // 새 사진이 없으면 기존 저장된 사진 URL 유지
    const allRecords = await SheetsAPI.getAll('공정기록').catch(() => []);
    const existingIdx = allRecords.findIndex(r => r[0] === woId && r[1] === String(stepNo));
    if (!photoUrls && existingIdx >= 0) {
      photoUrls = allRecords[existingIdx][6] || '';
    }

    // 입력값 수집
    const stepData = collectStepData(stepNo, stepType, step);

    // 기존 임시저장 기록 있으면 덮어쓰기, 없으면 새로 추가
    if (existingIdx >= 0) {
      await SheetsAPI.updateRowByIndex('공정기록', existingIdx + 2, {
        0: woId, 1: step[1], 2: step[2], 3: step[3],
        4: usedLotIds, 5: stepData, 6: photoUrls,
        7: '', 8: '', 9: '', 10: '완료',
        11: formatDateTime(), 12: State.user?.email
      });
    } else {
      await SheetsAPI.append('공정기록', [
        woId, step[1], step[2], step[3],
        usedLotIds, stepData, photoUrls,
        '', '', '', '완료',
        formatDateTime(), State.user?.email
      ]);
    }
    SheetsAPI.invalidateCache('공정기록');

    // Update lastSavedStep — 절대 감소하지 않음 (maxStep 보호)
    const prevMaxStep = State.woExec.maxStep || 0;
    const newMaxStep = Math.max(currentStep + 1, prevMaxStep);
    State.woExec.maxStep = newMaxStep;
    await SheetsAPI.updateCell('작업지시서', 0, woId, 13, String(newMaxStep));
    console.log(`[WO실행] completeStep: step=${currentStep}, prevMaxStep=${prevMaxStep}, newMaxStep=${newMaxStep}`);

    // 업로드 완료된 사진 State에서 제거 (재업로드 방지)
    if (State.woExec._pendingPhotos) {
      delete State.woExec._pendingPhotos[stepNo];
      if (stepType === 'pack') { for (let n=1;n<=3;n++) delete State.woExec._pendingPhotos[`${stepNo}-s${n}`]; }
      if (stepType === 'seal') { for (let n=1;n<=3;n++) delete State.woExec._pendingPhotos[`${stepNo}-seal${n}`]; }
      if (stepType === 'inspect') delete State.woExec._pendingPhotos[`${stepNo}-ccp7`];
    }

    // records 캐시 갱신 — 이후 단계 이동 시 최신 데이터 복원 가능하도록
    try {
      const freshRecords = await SheetsAPI.getAll('공정기록', false);
      State.woExec.records = freshRecords.filter(r => r[0] === woId);
    } catch (e) { console.warn('[WO실행] records 갱신 실패:', e.message); }

    // 다음 공정으로 이동
    State.woExec.currentStep = currentStep + 1;
    hideLoading();
    renderWOExecute();
  } catch (e) {
    hideLoading();
    toast('공정 기록 실패: ' + e.message, 'err');
  } finally {
    releaseLock('completeStep');
  }
}

async function submitForApproval() {
  confirm('냉동보관 시작', '모든 공정이 완료되었습니다. 냉동보관을 시작하시겠습니까?\n12시간 이후 관리자가 출하승인하면 완제품 재고로 등록됩니다.', async () => {
    if (!acquireLock('submitForApproval')) return;
    try {
      showLoading();
      const { woId, steps } = State.woExec;

      // ── 전체 공정기록 완료 검증 ──
      const allRecords = await SheetsAPI.getAll('공정기록').catch(() => []);
      const woRecords = allRecords.filter(r => r[0] === woId);
      const missingSteps = [];
      // 마지막 스텝(현재 스텝)은 아래에서 저장하므로 제외하고 검증
      for (let i = 0; i < steps.length - 1; i++) {
        const sNo = steps[i][1]; // stepNo (string)
        const rec = woRecords.find(r => r[1] === String(sNo) && r[10] === '완료');
        if (!rec) missingSteps.push(`${sNo}. ${steps[i][2] || ''}`);
      }
      if (missingSteps.length > 0) {
        hideLoading();
        toast(`⚠️ 미완료 공정이 있습니다:\n• ${missingSteps.join('\n• ')}\n\n모든 공정을 순서대로 완료해주세요.`, 'err', 6000);
        return;
      }

      const freezeStart = formatDateTime();

      // Save last step record with photos and data
      const step = steps[State.woExec.currentStep];
      const stepNo = parseInt(step[1]);
      const stepType = step[3] || 'store';
      const photos = collectStepPhotos(stepNo, stepType);
      let photoUrls = '';
      if (photos.length > 0) {
        toast('사진 업로드 중...', 'info', 2000);
        photoUrls = await uploadStepPhotos(photos);
      }
      // 새 사진이 없으면 기존 저장된 사진 URL 유지
      const existingIdx = allRecords.findIndex(r => r[0] === woId && r[1] === String(stepNo));
      if (!photoUrls && existingIdx >= 0) {
        photoUrls = allRecords[existingIdx][6] || '';
      }
      const stepData = collectStepData(stepNo, stepType, step);

      if (existingIdx >= 0) {
        await SheetsAPI.updateRowByIndex('공정기록', existingIdx + 2, {
          0: woId, 1: step[1], 2: step[2], 3: step[3],
          4: '', 5: stepData, 6: photoUrls,
          7: '', 8: '', 9: '', 10: '완료',
          11: formatDateTime(), 12: State.user?.email
        });
      } else {
        await SheetsAPI.append('공정기록', [
          woId, step[1], step[2], step[3],
          '', stepData, photoUrls,
          '', '', '', '완료',
          formatDateTime(), State.user?.email
        ]);
      }
      SheetsAPI.invalidateCache('공정기록');

      // Update WO status → 냉동보관중
      await SheetsAPI.updateRow('작업지시서', 0, woId, {
        10: formatDateTime(),   // endTime
        11: freezeStart,        // freezeStartTime
        12: '냉동보관중',        // status
        13: String(State.woExec.steps.length), // lastSavedStep
      });

      toast('냉동보관이 시작되었습니다. 12시간 후 출하승인 가능합니다.', 'suc');
      Router.go('production');
    } catch (e) {
      toast('냉동보관 시작 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
      releaseLock('submitForApproval');
    }
  });
}

// ── 승인요청 취소 ──

  confirm('승인요청 취소', `${woId}의 승인요청을 취소하시겠습니까?\n작업은 마지막 공정 상태로 복원됩니다.`, async () => {

// QR scan for material input during WO execution
let _qrScannerInstance = null;

function startQRCamera(stepNo, rmCode) {
  const cameraArea = $id(`qr-camera-area-${stepNo}`);
  if (!cameraArea) return;

  // Stop previous instance
  if (_qrScannerInstance) { try { _qrScannerInstance.stop(); } catch(e){} _qrScannerInstance = null; }

  cameraArea.innerHTML = '';
  cameraArea.style.minHeight = '250px';
  cameraArea.style.background = '#000';
  cameraArea.id = `qr-camera-area-${stepNo}`;

  if (typeof Html5Qrcode === 'undefined') {
    cameraArea.innerHTML = '<div class="fs-12 c-err" style="text-align:center;padding:20px">QR 스캐너를 불러올 수 없습니다</div>';
    return;
  }

  try {
    _qrScannerInstance = new Html5Qrcode(`qr-camera-area-${stepNo}`);
    _qrScannerInstance.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 },
      (decodedText) => {
        // QR 인식 성공 → 카메라 멈추고 조회
        try { _qrScannerInstance.stop(); } catch(e){}
        cameraArea.innerHTML = '<div class="fs-12 c-suc" style="text-align:center;padding:12px">✅ QR 인식 완료</div>';
        cameraArea.style.minHeight = '';
        cameraArea.style.background = '';
        processScannedQR(stepNo, rmCode, decodedText);
      },
      () => {} // scan miss — ignore
    ).catch((err) => {
      cameraArea.style.minHeight = '';
      cameraArea.style.background = '';
      cameraArea.innerHTML = '<div class="fs-12 c-err" style="text-align:center;padding:12px">카메라 접근이 거부되었습니다.<br>브라우저 설정에서 카메라 권한을 허용해주세요.</div>';
    });
  } catch(e) {
    cameraArea.innerHTML = '<div class="fs-12 c-err" style="text-align:center;padding:12px">카메라 초기화 실패</div>';
  }
}

async function processScannedQR(stepNo, rmCode, qrId) {
  if (!qrId) return;

  try {
    showLoading();
    SheetsAPI.invalidateCache('원재료개별');
    const indivs = await SheetsAPI.getAll('원재료개별');
    const indiv = indivs.find(r => r[0] === qrId);
    if (!indiv) { toast('해당 QR을 찾을 수 없습니다', 'err'); hideLoading(); return; }

    // 소진/폐기 상태는 스캔 거부, 잔여 상태는 재사용 허용
    const indivStatus = (indiv[3] || '').trim();
    if (['소진','폐기','입고취소'].includes(indivStatus)) {
      toast(`이 제품은 "${indivStatus}" 상태입니다. 사용할 수 없습니다.`, 'err');
      hideLoading();
      return;
    }

    const lots = await SheetsAPI.getAll('원재료LOT');
    const lot = lots.find(l => l[0] === indiv[1]);

    // Save scanned item
    if (!State.woExec._scannedLots) State.woExec._scannedLots = {};
    if (!State.woExec._scannedLots[stepNo]) State.woExec._scannedLots[stepNo] = [];

    // Prevent duplicate
    if (State.woExec._scannedLots[stepNo].find(s => s.qrId === qrId)) {
      toast('이미 스캔된 QR입니다', 'warn');
      hideLoading();
      return;
    }

    State.woExec._scannedLots[stepNo].push({
      qrId, lotId: indiv[1], name: lot?.[2] || '', remain: indiv[4] || '0',
      expiry: (lot?.[7]||'').substring(0,10), status: indiv[3] || ''
    });

    hideLoading();
    renderScannedList(stepNo);
    validateStepInputs(stepNo);
    toast(`${qrId} 스캔 완료`, 'suc');
  } catch (e) {
    hideLoading();
    toast('조회 실패: ' + e.message, 'err');
  }
}

function renderScannedList(stepNo) {
  const listEl = $id(`scanned-list-${stepNo}`);
  if (!listEl) return;
  const items = State.woExec._scannedLots?.[stepNo] || [];

  if (items.length === 0) { listEl.innerHTML = ''; return; }

  // 개별 항목별 useType 초기화 (기본: 'full')
  if (!State.woExec._itemUseType) State.woExec._itemUseType = {};
  if (!State.woExec._itemUseType[stepNo]) State.woExec._itemUseType[stepNo] = {};
  items.forEach((_, i) => {
    if (State.woExec._itemUseType[stepNo][i] === undefined) State.woExec._itemUseType[stepNo][i] = 'full';
  });

  listEl.innerHTML = `
    <div class="fs-12 fw-6 c-txt-l mb-4">투입 제품 목록 (${items.length}건)</div>
    ${items.map((item, i) => {
      const iut = State.woExec._itemUseType[stepNo][i] || 'full';
      const isFull = iut === 'full';
      return `
      <div class="card" style="padding:8px 12px;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:8px;height:8px;border-radius:50%;background:${isFull?'var(--suc)':'var(--warn)'};flex-shrink:0"></div>
          <div style="flex:1;min-width:0">
            <div class="fs-12 fw-6">${item.name}</div>
            <div class="lot-id" style="font-size:11px;font-weight:600">${item.qrId}</div>
            <div class="fs-11 c-txt-l">${isFull ? '전량 소진' : `잔여분 — 남은량 ${item.remain}kg`} · ${item.expiry}</div>
          </div>
          <button class="btn btn-sm" style="padding:2px 8px;font-size:11px;color:var(--err);background:none;border:1px solid var(--err)"
                  onclick="removeScannedItem(${stepNo},${i})">삭제</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn btn-sm flex-1" style="padding:3px 6px;font-size:11px;border:1.5px solid var(--info);${isFull?'background:var(--info);color:#fff':'background:transparent;color:var(--info)'}"
                  onclick="setItemUseType(${stepNo},${i},'full')">전량 소진</button>
          <button class="btn btn-sm flex-1" style="padding:3px 6px;font-size:11px;border:1.5px solid var(--warn);${!isFull?'background:var(--warn);color:#fff':'background:transparent;color:var(--warn)'}"
                  onclick="setItemUseType(${stepNo},${i},'partial')">잔여분</button>
        </div>
      </div>`;
    }).join('')}
  `;
}

function removeScannedItem(stepNo, index) {
  if (State.woExec._scannedLots?.[stepNo]) {
    State.woExec._scannedLots[stepNo].splice(index, 1);
    // _itemUseType 인덱스 재정렬
    if (State.woExec._itemUseType?.[stepNo]) {
      const old = State.woExec._itemUseType[stepNo];
      const rebuilt = {};
      const items = State.woExec._scannedLots[stepNo];
      items.forEach((_, i) => {
        rebuilt[i] = i < index ? (old[i] || 'full') : (old[i + 1] || 'full');
      });
      State.woExec._itemUseType[stepNo] = rebuilt;
    }
    renderScannedList(stepNo);
    validateStepInputs(stepNo);
  }
}

// 개별 항목별 전량/잔여분 설정
function setItemUseType(stepNo, index, type) {
  if (!State.woExec._itemUseType) State.woExec._itemUseType = {};
  if (!State.woExec._itemUseType[stepNo]) State.woExec._itemUseType[stepNo] = {};
  State.woExec._itemUseType[stepNo][index] = type;
  renderScannedList(stepNo);
  validateStepInputs(stepNo);
}

// 하위 호환 — 기존 setUseType 호출 무시
function setUseType(stepNo, type) {}

function validateStepInputs(stepNo) {
  const step = State.woExec?.steps?.[State.woExec?.currentStep];
  if (!step) return;
  const stepType = step[3] || 'input';
  const isWater = (step[4] || '') === 'RM002';

  let allValid = true;

  if (stepType === 'input') {
    // Check: 투입량 입력됨?
    const qtyInput = $id(`input-qty-${stepNo}`);
    const qtyVal = parseFloat(qtyInput?.value);
    if (!qtyVal || qtyVal <= 0) allValid = false;

    // Check: ±5% 범위 내?
    const targetVal = parseFloat(qtyInput?.dataset?.target || '0');
    let rangeHint = $id(`qty-range-hint-${stepNo}`);
    if (!rangeHint) {
      rangeHint = document.createElement('div');
      rangeHint.id = `qty-range-hint-${stepNo}`;
      rangeHint.style.cssText = 'font-size:11px;margin-top:4px';
      qtyInput?.closest('.input-group')?.appendChild(rangeHint);
    }
    if (targetVal > 0 && qtyVal > 0) {
      const lo = targetVal * 0.95, hi = targetVal * 1.05;
      if (qtyVal >= lo && qtyVal <= hi) {
        rangeHint.innerHTML = `<span style="color:var(--suc)">✓ 허용 범위 내 (${lo.toFixed(1)}~${hi.toFixed(1)}kg)</span>`;
      } else {
        rangeHint.innerHTML = `<span style="color:var(--err)">✗ 목표 대비 ±5% 초과 (허용: ${lo.toFixed(1)}~${hi.toFixed(1)}kg)</span>`;
        allValid = false;
      }
    } else if (targetVal > 0) {
      const lo = targetVal * 0.95, hi = targetVal * 1.05;
      rangeHint.innerHTML = `<span style="color:var(--gray)">허용 범위: ${lo.toFixed(1)}~${hi.toFixed(1)}kg (±5%)</span>`;
    }

    // Check: 사진 첨부됨?
    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) allValid = false;

    // Check: 체크항목 전부 체크됨?
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    checks.forEach((_, i) => {
      const cb = $id(`check-${stepNo}-${i}`);
      if (cb && cb.textContent !== '✓') allValid = false;
    });

    // Check: QR 스캔됨? (물 제외)
    if (!isWater) {
      const scanned = State.woExec._scannedLots?.[stepNo]?.length || 0;
      if (scanned === 0) allValid = false;
    }
  }

  // process 타입 검증
  if (stepType === 'process') {
    const checks = (step[6] || '').split(',').filter(c => c.trim());
    const isMixing = (step[2]||'').includes('믹싱');
    const allChecks = [...checks];
    if (isMixing) {
      if (!allChecks.includes('RPM 확인')) allChecks.push('RPM 확인');
      if (!allChecks.includes('믹싱 시간 확인')) allChecks.push('믹싱 시간 확인');
    }
    allChecks.forEach((_, i) => {
      const cb = $id(`check-${stepNo}-${i}`);
      if (cb && cb.textContent !== '✓') allValid = false;
    });
    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) allValid = false;
  }

  // inspect 타입 검증 (CCP) — 전체 합격 + 시간 + 사진
  if (stepType === 'inspect') {
    if (!$id('ccp-time-1')?.value) allValid = false;
    if ($id('ccp2-fe')?.dataset?.result !== '합격') allValid = false;
    if ($id('ccp2-sus')?.dataset?.result !== '합격') allValid = false;
    if ($id('ccp3-fe')?.dataset?.result !== '합격') allValid = false;
    if ($id('ccp3-sus')?.dataset?.result !== '합격') allValid = false;
    if (!$id('ccp-time-4')?.value) allValid = false;
    const ccp5c = document.getElementById('ccp5-records-' + stepNo);
    if (ccp5c) {
      ccp5c.querySelectorAll('.ccp5-record').forEach(rec => {
        if (rec.dataset?.result !== '합격') allValid = false;
      });
    }
    if ($id('ccp6-fe')?.dataset?.result !== '합격') allValid = false;
    if ($id('ccp6-sus')?.dataset?.result !== '합격') allValid = false;
    const ccpTotal = parseInt($id('ccp-total')?.value);
    if (!ccpTotal || ccpTotal <= 0) allValid = false;
    const ccpPhoto = $id(`photo-preview-${stepNo}-ccp7`);
    if (!ccpPhoto || !ccpPhoto.innerHTML.trim()) allValid = false;
  }

  // pack 타입 검증
  if (stepType === 'pack') {
    const packQty = parseInt($id(`pack-qty-${stepNo}`)?.value);
    if (!packQty || packQty <= 0) allValid = false;
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-s${n}`);
      if (!prev || !prev.innerHTML.trim()) allValid = false;
      const wt = parseFloat($id(`sample-wt-${stepNo}-${n}`)?.value);
      if (!wt || wt <= 0) allValid = false;
    }
  }

  // seal 타입 검증
  if (stepType === 'seal') {
    const sealCheck0 = $id(`check-seal-${stepNo}-0`);
    const sealCheck1 = $id(`check-seal-${stepNo}-1`);
    if (!sealCheck0 || sealCheck0.textContent !== '✓') allValid = false;
    if (!sealCheck1 || sealCheck1.textContent !== '✓') allValid = false;
    for (let n = 1; n <= 3; n++) {
      const prev = $id(`photo-preview-${stepNo}-seal${n}`);
      if (!prev || !prev.innerHTML.trim()) allValid = false;
      const wt = parseFloat($id(`seal-weight-${stepNo}-${n}`)?.value);
      if (!wt || wt <= 0) allValid = false;
    }
    const sealQty = parseInt($id(`seal-qty-${stepNo}`)?.value);
    if (!sealQty || sealQty <= 0) allValid = false;
  }

  // qr-label 타입 검증
  if (stepType === 'qr-label') {
    const qrQty = parseInt($id(`qr-label-qty-${stepNo}`)?.value);
    if (!qrQty || qrQty <= 0) allValid = false;
  }

  // store 타입 검증
  if (stepType === 'store') {
    const photoPreview = $id(`photo-preview-${stepNo}`);
    if (!photoPreview || !photoPreview.innerHTML.trim()) allValid = false;
  }

  // Enable/disable next button
  const nextBtn = document.querySelector('#step-content ~ div .btn-pri, #step-content ~ div .btn-suc');
  // Find the bottom buttons container
  const bottomBtns = document.querySelectorAll('#content > div:last-child button');
  bottomBtns.forEach(btn => {
    if (btn.textContent.includes('공정 완료') || btn.textContent.includes('전체 완료')) {
      btn.dataset.valid = allValid ? 'true' : 'false';
      btn.style.opacity = allValid ? '1' : '0.4';
    }
  });
}

/* ═══════════════════════════════════════════════
   공정기록 카드 렌더링 (wo-detail / approval-detail 공유)

  const time = (r[11]||'').substring(11,16);

  const typeColor = {input:'#1565c0',process:'#7c3aed',seal:'#7c3aed',inspect:'#c62828','qr-label':'#1565c0',store:'#00695c',pack:'#e65100'}[type] || '#666';

          <div class="input-group mt-8"><label style="font-size:12px">무게</label><div class="input-suffix"><input type="number" value="${sampleWeight}" readonly disabled style="background:var(--gray-l);opacity:0.8"><span>g</span></div></div>
        </div>`;
      }
    }
    if (stepData.sealQty) {
      bodyHtml += `<div class="input-group mt-12"><label>최종 완제품 수량</label><div class="input-suffix"><input type="number" value="${stepData.sealQty}" readonly disabled style="background:var(--gray-l);opacity:0.8"><span>개</span></div></div>`;
    }
  }
  else if (type === 'inspect') {
    bodyHtml += `<div class="info-box" style="background:rgba(198,40,40,0.1)">
      <div class="fs-12 fw-6" style="color:#c62828">CCP 금속검출 검사</div>

    if (stepData.ccpTotal) bodyHtml += `<div class="fs-11 c-txt-l mt-4">검사 수량: <strong>${stepData.ccpTotal}개</strong></div>`;
    if (stepData.passCount != null) bodyHtml += `<div class="fs-11 c-txt-l">합격: ${stepData.passCount}개 · 불합격: ${stepData.failCount||0}개</div>`;
    if (stepData.checks?.length) {
      bodyHtml += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-8">체크항목</div>`;
      bodyHtml += stepData.checks.map(c => `<div class="check-item"><div class="check-box ${c.checked?'checked':''}" style="pointer-events:none">${c.checked?'✓':''}</div><span>${c.name}</span></div>`).join('');
    }
    if (stepData.times) {
      bodyHtml += `<div class="fs-11 fw-6 mt-8 mb-4">CCP 모니터링 시간</div>`;
      bodyHtml += Object.entries(stepData.times).map(([k,v]) => `<div class="fs-11 c-txt-l">${k}: ${v}</div>`).join('');
    }
    if (photoUrls.length) {
      bodyHtml += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${photoUrls.map((url,pi) => `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-l)" onerror="this.outerHTML='<div style=\\'width:80px;height:80px;border-radius:6px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--pri)\\'>사진${pi+1}</div>'"></a>`).join('')}</div>`;

      bodyHtml += stepData.checks.map(c => `<div class="check-item"><div class="check-box ${c.checked?'checked':''}" style="pointer-events:none">${c.checked?'✓':''}</div><span>${c.name}</span></div>`).join('');

  }
  else if (type === 'pack') {
    bodyHtml += `<div class="info-box" style="background:rgba(230,81,0,0.1)">
      <div class="fs-12 fw-6" style="color:#e65100">계량 공정</div>
    </div>`;
    if (stepData.packQty) bodyHtml += `<div class="input-group mt-8"><label>포장 수량</label><div class="input-suffix"><input type="number" value="${stepData.packQty}" readonly disabled style="background:var(--gray-l);opacity:0.8"><span>개</span></div></div>`;
    if (stepData.samples?.length) {
      bodyHtml += `<div class="fs-13 fw-7 mb-8 mt-12">샘플 무게 기록</div>`;

        bodyHtml += `<div class="card" style="padding:10px;border-left:3px solid #e65100;margin-bottom:6px">

  }
  else {
    if (stepData.checks?.length) {
      bodyHtml += `<div class="fs-12 fw-6 c-txt-l mb-4">체크항목</div>`;
      bodyHtml += stepData.checks.map(c => `<div class="check-item"><div class="check-box ${c.checked?'checked':''}" style="pointer-events:none">${c.checked?'✓':''}</div><span>${c.name}</span></div>`).join('');
    }
    if (photoUrls.length) {
      bodyHtml += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${photoUrls.map((url,pi) => `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-l)" onerror="this.style.display='none'"></a>`).join('')}</div>`;
    }
  }

  return `
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">
      <div style="padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;background:${typeColor}08"
           onclick="const d=this.nextElementSibling;d.style.display=d.style.display==='none'?'block':'none';this.querySelector('.arrow').textContent=d.style.display==='none'?'▸':'▾'">
        <div style="width:28px;height:28px;border-radius:14px;background:${statusBg};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${statusIcon}</div>
        <div style="flex:1">
          <div class="fs-13 fw-6">${stepNo}. ${name}</div>
          <div class="fs-11 c-txt-l">${time} · ${worker.split('@')[0]}</div>
        </div>
        <span style="background:${typeColor}15;color:${typeColor};font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600">${typeLabel}</span>
        <span class="arrow" style="color:var(--txt-l);font-size:12px">▾</span>
      </div>
      <div style="padding:12px;border-top:1px solid var(--gray-l)">
        ${bodyHtml}
        <div class="fs-11 c-txt-l mt-8" style="border-top:1px solid var(--gray-l);padding-top:6px">기록: ${r[11]||'-'} · ${worker.split('@')[0]}</div>
      </div>
    </div>`;
}

/* PDF 미리보기 — 저장 없이 로컬 생성 후 새 탭으로 열기 */
async function previewWOPdf(woId) {
  try {
    showLoading();
    const { pdfBlob, fileName } = await generateWOPdf(woId);
    const url = URL.createObjectURL(pdfBlob);
    const w = window.open(url, '_blank');
    if (!w) {
      const a = document.createElement('a');
      a.href = url; a.download = fileName; a.click();
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    hideLoading();
    toast('📄 PDF 미리보기 생성 완료', 'suc', 2000);
  } catch (e) {
    hideLoading();
    toast('PDF 생성 실패: ' + e.message, 'err');
  }
}

/* ═══════════════════════════════════════════════
   WO DETAIL (작업지시서 상세 - 공정기록 조회)
   ═══════════════════════════════════════════════ */
Screens['wo-detail'] = async (params = {}) => {
  const { woId } = params;
  if (woId) State._woDetailId = woId;
  showLoading();

  try {
    // 항상 최신 데이터 (PC에서 확인 시 휴대폰 업데이트 반영)
    SheetsAPI.invalidateCache('작업지시서');
    SheetsAPI.invalidateCache('공정기록');
    const wos = await SheetsAPI.getAll('작업지시서', false);
    const wo = wos.find(w => w[0] === woId && w[12] !== '삭제');
    if (!wo) { toast('작업지시서를 찾을 수 없습니다', 'err'); hideLoading(); Router.go('production'); return; }

    const records = (await SheetsAPI.getAll('공정기록').catch(() => [])).filter(r => r[0] === woId);
    records.sort((a, b) => parseInt(a[1]) - parseInt(b[1]));
    const woStatus = wo[12] || '';
    const statusBadgeMap = { '진행중':'info','승인대기':'warn','냉동보관중':'warn','출하가능':'suc','출하완료':'suc','승인완료':'suc' };
    const freezeStart = wo[11] ? new Date(wo[11]) : null;
    const freezeHours = freezeStart ? ((Date.now() - freezeStart.getTime()) / (1000*60*60)).toFixed(1) : null;

    renderHeader('작업지시서 상세', woId, { back: 'production' });

    $id('content').innerHTML = `
      <div style="padding:16px">
        <div class="card">
          <div class="row between mb-8">
            <span class="fs-16 fw-7">${wo[4]||''} ${wo[5]||''}kg</span>
            <span class="badge badge-${statusBadgeMap[woStatus]||'gray'}">${woStatus}</span>
          </div>
          <div class="fs-12 c-txt-l">작업자: ${wo[8]||''} · ${wo[1]||''}</div>
