/* ═══════════════════════════════════════════════
   PDF 생성 (HACCP 작업지시서 보고서) v4
   — 라벨 짤림 수정, 빈페이지 제거, 사진 Drive API,
     CCP JSON 파싱, PDF 폴더 분리
   ═══════════════════════════════════════════════ */
async function generateWOPdf(woId) {
  const { jsPDF } = window.jspdf;

  /* ── 데이터 로드 ── */
  const wos = await SheetsAPI.getAll('작업지시서', false);
  const wo = wos.find(w => w[0] === woId);
  if (!wo) throw new Error('작업지시서를 찾을 수 없습니다');

  const records = (await SheetsAPI.getAll('공정기록', false)).filter(r => r[0] === woId);
  records.sort((a, b) => parseInt(a[1]) - parseInt(b[1]));

  /* ── 한글 폰트 로드 ── */
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const PW = 210, PH = 297, M = 15, CW = PW - M * 2;
  let y = M;

  let fontLoaded = false;
  try {
    const fontUrls = [
      'https://fonts.gstatic.com/s/nanumgothic/v23/PN_3Rfi-oW3hYwmKDpxS7F_z_tLfxno73g.ttf',
      'https://cdn.jsdelivr.net/gh/nicecai/nanum-font@master/NanumGothic.ttf',
      'https://fastly.jsdelivr.net/gh/nicecai/nanum-font@master/NanumGothic.ttf'
    ];
    let fontBuf = null;
    for (const fUrl of fontUrls) {
      try {
        const resp = await fetch(fUrl, { signal: AbortSignal.timeout(8000) });
        if (resp.ok) { fontBuf = await resp.arrayBuffer(); break; }
      } catch(e) { continue; }
    }
    if (fontBuf) {
      let binary = '';
      const bytes = new Uint8Array(fontBuf);
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      const b64Font = btoa(binary);
      doc.addFileToVFS('NanumGothic.ttf', b64Font);
      doc.addFont('NanumGothic.ttf', 'NanumGothic', 'normal');
      doc.addFont('NanumGothic.ttf', 'NanumGothic', 'bold');
      doc.setFont('NanumGothic', 'normal');
      fontLoaded = true;
      console.log('[PDF] 한글 폰트 로드 성공');
    }
  } catch(e) { console.warn('[PDF] 폰트 로드 실패:', e); }

  /* ── Canvas fallback ── */
  const _cfont = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const SC = 4;

  const canvasTextImg = (text, fs, fw, mw, color) => {
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    ctx.font = `${fw||'normal'} ${fs*SC}px ${_cfont}`;
    const lines = []; let rem = String(text||'');
    while (rem.length > 0) {
      let end = rem.length;
      while (end > 0 && ctx.measureText(rem.substring(0, end)).width > mw*SC) end--;
      if (end === 0) end = 1;
      lines.push(rem.substring(0, end)); rem = rem.substring(end);
    }
    if (lines.length === 0) lines.push('');
    const lh = fs * SC * 1.35;
    c.width = mw * SC + 4;
    c.height = lh * lines.length + fs * SC * 0.2;
    ctx.font = `${fw||'normal'} ${fs*SC}px ${_cfont}`;
    ctx.fillStyle = color || '#000'; ctx.textBaseline = 'top';
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 0, i * lh);
    return { d: c.toDataURL('image/png'), w: c.width / SC, h: c.height / SC, lines: lines.length };
  };

  /* ── 텍스트 렌더링 ── */
  const LH_FACTOR = 0.55; // 줄 높이 계수 (겹침 방지)

  const drawText = (text, x, yy, fs, fw, color, mw, align) => {
    if (!text && text !== 0) return { h: 0, y: yy };
    const str = String(text);
    const maxW = mw || CW;
    if (fontLoaded) {
      doc.setFont('NanumGothic', fw === 'bold' ? 'bold' : 'normal');
      doc.setFontSize(fs); doc.setTextColor(color || '#000');
      const splitLines = doc.splitTextToSize(str, maxW);
      const lineH = fs * LH_FACTOR;
      const totalH = splitLines.length * lineH;
      if (yy + totalH > PH - 12) { doc.addPage(); yy = M; }
      for (let i = 0; i < splitLines.length; i++) {
        const tx = align === 'center' ? x + maxW / 2 : (align === 'right' ? x + maxW : x);
        const opt = align ? { align } : {};
        doc.text(splitLines[i], tx, yy + i * lineH + fs * 0.28, opt);
      }
      return { h: totalH, y: yy };
    } else {
      const img = canvasTextImg(str, fs, fw, maxW, color);
      if (yy + img.h > PH - 12) { doc.addPage(); yy = M; }
      doc.addImage(img.d, 'PNG', x, yy, img.w, img.h);
      return { h: img.h, y: yy };
    }
  };

  const measureH = (text, fs, fw, mw) => {
    if (!text && text !== 0) return 0;
    const str = String(text); const maxW = mw || CW;
    if (fontLoaded) {
      doc.setFont('NanumGothic', fw === 'bold' ? 'bold' : 'normal');
      doc.setFontSize(fs);
      return doc.splitTextToSize(str, maxW).length * fs * LH_FACTOR;
    } else {
      const c = document.createElement('canvas'), ctx = c.getContext('2d');
      ctx.font = `${fw||'normal'} ${fs*SC}px ${_cfont}`;
      let rem = str, lines = 0;
      while (rem.length > 0) {
        let end = rem.length;
        while (end > 0 && ctx.measureText(rem.substring(0, end)).width > maxW*SC) end--;
        if (end === 0) end = 1;
        rem = rem.substring(end); lines++;
      }
      return lines * (fs * 1.35) / SC + fs * 0.2 / SC;
    }
  };

  const hLine = (yy, color, w) => {
    doc.setDrawColor(...(color||[21,101,192])); doc.setLineWidth(w||0.4);
    doc.line(M, yy, PW - M, yy);
  };

  /* ── Drive 사진 로드 (재시도 + 토큰 갱신) ── */
  const loadPhoto = async (url) => {
    try {
      if (!url || !url.trim()) return null;
      const u = url.trim();
      let fileId = null;
      const m1 = u.match(/\/d\/([^\/\?]+)/);
      const m2 = u.match(/[?&]id=([^&]+)/);
      const m3 = u.match(/^([a-zA-Z0-9_-]{20,})$/);
      if (m1) fileId = m1[1];
      else if (m2) fileId = m2[1];
      else if (m3) fileId = m3[1];
      else return null;

      const MAX_RETRIES = 2;
      for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
        let token = localStorage.getItem('mt_token') || State.token;
        if (!token) return null;
        try {
          const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&supportsAllDrives=true`, {
            headers: { 'Authorization': `Bearer ${token}` },
            signal: AbortSignal.timeout(15000)
          });
          if (resp.status === 401 && attempt < MAX_RETRIES) {
            // 토큰 만료 → 갱신 시도
            if (typeof refreshToken === 'function') {
              try { await refreshToken(); } catch(e) { console.warn('[PDF] 토큰 갱신 실패:', e); }
            }
            continue;
          }
          if (!resp.ok) {
            if (attempt < MAX_RETRIES) { await new Promise(r => setTimeout(r, 1000)); continue; }
            return null;
          }
          const blob = await resp.blob();
          if (blob.size < 100) {
            if (attempt < MAX_RETRIES) continue;
            return null;
          }
          // Canvas로 리사이즈 & 압축 (jsPDF 대용량 이미지 렌더링 오류 방지)
          const rawUrl = URL.createObjectURL(blob);
          try {
            const img = await new Promise((resolve, reject) => {
              const i = new Image();
              i.onload = () => resolve(i);
              i.onerror = reject;
              i.src = rawUrl;
            });
            const MAX_DIM = 800; // PDF에 충분한 해상도
            let w = img.width, h = img.height;
            if (w > MAX_DIM || h > MAX_DIM) {
              const scale = MAX_DIM / Math.max(w, h);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            const cvs = document.createElement('canvas');
            cvs.width = w; cvs.height = h;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const compressed = cvs.toDataURL('image/jpeg', 0.85);
            console.log(`[PDF] 사진 압축: ${(blob.size/1024).toFixed(0)}KB → ${(compressed.length*0.75/1024).toFixed(0)}KB (${w}x${h})`);
            return compressed;
          } finally {
            URL.revokeObjectURL(rawUrl);
          }
        } catch(e) {
          console.warn(`[PDF] 사진 로드 시도 ${attempt+1}/${MAX_RETRIES+1} 실패:`, e);
          if (attempt < MAX_RETRIES) { await new Promise(r => setTimeout(r, 1000)); continue; }
        }
      }
      return null;
    } catch { return null; }
  };

  /* ── 테이블 행 ── */
  const ROW_FS = 15, ROW_PAD = 3, MIN_ROW_H = 11;
  const LABEL_W = 50; // 라벨 너비 (큰 폰트 대응)

  const tableRow = (label, value, yy, labelW) => {
    const lw = labelW || LABEL_W;
    const vw = CW - lw;
    const valStr = (!value && value !== 0) || value === '-' || value === '' ? '내용 없음' : String(value);
    const lh = measureH(label, ROW_FS, 'bold', lw - 3);
    const vh = measureH(valStr, ROW_FS, 'normal', vw - 3);
    const rh = Math.max(lh + ROW_PAD * 2, vh + ROW_PAD * 2, MIN_ROW_H);
    if (yy + rh > PH - 12) { doc.addPage(); yy = M; }
    doc.setFillColor(240, 244, 250);
    doc.rect(M, yy, lw, rh, 'F');
    doc.setDrawColor(200, 210, 230); doc.setLineWidth(0.15);
    doc.rect(M, yy, CW, rh);
    doc.line(M + lw, yy, M + lw, yy + rh);
    const lTextY = yy + (rh - lh) / 2;
    const vTextY = yy + (rh - vh) / 2;
    drawText(label, M + 1.5, lTextY, ROW_FS, 'bold', '#333', lw - 3);
    const vColor = valStr === '내용 없음' ? '#999' : '#222';
    drawText(valStr, M + lw + 1.5, vTextY, ROW_FS, 'normal', vColor, vw - 3);
    return { nextY: yy + rh, height: rh };
  };

  /* ── 섹션 제목 ── */
  const sectionTitle = (text, yy, color) => {
    const h = measureH(text, 18, 'bold', CW);
    if (yy + h + 5 > PH - 12) { doc.addPage(); yy = M; }
    const r = drawText(text, M, yy, 18, 'bold', color || '#1565c0', CW);
    yy = r.y + r.h + 2;
    hLine(yy); yy += 3;
    return yy;
  };

  /* ── 공정 페이지 헤더 (높이 확대, 겹침 방지) ── */
  const processHeader = (title, subtitle) => {
    const headerH = 48;
    doc.setFillColor(21, 101, 192);
    doc.rect(0, 0, PW, headerH, 'F');
    drawText(title, M, 5, 18, 'bold', '#ffffff', CW * 0.55);
    if (subtitle) drawText(subtitle, M, 28, 12, 'normal', '#bbdefb', CW * 0.55);
    drawText(woId, PW - M - 60, 6, 12, 'normal', '#bbdefb', 60);
    drawText(wo[4]||'', PW - M - 60, 24, 12, 'normal', '#e3f2fd', 60);
    return headerH + 4;
  };

  /* ═══════════════════════════════════════════
     PAGE 1: 표지 + 기본 정보 + HACCP 요약
     ═══════════════════════════════════════════ */
  doc.setFillColor(21, 101, 192);
  doc.rect(0, 0, PW, 65, 'F');
  drawText('HACCP 생산 기록서', M, 6, 28, 'bold', '#ffffff', CW);
  drawText('작업지시서 (Work Order Report)', M, 28, 16, 'normal', '#bbdefb', CW);
  drawText(woId, M, 42, 14, 'normal', '#e3f2fd', CW);
  drawText(`${formatDateTime()}`, PW - M - 60, 52, 12, 'normal', '#90caf9', 60, 'right');
  y = 70;

  // ── 1. 기본 정보 ──
  y = sectionTitle('1. 기본 정보', y);

  const infoData = [
    ['제품명', wo[4] || '-'],
    ['제품코드', wo[3] || '-'],
    ['SOP', wo[1] || '-'],
    ['생산량', `${wo[5] || '-'} kg`],
    ['포장단위', wo[6] || '-'],
    ['포장수량', `${wo[7] || '-'} 개`],
    ['작업자', wo[8] || '-'],
    ['시작일시', (wo[9] || '-').substring(0, 16)],
    ['완료일시', (wo[10] || '-').substring(0, 16)],
    ['냉동시작', wo[11] || '-'],
    ['상태', wo[12] || '-'],
    ['완제품LOT', wo[14] || '-'],
    ['승인자', wo[15] || ''],
    ['승인일시', wo[16] ? wo[16].substring(0, 16) : ''],
  ];
  for (const [label, value] of infoData) {
    const r = tableRow(label, value, y);
    y = r.nextY;
  }
  y += 5;

  // ── 2. HACCP 관리 요약 ──
  const ccpRecords = records.filter(r => r[3] === 'inspect');
  const inputRecords = records.filter(r => r[3] === 'input');
  const storeRecords = records.filter(r => r[3] === 'store');

  y = sectionTitle('2. HACCP 관리 요약', y);

  const hacInfo = [
    ['총 공정', `${records.length}단계`],
    ['CCP 검사', `${ccpRecords.length}건`],
    ['원재료투입', `${inputRecords.length}건`],
    ['냉동보관', `${storeRecords.length}건`],
    ['LOT 추적', inputRecords.length > 0 ? '기록됨' : '해당 없음'],
    ['완료여부', records.every(r => r[10] === '완료') ? '전체 완료' : '일부 미완료'],
  ];
  for (const [label, value] of hacInfo) {
    const r = tableRow(label, value, y);
    y = r.nextY;
  }
  y += 4;

  // ── 3. 공정 결과 요약 ──
  y = sectionTitle('3. 공정 결과 요약', y);
  for (const rec of records) {
    const typeMap = {input:'투입',process:'믹싱',seal:'포장',inspect:'CCP','qr-label':'라벨',store:'보관',pack:'계량'};
    // 각 공정의 주요 정량 지표 추출
    let metric = '';
    try {
      const sd = rec[5] ? JSON.parse(rec[5]) : {};
      if (sd.targetQty != null || sd.inputQty != null) metric = `투입 ${sd.inputQty||'-'}kg / 목표 ${sd.targetQty||'-'}kg`;
      else if (sd.ccpTotal != null) metric = `검사 ${sd.ccpTotal}개, 합격 ${sd.passCount||0}, 불합격 ${sd.failCount||0}`;
      else if (sd.sealQty != null) metric = `밀봉 ${sd.sealQty}개`;
      else if (sd.packQty != null) metric = `포장 ${sd.packQty}개`;
      else if (sd.samples && sd.samples.length > 0) {
        const ws = sd.samples.map(s => s.weight).filter(w => w);
        if (ws.length > 0) metric = `샘플 ${ws.length}건, 평균 ${(ws.reduce((a,b)=>a+Number(b),0)/ws.length).toFixed(1)}g`;
      }
      else if (sd.qrQty) metric = `QR ${sd.qrQty}매`;
      else if (sd.freezeStart) metric = `냉동 ${sd.freezeStart}`;
      if (sd.checks && sd.checks.length > 0) {
        const passed = sd.checks.filter(c => c.checked).length;
        metric += (metric ? ' / ' : '') + `점검 ${passed}/${sd.checks.length}`;
      }
    } catch(e) {}
    const status = rec[10] || '미완료';
    const time = (rec[11] || '').substring(11, 16) || '-';
    const stepVal = `${typeMap[rec[3]]||rec[3]} | ${status} | ${time}` + (metric ? `\n${metric}` : '');
    const r = tableRow(`${rec[1]}. ${rec[2]||''}`, stepVal, y, 65);
    y = r.nextY;
  }

  /* ═══════════════════════════════════════════
     각 공정별 페이지
     ═══════════════════════════════════════════ */
  for (let ri = 0; ri < records.length; ri++) {
    const rec = records[ri];
    const stepNo = rec[1] || '';
    const stepName = rec[2] || '';
    const stepType = rec[3] || '';
    const usedLots = rec[4] || '';
    const stepDataRaw = rec[5] || '';
    const photoUrlsRaw = rec[6] || '';
    const actualValue = rec[7] || '';
    const photoUrl = rec[8] || '';
    const checkResult = rec[9] || '';
    const recordStatus = rec[10] || '내용 없음';
    const completedAt = rec[11] || '';
    const worker = rec[12] || '내용 없음';

    const typeLabel = {input:'원재료 투입',process:'믹싱 공정',seal:'포장/밀봉',inspect:'CCP 검사(금속검출)','qr-label':'QR 라벨 출력',store:'냉동보관',pack:'계량/소분'}[stepType] || stepType;
    const isCCP = stepType === 'inspect';

    // ── 공정별 페이지 배치 전략 ──
    // 사진/LOT/CCP/seal/pack이 있으면 무조건 새 페이지, 아니면 남은 공간 확인
    const hasPhotos = !!(photoUrlsRaw || photoUrl);
    const hasLots = !!usedLots;
    const isHeavy = isCCP || hasPhotos || hasLots || stepType === 'seal' || stepType === 'pack';
    if (isHeavy || ri === 0 || y > PH - 100) {
      doc.addPage();
      y = processHeader(`공정 ${stepNo}. ${stepName}`, `${typeLabel}  |  ${recordStatus}`);
    } else {
      // 같은 페이지에 구분선 + 미니 헤더
      y += 5;
      doc.setDrawColor(21, 101, 192); doc.setLineWidth(0.8);
      doc.line(M, y, PW - M, y);
      y += 5;
      const hdr = drawText(`공정 ${stepNo}. ${stepName}`, M, y, 20, 'bold', '#1565c0', CW * 0.6);
      drawText(`${typeLabel} | ${recordStatus}`, M + CW * 0.62, y + 2, 14, 'normal', '#666', CW * 0.38);
      y = hdr.y + hdr.h + 4;
    }

    // CCP 배너
    if (isCCP) {
      doc.setFillColor(255, 235, 238);
      doc.rect(M, y, CW, 16, 'F');
      doc.setDrawColor(211, 47, 47); doc.setLineWidth(0.5);
      doc.rect(M, y, CW, 16);
      drawText('⚠ HACCP CCP (Critical Control Point) — 중요관리점', M + 3, y + 2, 18, 'bold', '#c62828', CW - 6);
      y += 19;
    }

    // ── 기록 정보 ──
    y = sectionTitle('기록 정보', y);
    const baseInfo = [
      ['공정번호', stepNo],
      ['공정명', stepName],
      ['유형', typeLabel],
      ['작업자', worker],
      ['기록시간', completedAt ? completedAt.substring(0, 19) : '-'],
      ['상태', recordStatus],
    ];
    if (actualValue) baseInfo.push(['측정값', actualValue]);
    if (checkResult) baseInfo.push(['판정', checkResult]);

    for (const [l, v] of baseInfo) {
      const r = tableRow(l, v, y);
      y = r.nextY;
    }
    y += 4;

    // ── Step Data (작업자 기입 내용) ──
    let stepData = {};
    try { if (stepDataRaw) stepData = JSON.parse(stepDataRaw); } catch(e) {}
    const hasStepData = Object.keys(stepData).length > 0;

    if (hasStepData) {
      y = sectionTitle('작업자 기입 내용', y);

      // ★ 투입량: 목표 먼저, 실제 투입 나중 (순서 수정)
      if (stepData.inputQty != null || stepData.targetQty != null) {
        if (stepData.targetQty != null) {
          const r1 = tableRow('목표 투입량', `${stepData.targetQty} kg`, y);
          y = r1.nextY;
        }
        if (stepData.inputQty != null) {
          const r2 = tableRow('실제 투입량', `${stepData.inputQty} kg`, y);
          y = r2.nextY;
        }
        if (stepData.useType) {
          const r3 = tableRow('사용 구분', stepData.useType === 'full' ? '전량 사용' : '부분 사용', y);
          y = r3.nextY;
        }
      }

      // 체크항목 (HACCP 위생 점검)
      if (stepData.checks && stepData.checks.length > 0) {
        y += 3;
        const chkR = drawText('체크항목 (위생/품질 점검)', M, y, 18, 'bold', '#333', CW);
        y = chkR.y + chkR.h + 3;
        for (const c of stepData.checks) {
          if (y > PH - 12) { doc.addPage(); y = M; }
          const icon = c.checked ? '☑' : '☐';
          const txt = `${icon}  ${c.name}`;
          const chColor = c.checked ? '#2e7d32' : '#c62828';
          doc.setFillColor(c.checked ? 232 : 255, c.checked ? 245 : 235, c.checked ? 233 : 238);
          doc.rect(M + 2, y, CW - 4, 14, 'F');
          drawText(txt, M + 4, y + 2, 15, 'normal', chColor, CW - 8);
          y += 13;
        }
        y += 3;
      }

      // 계량/포장
      if (stepData.packQty != null) {
        const r = tableRow('포장 수량', `${stepData.packQty} 개`, y);
        y = r.nextY;
      }
      if (stepData.samples && stepData.samples.length > 0) {
        y += 2;
        const sr = drawText('중량 검사 샘플 (HACCP 계량 검증)', M, y, 18, 'bold', '#333', CW);
        y = sr.y + sr.h + 2;
        for (let si = 0; si < stepData.samples.length; si++) {
          if (y > PH - 12) { doc.addPage(); y = M; }
          const s = stepData.samples[si];
          const r = tableRow(`샘플 #${si+1}`, `${s.weight||'-'} g`, y);
          y = r.nextY;
        }
        y += 2;
      }

      // 밀봉/라벨
      if (stepData.sealQty != null) {
        let r;
        r = tableRow('최종 수량', `${stepData.sealQty} 개`, y); y = r.nextY;
        r = tableRow('라벨 부착 확인', stepData.labelCheck ? '확인 완료 ✓' : '미확인 ✗', y); y = r.nextY;
        r = tableRow('밀봉 상태 확인', stepData.sealCheck ? '확인 완료 ✓' : '미확인 ✗', y); y = r.nextY;
        // 샘플 무게 기록
        if (stepData.samples && stepData.samples.length > 0) {
          stepData.samples.forEach((s, si) => {
            if (y > PH - 10) { doc.addPage(); y = M; }
            r = tableRow(`샘플 #${si+1} 무게`, `${s.weight || '-'} g`, y); y = r.nextY;
          });
        }
      }

      // CCP 검사 (금속검출 — HACCP 핵심)
      if (isCCP) {
        if (stepData.ccpTotal != null) { const r = tableRow('검사 총 수량', `${stepData.ccpTotal} 개`, y); y = r.nextY; }
        if (stepData.passCount != null) { const r = tableRow('합격 수량', `${stepData.passCount} 개`, y); y = r.nextY; }
        if (stepData.failCount != null) { const r = tableRow('불합격 수량', `${stepData.failCount} 개`, y); y = r.nextY; }
        if (stepData.times) {
          y += 2;
          const tr = drawText('CCP 모니터링 시간 기록', M, y, 18, 'bold', '#c62828', CW);
          y = tr.y + tr.h + 2;
          for (const [k, v] of Object.entries(stepData.times)) {
            if (y > PH - 12) { doc.addPage(); y = M; }
            const r = tableRow(k, v, y); y = r.nextY;
          }
        }
        // CCP 판정 결과 강조 박스
        y += 3;
        const ccpResult = (stepData.failCount != null && stepData.failCount > 0) ? '불합격 발생' : '전량 합격';
        const isPass = ccpResult === '전량 합격';
        doc.setFillColor(isPass ? 232 : 255, isPass ? 245 : 235, isPass ? 233 : 238);
        doc.rect(M, y, CW, 16, 'F');
        if (!isPass) { doc.setDrawColor(211, 47, 47); doc.setLineWidth(0.5); doc.rect(M, y, CW, 16); }
        drawText(`CCP 판정 결과: ${ccpResult}`, M + 3, y + 2, 18, 'bold', isPass ? '#2e7d32' : '#c62828', CW - 6);
        y += 19;
      }

      // QR 라벨
      if (stepData.qrQty) { const r = tableRow('QR 라벨 발행 수', `${stepData.qrQty} 매`, y); y = r.nextY; }

      // 냉동보관
      if (stepData.freezeStart) {
        let r;
        r = tableRow('냉동 시작 시간', stepData.freezeStart, y); y = r.nextY;
        r = tableRow('냉동 온도', stepData.freezeTemp || '-18°C (기본)', y); y = r.nextY;
      }

      // 기타 데이터 (JSON 파싱하여 읽기 쉽게 표시)
      const shownKeys = ['inputQty','targetQty','useType','checks','packQty','samples','sealQty',
        'labelCheck','sealCheck','ccpTotal','passCount','failCount','times','qrQty','freezeStart','freezeTemp'];
      const extraKeys = Object.keys(stepData).filter(k => !shownKeys.includes(k));
      if (extraKeys.length > 0) {
        y += 2;
        const er = drawText('기타 기록 데이터', M, y, 18, 'bold', '#666', CW);
        y = er.y + er.h + 2;
        for (const k of extraKeys) {
          if (y > PH - 12) { doc.addPage(); y = M; }
          let val = stepData[k];
          // JSON 객체를 사람이 읽기 쉽게 포맷팅
          if (typeof val === 'object' && val !== null) {
            try {
              if (val.fe || val.sus) {
                // CCP 검사 결과 형식: {fe: {result, time}, sus: {result, time}}
                const parts = [];
                if (val.fe) parts.push(`Fe: ${val.fe.result||'-'} (${val.fe.time||'-'})`);
                if (val.sus) parts.push(`SUS: ${val.sus.result||'-'} (${val.sus.time||'-'})`);
                val = parts.join(' / ');
              } else if (val.num != null) {
                // 샘플 형식: {num, result, time}
                val = `#${val.num} ${val.result||'-'} (${val.time||'-'})`;
              } else {
                val = JSON.stringify(val);
              }
            } catch { val = JSON.stringify(val); }
          }
          const r = tableRow(k, String(val), y); y = r.nextY;
        }
      }
    } else {
      // stepData 없음 → "내용 없음" 표시
      y = sectionTitle('작업자 기입 내용', y);
      const r = tableRow('기록 데이터', '', y);
      y = r.nextY;
      if (isCCP) {
        const r2 = tableRow('CCP 검사 기록', '', y);
        y = r2.nextY;
      }
    }

    y += 4;

    // ── 원재료 사용 내역 (그룹핑 + 개별 ID 표시) ──
    if (usedLots) {
      y = sectionTitle('원재료 추적 (Traceability)', y);

      const allLots = usedLots.split(',').map(l => l.trim()).filter(l => l);

      // 동일 ID 그룹핑
      const lotGroups = {};
      const lotOrder = [];
      for (const lot of allLots) {
        if (!lotGroups[lot]) { lotGroups[lot] = 0; lotOrder.push(lot); }
        lotGroups[lot]++;
      }

      const ROW_H = 12;
      if (lotOrder.length < allLots.length) {
        for (let gi = 0; gi < lotOrder.length; gi++) {
          if (y > PH - 14) { doc.addPage(); y = M; }
          const lotId = lotOrder[gi];
          const cnt = lotGroups[lotId];
          doc.setFillColor(gi % 2 === 0 ? 242 : 232, gi % 2 === 0 ? 247 : 245, 253);
          doc.rect(M, y, CW, ROW_H, 'F');
          doc.setDrawColor(210, 220, 240); doc.setLineWidth(0.1);
          doc.rect(M, y, CW, ROW_H);
          const label = cnt > 1 ? `${gi+1}. ${lotId}  ×${cnt}` : `${gi+1}. ${lotId}`;
          drawText(label, M + 2, y + 1.5, 14, 'normal', '#0d47a1', CW - 4);
          y += ROW_H;
        }
      } else {
        for (let li = 0; li < allLots.length; li++) {
          if (y > PH - 14) { doc.addPage(); y = M; }
          doc.setFillColor(li % 2 === 0 ? 242 : 232, li % 2 === 0 ? 247 : 245, 253);
          doc.rect(M, y, CW, ROW_H, 'F');
          doc.setDrawColor(210, 220, 240); doc.setLineWidth(0.1);
          doc.rect(M, y, CW, ROW_H);
          drawText(`${li + 1}. ${allLots[li]}`, M + 2, y + 1.5, 14, 'normal', '#0d47a1', CW - 4);
          y += ROW_H;
        }
      }

      // 총 투입 수량 요약
      y += 1.5;
      doc.setFillColor(248, 250, 255);
      doc.rect(M, y, CW, 12, 'F');
      const summaryText = lotOrder.length < allLots.length
        ? `총 투입: ${allLots.length}건 (${lotOrder.length}종)`
        : `총 투입: ${allLots.length}건`;
      drawText(summaryText, M + 2, y + 1.5, 14, 'bold', '#1565c0', CW - 4);
      y += 14;
    }

    // ── 사진 영역 ──
    const allPhotoUrls = [];
    if (photoUrlsRaw) allPhotoUrls.push(...photoUrlsRaw.split(' | ').filter(u => u.trim()));
    if (photoUrl && !allPhotoUrls.includes(photoUrl)) allPhotoUrls.push(photoUrl);

    if (allPhotoUrls.length > 0) {
      if (y > PH - 50) { doc.addPage(); y = M; }
      y += 2;
      y = sectionTitle(`첨부사진 (${allPhotoUrls.length}장)`, y);

      const photoW = allPhotoUrls.length === 1 ? Math.min(CW - 4, 130) : (CW - 8) / 2;
      const photoH = photoW * 0.75;
      let px = M + 2, colIdx = 0;

      for (const pUrl of allPhotoUrls) {
        if (y + photoH > PH - 15) { doc.addPage(); y = M; px = M + 2; colIdx = 0; }

        const b64 = await loadPhoto(pUrl);
        if (b64) {
          // 테두리
          doc.setDrawColor(200, 210, 230); doc.setLineWidth(0.3);
          doc.rect(px, y, photoW, photoH);
          const imgFmt = b64.startsWith('data:image/png') ? 'PNG' : 'JPEG';
          doc.addImage(b64, imgFmt, px + 0.5, y + 0.5, photoW - 1, photoH - 1);
        } else {
          doc.setDrawColor(200); doc.setFillColor(245, 245, 245);
          doc.rect(px, y, photoW, photoH, 'FD');
          drawText('사진 로드 실패', px + 4, y + photoH/2 - 5, 14, 'normal', '#999', photoW - 8);
        }

        colIdx++;
        if (allPhotoUrls.length === 1 || colIdx >= 2) {
          y += photoH + 3; px = M + 2; colIdx = 0;
        } else {
          px += photoW + 4;
        }
      }
      if (colIdx > 0) y += photoH + 3;
    } else {
      // 사진 없음
      if (y > PH - 20) { doc.addPage(); y = M; }
      y += 2;
      y = sectionTitle('첨부사진', y);
      const r = tableRow('사진 기록', '', y);
      y = r.nextY;
    }
  } // end for each record

  /* ═══════════════════════════════════════════
     마지막 페이지: 확인 및 서명
     ═══════════════════════════════════════════ */
  doc.addPage();
  y = processHeader('확인 및 서명', 'HACCP 생산기록 확인서');
  y += 2;

  y = sectionTitle('HACCP 생산기록 확인', y);

  const confirmItems = [
    ['문서번호', woId],
    ['제품명', wo[4] || '-'],
    ['생산량', `${wo[5]||'-'} kg / ${wo[7]||'-'} 개`],
    ['생산기간', `${(wo[9]||'-').substring(0,16)} ~ ${(wo[10]||'-').substring(0,16)}`],
    ['CCP결과', ccpRecords.length > 0 ? '검사 완료' : '해당 없음'],
    ['LOT추적', inputRecords.filter(r => r[4]).length > 0 ? '전체 기록됨' : '해당 없음'],
    ['냉동보관', storeRecords.length > 0 ? '기록됨' : '해당 없음'],
    ['공정완료', `${records.filter(r=>r[10]==='완료').length} / ${records.length}단계`],
    ['완제품LOT', wo[14] || '-'],
  ];
  for (const [l, v] of confirmItems) {
    const r = tableRow(l, v, y); y = r.nextY;
  }

  y += 10;

  // 서명란
  y = sectionTitle('서명란', y);

  const woStatus = wo[12] || '';
  const isApproved = woStatus === '출하승인' || woStatus === '출하가능';

  const sigEntries = [
    ['작업자 (생산담당)', wo[8] || '', (wo[10] || '').substring(0, 16), true],
    ['출하 승인', wo[15] || '', (wo[16] || '').substring(0, 16), isApproved],
  ];
  for (const [role, name, dt, signed] of sigEntries) {
    if (y > PH - 70) { doc.addPage(); y = M; }
    const rr = drawText(role, M + 2, y, 18, 'bold', '#333', CW * 0.6);
    // 승인 상태 배지
    const badgeText = signed && name ? '서명 완료' : '미서명';
    const badgeColor = signed && name ? [232,245,233] : [255,243,224];
    const badgeTextColor = signed && name ? '#2e7d32' : '#e65100';
    doc.setFillColor(...badgeColor);
    const badgeW = 36, badgeH = 10;
    doc.roundedRect(M + CW - badgeW - 2, y, badgeW, badgeH, 2, 2, 'F');
    drawText(badgeText, M + CW - badgeW, y + 1, 13, 'bold', badgeTextColor, badgeW - 2);
    y = rr.y + rr.h + 3;
    let r;
    r = tableRow('성명', name || '-', y, 40); y = r.nextY;
    r = tableRow('일시', dt || '-', y, 40); y = r.nextY;
    // 서명란 박스 (전자확인 표시)
    doc.setDrawColor(180); doc.setLineWidth(0.3);
    doc.rect(M, y, CW, 22);
    if (signed && name) {
      drawText('전자 확인', M + 3, y + 3, 14, 'normal', '#888', 35);
      drawText(`${name} (${dt || '-'})`, M + 42, y + 3, 16, 'bold', '#1565c0', CW - 48);
      doc.setFillColor(232, 245, 233);
      doc.roundedRect(M + CW - 34, y + 3, 30, 16, 2, 2, 'F');
      drawText('확인 완료', M + CW - 32, y + 7, 14, 'bold', '#2e7d32', 28);
    } else {
      drawText('서명:', M + 3, y + 5, 15, 'normal', '#888', 25);
      doc.setDrawColor(200); doc.setLineWidth(0.15);
      doc.line(M + 30, y + 18, M + CW - 5, y + 18);
    }
    y += 26;
  }

  /* ── 페이지 번호 + 푸터 ── */
  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    // 구분선
    doc.setDrawColor(200, 210, 230); doc.setLineWidth(0.2);
    doc.line(M, PH - 14, PW - M, PH - 14);
    // 좌측: WO번호
    doc.setFontSize(10); doc.setTextColor(170);
    if (fontLoaded) doc.setFont('NanumGothic', 'normal');
    doc.text(woId, M, PH - 6);
    // 중앙: 페이지 번호
    doc.text(`${i} / ${totalPages}`, PW / 2, PH - 6, { align: 'center' });
    // 우측: 회사명
    doc.text('MAYTUTU · HACCP', PW - M, PH - 6, { align: 'right' });
  }

  /* ── PDF Blob 생성 ── */
  const pdfBlob = doc.output('blob');
  const productName = (wo[4] || '작업지시서').replace(/[\/\\?%*:|"<>]/g, '');
  const fileName = `${productName}_${woId}.pdf`;

  return { pdfBlob, fileName };
}

async function approveWO(woId) {
  confirm('출하승인', '냉동 12시간이 경과되었습니다.\n출하승인하시겠습니까? 완제품 재고로 등록됩니다.', async () => {
    if (!acquireLock('approveWO')) return;
    try {
      showLoading();
      // 캐시 무효화 후 최신 상태 확인 (동시 승인/거부 경합 방지)
      SheetsAPI.invalidateCache('작업지시서');
      const wos = await SheetsAPI.getAll('작업지시서', false);
      const wo = wos.find(w => w[0] === woId && w[12] !== '삭제');
      if (!wo) throw new Error('WO not found');
      // 상태 전이 검증: 냉동보관중/승인대기에서만 승인 가능
      const validStatuses = ['냉동보관중', '승인대기'];
      if (!validStatuses.includes(wo[12])) {
        toast(`현재 상태가 "${wo[12]}"입니다. 승인할 수 없는 상태입니다.`, 'err', 4000);
        hideLoading(); return;
      }

      // 12시간 재검증
      const freezeStart = wo[11] ? new Date(wo[11]) : null;
      const freezeHours = freezeStart ? (new Date() - freezeStart) / (1000*60*60) : 0;
      if (freezeHours < 12) {
        toast(`냉동 ${freezeHours.toFixed(1)}시간 경과. 12시간 이후 승인 가능합니다.`, 'err');
        hideLoading();
        return;
      }

      const packCount = parseInt(wo[7]) || 50;
      const qty = parseFloat(wo[5]) || 50;
      const fgItemCode = wo[3] || 'FG002';

      // 생산일 = WO 시작시간(wo[9]) 기준 (실제 제조일)
      const prodDateStr = wo[9] || wo[10] || formatDate();
      const prodDate = new Date(prodDateStr);
      // 소비기한 = 생산일 + 6개월
      const expDt = new Date(prodDate);
      expDt.setMonth(expDt.getMonth() + 6);
      const expDate = formatDate(expDt);
      const productionDate = formatDate(prodDate);

      // FG LOT ID: QR라벨 단계에서 사전 생성된 ID가 있으면 재사용, 없으면 새로 채번
      let fgLotId = wo[14] || '';
      if (!fgLotId || !fgLotId.startsWith('FG-')) {
        fgLotId = await generateLotId('FG', fgItemCode, expDate, '완제품LOT', 0, productionDate);
      } else {
        console.log(`[승인] 사전 생성된 FG LOT ID 재사용: ${fgLotId}`);
      }

      // ⚠ Race-condition Self-Healing (PR #27)
      //   동시 채번으로 같은 ID 가 다른 WO 와 겹쳤는지 검증.
      //   내 WO 의 row 가 시트에서 첫째가 아니면 새 ID 자동 발급.
      //   채번 atomicity 불가한 Sheets API 한계를 승인 시점 정정으로 보완.
      SheetsAPI.invalidateCache('완제품LOT');
      const allFgLots = await SheetsAPI.getAll('완제품LOT', false);
      const sameIdRows = allFgLots.filter(l => l[0] === fgLotId);
      const myRowIdx = sameIdRows.findIndex(l => l[7] === woId);
      if (sameIdRows.length > 0 && myRowIdx !== 0) {
        // 충돌 — 다른 WO 가 같은 ID 를 먼저 점유한 상태
        console.warn(`[승인] LOT ID ${fgLotId} 충돌 감지 (다른 WO 가 점유) → 새 ID 자동 발급`);
        toast(`⚠ LOT ID 충돌 감지 — 새 ID 자동 발급`, 'warn', 3000);
        const newId = await generateLotId('FG', fgItemCode, expDate, '완제품LOT', 0, productionDate);
        // 안전 검증: 새 ID 도 비어있어야 함
        const newIdConflict = allFgLots.find(l => l[0] === newId);
        if (newIdConflict) {
          // 극히 드문 경우 — 한 번 더 짧은 지연 후 재발급
          await new Promise(r => setTimeout(r, 500 + Math.random() * 300));
          fgLotId = await generateLotId('FG', fgItemCode, expDate, '완제품LOT', 0, productionDate);
        } else {
          fgLotId = newId;
        }
        console.log(`[승인] 충돌 정정: ${wo[14]} → ${fgLotId}`);
      }

      // 1. Update WO — 출하가능 상태로 (충돌 정정된 fgLotId 반영)
      await SheetsAPI.updateRow('작업지시서', 0, woId, {
        12: '출하가능',
        14: fgLotId,
        15: State.user?.email,
        16: formatDateTime(),
      });

      // 2. FG LOT 생성 또는 placeholder 갱신
      //    QR라벨 단계에서 atomic claim으로 placeholder('채번예약') 적재된 경우 → updateRow
      //    없으면(레거시 경로) → append
      SheetsAPI.invalidateCache('완제품LOT');
      const existingFgLot = (await SheetsAPI.getAll('완제품LOT', false)).find(l => l[0] === fgLotId);
      if (existingFgLot && existingFgLot[9] === '채번예약') {
        // placeholder 행 갱신 — 이미 row 존재 (race-safe)
        await SheetsAPI.updateRow('완제품LOT', 0, fgLotId, {
          2: wo[4] || '앙호두 (호두과자 전용반죽)',
          3: qty,
          4: wo[6] || '1kg',
          5: productionDate,
          6: expDate,
          7: woId,
          8: String(packCount),
          9: '출하가능',
          10: packCount,
          11: '냉동 -18°C'
        });
        console.log(`[승인] placeholder 갱신: ${fgLotId}`);
      } else if (!existingFgLot) {
        // 레거시 경로 — placeholder 없으면 신규 append
        await SheetsAPI.append('완제품LOT', [
          fgLotId, fgItemCode, wo[4] || '앙호두 (호두과자 전용반죽)', qty, wo[6] || '1kg',
          productionDate, expDate, woId, String(packCount), '출하가능', packCount, '냉동 -18°C'
        ]);
        console.log(`[승인] FG LOT 신규 append: ${fgLotId}`);
      } else {
        // 같은 ID 의 row 가 '채번예약' 이외 상태로 있음 — 중복 방지: append 하지 않고 갱신
        console.warn(`[승인] FG LOT 이미 존재 (status=${existingFgLot[9]}) — append 스킵, 갱신만`);
        await SheetsAPI.updateRow('완제품LOT', 0, fgLotId, {
          3: qty, 7: woId, 8: String(packCount), 9: '출하가능', 10: packCount
        });
      }

      // 3. Create FG individual QR records
      //    재발 방지: 같은 lotId 의 개별이 이미 있으면 중복 생성 차단 (idempotent)
      //    원인이 될 수 있는 경로: 더블 클릭 / 네트워크 재시도 / race
      SheetsAPI.invalidateCache('완제품개별');
      const existingIndivs = await SheetsAPI.getAll('완제품개별', false);
      const existingForLot = existingIndivs.filter(iv => iv[1] === fgLotId);
      if (existingForLot.length > 0) {
        console.warn(`[승인] FG LOT ${fgLotId} 의 개별 ${existingForLot.length}개 이미 존재 — 중복 생성 차단`);
        toast(`⚠ 개별 이미 존재 (${existingForLot.length}개) — 중복 생성 차단`, 'warn', 3000);
      } else {
        const indivRows = [];
        for (let i = 1; i <= packCount; i++) {
          const fgIndivId = `${fgLotId}-${String(i).padStart(2,'0')}`;
          indivRows.push([fgIndivId, fgLotId, fgItemCode, '출하가능', '', '', qrImageUrl(fgIndivId)]);
        }
        await SheetsAPI.append('완제품개별', indivRows);
      }

      toast(`출하승인 완료! ${fgLotId} 완제품 재고 등록 (QR ${packCount}개)`, 'suc', 5000);

      // PDF 자동 생성 (백그라운드 — 실패해도 승인 흐름 중단하지 않음)
      generateAndSaveWOPdf(woId).then(pdfUrl => {
        toast('📄 작업지시서 PDF 저장 완료', 'suc', 3000);
      }).catch(e => {
        console.error('[PDF] 자동 생성 실패:', e);
        toast('⚠️ PDF 생성 실패 — 상세 화면에서 재시도 가능', 'warn', 4000);
      });

      Router.go('production');

    } catch (e) {
      toast('승인 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
      releaseLock('approveWO');
    }
  });
}

    const wo = wos.find(w => w[0] === woId);

    hideLoading();

  }
}

async function processDisposal(itemId, lotId, type, itemName) {
  // 폐기 사유 입력 — 커스텀 모달 (CON-013: prompt() 대체)
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';

      </div>
      <div class="d-actions">
        <button class="btn btn-sm btn-outline btn-gray" id="disposal-cancel">취소</button>
        <button class="btn btn-sm btn-err" id="disposal-ok">폐기 진행</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#disposal-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#disposal-ok').onclick = () => {
    const reason = overlay.querySelector('#disposal-reason').value?.trim();
    if (!reason) { toast('폐기 사유를 입력해야 합니다', 'err'); return; }
    overlay.remove();
    _executeDisposal(itemId, lotId, type, itemName, reason);
  };
}

async function _executeDisposal(itemId, lotId, type, itemName, reason) {

  confirm('폐기 처리', `${itemId}\n${itemName}\n사유: ${reason}\n\n정말 폐기하시겠습니까?`, async () => {
    if (!acquireLock('executeDisposal')) return;
    try {
      showLoading();
      const isFG = type === '완제품';
      const isRM = type === '원재료';
      const isSP = type === '소모품';

      // 개별 레코드 상태 변경
      if (isFG) {
        await SheetsAPI.updateRow('완제품개별', 0, itemId, { 3: '폐기', 4: formatDateTime(), 5: `폐기:${reason}` });
      } else if (isRM) {
        await SheetsAPI.updateRow('원재료개별', 0, itemId, { 3: '폐기', 4: formatDateTime(), 5: `폐기:${reason}` });
      } else if (isSP && lotId) {
        // 소모품은 LOT 단위
        await SheetsAPI.updateRow('소모품LOT', 0, lotId, { 7: '폐기' });
      }

      // LOT 잔량 + 상태 업데이트 (개별 폐기 시) — 캐시 무효화 후 fresh 데이터 (CON-014)
      if ((isRM || isFG) && lotId) {
        const lotTab = isFG ? '완제품LOT' : '원재료LOT';
        const indivTab = isFG ? '완제품개별' : '원재료개별';
        SheetsAPI.invalidateCache(indivTab);
        SheetsAPI.invalidateCache(lotTab);
        const lots = await SheetsAPI.getAll(lotTab, false);
        const lot = lots.find(l => l[0] === lotId);
        if (lot) {
          const indivs = await SheetsAPI.getAll(indivTab, false);
          const activeIndivs = indivs.filter(iv => iv[1] === lotId && !['폐기','소진','출하완료','입고취소'].includes(iv[3]));
          const newStatus = activeIndivs.length === 0 ? '소진' : lot[9];
          if (isFG) {
            // 완제품: 잔량 = 활성 개별 수
            await SheetsAPI.updateRow(lotTab, 0, lotId, { 8: String(activeIndivs.length), 9: newStatus });
          } else {
            // 원재료: 잔량 = 활성 개별 수 × perUnit (개별 실제 수량 기반)
            const sampleIndiv = indivs.find(iv => iv[1] === lotId);
            const totalQty = parseFloat(lot[4]) || 0;
            const perUnit = sampleIndiv ? (parseFloat(sampleIndiv[4]) || totalQty / (parseInt(lot[10]) || 1))
                                        : totalQty / (parseInt(lot[10]) || 1);
            const newRemain = Math.round(activeIndivs.length * perUnit * 100) / 100;
            await SheetsAPI.updateRow(lotTab, 0, lotId, { 8: String(newRemain), 9: newStatus });
          }
        }
      }

      toast(`폐기 완료: ${itemId}`, 'suc');
      setTimeout(() => Router.go('qr-scan'), 1500);
    } catch (e) {
      toast('폐기 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
      releaseLock('executeDisposal');
    }
  });
}

  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog" style="max-width:380px">
      <div class="fs-16 fw-7 mb-8">🚚 LOT 전체 출하</div>
      <div class="fs-12 c-txt-l mb-4">${lotId}<br>${itemName}</div>
      <div class="card bl-warn" style="background:#fff8e1;padding:8px 10px;margin-bottom:12px">
        <div class="fs-12 fw-6">예상 출하 ${expectedCount}개 (개별 '출하가능' 항목 모두)</div>
        <div class="fs-11 c-txt-l">상태 '냉동보관중' 등은 제외 · 메모 입력 후 일괄 처리</div>
      </div>
      <div class="input-group" style="margin-bottom:12px">
        <label>출하 메모 (선택)</label>
        <input type="text" id="lot-ship-note" placeholder="예: 직접 출하 / 거래처명 / 기타" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
      </div>
      <div class="d-actions">
        <button class="btn btn-sm btn-outline btn-gray" id="lot-ship-cancel">취소</button>
        <button class="btn btn-sm btn-suc" id="lot-ship-ok">전체 출하 진행</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#lot-ship-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#lot-ship-ok').onclick = () => {
    const note = overlay.querySelector('#lot-ship-note').value?.trim() || '직접 출하';
    overlay.remove();
    executeLotShipment(lotId, itemName, note, '');
  };
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

/* LOT 전체 출하 실행 — 모든 '출하가능' 개별을 출하완료로 일괄 갱신.
   각 개별별 출하기록 행 + 상태 변경 + LOT 잔량/상태 업데이트 + WO 출하완료 전환. */
async function executeLotShipment(lotId, itemName, customerName, customerCode) {
  if (!acquireLock('executeLotShipment')) return;
  try {
    showLoading();
    SheetsAPI.invalidateCache('완제품개별');
    SheetsAPI.invalidateCache('완제품LOT');
    const allIndivs = await SheetsAPI.getAll('완제품개별', false);
    const targetIndivs = allIndivs.filter(iv => iv[1] === lotId && iv[3] === '출하가능');
    if (targetIndivs.length === 0) {
      toast(`${lotId}: 출하가능 상태인 개별이 없습니다`, 'err');
      return;
    }
    const shipTime = formatDateTime();
    const shipperEmail = State.user?.email || '';

    // 1. 출하기록 일괄 append + 각 개별 행 인덱스 수집
    const shipRows = [];
    const indivUpdates = [];
    for (const iv of targetIndivs) {
      const shipId = await generateSeqId('SHP', '출하기록');
      shipRows.push([shipId, lotId, iv[0], customerName, '1', 'ea', shipTime, shipperEmail]);
      const idx = await SheetsAPI.findRowIndex('완제품개별', 0, iv[0]);
      if (idx > 0) {
        indivUpdates.push({ range: `완제품개별!D${idx}`, values: [['출하완료']] });
        indivUpdates.push({ range: `완제품개별!E${idx}`, values: [[shipTime]] });
        indivUpdates.push({ range: `완제품개별!F${idx}`, values: [[shipperEmail]] });
      }
    }
    // 출하기록 한꺼번에 append
    if (shipRows.length > 0) await SheetsAPI.append('출하기록', shipRows);
    // 개별 상태 batchUpdate
    if (indivUpdates.length > 0) await SheetsAPI.batchUpdate(indivUpdates);

    // 2. LOT 잔량/상태 갱신
    SheetsAPI.invalidateCache('완제품개별');
    const refreshed = await SheetsAPI.getAll('완제품개별', false);
    const lotIndivs = refreshed.filter(iv => iv[1] === lotId);
    const remainCount = lotIndivs.filter(iv => !['출하완료','폐기','입고취소','삭제'].includes(iv[3])).length;
    const lotIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
    if (lotIdx > 0) {
      const lotBatch = [{ range: `완제품LOT!I${lotIdx}`, values: [[String(remainCount)]] }];
      if (remainCount === 0) lotBatch.push({ range: `완제품LOT!J${lotIdx}`, values: [['출하완료']] });
      await SheetsAPI.batchUpdate(lotBatch);
    }

    // 3. WO 출하완료 전환 (LOT 전체 소진 시)
    if (remainCount === 0) {
      try {
        const wos = await SheetsAPI.getAll('작업지시서');
        const wo = wos.find(w => w[14] === lotId && (w[12] === '출하가능' || w[12] === '냉동보관중'));
        if (wo) await SheetsAPI.updateCell('작업지시서', 0, wo[0], 12, '출하완료');
      } catch (e) { console.warn('WO 상태 전환 실패:', e); }
    }

    SheetsAPI.invalidateCache('완제품LOT');
    SheetsAPI.invalidateCache('완제품개별');
    toast(`${lotId} 전체 출하 완료 — ${targetIndivs.length}개 → ${customerName}`, 'suc', 4000);
    setTimeout(() => Router.go('inventory'), 1200);
  } catch (e) {
    toast('전체 출하 실패: ' + e.message, 'err', 5000);
    console.error('[executeLotShipment]', e);
  } finally {
    hideLoading();
    releaseLock('executeLotShipment');
  }
}

async function executeShipment(indivId, lotId, itemName, customerName, customerCode) {
  if (!acquireLock('executeShipment')) return;
  try {
    showLoading();

    // ── 서버 사이드 상태 재검증 (중복 출하/이미 폐기된 항목 차단) ──
    SheetsAPI.invalidateCache('완제품개별');
    const freshIndivs = await SheetsAPI.getAll('완제품개별', false);
    const currentIndiv = freshIndivs.find(iv => iv[0] === indivId);
    if (!currentIndiv) { toast('해당 항목을 찾을 수 없습니다', 'err'); return; }
    if (['출하완료','폐기','소진'].includes(currentIndiv[3])) {
      toast(`이미 ${currentIndiv[3]} 처리된 항목입니다. 중복 처리가 방지되었습니다.`, 'err', 4000);
      return;
    }

    const shipTime = formatDateTime();

    // 1. 완제품개별 상태 + 출하기록을 병렬로 처리
    const shipId = await generateSeqId('SHP', '출하기록');
    const [indivRowIdx] = await Promise.all([
      SheetsAPI.findRowIndex('완제품개별', 0, indivId),
      SheetsAPI.append('출하기록', [
        shipId, lotId, indivId, customerName, '1', 'ea', shipTime, State.user?.email
      ])
    ]);

    // 2. 개별 상태 업데이트 (batchUpdate)
    if (indivRowIdx > 0) {
      await SheetsAPI.batchUpdate([
        { range: `완제품개별!D${indivRowIdx}`, values: [['출하완료']] },
        { range: `완제품개별!E${indivRowIdx}`, values: [[shipTime]] },
        { range: `완제품개별!F${indivRowIdx}`, values: [[State.user?.email || '']] },
      ]);
    }

    // 3. LOT 잔량 업데이트 (캐시 무효화 후 fresh 데이터)
    SheetsAPI.invalidateCache('완제품개별');
    const allIndivs = await SheetsAPI.getAll('완제품개별', false);
    const lotIndivs = allIndivs.filter(iv => iv[1] === lotId);
    const activeCount = lotIndivs.filter(iv => !['출하완료','폐기','입고취소','삭제'].includes(iv[3])).length;

    // 4. LOT remain + 상태를 한 번에 업데이트
    const lotRowIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
    if (lotRowIdx > 0) {
      const lotBatch = [{ range: `완제품LOT!I${lotRowIdx}`, values: [[String(activeCount)]] }];
      if (activeCount === 0) {
        lotBatch.push({ range: `완제품LOT!J${lotRowIdx}`, values: [['출하완료']] });
      }
      await SheetsAPI.batchUpdate(lotBatch);
    }

    // 5. LOT 전체 출하 시 WO 상태도 '출하완료'로 전환 (CON-010)
    if (activeCount === 0) {
      try {
        const wos = await SheetsAPI.getAll('작업지시서');
        const wo = wos.find(w => w[14] === lotId && (w[12] === '출하가능' || w[12] === '냉동보관중'));
        if (wo) {
          await SheetsAPI.updateCell('작업지시서', 0, wo[0], 12, '출하완료');
        }
      } catch (e) { console.warn('WO 상태 전환 실패:', e); }
    }

    toast(`출하 완료: ${indivId} → ${customerName}`, 'suc');
    if (State.currentScreen === 'qr-scan') {
      setTimeout(() => Router.go('qr-scan'), 1000);
    } else {
      setTimeout(() => Router.go('inventory'), 1000);
    }
  } catch (e) {
    toast('출하 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
    releaseLock('executeShipment');
  }
}

// 하위호환: 기존 processShipment 호출 시 팝업으로 전환

/* ═══════════════════════════════════════════════
   APP INITIALIZATION
   ═══════════════════════════════════════════════ */
async function initApp() {
  // Load settings
  CONFIG.SHEET_ID = localStorage.getItem('mt_sheet_id') || CONFIG.SHEET_ID;
  CONFIG.DRIVE_FOLDER_ID = localStorage.getItem('mt_drive_folder') || CONFIG.DRIVE_FOLDER_ID;

  // Check auth FIRST (before replaceState, to preserve OAuth callback hash)
  const hasToken = Auth.init();

  // Set initial browser history state AFTER auth (prevents immediate exit on first back press)
  history.replaceState({ screen: 'init' }, '', window.location.href.split('#')[0] + '#init');

  if (hasToken) {
    showLoading();
    // Load user info
    const savedUser = localStorage.getItem('mt_user');
    if (savedUser) {
      State.user = JSON.parse(savedUser);
    }

    // Validate token
    const valid = await Auth.validateToken();
    if (!valid) {
      hideLoading();
      Auth.logout();
      return;
    }

    // If no user info yet, load it
    if (!State.user) {
      await Auth.loadUserInfo();
    }

    hideLoading();

    // Check if Sheet ID is set
    if (!CONFIG.SHEET_ID) {
      Router.go('settings');
      toast('Google Sheets ID를 설정해주세요', 'warn');
      return;
    }

    // 풀투리프레시 / 페이지 리로드 후 마지막 화면 복원 시도, 없으면 dashboard
    if (!restoreLastScreen()) {
      Router.go('dashboard');
    }

    // LiveSync 초기화 — PC↔모바일 실시간 동기화
    LiveSync.init();

    // [제거됨] 냉동 상태 체크 — 관리자 승인 경로만 사용

    // ── 마이그레이션: 진행중 WO에 FG LOT ID 사전 채번 ──
    if (!localStorage.getItem('mt_migr_fg_lot_preassign')) {
      (async () => {
        try {
          const targetWOs = ['WO-20260421-001', 'WO-20260422-001', 'WO-20260422-002'];
          const allWO = await SheetsAPI.getAll('작업지시서');
          for (const woId of targetWOs) {
            const wo = allWO.find(r => r[0] === woId);
            if (!wo) { console.log(`[마이그레이션] ${woId} 미발견, skip`); continue; }
            if (wo[14] && wo[14].startsWith('FG-')) {
              console.log(`[마이그레이션] ${woId} 이미 FG LOT ID 존재: ${wo[14]}, skip`);
              continue;
            }
            // 생산일 = WO 시작시간(col9) 기준
            const prodDateStr = wo[9] || formatDate();
            const prodDate = new Date(prodDateStr);
            const productionDate = formatDate(prodDate);
            // 소비기한 = 생산일 + 6개월
            const expDate = new Date(prodDate);
            expDate.setMonth(expDate.getMonth() + 6);
            const expStr = formatDate(expDate);
            const fgItemCode = wo[3] || 'FG002';
            const fgLotId = await generateLotId('FG', fgItemCode, expStr, '완제품LOT', 0, productionDate);
            await SheetsAPI.updateCell('작업지시서', 0, woId, 14, fgLotId);
            console.log(`[마이그레이션] ${woId} → FG LOT ID 사전 채번 완료: ${fgLotId} (생산일: ${productionDate})`);
          }
          localStorage.setItem('mt_migr_fg_lot_preassign', '1');
          console.log('[마이그레이션] FG LOT ID 사전 채번 마이그레이션 완료');
        } catch (e) {
          console.error('[마이그레이션] FG LOT ID 사전 채번 실패:', e.message);
          // 실패 시 플래그 미설정 → 다음 로그인 시 재시도
        }
      })();
    }

    // ── LOT 잔량-개별 정합성 자동 체크 (매 로그인 시) ──
    (async () => {
      try {
        const rmLots = await SheetsAPI.getAll('원재료LOT');
        const rmIndivs = await SheetsAPI.getAll('원재료개별');
        const fgLots = await SheetsAPI.getAll('완제품LOT');
        const fgIndivs = await SheetsAPI.getAll('완제품개별');
        let fixCount = 0;

        // 원재료 LOT: 잔량 = 활성개별수 × perUnit, 상태 = 활성개별 기반
        for (const lot of rmLots) {
          const lotId = lot[0], totalQty = parseFloat(lot[4]) || 0;
          const remain = parseFloat(lot[8]) || 0;
          const status = lot[9] || '';
          const myIndivs = rmIndivs.filter(iv => iv[1] === lotId);
          const active = myIndivs.filter(iv => !['폐기','소진','입고취소'].includes(iv[3]));
          const consumed = myIndivs.filter(iv => iv[3] === '소진');
          // perUnit: 개별 항목의 실제 수량 우선 사용 (lot[10] 의존 제거)
          const sampleIndiv = myIndivs[0];
          const perUnit = sampleIndiv ? (parseFloat(sampleIndiv[4]) || totalQty / (parseInt(lot[10]) || 1))
                                      : totalQty / (parseInt(lot[10]) || 1);
          const correctRemain = Math.round(active.length * perUnit * 100) / 100;
          const correctStatus = active.length === 0 ? '소진' : (consumed.length > 0 ? '사용중' : '미사용');
          if (Math.abs(remain - correctRemain) > 0.01 || status !== correctStatus) {
            await SheetsAPI.updateRow('원재료LOT', 0, lotId, { 8: String(correctRemain), 9: correctStatus });
            console.log(`[정합성] ${lotId}: 잔량 ${remain}→${correctRemain}, 상태 ${status}→${correctStatus}`);
            fixCount++;
          }
        }

        // 완제품 LOT: remainQty = 활성개별수(냉동보관중+출하가능)
        for (const lot of fgLots) {
          const lotId = lot[0];
          const dbRemain = parseInt(lot[8]) || 0;
          const active = fgIndivs.filter(iv => iv[1] === lotId && ['냉동보관중','출하가능'].includes(iv[3]));
          if (dbRemain !== active.length) {
            await SheetsAPI.updateRow('완제품LOT', 0, lotId, { 8: String(active.length) });
            console.log(`[정합성] ${lotId}: remainQty ${dbRemain}→${active.length}`);
            fixCount++;
          }
        }

        if (fixCount > 0) {
          SheetsAPI.invalidateAllCache();
          console.log(`[정합성] ${fixCount}건 자동 보정 완료`);
        }
      } catch (e) {
        console.warn('[정합성] 체크 실패:', e.message);
      }
    })();

    // ── 완료된 마이그레이션 플래그 설정 (더 이상 실행 불필요) ──
    ['mt_migr_step2_check','mt_migr_qr_url_cleanup','mt_migr_gen_indiv_v2','mt_migr_lot_id_v1']
      .forEach(k => { if (!localStorage.getItem(k)) localStorage.setItem(k, '1'); });

  } else {
    Router.go('login');
  }
}

// ── 네트워크 상태 감지 (오프라인 작업 방지) ──
let _offlineBanner = null;
window.addEventListener('offline', () => {
  if (_offlineBanner) return;
  _offlineBanner = document.createElement('div');
  _offlineBanner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:var(--err,#e24b4a);color:#fff;text-align:center;padding:10px;font-size:14px;font-weight:600';
  _offlineBanner.textContent = '⚠ 네트워크 연결이 끊겼습니다. 데이터 저장이 불가능합니다.';
  document.body.prepend(_offlineBanner);
  // 모든 잠금 해제 (오프라인 상태에서 영구 잠금 방지)
  Object.keys(_actionLocks).forEach(k => { _actionLocks[k] = false; });
});
window.addEventListener('online', () => {
  if (_offlineBanner) { _offlineBanner.remove(); _offlineBanner = null; }
  toast('네트워크 연결이 복원되었습니다. 데이터를 새로고침합니다.', 'suc', 3000);
  // 캐시 전체 무효화 + 현재 화면 새로고침
  SheetsAPI.invalidateAllCache();
  setTimeout(() => Router.go(State.currentScreen || 'dashboard'), 1000);
});

// ── 브라우저 닫기/새로고침 시 진행 중 작업 경고 ──
window.addEventListener('beforeunload', (e) => {
  const hasActiveLock = Object.values(_actionLocks).some(v => v);
  if (hasActiveLock) {
    e.preventDefault();
    e.returnValue = '작업이 진행 중입니다. 페이지를 나가면 데이터가 손실될 수 있습니다.';
  }
});

// Start the app
initApp();
