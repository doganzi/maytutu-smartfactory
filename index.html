    실측 가산율 10.25% / 10.22% / 10.01% → 10.2% 로 둔다.
    ⚠️ 회사 부담분이 다른 계정(복리후생비 등)에 이미 잡혀 있으면 이중계상이다 — 버튼을 안 누르면 된다. */
const PNL_EMPLOYER_INS_RATE = 0.102;

/** ERP 재무 DB(회계·재무 05) — 결산 라인. 읽기 전용. */
const ERP_FIN_SID = '1FbqWXusA6KCpJThwZ6f4tNSMw19kSjL7hL19byTrOVE';
const ERP_CLOSING_TAB = 'Closing_Line';
/** ERP 물류 API — 마켓봄 반죽 실매출. 인증 = 이 앱이 이미 가진 구글 토큰(hd=anghodu.biz). */
const ERP_LOGI_API = 'https://maytutu-erp.vercel.app/api/logistics?only=marketbom';

const FactoryPnl = {
  _num(v) { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; },

  /** 'YYYY-MM' 추출 — 날짜/일시 문자열과 구글 시트 날짜 시리얼 모두 대응. 못 읽으면 '' */
  ym(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number' || /^\d+(\.\d+)?$/.test(String(v).trim())) {
      const n = parseFloat(v);
      if (n > 20000 && n < 90000) {                                  // 시트 날짜 시리얼(1900 기준)
        return new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000).toISOString().slice(0, 7);
      }
    }
    const m = String(v).match(/(\d{4})[-./](\d{1,2})/);
    return m ? m[1] + '-' + String(+m[2]).padStart(2, '0') : '';
  },

  /** 완제품 수량 → 봉. 시트 unit 이 kg 이면 5로 나누고, 박스면 packsPerBox 를 곱한다. */
  toPacks(qty, unit, packsPerBox) {
    const q = this._num(qty); if (!q) return 0;
    const u = String(unit || '').trim().toLowerCase();
    if (u === 'kg') return q / PNL_KG_PER_PACK;
    if (u === 'box' || u === '박스') return q * (this._num(packsPerBox) || 1);
    return q;                                                        // 봉·개·pack·공란 = 이미 봉
  },

  /** usedLotIds → 원재료 코드. QR 개별ID(RM-…-01)는 뒤 -NN 을 떼고 LOT 로 맞춘다.
      한 스텝에 여러 LOT 이 섞이면 첫 해석 LOT 의 자재로 전량 귀속(ERP rawMaterialFlow 와 같은 근사). */
  matOf(usedLotIds, codeByRmLot) {
    for (const raw of String(usedLotIds || '').split(/[,\s]+/)) {
      const id = raw.trim(); if (!id) continue;
      const c = codeByRmLot.get(id) || codeByRmLot.get(id.replace(/-\d+$/, ''));
      if (c) return c;
    }
    return '';
  },

  /** 품명 정규화 — 괄호 안 규격을 떼고 공백을 없앤다.
      ⚠ 반죽은 SKU 를 바꿀 때 품명에만 규격이 붙어 다른 상품으로 갈린다
      ("앙호두 전용반죽" vs "앙호두 전용반죽(5kg*3ea)"). 코드로 맞추면 SKU 교체 때마다 끊긴다. */
  normName(s) {
    return String(s || '').replace(/[（(\[【].*?[)\]）】]/g, '').replace(/\s+/g, '').trim();
  },

  /** 마켓봄 판매행 1건의 **봉수/박스** — 박스 규격이 SKU 마다 달라 박스수만으로는 원가를 못 낸다.
      ① 품명의 규격 표기(`(5kg*3ea)`) ② 없으면 박스 공급가 ÷ 봉당 기준단가로 역산.
      실제로 ANG00266(4봉·20kg) → ANG00276(3봉·15kg) 로 2026-07 에 바뀌었고, 옛 SKU 는 품명에 규격이 없다. */
  packsPerBoxOf(row) {
    const m = String(row && row.name || '').match(/\d+(?:\.\d+)?\s*kg\s*[*x×]\s*(\d+)\s*(?:ea|개|팩|pack)?/i);
    if (m) { const n = parseInt(m[1], 10); if (n >= 1 && n <= 12) return n; }
    const qty = this._num(row && row.qty), sup = this._num(row && row.supply);
    if (qty > 0 && sup > 0) {
      const n = Math.round((sup / qty) / PNL_DEFAULT_PRICE);
      if (n >= 1 && n <= 12) return n;
    }
    return 1;
  },

  /** 이 마켓봄 판매행이 우리 공장 생산품인가 — 완제품품목에 등록된 품명과 **정확히** 같을 때만.
      완제품을 새로 등록하면(예: 앙버터 호두과자) 코드 수정 없이 자동으로 잡힌다.
      ⚠️ 앞글자 일치(startsWith)로 하면 안 된다 — 실데이터로 확인한 사고:
         완제품 품명이 "앙호두" 나 "앙호두(호두과자 전용반죽)"(괄호를 떼면 "앙호두") 이면
         앞치마·모자·거울·명함·도장·카라티·쿠폰까지 **굿즈 7종이 공장 매출로 딸려 온다**(3종 → 10종).
         품명이 안 맞으면 매출 0 + 경고로 드러나는 편이, 조용히 부풀려지는 것보다 낫다. */
  isOurProduct(name, fgNames) {
    const n = this.normName(name); if (!n) return false;
    return fgNames.includes(n);
  },

  /** 매칭 진단 — 마켓봄 품목 중 몇 개가 우리 완제품으로 잡혔나. 0 이면 품명이 어긋난 것이다. */
  matchReport(mbRows, fgItems) {
    const fgNames = (fgItems || []).filter(r => r && r[0] && r[7] !== '비활성')
      .map(r => this.normName(r[1] || r[0])).filter(Boolean);
    const all = new Map(), hit = new Map();
    for (const r of (mbRows || [])) {
      if (!r || !r.name) continue;
      all.set(r.code || r.name, r.name);
      if (this.isOurProduct(r.name, fgNames)) hit.set(r.code || r.name, r.name);
    }
    return { total: all.size, matched: [...hit.values()], fgNames };
  },

  /** 원가 구성 — 화면 표시 순서·색. 여기 한 줄 추가하면 표·막대·합계가 같이 따라온다. */
  LINES: [
    { key: 'rawMat',   label: '원재료비',        color: '#3d85c6' },
    { key: 'subMat',   label: '부재료·포장재비', color: '#6aa84f' },
    { key: 'supplies', label: '소모품비',        color: '#a5b4c2' },
    { key: 'scrap',    label: '폐기손실',        color: '#cc4125' },
    { key: 'freight',  label: '택배비',          color: '#e69138' },
    { key: 'labor',    label: '노무비',          color: '#f1c232' },
    { key: 'overhead', label: '제조경비',        color: '#8e7cc3' },
  ],

  /** 월별 손익 집계 — 시트 rows 만 받는 순수 함수. 테스트가 이 함수를 그대로 돌린다. */
  build(src) {
    const S = src || {};
    const fgItems = S.fgItems || [], fgLots = S.fgLots || [], ships = S.ships || [],
          pos = S.pos || [], procs = S.procs || [], rmItems = S.rmItems || [],
          rmLots = S.rmLots || [], rmIndiv = S.rmIndiv || [], spItems = S.spItems || [],
          manual = S.manual || [], mbRows = S.mbRows || [], mbDelivery = S.mbDelivery || {},
          erpLines = S.erpLines || [];

    const fgActive = fgItems.filter(r => r && r[0] && r[7] !== '비활성');
    const fgNames = fgActive.map(r => this.normName(r[1] || r[0])).filter(Boolean);
    const fgMeta = new Map(fgItems.filter(r => r && r[0]).map(r => [r[0], {
      name: r[1] || r[0],
      packsPerBox: this._num(r[8]) || 1,
      price: this._num(r[FG_EXT.supplyPrice]),                       // 원/봉 · VAT 제외 공급가
    }]));
    const rmMeta = new Map(rmItems.filter(r => r && r[0]).map(r => [r[0], {
      name: r[1] || r[0], unit: r[4] || 'kg', price: this._num(r[13]),
      sub: PNL_SUBMAT_RE.test(String(r[5] || '')),                   // 부재료·포장재 여부 = category
    }]));
    const spCodes = new Set(spItems.filter(r => r && r[0]).map(r => r[0]));
    const codeByFgLot = new Map(fgLots.filter(l => l && l[0]).map(l => [l[0], l[1]]));
    const codeByRmLot = new Map(rmLots.filter(l => l && l[0]).map(l => [l[0], l[1]]));
    // 원재료 LOT 개별 1개당 수량 — 폐기 손실 환산용(개별 시트는 폐기되면 [4]가 날짜로 덮여 수량을 잃는다)
    const perUnitByLot = new Map(rmLots.filter(l => l && l[0]).map(l =>
      [l[0], this._num(l[4]) / (parseInt(l[10], 10) || 1)]));

    const M = {};
    const at = ym => (M[ym] = M[ym] || { ym, prodPacks: 0, shipPacks: 0, estRevenue: 0, mbRevenue: 0,
      mbQty: 0, mbPacks: 0, rawUsed: 0, subUsed: 0, rawBuy: 0, subBuy: 0, supplies: 0, unknownBuy: 0,
      scrap: 0, scrapQty: 0, fgScrapPacks: 0, mbDelivery: 0, erpFreight: null,
      manLabor: null, manOh: null, manFreight: null, erpLabor: null, erpOh: null,
      noPricePacks: 0, noCostKg: 0, byMat: {} });

    // 1) 생산량 — 완제품LOT [3]qty·[4]unit·[5]prodDate. 폐기·삭제·채번예약만 제외
    const PROD_DEAD = new Set(['폐기', '삭제', '채번예약']);
    for (const l of fgLots) {
      if (!l || !l[0] || PROD_DEAD.has(l[9])) continue;
      const ym = this.ym(l[5]); if (!ym) continue;
      at(ym).prodPacks += this.toPacks(l[3], l[4], (fgMeta.get(l[1]) || {}).packsPerBox);
    }

    // 2) 출하량 + 매출 추정치 — 출하기록 [1]lotId→품목, [4]qty, [5]unit, [6]shipDt
    for (const s of ships) {
      if (!s || !s[0]) continue;
      const ym = this.ym(s[6]); if (!ym) continue;
      const meta = fgMeta.get(codeByFgLot.get(s[1])) || {};
      const packs = this.toPacks(s[4], s[5], meta.packsPerBox);
      const b = at(ym);
      b.shipPacks += packs;
      if (meta.price > 0) b.estRevenue += packs * meta.price;
      else b.noPricePacks += packs;
    }

    // 3) 마켓봄 반죽 실매출 — supply = 공급가(VAT 제외). 우리 완제품 품명과 맞는 행만.
    for (const r of mbRows) {
      if (!r || !this.isOurProduct(r.name, fgNames)) continue;
      const ym = this.ym(r.date); if (!ym) continue;
      const b = at(ym), q = this._num(r.qty);
      b.mbRevenue += this._num(r.supply);
      b.mbQty += q;                                     // 박스 수 — 택배비용
      b.mbPacks += q * this.packsPerBoxOf(r);           // 봉 수 — 원재료·부자재용
    }
    for (const [ym, v] of Object.entries(mbDelivery || {})) {           // 마켓봄 배송비(월별)
      if (this.ym(ym)) at(this.ym(ym)).mbDelivery += this._num(v);
    }

    // 4) 실투입(발생) — 공정기록 stepType='input' 의 stepData.inputQty(kg) × 매입단가.
    //    자재의 category 로 원재료 / 부재료·포장재를 가른다.
    for (const p of procs) {
      if (!p || p[3] !== 'input') continue;
      const ym = this.ym(p[11]); if (!ym) continue;
      let qty = 0;
      try { qty = this._num(JSON.parse(p[5] || '{}').inputQty); } catch (e) { qty = 0; }
      if (qty <= 0) continue;
      const code = this.matOf(p[4], codeByRmLot);
      if (!code) continue;
      const m = rmMeta.get(code) || {}, b = at(ym), amt = qty * (m.price || 0);
      if (m.sub) b.subUsed += amt; else b.rawUsed += amt;
      if (!(m.price > 0)) b.noCostKg += qty;
      const g = (b.byMat[code] = b.byMat[code] || { code, name: m.name || code, unit: m.unit || 'kg',
        kind: m.sub ? '부재료' : '원재료', qty: 0, price: m.price || 0, amount: 0 });
      g.qty += qty; g.amount += amt;
    }

    // 5) 매입(현금) — 구매주문 [4]itemCode 로 원재료/부재료/소모품을 가른다.
    //    귀속 = 수령일[10] 없으면 주문일[1]. 실투입 기록이 없는 항목(소모품·포장재)의 폴백이 된다.
    for (const o of pos) {
      if (!o || !o[0] || o[18] === '삭제') continue;
      const ym = this.ym(o[10]) || this.ym(o[1]); if (!ym) continue;
      const amt = this._num(o[9]) || (this._num(o[6]) * this._num(o[8]));
      if (!amt) continue;
      const b = at(ym), code = o[4], m = rmMeta.get(code);
      if (m) { if (m.sub) b.subBuy += amt; else b.rawBuy += amt; }
      else if (spCodes.has(code)) b.supplies += amt;
      else b.unknownBuy += amt;                                        // 품목 마스터에 없는 매입
    }

    // 6) 원재료 폐기 손실 — 원재료개별 [3]status='폐기', [4]=폐기일시(폐기 시 수량이 날짜로 덮인다).
    //    ⚠️ 버려진 원재료는 공정 input 에 안 잡히므로 재료비에서 통째로 빠져 있다 → 따로 더한다.
    //    ⚠️ 완제품 폐기는 여기 넣지 않는다 — 그 원재료는 이미 실투입으로 계상됐다(이중계상).
    for (const iv of rmIndiv) {
      if (!iv || iv[3] !== '폐기') continue;
      const ym = this.ym(iv[4]); if (!ym) continue;
      const code = iv[2] || codeByRmLot.get(iv[1]) || '';
      const m = rmMeta.get(code) || {};
      const q = perUnitByLot.get(iv[1]) || 0;
      const b = at(ym);
      b.scrapQty += q;
      b.scrap += q * (m.price || 0);
    }
    for (const l of fgLots) {                                          // 완제품 폐기 = 물량 지표만
      if (!l || !l[0] || l[9] !== '폐기') continue;
      const ym = this.ym(l[5]); if (!ym) continue;
      at(ym).fgScrapPacks += this.toPacks(l[3], l[4], (fgMeta.get(l[1]) || {}).packsPerBox);
    }

    // 7) 수기('공장손익' 시트) — 금액 빈 칸은 '수기값 없음'(0 이 ERP 결산을 이기지 않게)
    for (const r of manual) {
      if (!r) continue;
      const ym = this.ym(r[0]); if (!ym) continue;
      if (String(r[2] ?? '').trim() === '') continue;
      const b = at(ym), amt = this._num(r[2]), item = String(r[1] || '').trim();
      if (item === '노무비') b.manLabor = (b.manLabor || 0) + amt;
      else if (item === '택배비') b.manFreight = (b.manFreight || 0) + amt;
      else if (PNL_OVERHEAD_ITEMS.includes(item)) b.manOh = (b.manOh || 0) + amt;
    }

    // 8) ERP 재무DB Closing_Line(매출원가) — 수기가 없는 달만 쓴다. 손익포함='N' 제외.
    for (const l of erpLines) {
      if (!l || String(l['손익포함'] || '').toUpperCase() === 'N') continue;
      if (String(l['섹션'] || '') !== '매출원가') continue;
      const ym = this.ym(l['귀속월']) || this.ym(l['period']); if (!ym) continue;
      const nm = String(l['관리계정'] || '') + ' ' + String(l['표준계정'] || '');
      const amt = this._num(l['실현액']) + this._num(l['예정액']);
      if (!amt) continue;
      const b = at(ym);
      if (/노무|공장\s*인건/.test(nm)) b.erpLabor = (b.erpLabor || 0) + amt;
      else if (/제조경비|공장\s*경비/.test(nm)) b.erpOh = (b.erpOh || 0) + amt;
      else if (PNL_FREIGHT_RE.test(nm)) b.erpFreight = (b.erpFreight || 0) + amt;
    }

    return Object.values(M).sort((a, b) => a.ym < b.ym ? -1 : 1).map(b => {
      // 매출 — 마켓봄 실적이 있으면 실적, 없으면 출하 × 단가 추정
      if (b.mbRevenue > 0) { b.revenue = b.mbRevenue; b.revenueSrc = 'marketbom'; }
      else { b.revenue = b.estRevenue; b.revenueSrc = b.estRevenue > 0 ? 'estimate' : 'none'; }

      // 원재료·부재료 — 실투입 기록이 있으면 발생 기준, 없으면 매입(현금) 기준
      b.rawMatStd = b.mbPacks * PNL_RAW_PER_PACK;      // 봉당 표준 재료비(배합 × 단가)
      if (b.rawUsed > 0) { b.rawMat = b.rawUsed; b.rawMatSrc = 'sheet'; }
      else if (b.rawBuy > 0) { b.rawMat = b.rawBuy; b.rawMatSrc = 'purchase'; }
      else if (b.rawMatStd > 0) { b.rawMat = b.rawMatStd; b.rawMatSrc = 'perbox'; }
      else { b.rawMat = 0; b.rawMatSrc = 'none'; }
      // 부자재 = 박스 고정분 + 봉당 변동분. 박스 규격(3봉/4봉)이 섞여도 맞는다.
      b.subMatStd = b.mbQty * PNL_SUBMAT_PER_BOX + b.mbPacks * PNL_SUBMAT_PER_PACK;
      if (b.subUsed > 0) { b.subMat = b.subUsed; b.subMatSrc = 'sheet'; }
      else if (b.subBuy > 0) { b.subMat = b.subBuy; b.subMatSrc = 'purchase'; }
      else if (b.subMatStd > 0) { b.subMat = b.subMatStd; b.subMatSrc = 'perbox'; }
      else { b.subMat = 0; b.subMatSrc = 'none'; }
      b.suppliesSrc = b.supplies > 0 ? 'purchase' : 'none';            // 소모품은 투입 기록이 없다
      b.scrapSrc = b.scrap > 0 ? 'sheet' : 'none';

      // 택배비 — 수기 > ERP 결산 운반비 > 출고 박스수 × 박스당 단가.
      // ⚠️ 마켓봄 `deliveryByMonth`(월 7~13만)는 **굿즈 소량 배송분**이라 반죽 냉동택배가 아니다.
      //    폴백으로 쓰면 원가가 1/8 로 깎인다 → 쓰지 않고 참고 표시만 한다.
      b.freightBox = b.mbQty * PNL_FREIGHT_PER_BOX;
      if (b.manFreight != null) { b.freight = b.manFreight; b.freightSrc = 'manual'; }
      else if (b.erpFreight != null) { b.freight = b.erpFreight; b.freightSrc = 'erp'; }
      else if (b.freightBox > 0) { b.freight = b.freightBox; b.freightSrc = 'perbox'; }
      else { b.freight = 0; b.freightSrc = 'none'; }

      // 노무비·제조경비 — 수기가 이긴다(사람이 고친 값). 없으면 ERP 결산.
      if (b.manLabor != null) { b.labor = b.manLabor; b.laborSrc = 'manual'; }
      else if (b.erpLabor != null) { b.labor = b.erpLabor; b.laborSrc = 'erp'; }
      else { b.labor = 0; b.laborSrc = 'none'; }
      if (b.manOh != null) { b.overhead = b.manOh; b.overheadSrc = 'manual'; }
      else if (b.erpOh != null) { b.overhead = b.erpOh; b.overheadSrc = 'erp'; }
      else { b.overhead = 0; b.overheadSrc = 'none'; }

      b.matBuy = b.rawBuy + b.subBuy + b.supplies + b.unknownBuy;      // 실매입 총액(참고)
      b.matUsed = b.rawMat + b.subMat;                                 // 재료비 소계
      const cost = this.LINES.reduce((s, L) => s + (b[L.key] || 0), 0);
      b.prodKg = Math.round(b.prodPacks * PNL_KG_PER_PACK * 10) / 10;
      b.cost = cost;
      b.profit = b.revenue - cost;
      b.marginPct = b.revenue > 0 ? b.profit / b.revenue * 100 : null;
      b.unitPrice = b.shipPacks > 0 ? b.revenue / b.shipPacks : null;   // 봉당 매출(출하 기준)
      b.unitCost = b.prodPacks > 0 ? cost / b.prodPacks : null;         // 봉당 제조원가(생산 기준)
      b.mats = Object.values(b.byMat).sort((x, y) => y.amount - x.amount);
      return b;
    });
  },

  /** 현재 재고 — `원재료LOT[8]` 잔량 × `원재료품목[13]` 매입단가.
      ⚠️ 날짜별 재고원장이 없어 **시점 스냅샷**만 낼 수 있다(월별 기말재고가 아니다).
      제외 상태는 ERP `rawInventory()` 와 같게 맞춘다 — 갈리면 두 시스템 재고금액이 어긋난다. */
  inventory(rmItems, rmLots) {
    const DEAD = new Set(['폐기', '입고취소', '소진']);
    const meta = new Map((rmItems || []).filter(r => r && r[0]).map(r => [r[0], {
      name: r[1] || r[0], unit: r[4] || 'kg', price: this._num(r[13]),
      sub: PNL_SUBMAT_RE.test(String(r[5] || '')),
      reorder: this._num(r[9]), inactive: r[12] === '비활성',
    }]));
    const byCode = new Map();
    for (const l of (rmLots || [])) {
      if (!l || !l[0] || DEAD.has(l[9])) continue;
      const c = l[1] || '(미지정)';
      byCode.set(c, (byCode.get(c) || 0) + this._num(l[8]));
    }
    const rows = [];
    for (const [code, qty] of byCode) {
      if (!(qty > 0)) continue;
      const m = meta.get(code) || {};
      rows.push({ code, name: m.name || code, unit: m.unit || 'kg', kind: m.sub ? '부재료' : '원재료',
        qty: Math.round(qty * 100) / 100, price: m.price || 0, amount: qty * (m.price || 0),
        reorder: m.reorder || 0, low: m.reorder > 0 && qty < m.reorder, noPrice: !(m.price > 0) });
    }
    rows.sort((a, b) => b.amount - a.amount || a.name.localeCompare(b.name, 'ko'));
    const sum = k => rows.filter(r => r.kind === k).reduce((s, r) => s + r.amount, 0);
    return { rows, rawAmt: sum('원재료'), subAmt: sum('부재료'),
             total: rows.reduce((s, r) => s + r.amount, 0),
             noPrice: rows.filter(r => r.noPrice), low: rows.filter(r => r.low) };
  },

  /** 화면 표시용 — 최근 n개월만(데이터 없는 달은 애초에 버킷이 없다) */
  recent(rows, n) { return n > 0 ? rows.slice(-n) : rows; },

  /** ERP 마켓봄 실매출 — 이 앱의 구글 토큰을 그대로 쓴다. 실패하면 [](추정으로 폴백). */
  async fetchMarketbom() {
    try {
      const r = await fetch(ERP_LOGI_API, { headers: { Authorization: `Bearer ${State.token}` } });
      if (!r.ok) return { rows: [], err: `ERP ${r.status}` };
      const j = await r.json();
      return { rows: (j.marketbom && j.marketbom.rows) || [],
               delivery: (j.marketbom && j.marketbom.deliveryByMonth) || {},
               updated: j.marketbom && j.marketbom.updated_at };
    } catch (e) {
      return { rows: [], delivery: {}, err: e.message };   // CORS·오프라인 — 화면에서 '추정' 배지로 드러난다
    }
  },

  /** ERP 재무DB Closing_Line — 결산의 매출원가 계정. 시트 API 라 CORS 무관. 권한 없으면 []. */
  async fetchErpClosing() {
    try {
      const r = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${ERP_FIN_SID}/values/${encodeURIComponent(ERP_CLOSING_TAB)}?valueRenderOption=UNFORMATTED_VALUE`,
        { headers: { Authorization: `Bearer ${State.token}` } });
      if (!r.ok) return { lines: [], err: `결산 ${r.status}` };
      const vals = (await r.json()).values || [];
      if (vals.length < 2) return { lines: [] };
      const hdr = vals[0].map(h => String(h || '').trim());
      const lines = vals.slice(1).filter(row => row && row.length).map(row => {
        const o = {}; hdr.forEach((h, i) => { o[h] = row[i] ?? ''; }); return o;
      });
      return { lines };
    } catch (e) {
      return { lines: [], err: e.message };
    }
  },
};

/* ─── 공장 손익 화면 (관리자 전용) ─── */
const _pw = (n) => (n == null || !isFinite(n)) ? '-' : Math.round(n).toLocaleString();
const _pm = (n) => (n == null || !isFinite(n)) ? '-' : Math.round(n / 10000).toLocaleString();   // 만원
const _pq = (n) => (n == null || !isFinite(n)) ? '-' : (Math.round(n * 10) / 10).toLocaleString();
const _pymLabel = (ym) => String(ym || '').replace(/^(\d{4})-(\d{2})$/, '$1.$2');
/** 값의 출처 배지 — 실적과 추정을 눈으로 구분하게 한다. 이 화면의 핵심 장치. */
const PNL_SRC = {
  marketbom: ['ERP 실매출', 'var(--suc)'],
  sheet:     ['공장 시트',  'var(--suc)'],
  erp:       ['ERP 결산',   'var(--suc)'],
  manual:    ['수기',       'var(--info)'],
  purchase:  ['매입 기준',   'var(--warn)'],
  perbox:    ['박스×단가',   'var(--suc)'],
  estimate:  ['추정',       'var(--warn)'],
  none:      ['없음',       'var(--err)'],
};
function _pnlSrc(src) {
  const m = PNL_SRC[src]; if (!m) return '';
  return `<span class="fs-10" style="color:${m[1]};border:1px solid ${m[1]};border-radius:3px;padding:0 3px;white-space:nowrap;opacity:.85">${m[0]}</span>`;
}

Screens['pnl'] = async () => {
  if (State.user?.role !== 'admin') { toast('관리자 전용 화면입니다', 'err'); Router.go('home'); return; }
  renderHeader('💰 공장 손익', '관리자 전용 · 제조이익 = 매출 − (재료비+노무비+제조경비)', { back: 'more' });
  $id('content').innerHTML = '<div style="padding:16px"><div class="fs-13 c-txt-l">손익 집계 중…</div></div>';
  try {
    showLoading();
    const [fgItems, fgLots, ships, pos, procs, rmItems, rmLots, rmIndiv, spItems, manual, mb, erp] = await Promise.all([
      SheetsAPI.getAll('완제품품목').catch(() => []),
      SheetsAPI.getAll('완제품LOT').catch(() => []),
      SheetsAPI.getAll('출하기록').catch(() => []),
      SheetsAPI.getAll('구매주문').catch(() => []),
      SheetsAPI.getAll('공정기록').catch(() => []),
      SheetsAPI.getAll('원재료품목').catch(() => []),
      SheetsAPI.getAll('원재료LOT').catch(() => []),
      SheetsAPI.getAll('원재료개별').catch(() => []),        // 폐기 손실(폐기일·수량 환산)
      SheetsAPI.getAll('소모품품목').catch(() => []),        // 소모품비 = 구매주문에서 가려낸다
      SheetsAPI.getAll(PNL_SHEET).catch(() => []),          // 없으면 [] — 첫 입력 때 자동 생성
      FactoryPnl.fetchMarketbom(),                          // ERP 물류 API — 반죽 실매출 + 배송비
      FactoryPnl.fetchErpClosing(),                         // ERP 재무DB — 인건비(공장)·공장경비·운반비
    ]);
    State._pnl = {
      fgItems, manualRows: manual, mbErr: mb.err, mbUpdated: mb.updated, erpErr: erp.err,
      match: FactoryPnl.matchReport(mb.rows, fgItems),
      inv: FactoryPnl.inventory(rmItems, rmLots),
      rows: FactoryPnl.build({ fgItems, fgLots, ships, pos, procs, rmItems, rmLots, rmIndiv, spItems,
                               manual, mbRows: mb.rows, mbDelivery: mb.delivery, erpLines: erp.lines }),
    };
    renderPnlBody();
  } catch (e) {
    $id('content').innerHTML = `<div style="padding:16px"><div class="card bl-err"><div class="fs-13 c-err">불러오기 실패: ${e.message}</div></div></div>`;
  } finally { hideLoading(); }
};

function renderPnlBody() {
  const st = State._pnl; if (!st) return;
  const all = st.rows;
  const range = window._pnlRange || 12;
  const rows = FactoryPnl.recent(all, range);
  const sel = rows.find(r => r.ym === window._pnlSel) || rows[rows.length - 1];
  if (sel) window._pnlSel = sel.ym;

  if (!rows.length) {
    $id('content').innerHTML = `<div style="padding:16px">
      <div class="empty-state"><div class="es-icon">💰</div><div class="es-title">집계할 데이터가 없습니다</div>
      <div class="es-desc">생산·출하·구매 기록이 쌓이면 월별 손익이 여기에 나옵니다</div></div>
      ${pnlFootnote()}</div>`;
    return;
  }

  // ── 요약(선택 월) ──
  const s = sel || {};
  const profitColor = (s.profit || 0) >= 0 ? 'var(--suc)' : 'var(--err)';
  const summary = `
    <div class="card" style="border-left:3px solid ${profitColor}">
      <div class="row between" style="align-items:baseline">
        <div class="fs-14 fw-7">${_pymLabel(s.ym)} 제조손익</div>
        <div class="fs-20 fw-8" style="color:${profitColor}">${_pw(s.profit)}원</div>
      </div>
      <div class="row between fs-12 c-txt-l mt-4">
        <span>매출 <b>${_pw(s.revenue)}</b> ${_pnlSrc(s.revenueSrc)}</span>
        <span>원가 <b>${_pw(s.cost)}</b></span>
        <span>이익률 <b>${s.marginPct == null ? '-' : s.marginPct.toFixed(1) + '%'}</b></span>
      </div>
      <div class="row between fs-11 c-txt-l mt-4" style="border-top:1px solid var(--gray-l);padding-top:6px">
        <span>생산 ${_pq(s.prodPacks)}봉 (${_pq(s.prodKg)}kg)</span>
        <span>출하 ${_pq(s.shipPacks)}봉</span>
        <span>봉당 원가 ${_pw(s.unitCost)}원</span>
      </div>
    </div>`;

  // ── 경고 (믿을 수 없는 값은 먼저 말한다) ──
  const warns = [];
  if (st.mbErr) warns.push(`<b>ERP 실매출을 못 읽었습니다</b> (${st.mbErr}) — 매출이 '출하량 × 단가' 추정으로 계산됩니다`);
  if (st.erpErr) warns.push(`<b>ERP 결산을 못 읽었습니다</b> (${st.erpErr}) — 노무비·제조경비는 수기 입력분만 반영됩니다`);
  if (!st.mbErr && st.match && st.match.total > 0 && st.match.matched.length === 0) {
    warns.push(`ERP 마켓봄 ${st.match.total}품목 중 <b>우리 완제품과 품명이 맞는 게 하나도 없습니다</b> —
      완제품품목의 품명(<span class="m">${(st.match.fgNames || []).join(', ') || '없음'}</span>)을
      마켓봄 품명과 <b>똑같이</b> 맞춰야 실매출이 잡힙니다`);
  }
  if (s.revenueSrc === 'estimate') warns.push(`이 달 매출은 <b>마켓봄 실적이 없어 추정</b>입니다 — 출하량 × 공급단가`);
  if (s.revenueSrc === 'none') warns.push(`<b>매출 0</b> — 마켓봄 판매도 출하기록도 없는 달입니다`);
  if (s.revenueSrc !== 'marketbom' && s.noPricePacks > 0) warns.push(`출하 ${_pq(s.noPricePacks)}봉이 <b>공급단가 미입력</b> — 그만큼 매출이 빠져 있습니다`);
  if (s.noCostKg > 0) warns.push(`투입 ${_pq(s.noCostKg)}kg 자재가 <b>매입단가 미입력</b> — 재료비가 과소 산정됩니다`);
  if (!(s.labor > 0)) warns.push(`<b>노무비 없음</b> — ERP 결산에도 수기에도 공장 인건비가 없습니다`);
  if (!(s.overhead > 0)) warns.push(`<b>제조경비 없음</b> — 임차료·관리비, 전기·가스·수도가 원가에 안 들어갔습니다`);
  if (!(s.freight > 0)) warns.push(`<b>택배비 없음</b> — 반죽 배송비가 원가에 안 들어갔습니다`);
  else if (s.freightSrc === 'perbox') warns.push(`택배비는 <b>출고 ${_pq(s.mbQty)}박스 × ${PNL_FREIGHT_PER_BOX.toLocaleString()}원 추정</b>입니다 — 실제 청구서가 있으면 수기로 넣으세요`);
  if (s.rawMatSrc === 'perbox' || s.subMatSrc === 'perbox') warns.push(`${s.rawMatSrc === 'perbox' ? '원재료비' : ''}${s.rawMatSrc === 'perbox' && s.subMatSrc === 'perbox' ? '·' : ''}${s.subMatSrc === 'perbox' ? '부자재비' : ''}가 <b>표준원가</b>입니다 — 출고 ${_pq(s.mbQty)}박스(${_pq(s.mbPacks)}봉) 기준. 실투입·매입 기록이 잡히면 그쪽이 우선합니다`);
  if (s.rawMatSrc === 'purchase') warns.push(`원재료비가 <b>매입 기준</b>입니다 — 그 달 공정 투입기록이 없어 산 금액으로 대신했습니다(재고 증감이 섞입니다)`);
  if (st.inv && st.inv.noPrice.length) warns.push(`재고 <b>${st.inv.noPrice.length}품목이 매입단가 미입력</b>(${st.inv.noPrice.slice(0, 3).map(r => r.name).join(', ')}${st.inv.noPrice.length > 3 ? ' 외' : ''}) — 재고 금액에서 빠져 있습니다`);
  if (st.inv && st.inv.low.length) warns.push(`재고 <b>${st.inv.low.length}품목이 발주점 미달</b>(${st.inv.low.slice(0, 3).map(r => r.name).join(', ')}${st.inv.low.length > 3 ? ' 외' : ''})`);
  if (s.unknownBuy > 0) warns.push(`품목 마스터에 없는 매입 <b>${_pw(s.unknownBuy)}원</b> — 원재료·소모품 어느 쪽에도 안 잡혔습니다`);
  if (s.revenueSrc !== 'marketbom' && s.shipPacks > 0 && s.prodPacks > 0 && s.shipPacks < s.prodPacks * 0.5) {
    warns.push(`출하량이 생산량의 절반 미만 — 출하기록 누락이면 매출이 실제보다 작게 나옵니다`);
  }
  const warnCard = warns.length ? `
    <div class="card bl-warn mt-8" style="background:#fff8e1">
      <div class="fs-13 fw-7 c-warn mb-6">⚠ 이 달 숫자를 그대로 믿으면 안 되는 이유</div>
      ${warns.map(w => `<div class="fs-11 c-txt-l" style="margin-top:3px">· ${w}</div>`).join('')}
    </div>` : '';

  // ── 월별 표 ──
  const tbl = `
    <div class="card mt-8" style="padding:0;overflow:hidden">
      <div class="row between" style="padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--gray-l)">
        <span class="fs-13 fw-7">월별 제조손익</span>
        <span class="fs-10 c-txt-l">단위: 만원 · 행을 누르면 상세</span>
      </div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:340px">
        <thead><tr style="background:var(--bg)">
          ${['월', '생산<br>(봉)', '출하<br>(봉)', '매출', '원가', '제조이익', '이익률'].map((h, i) =>
            `<th style="padding:6px 6px;text-align:${i === 0 ? 'left' : 'right'};font-size:10px;color:var(--txt-l);font-weight:600">${h}</th>`).join('')}
        </tr></thead>
        <tbody>
        ${rows.slice().reverse().map(r => {
          const on = r.ym === window._pnlSel;
          const pc = r.profit >= 0 ? 'var(--suc)' : 'var(--err)';
          return `<tr onclick="window._pnlSel='${r.ym}';renderPnlBody()" style="cursor:pointer;border-top:1px solid var(--gray-l);${on ? 'background:rgba(61,133,198,.10)' : ''}">
            <td style="padding:7px 6px;font-weight:${on ? 700 : 500}">${_pymLabel(r.ym)}</td>
            <td style="padding:7px 6px;text-align:right">${_pq(r.prodPacks)}</td>
            <td style="padding:7px 6px;text-align:right">${_pq(r.shipPacks)}</td>
            <td style="padding:7px 6px;text-align:right">${_pm(r.revenue)}</td>
            <td style="padding:7px 6px;text-align:right">${_pm(r.cost)}</td>
            <td style="padding:7px 6px;text-align:right;font-weight:700;color:${pc}">${_pm(r.profit)}</td>
            <td style="padding:7px 6px;text-align:right;color:${pc}">${r.marginPct == null ? '-' : r.marginPct.toFixed(0) + '%'}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
      </div>
    </div>`;

  // ── 원가 구성(선택 월) ──
  const parts = FactoryPnl.LINES
    .map(L => ({ lb: L.label, v: s[L.key] || 0, c: L.color, src: s[L.key + 'Src'] }))
    .filter(p => p.v > 0);
  const totCost = s.cost || 0;
  const costCard = `
    <div class="card mt-8">
      <div class="row between mb-6"><span class="fs-13 fw-7">${_pymLabel(s.ym)} 원가 구성</span><span class="fs-12 fw-7">${_pw(totCost)}원</span></div>
      ${totCost > 0 ? `<div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--gray-l)">
        ${parts.map(p => `<div style="width:${p.v / totCost * 100}%;background:${p.c}" title="${p.lb}"></div>`).join('')}
      </div>` : ''}
      ${parts.map(p => `<div class="row between fs-12" style="margin-top:5px">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${p.c};margin-right:5px"></span>${p.lb} ${_pnlSrc(p.src)}</span>
        <span><b>${_pw(p.v)}</b> <span class="fs-10 c-txt-l">${totCost > 0 ? Math.round(p.v / totCost * 100) + '%' : ''}</span></span>
      </div>`).join('') || '<div class="fs-12 c-txt-l">원가 데이터 없음</div>'}
      <div class="row between fs-11 c-txt-l mt-8" style="border-top:1px solid var(--gray-l);padding-top:6px">
        <span>실매입(구매주문) 전체 <b>${_pw(s.matBuy)}원</b></span>
        <span>vs 재료비(원+부재료) <b>${_pw(s.matUsed)}원</b></span>
      </div>
      <div class="fs-10 c-txt-l mt-2">실매입=그 달 산 돈(현금) · 재료비=그 달 쓴 자재(발생). 차이는 재고 증감입니다.
        ${s.unknownBuy > 0 ? `<span style="color:var(--warn)">품목 마스터에 없는 매입 ${_pw(s.unknownBuy)}원은 어느 항목에도 안 들어갔습니다.</span>` : ''}</div>
      ${(s.fgScrapPacks > 0 || s.scrapQty > 0) ? `
        <div class="row between fs-11 c-txt-l mt-4" style="border-top:1px solid var(--gray-l);padding-top:6px">
          <span>원재료 폐기 <b>${_pq(s.scrapQty)}kg</b> · ${_pw(s.scrap)}원</span>
          <span>완제품 폐기 <b>${_pq(s.fgScrapPacks)}봉</b></span>
        </div>
        <div class="fs-10 c-txt-l mt-2">완제품 폐기는 <b>원가에 또 넣지 않습니다</b> — 그 반죽을 만든 원재료는 이미 재료비에 잡혀 있습니다(이중계상). 매출로 이어지지 못한 물량으로만 봅니다.</div>` : ''}
    </div>`;

  // ── 자재별 재료비 ──
  const matCard = (s.mats && s.mats.length) ? `
    <div class="card mt-8" style="padding:0;overflow:hidden">
      <div class="fs-13 fw-7" style="padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--gray-l)">자재별 재료비 · ${_pymLabel(s.ym)}</div>
      ${s.mats.map(m => `
        <div style="padding:8px 12px;border-bottom:1px solid var(--gray-l)">
          <div class="row between">
            <span class="fs-13 fw-6">${m.name}</span>
            <span class="fs-13 fw-7">${_pw(m.amount)}원</span>
          </div>
          <div class="fs-11 c-txt-l mt-2">${m.code} · <b>${m.kind}</b> · 투입 ${_pq(m.qty)}${m.unit} × ${m.price > 0 ? m.price.toLocaleString() + '원/' + m.unit : '<span style="color:var(--warn)">단가 미입력</span>'}</div>
        </div>`).join('')}
    </div>` : '';

  // ── 재고(현재 시점) ──
  const iv = st.inv || { rows: [], rawAmt: 0, subAmt: 0, total: 0, noPrice: [], low: [] };
  const invCard = iv.rows.length ? `
    <div class="card mt-8" style="padding:0;overflow:hidden">
      <div class="row between" style="padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--gray-l)">
        <span class="fs-13 fw-7">📦 원재료·부재료 재고 <span class="fs-10 c-txt-l">현재 시점</span></span>
        <span class="fs-13 fw-7">${_pw(iv.total)}원</span>
      </div>
      <div class="row between fs-12" style="padding:8px 12px;border-bottom:1px solid var(--gray-l)">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#3d85c6;margin-right:5px"></span>원재료 <b>${_pw(iv.rawAmt)}</b></span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#6aa84f;margin-right:5px"></span>부재료·포장재 <b>${_pw(iv.subAmt)}</b></span>
      </div>
      ${iv.rows.map(r => `
        <div style="padding:8px 12px;border-bottom:1px solid var(--gray-l)${r.low ? ';background:#fff8e1' : ''}">
          <div class="row between">
            <span class="fs-13 fw-6">${r.name} <span class="fs-10 c-txt-l">${r.kind}</span></span>
            <span class="fs-13 fw-7">${r.noPrice ? '<span style="color:var(--warn)">단가 미입력</span>' : _pw(r.amount) + '원'}</span>
          </div>
          <div class="fs-11 c-txt-l mt-2">${r.code} · 잔량 <b>${_pq(r.qty)}${r.unit}</b>${r.price > 0 ? ` × ${r.price.toLocaleString()}원/${r.unit}` : ''}${r.low ? ` · <span style="color:var(--warn)">발주점 ${_pq(r.reorder)}${r.unit} 미달</span>` : ''}</div>
        </div>`).join('')}
      <div class="fs-10 c-txt-l" style="padding:8px 12px">날짜별 재고원장이 없어 <b>지금 이 순간</b>의 재고입니다 — 월별 기말재고가 아닙니다.
        상태가 폐기·소진·입고취소인 LOT 은 뺐습니다(ERP 재고평가와 같은 기준).</div>
    </div>` : '';

  // ── 입력 버튼(관리자 액션) ──
  const actions = `
    <div class="row mt-12" style="gap:8px">
      <button class="btn btn-outline btn-pri flex-1" onclick="openPnlPriceEditor()">💵 공급단가</button>
      <button class="btn btn-pri flex-1" onclick="openPnlCostEditor('${s.ym}')">🧾 노무비·경비 입력</button>
    </div>`;

  // ── 기간 필터 ──
  const ranges = [[6, '6개월'], [12, '12개월'], [0, '전체']];
  const rangeBar = `<div class="row mb-8" style="gap:6px">
    ${ranges.map(([v, lb]) => `<button class="btn btn-sm ${range === v ? 'btn-pri' : 'btn-outline btn-gray'}" onclick="window._pnlRange=${v};renderPnlBody()">${lb}</button>`).join('')}
  </div>`;

  $id('content').innerHTML = `<div style="padding:16px">${rangeBar}${summary}${warnCard}${tbl}${costCard}${matCard}${invCard}${actions}${pnlFootnote()}</div>`;
}

/** 출처·계산식 각주 — 이 화면의 숫자가 어디서 왔는지 한 곳에 적어 둔다. */
function pnlFootnote() {
  const m = State._pnl && State._pnl.match;
  return `
    <div class="card mt-12" style="background:var(--bg)">
      <div class="fs-12 fw-7 mb-6">📌 이 숫자는 어디서 왔나</div>
      <div class="fs-11 c-txt-l" style="line-height:1.65">
        · <b>매출</b> ① <span style="color:var(--suc)">ERP 실매출</span> = 마켓봄 반죽 판매 <b>공급가</b> 실적(ERP 물류 원장).
          ② 실적이 없는 달만 <span style="color:var(--warn)">추정</span> = 출하기록 × 완제품 공급단가.<br>
        · <b>원재료비 / 부재료·포장재비</b> = 공정기록 실투입량(kg) × 매입단가. 둘의 구분은 <b>원재료품목의 분류(category)</b>입니다.
          투입기록이 없는 달은 <span style="color:var(--warn)">매입 기준</span>(구매주문)으로 대신합니다.<br>
        · <b>원재료·부자재</b>는 실투입·매입 기록이 없으면 <b>표준원가</b>로 잡습니다 —
          원재료 봉당 ${PNL_RAW_PER_PACK.toLocaleString()}원, 부자재 박스당 ${PNL_SUBMAT_PER_BOX.toLocaleString()}원(아이스박스·아이스팩) + 봉당 ${PNL_SUBMAT_PER_PACK}원(봉지·보냉팩).<br>
        · ⚠️ <b>박스 규격이 SKU 마다 다릅니다</b> — ANG00266은 4봉 20kg, ANG00276은 3봉 15kg(2026-07 전환).
          그래서 원재료·부자재는 <b>봉수</b>로 계산하고, <b>택배비만 규격 무관 박스당 정액</b>입니다.<br>
        · <b>소모품비</b> = 구매주문 중 소모품품목. 소모품은 공정 투입기록이 없어 <b>산 달에 잡힙니다</b>.<br>
        · <b>폐기손실</b> = 원재료개별 폐기분 × 매입단가. 버려진 원재료는 공정에 안 들어가 재료비에서 빠지므로 따로 더합니다.
          <b>완제품 폐기는 넣지 않습니다</b> — 그 원재료는 이미 재료비에 잡혀 있어 이중계상이 됩니다.<br>
        · <b>택배비</b> ① 수기 ② ERP 결산 운반비 계정 ③ <b>출고 박스수 × ${PNL_FREIGHT_PER_BOX.toLocaleString()}원</b>(3봉×5kg 냉동택배 건당) 순.
          마켓봄 배송비(월 7~13만)는 <b>굿즈 소량 배송분</b>이라 반죽 택배비로 쓰지 않습니다.<br>
        · <b>노무비·제조경비</b> ① <span style="color:var(--info)">수기</span>가 있으면 그게 이깁니다.
          ② 없으면 <span style="color:var(--suc)">ERP 결산</span>의 매출원가 › 인건비(공장)·공장경비.<br>
        · <b>노무비 = 급여대장 지급합계 + 사업주 부담 4대보험(추정 +${(PNL_EMPLOYER_INS_RATE * 100).toFixed(1)}%)</b> —
          국민연금·건강·장기요양·고용(실업급여)은 회사가 근로자와 같은 금액을 내고, 고용안정 0.25%·산재 약 1.0%가 더 붙습니다.<br>
        · ⚠️ <b>매출·원가 모두 공급가(VAT 제외)</b> 기준입니다. 매출만 부가세를 포함하면 이익이 10% 부풀려집니다 —
          마켓봄 판매가 23,750원/봉(VAT 포함)이 곧 공급가 ${PNL_DEFAULT_PRICE.toLocaleString()}원/봉입니다.<br>
        · <b>물량 단위</b>는 전부 봉(1봉 ${PNL_KG_PER_PACK}kg)으로 환산합니다.<br>
        · 감가상각은 <b>넣지 않습니다</b>(사용자 확정). 판관비·이자도 제외 — 여기 이익은 <b>제조이익</b>이지 순이익이 아닙니다.<br>
        · 대상 품목 = <b>완제품품목에 등록된 활성 품목과 품명이 정확히 같은</b> 마켓봄 판매행.
          앞글자만 맞으면 안 잡습니다 — 그렇게 하면 앙호두 앞치마·모자·쿠폰까지 공장 매출이 됩니다.
          ${m ? `현재 마켓봄 ${m.total}품목 중 <b>${[...new Set(m.matched)].length}품목</b>을 셉니다:
            <b>${[...new Set(m.matched)].join(' · ') || '없음'}</b>` : ''}
      </div>
    </div>`;
}

/* 완제품 공급단가 편집 — 원/봉(VAT 제외 공급가). 완제품품목[18]. 매출 계산의 유일한 단가 소스. */
function openPnlPriceEditor() {
  const items = (State._pnl?.fgItems || []).filter(r => r && r[0] && r[7] !== '비활성');
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog" style="max-width:380px">
      <div class="fs-16 fw-7 mb-4">💵 완제품 공급단가</div>
      <div class="fs-11 c-txt-l mb-8">1봉(${PNL_KG_PER_PACK}kg)당 <b>공급가 · VAT 제외</b>.
        마켓봄 실매출이 있는 달은 실적을 쓰고, <b>없는 달만</b> 이 단가로 추정합니다.<br>
        <span style="color:var(--info)">기본값 ${PNL_DEFAULT_PRICE.toLocaleString()}원 = 마켓봄 판매가 23,750원(VAT 포함) ÷ 1.1</span></div>
      <div style="max-height:46vh;overflow-y:auto">
      ${items.length ? items.map((it, i) => {
        const p = FactoryPnl._num(it[FG_EXT.supplyPrice]);
        const ppb = FactoryPnl._num(it[8]) || 1;
        return `<div class="input-group" style="margin-bottom:10px">
          <label>${it[1] || it[0]} <span class="fs-10 c-txt-l">(${it[0]} · 박스당 ${ppb}봉)</span></label>
          <input type="number" id="pnlp-${i}" value="${p || ''}" min="0" step="1" inputmode="numeric" placeholder="${PNL_DEFAULT_PRICE}"
                 style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
          <div class="fs-10 c-txt-l mt-2">박스 환산 ≈ <span id="pnlpc-${i}">${p > 0 ? (p * ppb).toLocaleString() + '원/박스' : '-'}</span></div>
        </div>`;
      }).join('') : '<div class="fs-12 c-txt-l">활성 완제품이 없습니다</div>'}
      </div>
      <div class="d-actions">
        <button class="btn btn-sm btn-outline btn-gray" id="pnlp-cancel">취소</button>
        <button class="btn btn-sm btn-pri" id="pnlp-save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('#pnlp-cancel').onclick = close;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  items.forEach((it, i) => {
    const ppb = FactoryPnl._num(it[8]) || 1;
    const inp = overlay.querySelector(`#pnlp-${i}`), out = overlay.querySelector(`#pnlpc-${i}`);
    if (inp && out) inp.addEventListener('input', e => {
      const v = parseFloat(e.target.value) || 0;
      out.textContent = v > 0 ? (v * ppb).toLocaleString() + '원/박스' : '-';
    });
  });
  overlay.querySelector('#pnlp-save').onclick = async () => {
    if (!acquireLock('pnlPrice')) return;
    try {
      showLoading();
      // 시트를 사람이 열어 볼 때 이름 없는 S열이 되지 않게 헤더부터 맞춘다(1회·멱등)
      try {
        const hdr = (await SheetsAPI.getRange('완제품품목!A1:Z1', false))[0] || [];
        if (hdr[FG_EXT.supplyPrice] !== '공급단가') await SheetsAPI.updateRowByIndex('완제품품목', 1, { [FG_EXT.supplyPrice]: '공급단가' });
      } catch (e) { /* 헤더 보정 실패는 저장을 막지 않는다 */ }
      let n = 0;
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        const el = overlay.querySelector(`#pnlp-${i}`);
        const v = el ? el.value.trim() : '';
        const cur = String(it[FG_EXT.supplyPrice] ?? '').trim();
        if (v === cur) continue;
        if (v !== '' && !(parseFloat(v) >= 0)) { toast(`${it[1] || it[0]}: 0 이상의 숫자를 입력하세요`, 'err'); return; }
        await SheetsAPI.updateCell('완제품품목', 0, it[0], FG_EXT.supplyPrice, v === '' ? '' : String(Math.round(parseFloat(v))));
        n++;
      }
      SheetsAPI.invalidateCache('완제품품목');
      toast(n ? `공급단가 ${n}건 저장` : '변경 없음', n ? 'suc' : 'info');
      close();
      if (n) await Screens['pnl']();
    } catch (e) {
      const grid = /grid|range|exceed/i.test(e.message || '');
      toast(grid ? '완제품품목 시트에 S열(공급단가)이 없습니다 — 시트에서 열을 하나 추가한 뒤 다시 저장하세요' : '저장 실패: ' + e.message, 'err', 6000);
    }
    finally { hideLoading(); releaseLock('pnlPrice'); }
  };
}

/* 월별 노무비·제조경비 입력 — '공장손익' 시트. 같은 달·항목 행이 있으면 갱신, 없으면 추가(멱등).
   ERP 결산에서 자동으로 잡히는 달은 비워 두면 된다 — 여기 넣은 값이 있으면 그게 ERP 를 이긴다. */
function openPnlCostEditor(period) {
  const ym = /^\d{4}-\d{2}$/.test(period || '') ? period : new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 7);
  const row = (State._pnl?.rows || []).find(r => r.ym === ym) || {};
  const cur = { '노무비': row.manLabor, '임차료·관리비': null, '공과금(전기·가스·수도)': null, '택배비': row.manFreight };
  (State._pnl?.manualRows || []).forEach(r => {
    if (!r || FactoryPnl.ym(r[0]) !== ym) return;
    if (cur[r[1]] !== undefined) cur[r[1]] = FactoryPnl._num(r[2]);
  });
  const erpNote = [
    row.laborSrc === 'erp' ? `노무비 ${_pw(row.labor)}원` : '',
    row.overheadSrc === 'erp' ? `제조경비 ${_pw(row.overhead)}원` : '',
    row.freightSrc === 'erp' ? `택배비 ${_pw(row.freight)}원` : '',
    row.freightSrc === 'perbox' ? `택배비 ${_pw(row.freight)}원(출고 ${_pq(row.mbQty)}박스 추정)` : '',
  ].filter(Boolean).join(' · ');
  const fields = [
    ['pnlc-labor', '노무비', '공장 인건비 (이상현·김수영)', cur['노무비']],
    ['pnlc-rent', '임차료·관리비', '공장 임대료 + 건물 관리비', cur['임차료·관리비']],
    ['pnlc-util', '공과금(전기·가스·수도)', '생산량에 따라 움직입니다', cur['공과금(전기·가스·수도)']],
    ['pnlc-frt', '택배비', `반죽 냉동택배 · 박스당 ${PNL_FREIGHT_PER_BOX.toLocaleString()}원 기준`, cur['택배비']],
  ];
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog" style="max-width:340px">
      <div class="fs-16 fw-7 mb-4">🧾 노무비 · 제조경비</div>
      <div class="fs-11 c-txt-l mb-8">공장 시트에 없는 비용입니다. <b>비워 두면 ERP 결산 값</b>을 그대로 쓰고,
        넣으면 그게 이깁니다. 노무비는 <b>급여대장 지급합계</b>를 넣고 <b>＋보험료</b>를 누르세요.</div>
      ${erpNote ? `<div class="card bl-info" style="background:#e3f2fd;padding:7px 9px;margin-bottom:10px">
        <div class="fs-11 c-info">이 달 ERP 결산에서 잡힌 값: ${erpNote}</div></div>` : ''}
      <div class="input-group" style="margin-bottom:8px">
        <label>귀속월</label>
        <input type="month" id="pnlc-ym" value="${ym}" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
      </div>
      ${fields.map(([id, lb, hint, v]) => `
        <div class="input-group" style="margin-bottom:8px">
          <label>${lb} <span class="fs-10 c-txt-l">· ${hint}</span></label>
          <input type="number" id="${id}" value="${v == null ? '' : v}" min="0" step="1" inputmode="numeric" placeholder="원"
                 style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
          ${id === 'pnlc-labor' ? `
            <div class="row between mt-4" style="gap:6px;align-items:center">
              <span class="fs-10 c-txt-l" id="pnlc-ins-hint" style="flex:1;min-width:0">급여대장 지급합계를 넣으세요</span>
              <button type="button" class="btn btn-sm btn-outline btn-info" id="pnlc-ins-apply"
                      style="padding:2px 8px;font-size:11px;flex-shrink:0">＋보험료</button>
            </div>` : ''}
        </div>`).join('')}
      <div class="input-group" style="margin-bottom:12px">
        <label>메모 (선택)</label>
        <input type="text" id="pnlc-memo" placeholder="예: 4대보험 포함" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
      </div>
      <div class="d-actions">
        <button class="btn btn-sm btn-outline btn-gray" id="pnlc-cancel">취소</button>
        <button class="btn btn-sm btn-pri" id="pnlc-save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('#pnlc-cancel').onclick = close;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  // 사업주 부담 4대보험 가산 — 급여대장 지급합계(세전)를 넣고 한 번 누르면 노무비가 된다.
  //   두 번 누르면 21% 가 붙어 버리므로 적용 후엔 잠그고, 값을 다시 고치면 풀린다.
  (() => {
    const inp = overlay.querySelector('#pnlc-labor'), btn = overlay.querySelector('#pnlc-ins-apply'),
          hint = overlay.querySelector('#pnlc-ins-hint');
    if (!inp || !btn || !hint) return;
    let applied = false;
    const pct = (PNL_EMPLOYER_INS_RATE * 100).toFixed(1);
    const sync = () => {
      const v = parseFloat(inp.value) || 0;
      btn.disabled = applied || !(v > 0);
      btn.style.opacity = btn.disabled ? '.45' : '1';
      if (applied) { hint.innerHTML = '<span style="color:var(--suc)">✓ 사업주 부담 4대보험 포함됨</span>'; return; }
      hint.innerHTML = v > 0
        ? `+${pct}% = <b>${Math.round(v * (1 + PNL_EMPLOYER_INS_RATE)).toLocaleString()}원</b>`
        : '급여대장 지급합계를 넣으세요';
    };
    inp.addEventListener('input', () => { applied = false; sync(); });
    btn.onclick = () => {
      // disabled 만 믿지 않는다 — 여기서 한 번 더 막아야 두 번째 클릭이 21% 를 붙이지 못한다
      if (applied) return;
      const v = parseFloat(inp.value) || 0; if (!(v > 0)) return;
      inp.value = String(Math.round(v * (1 + PNL_EMPLOYER_INS_RATE)));
      applied = true; sync();
    };
    sync();
  })();

  overlay.querySelector('#pnlc-save').onclick = async () => {
    const p = $id('pnlc-ym')?.value, memo = $id('pnlc-memo')?.value || '';
    if (!/^\d{4}-\d{2}$/.test(p || '')) { toast('귀속월을 선택하세요', 'err'); return; }
    const vals = {};
    fields.forEach(([id, lb]) => { vals[lb] = $id(id)?.value; });
    if (!acquireLock('pnlCost')) return;
    try {
      showLoading();
      let cur = [];
      try { cur = await SheetsAPI.getAll(PNL_SHEET, false); }
      catch (e) { await SheetsAPI.createSheet(PNL_SHEET, PNL_HEADER); cur = []; }
      const who = State.user?.email || '', now = formatDateTime();
      for (const item of PNL_MANUAL_ITEMS) {
        const raw = String(vals[item] ?? '').trim();
        const i = cur.findIndex(r => r && FactoryPnl.ym(r[0]) === p && r[1] === item);
        if (raw === '') {
          // 비워서 저장 = 수기 해제 → 그 달은 다시 ERP 결산 값을 쓴다. 행이 없으면 만들 것도 없다.
          if (i >= 0) await SheetsAPI.updateRowByIndex(PNL_SHEET, i + 2, { 2: '', 3: memo, 4: who, 5: now });
          continue;
        }
        const amt = parseFloat(raw);
        if (!(amt >= 0)) { toast(`${item}: 0 이상의 숫자를 입력하세요`, 'err'); return; }
        if (i >= 0) await SheetsAPI.updateRowByIndex(PNL_SHEET, i + 2, { 0: p, 1: item, 2: String(Math.round(amt)), 3: memo, 4: who, 5: now });
        else await SheetsAPI.append(PNL_SHEET, [[p, item, String(Math.round(amt)), memo, who, now]]);
      }
      SheetsAPI.invalidateCache(PNL_SHEET);
      toast(`${p} 노무비·제조경비 저장`, 'suc');
      close();
      window._pnlSel = p;
      await Screens['pnl']();
    } catch (e) { toast('저장 실패: ' + e.message, 'err', 5000); }
    finally { hideLoading(); releaseLock('pnlCost'); }
  };
}

Screens['bom-calc'] = async () => {
  renderHeader('BOM 계산기', '봉수/kg 입력 → 자재 필요량 자동 계산', { back: 'more' });
  showLoading();
  try {
    const [sops, recipes, rmItems, rmLots] = await Promise.all([
      SheetsAPI.getAll('SOP').catch(() => []),
      SheetsAPI.getAll('SOP레시피').catch(() => []),
      SheetsAPI.getAll('원재료품목').catch(() => []),
      SheetsAPI.getAll('원재료LOT').catch(() => [])
    ]);
    const activeSops = sops.filter(s => s[4] === '활성');

    $id('content').innerHTML = `

            <label>SOP 선택</label>

              ${activeSops.length===0 ? '<option value="">활성 SOP 없음</option>' : ''}
            </select>
          </div>
          <div class="input-group">
            <label>입력 단위</label>
            <div class="row" style="gap:6px">

              <button class="btn btn-sm btn-outline btn-gray" id="bom-unit-kg" onclick="window._bomUnit='kg';document.getElementById('bom-unit-kg').className='btn btn-sm btn-pri';document.getElementById('bom-unit-bag').className='btn btn-sm btn-outline btn-gray';renderBomResult()">완제품 kg</button>
            </div>
          </div>
          <div class="input-group">
            <label id="bom-input-label">생산 봉수</label>
            <div class="input-suffix">
              <input type="number" id="bom-qty" min="1" placeholder="수량 입력" oninput="renderBomResult()">
              <span id="bom-input-unit">봉</span>
            </div>
          </div>
        </div>
        <div id="bom-rec"></div>
        <div id="bom-result"></div>
      </div>
    `;
    window._bomUnit = 'bag';
    renderBomResult();
    hideLoading();
  } catch (e) {
    hideLoading();
    toast('로드 실패: ' + e.message, 'err');
  }
};

function renderBomResult() {
  const sopId = $id('bom-sop')?.value || '';
  const unit = window._bomUnit || 'bag';
  const qty = parseFloat($id('bom-qty')?.value) || 0;
  const lblEl = $id('bom-input-label'), unitEl = $id('bom-input-unit');
  if (lblEl) lblEl.textContent = unit === 'bag' ? '생산 봉수' : '완제품 kg';
  if (unitEl) unitEl.textContent = unit === 'bag' ? '봉' : 'kg';
  const result = $id('bom-result');
  const recEl = $id('bom-rec');
  if (recEl) recEl.innerHTML = '';
  if (!result || !State._bom || qty <= 0 || !sopId) {
    if (result) result.innerHTML = '<div class="fs-12 c-txt-l mt-12">입력값을 확인하세요</div>';
    return;
  }
  const { recipes, rmItems, rmLots } = State._bom;
  const sopRecipes = recipes.filter(r => r[0] === sopId);
  if (sopRecipes.length === 0) {
    result.innerHTML = '<div class="card bl-warn" style="background:#fff8e1;margin-top:12px"><div class="fs-12 c-warn">선택한 SOP에 레시피가 없습니다</div></div>';
    return;
  }

  // ─── 권장 배치 사이즈 (200~350kg, 정수 포대) — 입력 바로 아래에 표시 ───
  if (recEl) {
    // 주 자재 = **배합비가 가장 큰 자재**. 믹스 코드를 박아 두면 공급사가 바뀔 때 조용히 어긋난다
    // (실제로 RM003 마미만쥬 → RM011 앙브레드로 교체됐다). 믹스는 어느 공급사든 늘 최대 비중이다.
    const mainRecipe = sopRecipes.reduce((max, r) => (parseFloat(r[3])||0) > (parseFloat(max[3])||0) ? r : max, sopRecipes[0]);
    const mainItem = rmItems.find(i => i[0] === mainRecipe[1]);
    const mainSkuP = parseSkuUnit(mainItem?.[3] || '');
    const mainRatio = parseFloat(mainRecipe[3]) || 0;
    const candidates = [];
    if (mainSkuP && mainSkuP.perUnit > 0 && mainRatio > 0) {
      for (let units = 1; units <= 50; units++) {
        const totalMixKg = units * mainSkuP.perUnit;
        const maxFinishedKg = totalMixKg / (mainRatio * 1.01);
        if (maxFinishedKg < 200) continue;
        if (maxFinishedKg > 360) break;
        const bags = Math.floor(maxFinishedKg / 5);
        const finishedKg = bags * 5;
        if (finishedKg < 200 || finishedKg > 350) continue;
        const mixUsed = mainRatio * finishedKg * 1.01;
        const waste = totalMixKg - mixUsed;
        candidates.push({ units, totalMixKg, finishedKg, bags, waste });
      }
      candidates.sort((a, b) => (a.waste - b.waste) || (b.bags - a.bags));
    }
    const top3 = candidates.slice(0, 3);
    const curBags = unit === 'bag' ? qty : Math.round(qty / 5);
    if (top3.length > 0) {
      recEl.innerHTML = `
        <div class="card" style="background:#f0f7ff;border-left:3px solid var(--pri);margin-top:12px">
          <div class="fs-13 fw-7 mb-4">📐 권장 배치 (${mainRecipe[2]} 정수 ${mainSkuP.unitName} 단위)</div>
          <div class="fs-11 c-txt-l mb-8">200~350kg 범위 · 잔여 자재 최소 순 상위 3건</div>
          ${top3.map((r, i) => {
            const isCurrent = (curBags === r.bags);
            const applyVal = unit === 'bag' ? r.bags : r.finishedKg;
            return `
              <div class="row between" style="padding:8px 0;${i < top3.length-1 ? 'border-bottom:1px solid var(--bg)' : ''};align-items:center">
                <div style="flex:1">
                  <div class="fs-13 fw-7">${r.bags}봉 (${r.finishedKg}kg)</div>
                  <div class="fs-11 c-txt-l">${mainRecipe[2]} ${r.units}${mainSkuP.unitName} (${r.totalMixKg}kg) · 잔여 ${r.waste.toFixed(2)}kg</div>
                </div>
                ${isCurrent ? '<span class="badge badge-suc">현재 입력</span>' :
                  `<button class="btn btn-sm btn-pri" onclick="document.getElementById('bom-qty').value=${applyVal};renderBomResult()" style="white-space:nowrap">적용</button>`}
              </div>
            `;
          }).join('')}
        </div>
      `;
    } else if (mainSkuP && mainSkuP.perUnit > 0) {
      recEl.innerHTML = `<div class="card bl-warn" style="background:#fff8e1;margin-top:12px;padding:10px"><div class="fs-12 c-warn">⚠ 200~350kg 범위에서 ${mainRecipe[2]} 정수 ${mainSkuP.unitName} 조합 없음</div></div>`;
    }
  }

  const targetKg = unit === 'bag' ? qty * 5 : qty;
  const bagCount = unit === 'bag' ? qty : (qty / 5);
  const ratioSum = sopRecipes.reduce((s, r) => s + (parseFloat(r[3])||0), 0);

  // 자재별 계산
  const rows = sopRecipes.map(r => {
    const rmCode = r[1];
    const rmName = r[2];
    const ratio = parseFloat(r[3]) || 0;
    const needKg = ratio * targetKg * 1.01;  // index.html:4570 동일 공식
    const item = rmItems.find(i => i[0] === rmCode);
    const sku = item?.[3] || '';
    const skuP = parseSkuUnit(sku);
    const isWater = rmCode === 'RM002';  // 물은 재고 추적 대상 외 (수도 공급)
    let needConv = '—', stockKg = 0, stockConv = '—', isShort = false;
    if (skuP && skuP.perUnit > 0) {
      const u = needKg / skuP.perUnit;
      needConv = `${u.toFixed(2)} ${skuP.unitName}`;
    }
    // 재고 (활성 LOT 합계) — 물은 무제한 가용으로 간주
    if (isWater) {
      stockKg = Infinity;
      stockConv = '관리대상 외';
      isShort = false;
    } else {
      stockKg = rmLots.filter(l => l[1] === rmCode && !['폐기','입고취소'].includes(l[9]))
                     .reduce((sum, l) => sum + (parseFloat(l[8])||0), 0);
      if (skuP && skuP.perUnit > 0) {
        const su = stockKg / skuP.perUnit;
        stockConv = `${su.toFixed(2)} ${skuP.unitName}`;
      } else {
        stockConv = `${stockKg.toFixed(2)} kg`;
      }
      isShort = stockKg < needKg;
    }
    const shortKg = isShort ? needKg - stockKg : 0;
    const unitPrice = parseFloat(item?.[13]) || 0;   // 매입단가(원/kg · 원재료품목 col13)
    return { rmCode, rmName, ratio, needKg, needConv, stockKg, stockConv, isShort, shortKg, sku, isWater, unitPrice, cost: needKg * unitPrice };
  });
  const totalCost = rows.reduce((s, r) => s + (r.cost || 0), 0);   // 생산원가(재료비) 합계
  const anyNoPrice = rows.some(r => !r.isWater && !(r.unitPrice > 0));   // 단가 미입력 자재 존재 여부

  const anyShort = rows.some(r => r.isShort);
  const totalNeed = rows.reduce((s, r) => s + r.needKg, 0);

  result.innerHTML = `
    <div class="card bl-${anyShort ? 'err' : 'suc'}" style="background:${anyShort ? '#fff5f5' : '#e8f5e9'};margin-top:12px">
      <div class="row between">
        <div>
          <div class="fs-13 fw-7">생산 목표</div>
          <div class="fs-16 fw-8">${targetKg.toFixed(1)} kg / ${bagCount.toFixed(1)} 봉</div>
        </div>
        <div style="text-align:right">
          <div class="fs-11 c-txt-l">SOP ${sopId}</div>
          <div class="fs-11 c-txt-l">자재 합계: ${totalNeed.toFixed(2)} kg</div>
        </div>
      </div>
      ${anyShort ? '<div class="fs-12 c-err mt-4 fw-6">⚠ 재고 부족 자재가 있습니다 (아래 빨간색 표시)</div>' : '<div class="fs-12 c-suc mt-4 fw-6">✓ 모든 자재 재고 충분</div>'}
    </div>

    <div class="card" style="margin-top:8px;background:${anyNoPrice ? '#fff8e1' : '#f0f7ff'};border-left:3px solid ${anyNoPrice ? 'var(--warn)' : 'var(--pri)'}">
      <div class="row between" style="align-items:baseline">
        <div class="fs-13 fw-7">💰 생산원가 (재료비)</div>
        <div class="fs-18 fw-8 c-pri">${Math.round(totalCost).toLocaleString()}원</div>
      </div>
      <div class="row between fs-11 c-txt-l mt-4" style="gap:8px">
        <span>kg당 <b>${targetKg > 0 ? Math.round(totalCost / targetKg).toLocaleString() : 0}원</b> · 봉(5kg)당 <b>${targetKg > 0 ? Math.round(totalCost / targetKg * 5).toLocaleString() : 0}원</b></span>
        <span>박스(15kg)당 <b>${targetKg > 0 ? Math.round(totalCost / targetKg * 15).toLocaleString() : 0}원</b></span>
      </div>
      ${anyNoPrice ? '<div class="fs-11 c-warn mt-4">⚠ 매입단가 미입력 자재가 있어 원가가 과소 산정됩니다 — 원재료 품목 화면에서 단가를 입력하세요</div>' : '<div class="fs-10 c-txt-l mt-4">단가 = 원재료 품목 매입단가(원/kg) × 필요량(배합비×1.01). 배송·포장 제외 재료비만.</div>'}
    </div>

    <div class="card" style="padding:0;overflow:hidden;margin-top:8px">
      <div class="fs-13 fw-7" style="padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--gray-l)">자재별 필요량 / 재고 비교</div>
      ${rows.map(r => `
        <div style="padding:10px 12px;border-bottom:1px solid var(--bg);${r.isShort ? 'background:#fff5f5' : ''}">
          <div class="row between mb-4">
            <span class="fs-13 fw-6">${r.rmCode} · ${r.rmName}</span>
            ${r.isWater ? '<span class="badge badge-gray">관리대상 외</span>' :
              r.isShort ? `<span class="badge badge-err">부족 ${r.shortKg.toFixed(2)}kg</span>` : '<span class="badge badge-suc">충분</span>'}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
            <div>
              <div class="fs-11 c-txt-l">필요량 (배합비 × kg × 1.01)</div>
              <div class="fs-13 fw-7">${r.needKg.toFixed(2)} kg</div>
              ${r.needConv !== '—' ? `<div class="fs-11 c-txt-l">≈ ${r.needConv}</div>` : ''}
            </div>
            <div>
              <div class="fs-11 c-txt-l">현재고</div>
              <div class="fs-13 fw-7" style="${r.isWater ? 'color:var(--txt-l)' : r.isShort ? 'color:var(--err)' : ''}">${r.isWater ? '—' : r.stockKg.toFixed(2) + ' kg'}</div>
              <div class="fs-11 c-txt-l">${r.isWater ? '수도 공급 · 추적 안함' : '≈ ' + r.stockConv}</div>
            </div>
          </div>
          <div class="fs-10 c-txt-l mt-4">배합비 ${r.ratio.toFixed(4)} · SKU "${r.sku || '-'}"${r.isWater ? '' : ` · 단가 ${r.unitPrice > 0 ? r.unitPrice.toLocaleString() + '원/kg' : '<span style="color:var(--warn)">미입력</span>'} · 원가 <b>${Math.round(r.cost).toLocaleString()}원</b>`}</div>
        </div>
      `).join('')}
      <div class="row between" style="padding:10px 12px;background:#eef5ff">
        <span class="fs-12 fw-6">배합비 합계</span>
        <span class="fs-12 fw-7">${ratioSum.toFixed(4)} ${Math.abs(ratioSum-1.0)<0.005 ? '✓ (정밀)' : Math.abs(ratioSum-1.01)<0.005 ? '⚠ 1.01 (반올림 — 안전계수 중복 적용)' : '⚠ 비정상'}</span>
      </div>
    </div>

  `;
}

Screens['sop-detail'] = async (params = {}) => {
  const { sopId } = params;

  try {
    if (!State.sopSteps.length) State.sopSteps = await SheetsAPI.getAll('SOP공정단계').catch(() => []);
    if (!State.sopRecipes.length) State.sopRecipes = await SheetsAPI.getAll('SOP레시피').catch(() => []);
  } catch(e) {}

  const sop = State.sops.find(s => s[0] === sopId) || State.sops[0];
  const sid = sop?.[0] || sopId;
  const steps = State.sopSteps.filter(s => s[0] === sid).sort((a,b) => parseInt(a[1])-parseInt(b[1]));
  const recipes = State.sopRecipes.filter(r => r[0] === sid);

  // 미리보기 기준 (사용자가 변경 가능)
  if (!State._sopPrev) State._sopPrev = { kg: 200, bags: 40 };

  renderHeader('SOP 상세', `${sid} · ${sop?.[1] || ''}`, { back: 'sop-list' });

  function renderAll() {
    const previewKg = State._sopPrev.kg;
    const previewBags = State._sopPrev.bags;

    $id('content').innerHTML = `
      <div style="padding:12px">
        <div class="card">
          <div class="row between mb-8">
            <div>
              <div class="fs-16 fw-7">${sop?.[1] || ''}</div>
              <div class="fs-12 c-txt-l">${sid} · v${sop?.[3]||'1.0'} · 대상: ${sop?.[2]||''}</div>
            </div>
            <span class="badge badge-${sop?.[4]==='활성'?'suc':'err'}">${sop?.[4] || ''}</span>
          </div>
          ${State.user?.role === 'admin' ? '<div class="row" style="gap:8px"><button class="btn btn-sm btn-pri" disabled>수정 (준비중)</button><button class="btn btn-sm btn-outline btn-err" disabled>폐기 (준비중)</button></div>' : ''}
        </div>

        <div class="card bl-info" style="background:#e3f2fd;padding:10px">
          <div class="fs-13 fw-7 c-info mb-4">📋 작업자 화면 미리보기 (관리자)</div>
          <div class="fs-11 c-txt-l mb-8">실제 작업자가 보는 공정 화면입니다. 입력/스캔/사진은 비활성.</div>
          <div class="row" style="gap:8px;align-items:center">
            <span class="fs-11 c-txt-l">기준 수량:</span>
            <input type="number" id="sop-prev-bags" value="${previewBags}" min="1" style="width:70px;padding:4px 8px;border:1px solid var(--gray-l);border-radius:4px" oninput="window._sopPrevSetBags(this.value)">
            <span class="fs-11 c-txt-l">봉 = ${previewKg} kg</span>
          </div>
        </div>

        ${recipes.length > 0 ? `
          <div class="fs-14 fw-7 mb-8">레시피 (BOM) — 완제품 1kg당</div>
          <div class="card">
            ${recipes.map((r, i) => `
              <div class="row between" style="padding:6px 0;${i < recipes.length-1 ? 'border-bottom:1px solid var(--bg)' : ''}">
                <span class="fs-13">${r[2] || ''} (${r[1] || ''})</span>
                <span class="fs-13 c-txt-l">${r[3] || ''} ${r[4] || ''} · 공정${r[5] || ''}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <div class="fs-14 fw-7 mb-8 mt-12">공정 단계 (${steps.length}단계) — 작업자 화면 그대로</div>

/* SOP 단계 미리보기 카드 — 작업자가 실제로 보는 화면 구조와 동일.
   모든 입력·버튼은 비활성화. wo-execute 의 renderStepContent 와 동일한 스타일. */
function renderSopStepPreview(step, recipes, targetKg, packCount) {
  const stepNo = parseInt(step[1]);
  const stepType = step[3] || 'input';
  const isMixing = stepType === 'process' && (step[2]||'').includes('믹싱');
  const typeColor = { input: 'info', process: isMixing ? 'teal' : 'pri', seal: 'pri', inspect: 'warn', pack: 'gray-d', store: 'teal', 'qr-label': 'info', heat: 'err' };
  const typeLabel = { input: '투입', process: isMixing ? '믹싱' : '공정', seal: '포장(밀봉)', inspect: '검사(CCP)', pack: '포장', store: '보관', 'qr-label': 'QR라벨', heat: `가열(${CCP.HEAT.no})` };
  const color = typeColor[stepType] || 'gray';
  const label = typeLabel[stepType] || stepType;
  const checks = (step[6] || '').split(',').filter(c => c.trim());
  const desc = step[6] || '';

  // disabled 입력 공통 스타일
  const dis = 'readonly disabled style="background:var(--gray-l);opacity:0.7"';

  let body = '';

  if (stepType === 'input') {
    const rmCode = step[4] || '';
    const recipe = recipes.find(r => r[1] === rmCode);
    const target = recipe ? (parseFloat(recipe[3]) * targetKg * 1.01).toFixed(2) : '0';
    const isWater = rmCode === 'RM002';
    let n = 1;
    body += `
      <div class="fs-14 fw-7" style="margin-bottom:6px;margin-top:4px">Step ${n++}. 투입 목표량 확인</div>
      <div class="info-box suc">
        <div class="fs-12 fw-6 c-suc">투입 목표량 (배합비 × ${targetKg}kg × 1.01)</div>
        <div class="fs-20 fw-8 c-suc mt-4">${target} kg</div>
        <div class="fs-11 c-txt-l">자재 코드: ${rmCode}${isWater ? ' (수도 공급 · 추적 외)' : ''}</div>
      </div>
    `;
    if (checks.length > 0) {
      body += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-8">체크항목</div>`;
      checks.forEach(c => {
        body += `<div class="check-item"><div class="check-box" style="pointer-events:none"></div><span>${c.trim()}</span></div>`;
      });
    }
    if (!isWater) {
      body += `
        <div class="fs-14 fw-7" style="margin-bottom:6px;margin-top:20px">Step ${n++}. 원재료 LOT 확인</div>
        <button class="btn btn-info btn-full mb-8" disabled>📷 QR 스캔 시작</button>
      `;
    }
    body += `
      <div class="fs-14 fw-7" style="margin-bottom:6px;margin-top:20px">Step ${n++}. 저울 계량값 사진 첨부 <span class="c-err">*필수</span></div>
      <div class="row mb-8" style="gap:8px">
        <button class="btn btn-sm btn-outline btn-pri flex-1" disabled>📷 카메라 촬영</button>
        <button class="btn btn-sm btn-outline btn-gray flex-1" disabled>🖼️ 갤러리 선택</button>
      </div>
      <div class="fs-14 fw-7" style="margin-bottom:6px;margin-top:20px">Step ${n++}. 실제 투입량 입력</div>
      <div class="input-group">
        <label>실제 투입량 (kg) <span class="c-err">*필수</span></label>
        <div class="input-suffix"><input type="number" placeholder="투입량 입력" ${dis}><span>kg</span></div>
      </div>
    `;
  }
  else if (stepType === 'process') {
    const std = step[5] || '';
    if (!isMixing && std) {

/* ── 발주점(안전재고) 산식 ────────────────────────────────────────────────
   손으로 박아 둔 발주점은 생산량이 바뀌면 조용히 썩는다. 2026-08-21 실측에서
   계란 75kg = 1.8일치, 전용믹스 480kg = 4일치로 «리드타임조차» 못 덮고 있었다.
   그래서 실제 사용량(공정기록)과 실제 입고 간격(입고기록)에서 매번 다시 뽑는다.

     d(일평균)   = 최근 12주(완결주) 사용량 평균 ÷ 7                 kg/일
     σ           = 같은 구간 주간 사용량 표본표준편차                kg/주
     R(발주주기) = 실측 입고일 간격의 75퍼센타일(3회 이상) · 없으면 마스터 주문주기
     P(보호기간) = 리드타임 + R/2   ← 아무 때나 봐도 다음 보충까지 남은 기대 일수
     SS(안전여유)= 1.65 × σ × √(P/7)                     (서비스수준 95%)
     발주점      = d × P + SS  → SKU 포장단위(판·통·포대)로 올림

   R 을 중앙값이 아니라 75퍼센타일로 잡는 이유 = 주말·연휴로 벌어지는 «나쁜 쪽»
   간격까지 덮어야 알람이 제 역할을 한다(계란 실측 간격은 대부분 1일이지만 주말마다 4일).
   ⚠️ 숫자는 냉장고 용량도 유통기한도 모른다 — 값은 ✏️ 발주점에서 손으로 덮어쓸 수 있고,
      덮어쓴 값이 시트의 정본이다. 이 산식은 «제안»까지만 한다.
   검증: node tests/reorder-point.test.js                                      */
// <reorder-calc>
const RP_CFG = {
  Z: 1.65,          // 서비스수준 95%
  WEEKS: 12,        // 사용량 관측 창(완결주)
  RCV_DAYS: 180,    // 입고간격 관측 창
  GAP_PCT: 0.75,    // 발주주기 백분위 — 나쁜 쪽 간격을 덮는다
  MIN_GAPS: 3,      // 실측 간격이 이보다 적으면 마스터 주문주기로 떨어진다
  LEAD_DEFAULT: 3,  // 리드타임 미설정 시
  CYCLE: { '매일': 1, '격일': 2, '주간': 7, '주1회': 7, '격주': 14, '월간': 30, '월1회': 30, '발주점도달시': 1 },
};
/** 시트 날짜("2026-08-21 8:59" 등) → Date.
    ⚠️ ISO 흉내(' '→'T')를 내지 말 것 — 한 자리 시(8:59)가 통째로 버려진다(입고 68건 중 9건 실종). */
function rpDate(v) { const s = String(v || '').trim(); if (!s) return null; const d = new Date(s.replace(/-/g, '/')); return isFinite(d) ? d : null; }
function rpWeekStart(d) { const t = new Date(d); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t; }
function rpPercentile(arr, p) { const s = [...arr].sort((a, b) => a - b); if (!s.length) return null; const i = p * (s.length - 1), lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (i - lo) * (s[hi] - s[lo]); }

/** 원재료별 주간 사용량(kg) — 공정기록 input 스텝의 inputQty 를 usedLotIds→원재료LOT 로 품목에 귀속.
    진행 중인 주는 반쪽이라 뺀다(안 빼면 평균이 주 초마다 주저앉는다). */
function rpWeeklyUse(procRecords, rmLots, asOf) {
  const lotItem = new Map((rmLots || []).map(l => [l[0], l[1]]));
  const curWk = rpWeekStart(asOf).getTime();
  const out = new Map();
  for (const r of procRecords || []) {
    if (!r || r[3] !== 'input') continue;
    let qty = 0; try { qty = parseFloat(JSON.parse(r[5] || '{}').inputQty) || 0; } catch (e) { qty = 0; }
    if (qty <= 0) continue;
    let code = null;
    for (const id of String(r[4] || '').split(',')) {          // QR 개별(…-01)은 뒤 일련번호를 떼야 LOT 과 붙는다
      const lot = id.trim().replace(/-\d+$/, '');
      if (lotItem.has(lot)) { code = lotItem.get(lot); break; }
    }
    if (!code) continue;                                       // 물처럼 LOT 이 없는 자재 — 재고 추적 대상 아님
    const d = rpDate(r[11]); if (!d) continue;
    const w = rpWeekStart(d).getTime(); if (w >= curWk) continue;
    if (!out.has(code)) out.set(code, new Map());
    const m = out.get(code); m.set(w, (m.get(w) || 0) + qty);
  }
  return out;
}

/** 관측 창(최근 WEEKS 주, 첫 사용주 이후)의 주간 사용량 배열 — 안 쓴 주는 0 으로 채운다.
    첫 사용주 이전을 0 으로 깔면 자재 교체 직후 평균이 반토막 난다(RM003→RM011). */
function rpUseSeries(weekMap, asOf) {
  if (!weekMap || !weekMap.size) return [];
  const DAY = 86400000, curWk = rpWeekStart(asOf).getTime();
  const from = Math.max(Math.min(...weekMap.keys()), curWk - RP_CFG.WEEKS * 7 * DAY);
  const ser = [];
  for (let w = from; w < curWk; w += 7 * DAY) ser.push(weekMap.get(w) || 0);
  return ser;
}

/** 실측 입고 간격(일) — 같은 날 여러 건은 «한 번의 보충»이므로 날짜로 묶는다. */
function rpReceiptGaps(rcvRecords, code, asOf) {
  const DAY = 86400000, since = asOf.getTime() - RP_CFG.RCV_DAYS * DAY, days = new Set();
  for (const r of rcvRecords || []) {
    if (!r || r[1] !== '원재료' || r[3] !== code) continue;
    const d = rpDate(r[8]); if (!d) continue;
    d.setHours(0, 0, 0, 0);
    if (d.getTime() >= since) days.add(d.getTime());
  }
  const sorted = [...days].sort((a, b) => a - b), gaps = [];
  for (let i = 1; i < sorted.length; i++) gaps.push((sorted[i] - sorted[i - 1]) / DAY);
  return gaps;
}

/** 발주점 산출. 사용 이력이 없으면 null — 근거 없는 숫자를 심지 않는다. */
function calcReorderPoint({ series, gaps, leadDays, orderCycle, perUnit }) {
  const ser = (series || []).map(v => parseFloat(v) || 0);
  if (!ser.length) return null;
  const n = ser.length, mu = ser.reduce((a, b) => a + b, 0) / n;
  if (mu <= 0) return null;
  const sd = n > 1 ? Math.sqrt(ser.reduce((a, b) => a + (b - mu) ** 2, 0) / (n - 1)) : 0;
  const lt = parseFloat(leadDays) > 0 ? parseFloat(leadDays) : RP_CFG.LEAD_DEFAULT;
  const cyc = (gaps || []).length >= RP_CFG.MIN_GAPS
    ? rpPercentile(gaps, RP_CFG.GAP_PCT)
    : (RP_CFG.CYCLE[String(orderCycle || '').trim()] || 7);
  const r = Math.round(cyc * 10) / 10;
  const p = lt + r / 2;
  const ss = RP_CFG.Z * sd * Math.sqrt(p / 7);
  const daily = mu / 7, rop = daily * p + ss;
  const per = parseFloat(perUnit) > 0 ? parseFloat(perUnit) : 0;
  const rounded = per ? Math.round(Math.ceil(rop / per) * per * 100) / 100 : Math.ceil(rop);
  return { weeks: n, mu, sd, daily, leadDays: lt, cycleDays: r, protectDays: p, safety: ss, rop, rounded };
}
// </reorder-calc>

/* 발주점 편집 모달 — SKU 단위(판/통/봉) 인식해 친화적 입력 */
function openReorderPointEditor(code, name, currentRpKg, sku, unit) {

/** 실사용·실입고에서 뽑은 권장 발주점을 모달에 깔아 준다. 채우기만 하고 저장하지 않는다. */
async function rpRenderSuggestion(code, perUnit, unitName, unit) {
  const el = $id('rp-suggest');
  if (!el) return;
  try {
    const [items, lots, proc, rcv] = await Promise.all([
      SheetsAPI.getAll('원재료품목').catch(() => []),
      SheetsAPI.getAll('원재료LOT').catch(() => []),
      SheetsAPI.getAll('공정기록').catch(() => []),
      SheetsAPI.getAll('입고기록').catch(() => []),
    ]);
    const item = items.find(i => i && i[0] === code) || [];
    const asOf = new Date();
    const res = calcReorderPoint({
      series: rpUseSeries(rpWeeklyUse(proc, lots, asOf).get(code), asOf),
      gaps: rpReceiptGaps(rcv, code, asOf),
      leadDays: item[10], orderCycle: item[11], perUnit,
    });
    if (!res) { el.innerHTML = '📐 최근 사용 이력이 없어 권장값을 낼 수 없습니다 — 손으로 정하세요'; return; }
    const inUnit = perUnit > 0 ? Math.round(res.rounded / perUnit * 10) / 10 : res.rounded;
    el.innerHTML = `
      <div class="card bl-info" style="background:var(--bg);padding:8px;margin:0">
        <div class="row between" style="align-items:center;gap:6px">
          <div class="fs-12 fw-6">📐 권장 발주점 <b>${inUnit}${unitName}</b>${perUnit > 0 ? ` (${res.rounded}${unit})` : ''}</div>
          <button class="btn btn-sm btn-outline btn-pri" id="rp-apply" style="padding:2px 8px;font-size:11px;flex-shrink:0">적용</button>
        </div>
        <div class="fs-11 c-txt-l" style="margin-top:4px">
          최근 ${res.weeks}주 평균 <b>${Math.round(res.mu)}${unit}/주</b>(일 ${res.daily.toFixed(1)}${unit})
          · 리드타임 ${res.leadDays}일 · 실측 발주주기 ${res.cycleDays}일
          → 보호기간 ${res.protectDays.toFixed(1)}일 + 안전여유 ${Math.round(res.safety)}${unit}
        </div>
      </div>`;
    const btn = $id('rp-apply');
    if (btn) btn.onclick = () => { const i = $id('rp-input'); if (i) { i.value = inUnit; i.focus(); } };
  } catch (e) {
    el.innerHTML = '📐 권장값 계산 실패 — ' + (e.message || '데이터를 읽지 못했습니다');
  }
}

// Drive view URL 에서 fileId 추출 → 썸네일 endpoint. 미추출 시 원본 URL 반환.
function sfDriveFileId(url) {
  const m = String(url || '').match(/\/d\/([^/]+)/);
  return m ? m[1] : null;
}
function sfDriveThumb(url, sz) {
  const id = sfDriveFileId(url);

}

/* 다음 완제품 코드 추천 — 기존 FG### 중 최대 번호 +1 (3자리 zero-pad).
   비활성 포함 전체 목록을 넘겨 충돌 방지. */
function nextFgCode(allItems) {
  let max = 0;
  (allItems || []).forEach(it => {
    const m = /^FG0*(\d+)$/i.exec(String(it[0] || '').trim());
    if (m) max = Math.max(max, parseInt(m[1]));
  });
  return 'FG' + String(max + 1).padStart(3, '0');
}

/* 완제품 등록/스펙 편집 모달 (관리자 전용).
   code 미지정 → 신규 등록(품목코드·제품명 입력), 지정 → 기존 스펙 수정.
   박스당 봉수는 재고 화면 가용주차 산정에 반영. 소비기한은 생산일+6개월

    let allItems = [];

    else if (perKg > 0) prev = `포장: ${perKg.toLocaleString()}kg/봉 · 박스당 봉수 미설정`;
    else if (ppb > 0) prev = `포장: 봉당 중량 미설정 · ${ppb}봉/박스`;
    else prev = '포장: —';
    const el = $id('fg-box-preview'); if (el) el.textContent = prev;
  };
  overlay.querySelector('#fg-cancel').onclick = close;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  $id('fg-packunit')?.addEventListener('input', updatePreview);
  $id('fg-packsperbox')?.addEventListener('input', updatePreview);
  overlay.querySelector('#fg-save').onclick = () => saveFgSpec(isNew, code, close);
  updatePreview();
  setTimeout(() => $id(isNew ? 'fg-name' : 'fg-packsperbox')?.focus(), 50);
}

async function saveFgSpec(isNew, origCode, closeFn) {
  if (State.user?.role !== 'admin') { toast('관리자만 가능합니다', 'err'); return; }
  const name = $id('fg-name')?.value.trim() || '';
  const unit = $id('fg-unit')?.value.trim() || 'kg';
  const spec = $id('fg-spec')?.value.trim() || '';
  const bagRaw = ($id('fg-packunit')?.value ?? '').trim();
  const bagKg = parseFloat(bagRaw);
  const packUnit = bagRaw === '' ? '' : String(bagKg);   // col4 = 봉당 중량(kg) 숫자 정규화
  const ppbRaw = $id('fg-packsperbox')?.value;
  const shelfLife = $id('fg-shelflife')?.value.trim() || '';
  const storage = $id('fg-storage')?.value.trim() || '';
  const ppb = parseInt(ppbRaw);
  if (!name) { toast('제품명을 입력하세요', 'err'); return; }
  if (bagRaw !== '' && (isNaN(bagKg) || bagKg <= 0)) { toast('봉당 중량(kg)은 0보다 큰 숫자', 'err'); return; }
  if (ppbRaw !== '' && (isNaN(ppb) || ppb < 1)) { toast('박스당 봉수는 1 이상의 정수', 'err'); return; }
  const ppbStr = (ppbRaw === '' ? '' : String(ppb));

  // 규제정보 (품목제조보고 · 라벨) — 시트 [10]~[17]
  const reg = {
    [FG_EXT.reportNo]:   $id('fg-reportno')?.value.trim() || '',
    [FG_EXT.reportDate]: $id('fg-reportdate')?.value.trim() || '',
    [FG_EXT.foodType]:   $id('fg-foodtype')?.value.trim() || '',
    [FG_EXT.recipe]:     $id('fg-recipe')?.value.trim() || '',
    [FG_EXT.packSize]:   $id('fg-packsize')?.value.trim() || '',
    [FG_EXT.labelFile]:  $id('fg-labelfile')?.value.trim() || '',
    [FG_EXT.specNote]:   $id('fg-specnote')?.value.trim() || '',
  };
  if (reg[FG_EXT.reportNo] && !/^\d{8,14}$/.test(reg[FG_EXT.reportNo])) {
    toast('품목보고번호는 숫자 8~14자리입니다', 'err', 4000); return;
  }
  // 라벨 링크가 바뀐 경우에만 갱신일 기록 (감사 추적)
  const prevItem = (window._fgItemsCache || []).find(x => x[0] === origCode) || [];
  const labelChanged = (prevItem[FG_EXT.labelFile] || '') !== reg[FG_EXT.labelFile];
  reg[FG_EXT.labelUpdatedAt] = labelChanged && reg[FG_EXT.labelFile]
    ? formatDateTime() : (prevItem[FG_EXT.labelUpdatedAt] || '');

  if (!acquireLock('saveFgSpec')) return;
  try {
    showLoading();
    // 라벨 이미지 기준값 — 신규 업로드는 각 분기의 검증 통과 후 수행(중복코드 실패 시 orphan 방지)
    let labelUrl = '';
    if (!isNew) {
      const origItem = (window._fgItemsCache || []).find(x => x[0] === origCode);
      labelUrl = origItem ? (origItem[9] || '') : '';
    }
    if (window._fgLabelRemoved) labelUrl = '';
    if (isNew) {
      const code = ($id('fg-code')?.value.trim() || '').toUpperCase();
      if (!code) { toast('품목코드를 입력하세요', 'err'); return; }
      if (!/^[A-Z0-9-]+$/.test(code)) { toast('품목코드는 영문·숫자·하이픈만', 'err'); return; }
      // 유일성: 비활성 포함 전체 재조회로 충돌 방지
      SheetsAPI.invalidateCache('완제품품목');
      const all = await SheetsAPI.getAll('완제품품목', false).catch(() => []);
      if (all.some(it => String(it[0]).trim().toUpperCase() === code)) {
        toast(`이미 존재하는 코드입니다: ${code}`, 'err', 5000); return;
      }
      if (window._fgLabelFile) labelUrl = await DriveAPI.uploadPhoto(window._fgLabelFile);
      // col 순서: code,name,spec,unit,packUnit,shelfLife,storage,status(''),packsPerBox,labelImage + 규제정보[10]~[17]
      const row = [code, name, spec, unit, packUnit, shelfLife, storage, '', ppbStr, labelUrl];
      for (let i = 10; i <= FG_EXT.specNote; i++) row[i] = reg[i] || '';
      await SheetsAPI.append('완제품품목', row);
      SheetsAPI.invalidateCache('완제품품목');
      toast(`${code} ${name} 등록 완료`, 'suc');
    } else {
      if (window._fgLabelFile) labelUrl = await DriveAPI.uploadPhoto(window._fgLabelFile);
      // col: 1=name, 2=spec, 3=unit, 4=packUnit, 5=shelfLife, 6=storage, 8=packsPerBox, 9=labelImage
      await SheetsAPI.updateRow('완제품품목', 0, origCode, {
        1: name, 2: spec, 3: unit, 4: packUnit, 5: shelfLife, 6: storage, 8: ppbStr, 9: labelUrl, ...reg
      });
      SheetsAPI.invalidateCache('완제품품목');
      toast(`${origCode} 스펙 저장 완료`, 'suc');
    }
    closeFn && closeFn();
    await Screens['items-fg']();
  } catch (e) {
    toast('저장 실패: ' + e.message, 'err', 5000);
  } finally {
    hideLoading();
    releaseLock('saveFgSpec');
  }
}

// ─── CONSUMABLE ITEMS (소모품 품목) ───
Screens['items-sp'] = async () => {
  renderHeader('소모품 품목', '소모품 마스터 데이터', { back: 'more' });

      SheetsAPI.getAll('소모품품목').catch(() => []),
      SheetsAPI.getAll('소모품LOT').catch(() => []),
    ]);
  } catch(e) {}
  hideLoading();

  $id('content').innerHTML = `
    <div style="padding:16px">
      <div class="fs-12 c-txt-l mb-8">총 ${items.length}개 소모품 · DB 연동 조회</div>
      ${items.length === 0 ?
        `<div class="empty-state"><div class="es-icon">🧹</div><div class="es-title">등록된 소모품 없음</div><div class="es-desc">Google Sheets에서 직접 등록하세요</div></div>` :

          const totalStock = lots.filter(l => l[1] === code && l[5] !== '폐기' && l[5] !== '소진')

          const isLow = minStock > 0 && totalStock < minStock;
          return `
            <div class="card">
              <div class="row between mb-4">
                <div class="fs-14 fw-6">${name} <span class="fs-11 c-txt-l">${code}</span></div>
                ${isLow ? '<span class="badge badge-err">재고부족</span>' : '<span class="badge badge-suc">정상</span>'}
              </div>
              <div class="fs-12 c-txt-l">규격: ${spec || '-'} · 단위: ${unit} · 분류: ${category || '-'}</div>
              <div class="fs-12" style="margin-top:4px">현재고: <b>${totalStock}${unit}</b>${minStock > 0 ? ` · 발주점: ${minStock}${unit}` : ''}</div>

      </div>
    </div>
  `;
};

async function saveVendor(existingCode, closeFn) {
  const name = $id('vd-name')?.value?.trim();
  if (!name) { toast('거래처명 필수', 'err'); return; }
  const type = $id('vd-type')?.value || '공급';
  const contact = $id('vd-contact')?.value?.trim() || '';
  const phone = $id('vd-phone')?.value?.trim() || '';
  const addr = $id('vd-addr')?.value?.trim() || '';
  const note = $id('vd-note')?.value?.trim() || '';
  if (!acquireLock('saveVendor')) return;
  try {
    showLoading();
    if (existingCode) {
      await SheetsAPI.updateRow('거래처', 0, existingCode, { 1: name, 2: type, 3: contact, 4: phone, 5: addr, 6: note });
      toast(`거래처 수정 완료: ${name}`, 'suc');
    } else {
      const vendors = await SheetsAPI.getAll('거래처').catch(() => []);
      let max = 0;
      vendors.forEach(x => { const m = (x[0]||'').match(/^V(\d+)$/); if (m) max = Math.max(max, parseInt(m[1])); });
      const code = 'V' + String(max + 1).padStart(3, '0');
      await SheetsAPI.append('거래처', [code, name, type, contact, phone, addr, note]);
      toast(`거래처 등록 완료: ${code} ${name}`, 'suc');
    }
    SheetsAPI.invalidateCache('거래처');
    closeFn && closeFn();
    await Screens.vendors();
  } catch (e) {
    toast('저장 실패: ' + e.message, 'err', 5000);
  } finally {
    hideLoading();
    releaseLock('saveVendor');
  }
}
