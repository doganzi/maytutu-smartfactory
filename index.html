async function submitProductionRequest() {
  if (!acquireLock('submitProdReq')) return;
  const product = $id('req-product')?.value;
  const qty = $id('req-qty')?.value;
  const unit = $id('req-unit')?.value;
  const due = $id('req-due')?.value;
  const notes = $id('req-notes')?.value;

  if (!qty || parseFloat(qty) <= 0) { toast('수량을 입력하세요', 'err'); releaseLock('submitProdReq'); return; }

  try {
    showLoading();
    const reqId = await generateSeqId('REQ', '생산요청');
    const productName = product?.includes(' ') ? product.split(' ').slice(1).join(' ') : '앙호두 (호두과자 전용반죽)';
    const productCode = product?.split(' ')[0] || 'FG002';

    await SheetsAPI.append('생산요청', [
      reqId, productCode, productName, qty, unit, formatDate(), due, '대기', State.user?.email, notes || ''
    ]);

    toast('생산요청이 등록되었습니다', 'suc');
    Router.go('production');
  } catch (e) {
    toast('등록 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
    releaseLock('submitProdReq');
  }
}

// ─── INVENTORY ───
Screens.inventory = async () => {
  renderHeader('재고관리');

  try {
    const _warnLoad = (tab) => (e) => { console.warn(`${tab} 로드 실패:`, e); return []; };
    const [rmItems, rmLots, fgLots, spLots, rcvRecords] = await Promise.all([
      SheetsAPI.getAll('원재료품목').catch(_warnLoad('원재료품목')),
      SheetsAPI.getAll('원재료LOT').catch(_warnLoad('원재료LOT')),
      SheetsAPI.getAll('완제품LOT').catch(_warnLoad('완제품LOT')),
      SheetsAPI.getAll('소모품LOT').catch(_warnLoad('소모품LOT')),
      SheetsAPI.getAll('입고기록').catch(_warnLoad('입고기록')),
    ]);
    State.rawMaterialItems = rmItems.filter(i => i[12] !== '비활성');
    State.rawMaterialLots = rmLots;
    State.finishedGoodsLots = fgLots;
    State.consumableLots = spLots;
    State.receivingRecords = rcvRecords;
  } catch(e) { console.warn(e); }

  // 직전 활성 탭 유지 — LiveSync 자동 재렌더로 무조건 기본 탭으로 튕기는 이슈 방지
  // 기본 탭은 '발주' (소모품 탭 제거됨 — 과거 저장값이면 '발주' 로 폴백)
  const validTabs = ['발주', '원재료', '완제품'];
  const lastTab = validTabs.includes(State._invActiveTab) ? State._invActiveTab : '발주';
  // await 필수 — 완제품 탭은 내부에서 SheetsAPI.getAll('완제품개별') 추가 페치.
  // 빠뜨리면 LiveSync 의 스크롤 복원이 페치 완료 전에 실행되어 직후 DOM 재구성으로 무효화됨.
  await renderInventoryContent(lastTab);
};

async function renderInventoryContent(activeTab) {
  // 활성 탭 State 에 저장 (재렌더 시 복원용)
  State._invActiveTab = activeTab;
  const tabs = ['발주', '원재료', '완제품'];

  $id('content').innerHTML = `
    <div class="tab-filter">
      ${tabs.map(t => `<div class="tab ${activeTab === t ? 'active' : ''}" onclick="renderInventoryContent('${t}')">${t}</div>`).join('')}
    </div>
    <div style="padding:16px;position:relative" id="inv-list"></div>
  `;

  const listEl = $id('inv-list');

  if (activeTab === '원재료') {
    const items = State.rawMaterialItems || [];
    if (items.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><div class="es-icon">📦</div><div class="es-title">원재료 품목이 없습니다</div></div>`;
    } else {
      // 최근 7일 이내 입고된 미사용 LOT (입고취소 가능 후보) — 상단 강조
      const now = Date.now();
      const recentLots = (State.rawMaterialLots || []).filter(l => {
        if (l[9] !== '미사용') return false;
        const totalQty = parseFloat(l[4]) || 0, remain = parseFloat(l[8]) || 0;
        if (Math.abs(totalQty - remain) > 0.01) return false;  // 부분 소비된 건 제외
        if (!l[6]) return false;
        const days = (now - new Date(l[6]).getTime()) / 86400000;
        return days <= 7 && days >= 0;
      }).sort((a,b) => new Date(b[6]) - new Date(a[6])).slice(0, 5);

      const recentBanner = recentLots.length > 0 ? `
        <div class="card bl-info" style="background:#e3f2fd;margin-bottom:12px">
          <div class="fs-13 fw-7 c-info mb-4">📥 최근 입고 LOT (7일 내 · ${recentLots.length}건)</div>
          <div class="fs-11 c-txt-l mb-8">잘못 입고된 건은 LOT 상세 → '입고취소 (오입고 정정)' 버튼으로 무효화 가능</div>
          ${recentLots.map(l => {
            const item = items.find(i => i[0] === l[1]);
            return `
              <div class="row between clickable" style="padding:6px 0;border-bottom:1px solid var(--bg);align-items:center" onclick="Router.go('lot-detail', {itemCode:'${l[1]}', itemName:'${(item?.[1]||'').replace(/'/g,"\\'")}'})">
                <div style="flex:1;min-width:0">
                  <div class="fs-12 fw-6" style="font-family:monospace;word-break:break-all">${l[0]}</div>
                  <div class="fs-11 c-txt-l">${item?.[1]||l[1]} · 입고 ${(l[4]||'')}${(l[5]||'')} · ${(l[6]||'').substring(0,10)}</div>
                </div>
                <span class="fs-10 c-info" style="white-space:nowrap;margin-left:8px">상세 ▸</span>
              </div>
            `;
          }).join('')}
        </div>
      ` : '';

      listEl.innerHTML = recentBanner + items.map(item => {
        const code = item[0], name = item[1];
        const sku = item[3] || '';
        const storageTemp = item[8] || '실온';
        const reorderPoint = parseFloat(item[9]) || parseFloat(item[6]) || 0;
        const isWater = code === 'RM002';

        // Calculate remain from LOTs
        const totalRemain = isWater ? '-' :
          (State.rawMaterialLots || []).filter(l => l[1] === code && !['폐기','입고취소'].includes(l[9]))
            .reduce((sum, l) => sum + (parseFloat(l[8]) || 0), 0);

        const needsOrder = !isWater && reorderPoint > 0 && totalRemain <= reorderPoint;

        // Find earliest expiry
        const lots = (State.rawMaterialLots || []).filter(l => l[1] === code && !['폐기','소진','입고취소'].includes(l[9]));
        const earliestExp = lots.reduce((min, l) => {
          if (!l[7]) return min;
          return !min || l[7] < min ? l[7] : min;
        }, null);

        // Unit conversion for display — parseSkuUnit 활용 (알/판 포함)
        let stockDisp = totalRemain + 'kg', rpDisp = reorderPoint + 'kg';
        if (!isWater && sku && typeof totalRemain === 'number') {
          const skuP = parseSkuUnit(sku);
          if (skuP && skuP.perUnit > 0) {
            const stockUnits = Math.floor(totalRemain / skuP.perUnit);
            const stockRem = Math.round(totalRemain % skuP.perUnit * 10) / 10;
            stockDisp = stockRem > 0 ? stockUnits + skuP.unitName + ' ' + stockRem + 'kg' : stockUnits + skuP.unitName;
            rpDisp = Math.round(reorderPoint / skuP.perUnit) + skuP.unitName;
          }
        }

        const badgeClass = isWater ? 'gray' : needsOrder ? 'warn' : 'suc';
        const badgeText = isWater ? '-' : needsOrder ? '발주필요' : '정상';

        return `
          <div class="card ${isWater ? '' : 'clickable'}" ${isWater ? '' : `onclick="Router.go('lot-detail', {itemCode:'${code}', itemName:'${name}'})"`} ${needsOrder ? 'style="border-left:3px solid var(--warn)"' : ''}>
            <div class="row between">
              <div>
                <div class="fs-14 fw-6">
                  ${name} <span class="fs-11 c-txt-l">${code}</span>
                  ${!isWater ? '<span class="fs-10 c-info" style="margin-left:4px">▸ LOT상세</span>' : ''}
                </div>
                <div class="fs-12 c-txt-l mt-4">현재고: ${isWater ? '-' : stockDisp}</div>
                <div class="fs-11 ${needsOrder ? 'c-warn fw-6' : 'c-txt-l'}">${isWater ? '관리대상 외' : `발주점: ${rpDisp}`}</div>
                <div class="fs-11 c-txt-l">소비기한: ${earliestExp ? earliestExp.substring(0,10) : '-'} · ${storageTemp}</div>
              </div>
              <span class="badge badge-${badgeClass}">${badgeText}</span>
            </div>
          </div>
        `;
      }).join('');
    }
    listEl.innerHTML += `<div class="fab" onclick="Router.go('receive-form')">+</div>`;
  }

  else if (activeTab === '완제품') {
    // 개별 항목도 함께 로드하여 정확한 재고 카운트
    let fgIndivs = [];
    try { fgIndivs = await SheetsAPI.getAll('완제품개별').catch(() => []); } catch(e) {}
    const activeStatuses = ['냉동보관중','출하가능'];
    // 완제품 스펙(박스당 봉수) 마스터 조회 — 가용주차 산정에 제품별 포장 규격 반영
    let fgSpecRows = [];
    try { fgSpecRows = await SheetsAPI.getAll('완제품품목').catch(() => []); } catch(e) {}
    const fgPacksPerBoxMap = {};
    fgSpecRows.forEach(it => { const n = parseInt(it[8]); if (n > 0) fgPacksPerBoxMap[it[0]] = n; });

    const fgLots = (State.finishedGoodsLots || []).filter(l => !['폐기','소진','출하완료','삭제','채번예약'].includes(l[9]));
    // Group by itemCode
    const grouped = {};
    fgLots.forEach(l => {
      const code = l[1] || 'FG002';
      if (!grouped[code]) grouped[code] = { name: l[2] || '', lots: [], totalActiveIndivs: 0 };
      // 출하완료/폐기 제외한 실제 개별 수량 카운트
      const lotActiveIndivs = fgIndivs.filter(iv => iv[1] === l[0] && activeStatuses.includes(iv[3]));
      l._activeCount = lotActiveIndivs.length;
      grouped[code].lots.push(l);
      grouped[code].totalActiveIndivs += lotActiveIndivs.length;
    });

    if (Object.keys(grouped).length === 0) {
      listEl.innerHTML = `<div class="empty-state"><div class="es-icon">🎁</div><div class="es-title">완제품 재고 없음</div></div>`;
    } else {
      let html = '';
      Object.entries(grouped).forEach(([code, g]) => {
        // 품목 헤더
        const freezingCount = g.lots.filter(l => (l[9]||'') === '냉동보관중').length;
        const readyCount = g.lots.filter(l => (l[9]||'') === '출하가능').length;
        // 가용 주차 산정 — 박스당 봉수 = 완제품품목 마스터값(미설정 시 4), 주당 75박스 소비 기준
        const PACKS_PER_BOX = fgPacksPerBoxMap[code] || 4;
        const BOXES_PER_WEEK = 75;
        const boxes = g.totalActiveIndivs / PACKS_PER_BOX;
        const weeks = boxes / BOXES_PER_WEEK;
        const weekColor = weeks < 1 ? 'c-err' : weeks < 2 ? 'c-warn' : 'c-suc';
        html += `
          <div class="card info-box suc" style="margin-bottom:8px">
            <div class="row between">
              <div>
                <div class="fs-14 fw-7">${g.name} <span class="fs-11 c-txt-l">${code}</span></div>
                <div class="fs-12 c-txt-l mt-4">총 ${g.lots.length} LOT · ${g.totalActiveIndivs}개 · 냉동 -18°C</div>
                <div class="fs-12 mt-2">≈ ${boxes.toFixed(1)}박스 · 가용 <span class="${weekColor} fw-7">${weeks.toFixed(1)}주</span> <span class="fs-10 c-txt-l">(1박스 ${PACKS_PER_BOX}개 · 주 ${BOXES_PER_WEEK}박스 기준)</span></div>
              </div>
              <div style="text-align:right">
                ${freezingCount > 0 ? `<span class="badge badge-warn" style="display:block;margin-bottom:2px">냉동중 ${freezingCount}</span>` : ''}
                ${readyCount > 0 ? `<span class="badge badge-suc" style="display:block">출하가능 ${readyCount}</span>` : ''}
              </div>
            </div>
          </div>
        `;
        // LOT별 카드
        g.lots.forEach(l => {
          const lotId = l[0];
          const status = l[9] || '냉동보관중';
          const stColor = status === '출하가능' ? 'suc' : status === '냉동보관중' ? 'warn' : 'gray';
          const activeCount = l._activeCount || 0;
          const totalCount = parseFloat(l[10]) || parseFloat(l[3]) || 0;
          const mfgDate = (l[5] || '').substring(0,10);
          const expDate = (l[6] || '').substring(0,10);
          // 출하가능 개별 수 — '출하가능' 상태인 항목만 카운트 (LOT 단위 일괄 출하 후보)
          // LOT 상태 검사는 완화: 개별이 출하가능이면 LOT 상태 무관히 출하 가능
          // (LOT 상태가 '냉동보관중' 으로 뒤늦게 갱신 안 된 경우도 처리)
          const shippableCount = fgIndivs.filter(iv => iv[1] === lotId && iv[3] === '출하가능').length;
          const canShipAll = shippableCount > 0;
          html += `
            <div class="card bl-${stColor} clickable" style="margin-bottom:6px" onclick="showLotIndividuals('${lotId}','${g.name}','fg')">
              <div class="lot-card-header mb-4">
                <span class="lot-id">${lotId}</span>
                <div class="lot-actions">
                  <button class="btn btn-sm btn-pri" style="padding:4px 10px;font-size:11px" onclick="event.stopPropagation();printLotLabels('${lotId}','${g.name}','fg')">🖨️ 라벨</button>
                  <span class="badge badge-${stColor}">${status}</span>
                </div>
              </div>
              <div class="fs-12 c-txt-l">재고: ${activeCount}개 / 전체 ${totalCount}개 · 제조: ${mfgDate}</div>
              <div class="fs-11 c-txt-l">소비기한: ${expDate}</div>
              ${totalCount > 0 ? `<div class="progress-bar mt-6"><div class="fill" style="width:${Math.min(100,(activeCount/totalCount)*100)}%;background:var(--${stColor})"></div></div>` : ''}
              ${canShipAll ? `
                <button class="btn btn-suc btn-full mt-8" style="padding:8px;font-size:13px" onclick="event.stopPropagation();showLotShipmentPopup('${lotId}','${(g.name||'').replace(/'/g,"\\'")}', ${shippableCount})">🚚 전체 출하 (${shippableCount}개)</button>
              ` : ''}
              <div id="indiv-list-${lotId.replace(/[^a-zA-Z0-9]/g,'_')}" style="display:none" class="mt-8"></div>
            </div>
          `;
        });
      });
      listEl.innerHTML = html;
      // 펼침 상태 자동 복원 — State._invFgExpandedLots 에 남은 LOT 들을 다시 열어 사용자가
      // 작업 중이던 위치를 유지. 출하 후 부분 갱신/Router.go 재진입 시에도 적용.
      if (State._invFgExpandedLots && State._invFgExpandedLots.size > 0) {
        const stillPresent = new Set();
        for (const lotId of [...State._invFgExpandedLots]) {
          const lot = (State.finishedGoodsLots || []).find(l => l[0] === lotId);
          if (!lot) continue; // 출하완료 등으로 LOT 사라지면 Set 에서도 제거
          stillPresent.add(lotId);
          const itemCode = lot[1] || 'FG002';
          const itemName = grouped[itemCode]?.name || '';
          // 다음 tick 에서 펼침 (DOM 안정 후) — toggle 동작이므로 닫힌 상태→열림으로 전환
          setTimeout(() => showLotIndividuals(lotId, itemName, 'fg'), 0);
        }
        State._invFgExpandedLots = stillPresent;
      }
    }
  }

  // 소모품 탭은 제거됨 — 소모품 LOT 은 더보기 → 소모품 품목 화면에서 관리

  else if (activeTab === '발주') {
    // 구매주문 + 거래처 동시 로드 (발주 탭 진입 시에만 — 전체 재고 진입 비용 절감)
    let purchaseOrders = [], vendors = [];
    try {
      [purchaseOrders, vendors] = await Promise.all([
        SheetsAPI.getAll('구매주문').catch(() => []),
        SheetsAPI.getAll('거래처').catch(() => []),
      ]);
    } catch(e) { console.warn('발주 로드 실패:', e); }

    // 거래처 코드 → 이름 lookup
    const vendorMap = {};
    vendors.forEach(v => { if (v[0]) vendorMap[v[0]] = v[1] || v[0]; });

    // 단계 완료 판정 — 일자 필드 채워졌는지 기준 (status 보다 정확)
    const isDone = (po, idx) => !!(po[idx] && String(po[idx]).trim());

    // 종결·취소 제외한 활성 PO
    const activePOs = purchaseOrders.filter(p => !['종결','취소','삭제'].includes(p[18]));

    // 다음 대기 단계 카운트
    const summary = { order: 0, recv: 0, tax: 0, pay: 0 };
    activePOs.forEach(p => {
      if (!isDone(p, 1)) summary.order++;
      else if (!isDone(p, 10)) summary.recv++;
      else if (!isDone(p, 13)) summary.tax++;
      else if (!isDone(p, 15)) summary.pay++;
    });

    // 최근 주문 우선 정렬 (orderDt desc, 빈 값은 뒤)
    activePOs.sort((a, b) => (b[1] || '').localeCompare(a[1] || ''));

    let html = `
      <div class="card info-box" style="background:#fff;border-left:4px solid var(--pri);margin-bottom:12px">
        <div class="fs-13 fw-7 mb-6">📋 구매주문 현황 <span class="fs-11 c-txt-l">활성 ${activePOs.length}건</span></div>
        <div class="row" style="gap:10px;flex-wrap:wrap">
          <span class="fs-12"><span class="badge badge-gray">주문대기</span> <b>${summary.order}</b></span>
          <span class="fs-12"><span class="badge badge-warn">수령대기</span> <b>${summary.recv}</b></span>
          <span class="fs-12"><span class="badge badge-info">계산서대기</span> <b>${summary.tax}</b></span>
          <span class="fs-12"><span class="badge badge-suc">입금대기</span> <b>${summary.pay}</b></span>
        </div>
      </div>
    `;

    if (activePOs.length === 0) {
      html += `<div class="empty-state"><div class="es-icon">📋</div><div class="es-title">활성 구매주문 없음</div><div class="es-desc">신규 발주가 등록되면 여기에 표시됩니다</div></div>`;
    } else {
      html += activePOs.map(p => {
        const orderDone = isDone(p, 1);
        const recvDone = isDone(p, 10);
        const taxDone = isDone(p, 13);
        const payDone = isDone(p, 15);
        const stColor = payDone ? 'suc' : taxDone ? 'info' : recvDone ? 'warn' : 'gray';
        // 단계 순서: 주문 → 세금계산서 → 입금 → 수령(종결). 최종 단계가 우선 표시되도록 역순 체크.
        const stLabel = recvDone ? '수령완료' : payDone ? '입금완료' : taxDone ? '계산서수령' : orderDone ? '주문완료' : '주문대기';
        const vendorName = vendorMap[p[3]] || p[3] || '-';
        const qty = parseFloat(p[6]) || 0;
        const unitPrice = parseFloat(p[8]) || 0;
        const totalAmt = parseFloat(p[9]) || (qty * unitPrice) || 0;
        const dot = (done) => done ? '<span style="color:var(--suc);font-weight:bold">●</span>' : '<span style="color:var(--gray-l)">○</span>';
        return `
          <div class="card clickable bl-${stColor}" style="margin-bottom:8px" onclick="Router.go('po-detail', {poId:'${p[0]}'})">
            <div class="row between mb-4">
              <span class="fs-13 fw-7">${p[0] || '-'}</span>
              <span class="badge badge-${stColor}">${stLabel}</span>
            </div>
            <div class="fs-12 mb-4"><b>${vendorName}</b> · ${p[5] || ''} ${qty || ''}${p[7] || ''}</div>
            <div class="fs-11 c-txt-l mb-6">단가 ${unitPrice.toLocaleString()}원 · 합계 ${totalAmt.toLocaleString()}원</div>
            <div class="row" style="gap:10px;font-size:11px;flex-wrap:wrap">
              <span>${dot(orderDone)} 주문 ${(p[1] || '').substring(0,10)}</span>
              <span>${dot(recvDone)} 수령 ${(p[10] || '').substring(0,10)}</span>
              <span>${dot(taxDone)} 계산서 ${(p[13] || '').substring(0,10)}</span>
              <span>${dot(payDone)} 입금 ${(p[15] || '').substring(0,10)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    listEl.innerHTML = html;
    // FAB(+) — 신규 발주 등록 (worker / producer / admin 노출)
    if (Role.canCreateOrder()) {
      listEl.innerHTML += `<div class="fab" onclick="Router.go('po-new')">+</div>`;
    }
  }

  else if (activeTab === '입고') {
    const records = (State.receivingRecords || []).slice().reverse().slice(0, 20);
    if (records.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><div class="es-icon">📥</div><div class="es-title">입고 내역 없음</div></div>`;
    } else {
      listEl.innerHTML = records.map(r => `
        <div class="card">
          <div class="row between mb-4">
            <span class="fs-13 fw-6">${r[4] || ''} ${r[6] || ''}${r[7] || ''}</span>
            <span class="badge badge-gray">${r[1] || ''}</span>
          </div>
          <div class="fs-11 c-txt-l">${r[0] || ''} · ${r[5] || ''} · ${(r[8]||'').substring(0,10)}</div>
        </div>
      `).join('');
    }
    listEl.innerHTML += `<div class="fab" onclick="Router.go('receive-form')">+</div>`;
  }
}

// ─── 구매주문 (PO) — 등록 / 상세·처리 ───
// 구매주문 시트 헤더 (20개 컬럼) — 자동 생성 / append 시 일관성 보장
const PO_SHEET_HEADER = [
  'poId', 'orderDt', 'ordererEmail', 'vendorCode', 'itemCode', 'itemName',
  'qty', 'unit', 'unitPrice', 'totalAmt', 'recvDt', 'receiverEmail',
  'recvLotId', 'taxInvoiceDt', 'taxInvoiceNo', 'paymentDt',
  'paymentAccount', 'paymentConfirmer', 'status', 'note'
];

Screens['po-new'] = async () => {
  if (!Role.canCreateOrder()) {
    toast('발주 등록 권한이 없습니다', 'err');
    Router.go('inventory');
    return;
  }
  renderHeader('신규 발주 등록', null, { back: 'inventory' });

  let vendors = [], rmItems = [], pos = [], rcvs = [];
  try {
    [vendors, rmItems, pos, rcvs] = await Promise.all([
      SheetsAPI.getAll('거래처').catch(() => []),
      SheetsAPI.getAll('원재료품목').catch(() => []),
      SheetsAPI.getAll('구매주문').catch(() => []),
      SheetsAPI.getAll('입고기록').catch(() => []),
    ]);
  } catch(e) { console.warn('po-new 로드 실패:', e); }

  // RM002(물) 및 비활성 제외
  const activeItems = rmItems.filter(i => i[0] !== 'RM002' && i[12] !== '비활성');

  // 품목 → 거래처 이력 매핑 (구매주문 + 입고기록 합산, 삭제된 PO 제외)
  const itemVendors = {};
  pos.forEach(p => {
    if (p[18] === '삭제') return;
    if (p[4] && p[3]) (itemVendors[p[4]] = itemVendors[p[4]] || new Set()).add(p[3]);
  });
  rcvs.forEach(r => {
    if (r[3] && r[2]) (itemVendors[r[3]] = itemVendors[r[3]] || new Set()).add(r[2]);
  });

  // 후속 함수에서 사용
  window._poVendors = vendors;
  window._poItemVendors = itemVendors;

  $id('content').innerHTML = `
    <div style="padding:16px">
      <div class="input-group">
        <label>품목 *</label>
        <select id="po-item" onchange="updatePOItemUnit()">
          <option value="">-- 선택 --</option>
          ${activeItems.map(i => {
            const sku = i[3] || '';
            const parsed = parseSkuUnit(sku);
            const orderUnit = parsed ? parsed.unitName : (i[4] || 'kg');
            const storageUnit = parsed ? (parsed.isEgg ? '알' : parsed.raw) : (i[4] || 'kg');
            const perUnit = parsed ? (parsed.isEgg ? parsed.eggPerTray : parsed.perUnit) : 1;
            const kgPerUnit = parsed ? parsed.perUnit : 1;
            return `<option value="${i[0]}" data-name="${(i[1]||'').replace(/"/g,'&quot;')}" data-order-unit="${orderUnit}" data-storage-unit="${storageUnit}" data-per-unit="${perUnit}" data-kg-per-unit="${kgPerUnit}" data-sku="${(i[3]||'').replace(/"/g,'&quot;')}">${i[1] || i[0]}${sku?` (${sku})`:''}</option>`;
          }).join('')}
        </select>
      </div>
      <div class="input-group">
        <label>거래처 *</label>
        <select id="po-vendor" disabled>
          <option value="">-- 먼저 품목 선택 --</option>
        </select>
        <div id="po-vendor-hint" class="fs-11 c-txt-l mt-4" style="display:none"></div>
      </div>
      <div class="grid-2">
        <div class="input-group">
          <label>수량 *</label>
          <input type="number" id="po-qty" min="1" step="1" oninput="updatePOTotal()">
        </div>
        <div class="input-group">
          <label>단위</label>
          <input type="text" id="po-unit" readonly style="background:#f5f5f5">
        </div>
      </div>
      <div id="po-conv-hint" class="fs-11 c-info" style="display:none;background:#e3f2fd;padding:8px 10px;border-radius:6px;margin-bottom:14px"></div>
      <div class="grid-2">
        <div class="input-group">
          <label>단가 (1<span id="po-price-unit-lbl">개</span>당 원)</label>
          <input type="number" id="po-unit-price" min="0" step="1" oninput="updatePOTotal()">
        </div>
        <div class="input-group">
          <label>합계 (원)</label>
          <input type="text" id="po-total" readonly style="background:#f5f5f5">
        </div>
      </div>
      <div class="input-group">
        <label>비고</label>
        <textarea id="po-note" rows="2" placeholder="예: 카톡주문, 다음주 화요일 도착 예정"></textarea>
      </div>
      <button class="btn btn-pri btn-full mt-12" onclick="submitNewPO()">발주 등록</button>
    </div>
  `;
  updatePOItemUnit();
};

function updatePOItemUnit() {
  const sel = $id('po-item');
  if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const itemCode = sel.value;
  const orderUnit = (opt && opt.dataset.orderUnit) || '';
  const storageUnit = (opt && opt.dataset.storageUnit) || '';
  const perUnit = parseFloat(opt?.dataset.perUnit) || 0;
  const kgPerUnit = parseFloat(opt?.dataset.kgPerUnit) || 0;
  // 수량 단위 표시 (포대/통/판 등 주문 단위)
  const unitEl = $id('po-unit');
  if (unitEl) unitEl.value = orderUnit;
  // 단가 라벨 — "단가 (1 포대당 원)" 식으로 명확화
  const lbl = $id('po-price-unit-lbl');
  if (lbl) lbl.textContent = orderUnit || '개';
  // 환산 힌트
  const hint = $id('po-conv-hint');
  if (hint) {
    if (orderUnit && storageUnit && perUnit) {
      const eggKg = (kgPerUnit && kgPerUnit !== perUnit) ? ` (≈ ${kgPerUnit} kg)` : '';
      hint.style.display = 'block';
      hint.innerHTML = `💡 1 ${orderUnit} = ${perUnit} ${storageUnit}${eggKg} · 입고 시 자동 환산`;
    } else {
      hint.style.display = 'none';
    }
  }
  // 거래처 dropdown — 선택 품목과 거래 이력 있는 거래처만, 없으면 전체 + 힌트
  updatePOVendors(itemCode);
  updatePOTotal();
}

function updatePOVendors(itemCode) {
  const vSel = $id('po-vendor');
  const vHint = $id('po-vendor-hint');
  if (!vSel) return;
  const allVendors = window._poVendors || [];
  const map = window._poItemVendors || {};
  if (!itemCode) {
    vSel.innerHTML = `<option value="">-- 먼저 품목 선택 --</option>`;
    vSel.disabled = true;
    if (vHint) vHint.style.display = 'none';
    return;
  }
  const linked = map[itemCode];  // Set or undefined
  const hasHistory = linked && linked.size > 0;
  const candidates = hasHistory
    ? allVendors.filter(v => linked.has(v[0]))
    : allVendors;
  vSel.disabled = false;
  vSel.innerHTML = `<option value="">-- 선택 --</option>` +
    candidates.map(v => `<option value="${v[0]}">${v[1] || v[0]}</option>`).join('');
  if (vHint) {
    if (hasHistory) {
      vHint.style.display = 'block';
      vHint.textContent = `📜 이 품목 거래 이력 ${candidates.length}개 거래처 노출 (이력 없으면 전체 표시)`;
    } else {
      vHint.style.display = 'block';
      vHint.textContent = `🆕 이 품목 첫 발주 — 전체 거래처(${candidates.length}개) 표시`;
    }
  }
}

function updatePOTotal() {
  const qty = parseFloat($id('po-qty')?.value) || 0;
  const price = parseFloat($id('po-unit-price')?.value) || 0;
  const totalEl = $id('po-total');
  if (totalEl) totalEl.value = (qty * price).toLocaleString();
}

async function submitNewPO() {
  if (!Role.isProducer() && !Role.isAdmin()) { toast('권한 없음', 'err'); return; }
  const vendor = $id('po-vendor')?.value || '';
  const itemSel = $id('po-item');
  const itemCode = itemSel?.value || '';
  const itemName = itemSel?.options[itemSel.selectedIndex]?.dataset.name || '';
  const qty = $id('po-qty')?.value || '';
  const unit = $id('po-unit')?.value || '';
  const unitPrice = $id('po-unit-price')?.value || '0';
  const note = $id('po-note')?.value || '';

  const missing = [];
  if (!vendor) missing.push('거래처');
  if (!itemCode) missing.push('품목');
  if (!qty || parseFloat(qty) <= 0) missing.push('수량');
  if (missing.length) { toast('미입력: ' + missing.join(', '), 'err'); return; }

  try {
    showLoading();
    // 사전 점검 — '구매주문' 시트 탭 존재 확인. 없으면 자동 생성 제안.
    try {
      await SheetsAPI.getAll('구매주문');
    } catch (probeErr) {
      hideLoading();
      console.warn('[po-new] 구매주문 시트 미존재 — 자동 생성 제안:', probeErr.message);
      confirm(
        '구매주문 시트 자동 생성',
        'Google Sheets 에 "구매주문" 탭이 없습니다.\n지금 자동으로 생성하시겠습니까?\n(헤더 20개 컬럼 포함)',
        async () => {
          try {
            showLoading();
            await SheetsAPI.createSheet('구매주문', PO_SHEET_HEADER);
            hideLoading();
            toast('구매주문 시트 생성 완료 — 발주 등록 버튼을 다시 눌러주세요.', 'suc', 5000);
          } catch (createErr) {
            hideLoading();
            toast('시트 자동 생성 실패: ' + createErr.message, 'err', 7000);
          }
        }
      );
      return;
    }
    const poId = await generateSeqId('PO', '구매주문');
    const totalAmt = String((parseFloat(qty) || 0) * (parseFloat(unitPrice) || 0));
    await SheetsAPI.append('구매주문', [
      poId, formatDate(), State.user?.email || '', vendor, itemCode, itemName,
      qty, unit, unitPrice, totalAmt, '', '', '', '', '', '', '', '', '주문완료', note
    ]);
    SheetsAPI.invalidateCache('구매주문');
    toast(`발주 등록 완료: ${poId}`, 'suc');
    Router.go('inventory');
  } catch(e) {
    toast('등록 실패: ' + e.message, 'err', 6000);
  } finally { hideLoading(); }
}

      <div class="grid-2">
        <div class="input-group">
          <label>입금일 *</label>
          <input type="date" id="po-pay-dt" value="${formatDate()}">
        </div>
        <div class="input-group">
          <label>이체 계좌 *</label>
          <input type="text" id="po-pay-acc" placeholder="예: 신한 110-***-***">
        </div>

      <div class="input-group">
        <label>확인자</label>
        <input type="text" value="${State.user?.name||''}" readonly style="background:#f5f5f5">
      </div>

  `;
}

async function savePOReceive(poId) {
  if (!Role.canEditPO('recv')) { toast('권한 없음', 'err'); return; }
  const recvDt = $id('po-recv-dt')?.value;
  const exp = $id('po-recv-exp')?.value;
  if (!recvDt || !exp) { toast('수령일·소비기한 필수', 'err'); return; }

  try {
    showLoading();
    const pos = await SheetsAPI.getAll('구매주문', false);
    const po = pos.find(p => p[0] === poId);
    if (!po) throw new Error('PO 없음');

    const itemCode = po[4];
    const itemName = po[5];
    const vendorCode = po[3];
    const inputQty = parseFloat(po[6]) || 0;

    // RM 품목 sku 조회 → kg 환산 (기존 submitReceiving 와 동일 로직)
    const rmItems = await SheetsAPI.getAll('원재료품목').catch(() => []);
    const item = rmItems.find(i => i[0] === itemCode);
    const sku = item?.[3] || '';
    const parsed = parseSkuUnit(sku);
    const qtyKg = parsed ? Math.round(inputQty * parsed.perUnit * 100) / 100 : inputQty;
    const indivCount = parsed ? inputQty : Math.max(1, Math.round(inputQty));

    const rcvId = await generateSeqId('RCV', '입고기록');
    const lotId = await generateLotId('RM', itemCode, exp, '원재료LOT');

    // 1. 입고기록
    await SheetsAPI.append('입고기록', [
      rcvId, '원재료', vendorCode, itemCode, itemName, lotId, String(qtyKg), 'kg', formatDateTime(),
      State.user?.email || '', '완료', ''
    ]);
    // 2. 원재료LOT
    await SheetsAPI.append('원재료LOT', [
      lotId, itemCode, itemName, vendorCode, String(qtyKg), 'kg', recvDt, exp, String(qtyKg), '미사용', indivCount, '상온 15~25℃'
    ]);
    // 3. 원재료개별 QR
    if (indivCount > 0) {
      const perUnit = qtyKg / indivCount;
      const indivRows = [];
      for (let i = 1; i <= indivCount; i++) {
        const indivId = `${lotId}-${String(i).padStart(2, '0')}`;
        indivRows.push([indivId, lotId, itemCode, '미사용', String(perUnit), '', qrImageUrl(indivId)]);
      }
      await SheetsAPI.append('원재료개별', indivRows);
    }
    // 4. 구매주문 row 업데이트
    await SheetsAPI.updateRow('구매주문', 0, poId, {
      10: recvDt, 11: State.user?.email || '', 12: lotId, 18: '수령완료'
    });
    SheetsAPI.invalidateAllCache();
    toast(`수령 완료 · LOT ${lotId} 생성 (${indivCount}개) · PO 종결`, 'suc');
    Router.go('po-detail', { poId });
  } catch (e) {
    toast('수령 처리 실패: ' + e.message, 'err');
  } finally { hideLoading(); }
}

async function deletePO(poId) {
  showLoading();
  try {
    SheetsAPI.invalidateCache('구매주문');
    const pos = await SheetsAPI.getAll('구매주문', false);
    const po = pos.find(p => p[0] === poId);
    if (!po) { hideLoading(); toast('PO 를 찾을 수 없습니다', 'err'); return; }
    if (po[18] === '삭제') { hideLoading(); toast('이미 삭제된 발주입니다', 'warn'); return; }

    const isAdmin = State.user?.role === 'admin';
    const isOwner = po[2] === State.user?.email;
    if (!isAdmin && !isOwner) { hideLoading(); toast('본인 또는 관리자만 삭제 가능합니다', 'err'); return; }

    const recvLotId = po[12] || '';
    let lotStatus = '';
    let lotCascadable = false;
    if (recvLotId) {
      const lots = await SheetsAPI.getAll('원재료LOT').catch(() => []);
      const lot = lots.find(l => l[0] === recvLotId);
      lotStatus = lot ? (lot[9] || '') : '';
      lotCascadable = lot && lot[9] === '미사용';  // 미사용 LOT 만 자동 입고취소 가능
    }
    hideLoading();

    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog" style="max-width:380px">
        <div class="d-title">발주 삭제</div>
        <div class="d-msg">${poId} · ${po[5]||''} ${po[6]||''}${po[7]||''}<br><span class="fs-11 c-txt-l">상태: ${po[18]||'-'}</span></div>
        ${recvLotId ? `
          <div class="card bl-err" style="background:#fff0f0;padding:10px;margin-bottom:10px">
            <div class="fs-12 c-err fw-7">⚠ 수령 완료된 발주</div>
            <div class="fs-11 c-txt-l mt-4">연결 LOT: ${recvLotId} (${lotStatus||'-'})</div>
            ${lotCascadable
              ? `<div class="check-item" id="cascade-lot-row" style="margin-top:8px;cursor:pointer"><div class="check-box" id="cascade-lot-box" style="border:2px solid var(--err)"></div><span class="fs-12">LOT 도 함께 '입고취소' 처리 (미사용 상태에서만 가능)</span></div>`
              : `<div class="fs-11 c-txt-l mt-4">LOT 이 이미 사용/소진/폐기 상태 — LOT 은 보존됩니다</div>`}
          </div>
        ` : ''}
        <div class="input-group" style="margin-bottom:8px">
          <label>삭제 사유 (필수)</label>
          <select id="po-del-reason-preset" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
            <option value="">— 사유 선택 —</option>
            <option value="오등록">오등록</option>
            <option value="중복">중복 등록</option>
            <option value="거래처변경">거래처 변경</option>
            <option value="수량변경">수량 변경 (재등록)</option>
            <option value="발주취소">발주 취소</option>
            <option value="테스트">테스트</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="input-group" style="margin-bottom:12px">
          <textarea id="po-del-reason-detail" rows="2" placeholder="상세 사유 (선택)" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px"></textarea>
        </div>
        <div class="d-actions">
          <button class="btn btn-sm btn-outline btn-gray" id="po-del-cancel">취소</button>
          <button class="btn btn-sm btn-err" id="po-del-ok">삭제</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const cascadeRow = overlay.querySelector('#cascade-lot-row');
    if (cascadeRow) {
      cascadeRow.onclick = () => {
        const box = overlay.querySelector('#cascade-lot-box');
        const checked = box.classList.toggle('checked');
        box.style.background = checked ? 'var(--err)' : '';
        box.textContent = checked ? '✓' : '';
        box.style.color = checked ? '#fff' : '';
      };
    }
    overlay.querySelector('#po-del-cancel').onclick = () => overlay.remove();
    overlay.querySelector('#po-del-ok').onclick = () => {
      const preset = overlay.querySelector('#po-del-reason-preset').value;
      const detail = overlay.querySelector('#po-del-reason-detail').value?.trim();
      if (!preset) { toast('삭제 사유를 선택하세요', 'err'); return; }
      const reason = detail ? `${preset} — ${detail}` : preset;
      const cascadeLot = !!(lotCascadable && overlay.querySelector('#cascade-lot-box')?.classList.contains('checked'));
      overlay.remove();

      confirm('정말 삭제하시겠습니까?', `${poId}\n사유: ${reason}${cascadeLot ? `\n+ LOT ${recvLotId} '입고취소' 처리` : ''}`, async () => {
        if (!acquireLock('deletePO')) return;
        try {
          showLoading();
          const existingNote = po[19] || '';
          const noteUpdate = `[삭제 ${formatDateTime()} by ${State.user?.email||''}] ${reason}${existingNote ? ` | 기존: ${existingNote}` : ''}`;
          await SheetsAPI.updateRow('구매주문', 0, poId, {
            18: '삭제',
            19: noteUpdate
          });
          if (cascadeLot && recvLotId) {
            await SheetsAPI.updateRow('원재료LOT', 0, recvLotId, { 9: '입고취소' });
            SheetsAPI.invalidateCache('원재료LOT');
          }
          SheetsAPI.invalidateCache('구매주문');
          toast('발주 삭제 완료' + (cascadeLot ? ` (LOT ${recvLotId} 입고취소)` : ''), 'suc');
          Router.go('inventory');
        } catch (e) {
          toast('삭제 실패: ' + e.message, 'err');
        } finally {
          hideLoading();
          releaseLock('deletePO');
        }
      });
    };
  } catch (e) {
    hideLoading();
    toast('삭제 처리 실패: ' + e.message, 'err');
  }
}

// ─── LOT DETAIL ───
Screens['lot-detail'] = async (params = {}) => {
  const { itemCode, itemName, type } = params;
  const _keepCache = params._keepCache;
  State._lotDetailParams = { itemCode, itemName, type };
  renderHeader('LOT 상세', `${itemCode || ''} ${itemName || ''}`, { back: 'inventory' });
  // 다중 선택 출하 상태 — 화면 진입 시마다 초기화 (다른 LOT 잔여 선택 방지)
  State._selectedShipIds = new Map();

  const isFG = type === 'fg';
  const isSP = type === 'sp';
  const lotTab = isFG ? '완제품LOT' : isSP ? '소모품LOT' : '원재료LOT';
  const indivTab = isFG ? '완제품개별' : isSP ? '소모품개별' : '원재료개별';

  let lots = [], indivs = [], rmSku = '';
  try {
    // 카드와 개별 목록 표시값 일치 보장 — 진입 시 캐시 무효화로 fresh 데이터 강제
    if (!_keepCache) { SheetsAPI.invalidateCache(lotTab); SheetsAPI.invalidateCache(indivTab); }
    lots = (await SheetsAPI.getAll(lotTab, false).catch(() => [])).filter(l => l[1] === itemCode);
    indivs = await SheetsAPI.getAll(indivTab, false).catch(() => []);
    // showLotIndividuals 가 재사용할 수 있도록 State 에 저장 (재fetch 없이 동일 데이터 사용)
    State._lotDetailIndivs = { tab: indivTab, data: indivs, ts: Date.now() };
    if (!isFG && !isSP) {
      const item = State.rawMaterialItems?.find(i => i[0] === itemCode);
      rmSku = item?.[3] || '';
    }
  } catch (e) { console.warn(e); }

  // 완제품: 출하완료 제외한 실제 재고 카운트
  let totalRemain;
  if (isFG) {
    const activeStatuses = ['냉동보관중','출하가능'];
    totalRemain = indivs.filter(iv => lots.some(l => l[0] === iv[1]) && activeStatuses.includes(iv[3])).length;
  } else {
    totalRemain = lots.reduce((sum, l) => sum + (parseFloat(l[8]) || 0), 0);
  }
  const rmItem = !isFG && !isSP ? State.rawMaterialItems?.find(i => i[0] === itemCode) : null;
  const lotReorderPoint = parseFloat(rmItem?.[9]) || parseFloat(rmItem?.[6]) || 0;
  const needsOrder = lotReorderPoint > 0 && totalRemain <= lotReorderPoint;

  // Unit conversion for display — parseSkuUnit 활용 (알/판 포함)
  let lotStockDisp = totalRemain + (isFG ? '개' : 'kg'), lotRpDisp = lotReorderPoint + 'kg';
  if (!isFG && !isSP && rmSku) {
    const skuP2 = parseSkuUnit(rmSku);
    if (skuP2 && skuP2.perUnit > 0) {
      const su2 = Math.floor(totalRemain / skuP2.perUnit), sr2 = Math.round(totalRemain % skuP2.perUnit * 10) / 10;
      lotStockDisp = sr2 > 0 ? su2 + skuP2.unitName + ' ' + sr2 + 'kg' : su2 + skuP2.unitName;
      if (lotReorderPoint > 0) lotRpDisp = Math.round(lotReorderPoint / skuP2.perUnit) + skuP2.unitName;
    }
  }

  // 완제품: 출하완료 LOT 제외
  const displayLots = isFG ? lots.filter(l => !['출하완료','폐기','소진','삭제','채번예약'].includes(l[9]))
                                   : lots.filter(l => l[9] !== '입고취소');
  // 정렬 — 기본 '최근순'(LOT ID = 제조일YYMMDD 인코딩 → 내림차순). State._lotSortKey 로 사용자 선택 유지.
  const _expOf = l => isFG ? (l[6]||'') : (l[7]||'');
  const _remainOf = l => isFG ? indivs.filter(iv => iv[1] === l[0] && ['냉동보관중','출하가능'].includes(iv[3])).length : (parseFloat(l[8])||0);
  const _lotSortKey = State._lotSortKey || 'recent';
  const _lotSorters = {
    recent: (a,b) => String(b[0]).localeCompare(String(a[0])),
    old:    (a,b) => String(a[0]).localeCompare(String(b[0])),
    exp:    (a,b) => String(_expOf(a)).localeCompare(String(_expOf(b))) || String(a[0]).localeCompare(String(b[0])),
    remain: (a,b) => _remainOf(b) - _remainOf(a) || String(b[0]).localeCompare(String(a[0])),
  };
  displayLots.sort(_lotSorters[_lotSortKey] || _lotSorters.recent);

  const lotBadgeClass = needsOrder ? 'warn' : 'suc';
  const lotBadgeText = needsOrder ? '발주필요' : '정상';
  const lotBoxClass = needsOrder ? 'warn' : 'suc';

  $id('content').innerHTML = `
    <div style="padding:16px">
      <div class="card info-box ${lotBoxClass}">
        <div class="row between">
          <div>
            <div class="fs-16 fw-7">${itemName}</div>
            <div class="fs-12 c-txt-l">${itemCode} · 현재고 ${lotStockDisp}${!isFG && !isSP && lotReorderPoint > 0 ? ` · 발주점 ${lotRpDisp}` : ''}</div>
          </div>
          ${!isFG && !isSP ? `<span class="badge badge-${lotBadgeClass}">${lotBadgeText}</span>` : ''}
        </div>
      </div>

      <div class="row between" style="margin-bottom:8px;align-items:center;flex-wrap:wrap;gap:6px">
        <span class="fs-13 fw-7">LOT 목록 <span class="fs-11 c-txt-l">${isFG ? '(클릭하여 개별 항목 확인/출하)' : '(미사용/사용중만 인쇄 가능)'}</span></span>
        <div class="row" style="gap:4px;flex-wrap:wrap">
          ${[['recent','최근순'],['old','오래된순'],['exp','소비기한'],['remain','잔량순']].map(([k,lb]) => `<button class="btn btn-sm ${_lotSortKey===k?'btn-pri':'btn-outline'}" style="padding:3px 9px;font-size:11px;min-height:auto" onclick="setLotSort('${k}')">${lb}</button>`).join('')}
        </div>
      </div>
      ${displayLots.length === 0 ? '<div class="fs-12 c-txt-l">LOT 없음</div>' : displayLots.map(l => {
        const status = isFG ? (l[9] || '냉동보관중') : (l[9] || '미사용');
        const lotIndivs = indivs.filter(iv => iv[1] === l[0]);

        if (isFG) {
          // 완제품 LOT: 개별 기반 카운트
          const activeStatuses = ['냉동보관중','출하가능'];
          const activeIndivs = lotIndivs.filter(iv => activeStatuses.includes(iv[3]));
          const shippableIndivs = lotIndivs.filter(iv => iv[3] === '출하가능');
          // 전체 카운트는 'soft-deleted' 제외 (HACCP 추적성 유지 + 실제 생산량 반영)
          const totalIndivs = lotIndivs.filter(iv => iv[3] !== '삭제').length;
          const stColor = status === '출하가능' ? 'suc' : status === '냉동보관중' ? 'warn' : 'gray';
          const canPrint = activeIndivs.length > 0;
          const canShipAll = shippableIndivs.length > 0;  // LOT 상태 검사 완화 — 개별이 출하가능이면 충분
          return `
            <div class="card bl-${stColor}" style="cursor:pointer" onclick="showLotIndividuals('${l[0]}','${itemName}','fg')">
              <div class="lot-card-header mb-4">
                <span class="lot-id">${l[0]}</span>
                <div class="lot-actions">
                  ${canPrint ? `<button class="btn btn-sm btn-pri" style="padding:4px 10px;font-size:11px" onclick="event.stopPropagation();printLotLabels('${l[0]}','${itemName}','fg')">🖨️ 인쇄가능 ${activeIndivs.length}매</button>` : ''}
                  <span class="badge badge-${stColor}">${status}</span>
                </div>
              </div>
              <div class="fs-12 c-txt-l">재고: ${activeIndivs.length}개 / 전체 ${totalIndivs}개 · 제조: ${(l[5]||'').substring(0,10)}</div>
              <div class="fs-11 c-txt-l">소비기한: ${(l[6]||'').substring(0,10)}</div>
              ${totalIndivs > 0 ? `<div class="progress-bar mt-8"><div class="fill" style="width:${Math.min(100,(activeIndivs.length/totalIndivs)*100)}%;background:var(--${stColor})"></div></div>` : ''}
              ${canShipAll ? `
                <button class="btn btn-suc btn-full mt-8" style="padding:8px;font-size:13px" onclick="event.stopPropagation();showLotShipmentPopup('${l[0]}','${(itemName||'').replace(/'/g,"\\'")}', ${shippableIndivs.length})">🚚 전체 출하 (${shippableIndivs.length}개)</button>
              ` : ''}
              <div id="indiv-list-${l[0].replace(/[^a-zA-Z0-9]/g,'_')}" style="display:none" class="mt-8"></div>
            </div>
          `;
        }

        // 원재료/소모품 LOT (기존 로직)
        const remain = parseFloat(l[8]) || 0;
        const qty = parseFloat(l[4]) || 1;
        const stColor = status === '미사용' ? 'suc' : status === '사용중' ? 'info' : 'gray';
        const canPrint = ['미사용','사용중'].includes(status);
        const printableIndivs = lotIndivs.filter(iv => ['미사용','사용중'].includes(iv[3]));
        // 입고취소 가능 조건: 미사용 LOT + 모든 개별이 미사용 상태 (원재료만)
        const isRMLot = !isFG && !isSP;
        const canCancelIntake = isRMLot && status === '미사용' && lotIndivs.length > 0
          && lotIndivs.every(iv => iv[3] === '미사용' || !iv[3]);
        // SKU 단위 변환 for LOT display — unit이 이미 비-kg 단위이면 이중 변환 방지
        const lotUnit = (l[5]||'kg').trim();
        let lotQtyDisp = qty + lotUnit, lotRemDisp = remain + lotUnit;
        if (!isSP && rmSku && lotUnit === 'kg') {
          const skuP = parseSkuUnit(rmSku);
          if (skuP && skuP.perUnit > 0) {
            const qU = Math.floor(qty / skuP.perUnit), qR = Math.round(qty % skuP.perUnit * 10) / 10;
            lotQtyDisp = qR > 0 ? qU + skuP.unitName + ' ' + qR + 'kg' : qU + skuP.unitName;
            const rU = Math.floor(remain / skuP.perUnit), rR = Math.round(remain % skuP.perUnit * 10) / 10;
            lotRemDisp = rR > 0 ? rU + skuP.unitName + ' ' + rR + 'kg' : rU + skuP.unitName;
          }
        }
        return `
          <div class="card bl-${stColor}" style="cursor:pointer" onclick="showLotIndividuals('${l[0]}','${itemName}','${isSP?'sp':'rm'}')">
            <div class="lot-card-header mb-4">
              <span class="lot-id">${l[0]}</span>
              <div class="lot-actions">
                ${canPrint && printableIndivs.length > 0 ? `<button class="btn btn-sm btn-pri" style="padding:4px 10px;font-size:11px" onclick="event.stopPropagation();printLotLabels('${l[0]}','${itemName}','${isSP?'sp':'rm'}')">🖨️ 인쇄가능 ${printableIndivs.length}매</button>` : ''}
                <span class="badge badge-${stColor}">${status}</span>
              </div>
            </div>
            <div class="fs-12 c-txt-l clickable">
              입고: ${lotQtyDisp} → 잔량: ${lotRemDisp} · 개별: ${printableIndivs.length}/${lotIndivs.length}건
            </div>
            <div class="fs-11 c-txt-l">소비기한: ${(l[7]||'').substring(0,10)}</div>
            ${remain > 0 && qty > 0 ? `
              <div class="progress-bar mt-8">
                <div class="fill" style="width:${Math.min(100, (remain/qty)*100)}%;background:var(--info)"></div>
              </div>
            ` : ''}
            ${canCancelIntake ? `
              <div class="row" style="gap:6px;margin-top:8px">
                <button class="btn btn-sm btn-outline btn-err" style="font-size:11px;padding:4px 10px" onclick="event.stopPropagation();cancelLotIntake('${l[0]}','${(itemName||'').replace(/'/g,"\\'")}')">🗑 입고취소 (오입고 정정)</button>
              </div>` : ''}
            <div id="indiv-list-${l[0].replace(/[^a-zA-Z0-9]/g,'_')}" style="display:none" class="mt-8"></div>
          </div>
        `;
      }).join('')}
    </div>
  `;
};

// LOT 상세 정렬 변경 — 캐시 유지하며 재렌더(서버 재fetch 없이 즉시 반영)
function setLotSort(k) {
  State._lotSortKey = k;
  Screens['lot-detail']({ ...(State._lotDetailParams || {}), _keepCache: true });
}

// ── LOT 개별 항목 토글 표시 ──
async function showLotIndividuals(lotId, itemName, type) {
  const safeId = lotId.replace(/[^a-zA-Z0-9]/g, '_');
  const container = $id('indiv-list-' + safeId);
  if (!container) return;

  // 완제품 탭 펼침 상태 영속화 — 화면 재렌더 후에도 자동 복원되도록 State 에 저장.
  if (!State._invFgExpandedLots) State._invFgExpandedLots = new Set();
  const isFG = type === 'fg';

  // 토글
  if (container.style.display !== 'none') {
    container.style.display = 'none';
    if (isFG) State._invFgExpandedLots.delete(lotId);
    return;
  }
  container.style.display = 'block';
  if (isFG) State._invFgExpandedLots.add(lotId);
  container.innerHTML = '<div class="loading-inline"><div class="spinner-s"></div> 개별 조회 중...</div>';

  try {
    const isFG = type === 'fg';
    const isSP = type === 'sp';
    const indivTab = isFG ? '완제품개별' : isSP ? '소모품개별' : '원재료개별';
    const lotTab = isFG ? '완제품LOT' : isSP ? '소모품LOT' : '원재료LOT';
    // lot-detail 에서 저장한 동일 데이터 우선 사용 (카드 ↔ 목록 표시값 일치 보장)
    // State._lotDetailIndivs 가 같은 탭 + 60초 이내면 그대로 사용, 아니면 fresh fetch
    let indivs;
    const cached = State._lotDetailIndivs;
    if (cached && cached.tab === indivTab && Date.now() - cached.ts < 60000) {
      indivs = cached.data.filter(iv => iv[1] === lotId);
    } else {
      indivs = (await SheetsAPI.getAll(indivTab).catch(() => [])).filter(iv => iv[1] === lotId);
    }
    const lot = (await SheetsAPI.getAll(lotTab).catch(() => [])).find(l => l[0] === lotId);

    if (indivs.length === 0) {
      container.innerHTML = '<div class="fs-12 c-txt-l" style="text-align:center;padding:8px">개별 항목 없음</div>';
      return;
    }

    const activeIndivs = indivs.filter(iv => !['출하완료','폐기','입고취소','삭제'].includes(iv[3]));
    const shippedIndivs = indivs.filter(iv => iv[3] === '출하완료');
    // 다중 선택 출하용 — 출하가능 항목 1개 이상일 때 컨트롤 바 노출
    const shippableIds = activeIndivs.filter(iv => iv[3] === '출하가능').map(iv => iv[0]);
    const hasShippable = isFG && shippableIds.length > 0;
    const safeNameEsc = (itemName || '').replace(/'/g, "\\'");
    container.innerHTML = `
      <div style="border-top:1px dashed var(--gray-l);padding-top:8px">
        <div class="fs-11 fw-6 c-txt-l mb-4">개별 항목 (재고 ${activeIndivs.length}건 / 전체 ${indivs.filter(iv => iv[3] !== '삭제').length}건)</div>
        ${hasShippable ? `
          <div class="row between" style="padding:8px 10px;background:#e8f5e9;border-radius:6px;margin-bottom:8px;align-items:center;gap:8px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0">
              <input type="checkbox" id="ship-select-all-${safeId}" onclick="event.stopPropagation();toggleShipSelectAll('${lotId}')" style="width:18px;height:18px">
              전체 선택
            </label>
            <button class="btn btn-sm btn-suc" id="ship-selected-btn-${safeId}" style="padding:4px 12px;font-size:12px;display:none" onclick="event.stopPropagation();showSelectedShipmentPopup('${lotId}','${safeNameEsc}')">🚚 선택 출하 (<span class="cnt">0</span>개)</button>
          </div>
        ` : ''}
        ${activeIndivs.map(iv => {
          const st = iv[3] || (isFG ? '냉동보관중' : '미사용');
          const canPrint = ['미사용','사용중','냉동보관중','출하가능'].includes(st);
          const canShip = isFG && st === '출하가능';
          const isFreezing = st === '냉동보관중';
          const stColor = st === '출하가능' ? 'suc' : st === '냉동보관중' ? 'warn' : st === '사용중' ? 'info' : st === '미사용' ? 'suc' : 'gray';
          const isSelected = canShip && State._selectedShipIds?.get(lotId)?.has(iv[0]);
          return `
            <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--bg);align-items:center;gap:6px">
              ${canShip
                ? `<input type="checkbox" class="ship-select-cb" data-indiv="${iv[0]}" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation();toggleShipSelection('${lotId}','${iv[0]}')" style="margin-right:4px;flex-shrink:0;width:18px;height:18px">`
                : '<span style="width:22px;flex-shrink:0"></span>'}
              <div style="flex:1;min-width:0">
                <span class="lot-id" style="font-size:11px;font-weight:600">${iv[0]}</span>
                <span class="badge badge-${stColor}" style="font-size:9px;padding:1px 6px;margin-left:4px">${st}</span>
              </div>
              <div class="row" style="gap:4px;flex-shrink:0">
                ${canShip ? `<button class="btn btn-sm btn-suc" style="padding:2px 8px;font-size:10px" onclick="event.stopPropagation();showShipmentPopup('${iv[0]}','${lotId}','${itemName}')">출하</button>` : ''}
                ${isFreezing ? `<span class="fs-10 c-warn">냉동중</span>` : ''}
                ${canPrint ? `<button class="btn btn-sm btn-outline btn-pri" style="padding:2px 8px;font-size:10px" onclick="event.stopPropagation();printSingleLabel('${iv[0]}','${itemName}','${lotId}','${type}')">인쇄</button>` : '<span class="fs-10 c-txt-l">인쇄불가</span>'}
              </div>
            </div>
          `;
        }).join('')}
        ${shippedIndivs.length > 0 ? `
          <div class="fs-12 fw-6 c-txt-l mt-8 mb-4" style="cursor:pointer;padding:8px 4px;background:var(--bg);border-radius:4px"
               onclick="const d=this.nextElementSibling;const open=d.style.display!=='none';d.style.display=open?'none':'block';this.querySelector('.ship-arrow').textContent=open?'▸':'▾'">
            🚚 출하완료 ${shippedIndivs.length}건
            <span class="ship-arrow" style="float:right">▾</span>
          </div>
          <div style="display:block">
            ${shippedIndivs.map(iv => `
              <div style="padding:8px 6px;border-bottom:1px solid var(--bg);background:#fafafa">
                <div class="row between" style="align-items:flex-start;gap:6px">
                  <div style="flex:1;min-width:0">
                    <div class="fs-12 fw-6" style="font-family:monospace;word-break:break-all">${iv[0]||''}</div>
                    <div class="fs-11 c-txt-l mt-2">
                      📦 ${(iv[4]||'').substring(0,16) || '시각 미기록'}${iv[5] ? ' · ' + (iv[5].split('@')[0]||iv[5]) : ''}
                    </div>
                  </div>
                  <span class="badge badge-gray" style="font-size:10px;padding:2px 6px;flex-shrink:0">출하완료</span>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
    // 다중 선택 상태 복원 (펼침/접힘 토글 후에도 유지)
    if (typeof updateShipSelectionUI === 'function') updateShipSelectionUI(lotId);
  } catch(e) {
    container.innerHTML = '<div class="fs-12 c-err">조회 실패: ' + e.message + '</div>';
  }
}

/* ─── 완제품 개별 다중 선택 출하 ───
   LOT 안에서 출하가능 개별을 여러 개 체크 → 일괄 출하.
   State._selectedShipIds: Map<lotId, Set<indivId>> — 같은 lot-detail 화면 안에서
   다른 LOT 의 선택 상태와 독립적으로 관리. lot-detail 진입/재진입 시 초기화. */
function toggleShipSelection(lotId, indivId) {
  if (!State._selectedShipIds) State._selectedShipIds = new Map();
  if (!State._selectedShipIds.has(lotId)) State._selectedShipIds.set(lotId, new Set());
  const sel = State._selectedShipIds.get(lotId);
  if (sel.has(indivId)) sel.delete(indivId); else sel.add(indivId);
  updateShipSelectionUI(lotId);
}

function toggleShipSelectAll(lotId) {
  if (!State._selectedShipIds) State._selectedShipIds = new Map();
  if (!State._selectedShipIds.has(lotId)) State._selectedShipIds.set(lotId, new Set());
  const sel = State._selectedShipIds.get(lotId);
  const safeId = lotId.replace(/[^a-zA-Z0-9]/g, '_');
  const container = $id('indiv-list-' + safeId);
  if (!container) return;
  const cbs = container.querySelectorAll('.ship-select-cb');
  const allChecked = Array.from(cbs).every(cb => cb.checked);
  cbs.forEach(cb => {
    const id = cb.getAttribute('data-indiv');
    if (allChecked) { sel.delete(id); cb.checked = false; }
    else { sel.add(id); cb.checked = true; }
  });
  updateShipSelectionUI(lotId);
}

function updateShipSelectionUI(lotId) {
  const safeId = lotId.replace(/[^a-zA-Z0-9]/g, '_');
  const sel = State._selectedShipIds?.get(lotId);
  const count = sel?.size || 0;
  const btn = $id('ship-selected-btn-' + safeId);
  if (btn) {
    btn.style.display = count > 0 ? 'inline-block' : 'none';
    const cntEl = btn.querySelector('.cnt');
    if (cntEl) cntEl.textContent = String(count);
  }
  const container = $id('indiv-list-' + safeId);
  const selAllCb = $id('ship-select-all-' + safeId);
  if (container && selAllCb) {
    const cbs = container.querySelectorAll('.ship-select-cb');
    const total = cbs.length;
    selAllCb.checked = total > 0 && count === total;
    selAllCb.indeterminate = count > 0 && count < total;
  }
}

  const sel = State._selectedShipIds?.get(lotId);
  if (!sel || sel.size === 0) { toast('선택된 항목이 없습니다', 'err'); return; }
  const indivIds = Array.from(sel);
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog" style="max-width:380px">
      <div class="fs-16 fw-7 mb-8">🚚 선택 출하</div>
      <div class="fs-12 c-txt-l mb-4">${lotId}<br>${itemName}</div>
      <div class="card bl-suc" style="background:#e8f5e9;padding:8px 10px;margin-bottom:12px">
        <div class="fs-12 fw-6">${indivIds.length}개 항목 일괄 출하</div>
        <div class="fs-11 c-txt-l" style="word-break:break-all;margin-top:2px">${indivIds.slice(0,3).join(', ')}${indivIds.length > 3 ? ` 외 ${indivIds.length-3}개` : ''}</div>
      </div>
      <div class="input-group" style="margin-bottom:12px">
        <label>출하 메모 (선택)</label>
        <input type="text" id="sel-ship-note" placeholder="예: 직접 출하 / 거래처명 / 기타" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--gray-l);font-size:14px">
      </div>
      <div class="d-actions">
        <button class="btn btn-sm btn-outline btn-gray" id="sel-ship-cancel">취소</button>
        <button class="btn btn-sm btn-suc" id="sel-ship-ok">선택 출하 진행</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#sel-ship-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#sel-ship-ok').onclick = () => {
    const note = overlay.querySelector('#sel-ship-note').value?.trim() || '직접 출하';
    overlay.remove();
    executeSelectedShipment(lotId, indivIds, itemName, note);
  };
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

async function executeSelectedShipment(lotId, indivIds, itemName, customerName) {
  if (!acquireLock('executeSelectedShipment')) return;
  try {
    showLoading();
    SheetsAPI.invalidateCache('완제품개별');
    SheetsAPI.invalidateCache('완제품LOT');
    const allIndivs = await SheetsAPI.getAll('완제품개별', false);
    // 선택된 ID 중 실제 출하가능 상태인 것만 대상 (다른 사용자의 동시 처리 방지)
    const targetIndivs = allIndivs.filter(iv => iv[1] === lotId && iv[3] === '출하가능' && indivIds.includes(iv[0]));
    if (targetIndivs.length === 0) {
      toast('선택 항목 중 출하가능한 항목이 없습니다 (이미 처리됐을 수 있음)', 'err', 4000);
      return;
    }
    const shipTime = formatDateTime();
    const shipperEmail = State.user?.email || '';
    const tempStamp = await getShipFreezerStamp();   // 출하시점 냉동창고 온도 자동 스탬프 (executeLotShipment·executeShipment와 동일)
    warnShipStamp(tempStamp);

    const shipRows = [];
    const indivUpdates = [];
    for (const iv of targetIndivs) {
      const shipId = await generateSeqId('SHP', '출하기록');
      shipRows.push([shipId, lotId, iv[0], customerName, '1', 'ea', shipTime, shipperEmail, tempStamp ? `${tempStamp.temp}°C` : '', tempStamp ? tempStamp.at : '', tempStamp ? `${tempStamp.productTemp}°C` : '', tempStamp ? tempStamp.method : '']);
      const idx = await SheetsAPI.findRowIndex('완제품개별', 0, iv[0]);
      if (idx > 0) {
        indivUpdates.push({ range: `완제품개별!D${idx}`, values: [['출하완료']] });
        indivUpdates.push({ range: `완제품개별!E${idx}`, values: [[shipTime]] });
        indivUpdates.push({ range: `완제품개별!F${idx}`, values: [[shipperEmail]] });
      }
    }
    if (shipRows.length > 0) await SheetsAPI.append('출하기록', shipRows);
    if (indivUpdates.length > 0) await SheetsAPI.batchUpdate(indivUpdates);

    // LOT 잔량 + 상태 갱신
    SheetsAPI.invalidateCache('완제품개별');
    const refreshed = await SheetsAPI.getAll('완제품개별', false);
    const lotIndivs = refreshed.filter(iv => iv[1] === lotId);
    const remainCount = lotIndivs.filter(iv => !['출하완료','폐기','입고취소','삭제'].includes(iv[3])).length;
    const lotIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
    if (lotIdx > 0) {
      const lotBatch = [{ range: `완제품LOT!I${lotIdx}`, values: [[String(remainCount)]] }];
      if (remainCount === 0) lotBatch.push({ range: `완제품LOT!J${lotIdx}`, values: [['출하완료']] });
      await SheetsAPI.batchUpdate(lotBatch);
    }

    // LOT 전체 소진 시 WO 상태 전환
    if (remainCount === 0) {
      try {
        const wos = await SheetsAPI.getAll('작업지시서');
        const wo = wos.find(w => w[14] === lotId && (w[12] === '출하가능' || w[12] === '냉동보관중'));
        if (wo) await SheetsAPI.updateCell('작업지시서', 0, wo[0], 12, '출하완료');
      } catch (e) { console.warn('WO 상태 전환 실패:', e); }
    }

    SheetsAPI.invalidateCache('완제품LOT');
    SheetsAPI.invalidateCache('완제품개별');
    // 선택 상태 초기화
    State._selectedShipIds?.delete(lotId);
    toast(`${lotId} 선택 출하 완료 — ${targetIndivs.length}개 → ${customerName}${tempStamp ? ` · 냉동고 ${tempStamp.temp}°C 자동기록` : ''}`, 'suc', 4000);
    refreshAfterShipment(lotId, 800);
  } catch (e) {
    toast('선택 출하 실패: ' + e.message, 'err', 5000);
    console.error('[executeSelectedShipment]', e);
  } finally {
    hideLoading();
    releaseLock('executeSelectedShipment');
  }
}

// ── LOT 전체 라벨 인쇄 ──
async function printLotLabels(lotId, itemName, type) {
  showLoading();
  try {
    const isFG = type === 'fg';
    const isSP = type === 'sp';
    const indivTab = isFG ? '완제품개별' : isSP ? '소모품개별' : '원재료개별';
    const lotTab = isFG ? '완제품LOT' : isSP ? '소모품LOT' : '원재료LOT';

    const indivs = (await SheetsAPI.getAll(indivTab).catch(() => [])).filter(iv => iv[1] === lotId);
    const lot = (await SheetsAPI.getAll(lotTab).catch(() => [])).find(l => l[0] === lotId);
    const printable = indivs.filter(iv => ['미사용','사용중','냉동보관중','출하가능'].includes(iv[3]));

    if (printable.length === 0) { toast('인쇄 가능한 개별 항목이 없습니다', 'warn'); hideLoading(); return; }

    const expDate = isFG ? (lot?.[6] || '') : isSP ? (lot?.[6] || '') : (lot?.[7] || '');
    const storageTemp = isFG ? (lot?.[11] || '냉동 -18°C') : isSP ? '' : (lot?.[11] || '');
    const inDate = isFG ? (lot?.[5] || formatDate()) : isSP ? (lot?.[5] || formatDate()) : (lot?.[6] || formatDate());

    const labels = printable.map(iv => ({
      indivId: iv[0],
      itemName: itemName,
      lotId: '',
      date: `생산날짜: ${inDate}`,
      exp: expDate ? `소비기한: ${expDate}까지` : '',

}

function parseSkuUnit(sku) {
  // "10kg/포대" → { perUnit: 10, unitName: '포대', raw: 'kg' }
  // "18L/통"   → { perUnit: 18, unitName: '통', raw: 'L' }
  // "30알/판"  → { perUnit: 1.5, unitName: '판', raw: '알', isEgg: true }  (30알=1.5kg)
  const m = sku?.match(/^(\d+)(kg|L|알)\/(통|판|포대|봉)/);
  if (!m) return null;
  const num = parseFloat(m[1]);
  const raw = m[2];
  const unitName = m[3];
  if (raw === '알') return { perUnit: num * 0.05, unitName, raw, isEgg: true, eggPerTray: num };
  if (raw === 'L') return { perUnit: num, unitName, raw };
  return { perUnit: num, unitName, raw };
}

function updateReceiveUnit() {
  const sel = $id('rcv-item');
  const opt = sel?.selectedOptions[0];
  const sku = opt?.dataset?.sku || '';
  const parsed = parseSkuUnit(sku);

  // SKU 단위 뱃지 업데이트
  const unitEl = $id('rcv-sku-unit');
  if (unitEl) unitEl.textContent = parsed ? parsed.unitName : 'kg';

  // hidden unit 값 세팅
  const unitInput = $id('rcv-unit');
  if (unitInput) unitInput.value = parsed ? parsed.unitName : 'kg';

  // 변환 정보 초기화
  updateReceiveConvert();

  // 소비기한·보관온도 자동 세팅
  const type = $id('rcv-type')?.value;
  const code = sel?.value;
  const items = type === '원재료' ? (window._rcvRmItems || []) : (window._rcvSpItems || []);
  const item = items.find(i => i[0] === code);
  if (item) {
    const days = parseInt(item[7]) || 90;
    $id('rcv-exp').value = formatDate(new Date(Date.now() + days * 86400000));
    const temp = item[8] || '상온 15~25℃';
    const tempSel = $id('rcv-temp');
    if (tempSel) {
      for (const o of tempSel.options) { if (o.value === temp) { tempSel.value = temp; break; } }
    }
  }
}

function updateReceiveConvert() {
  const sel = $id('rcv-item');
  const opt = sel?.selectedOptions[0];
  const sku = opt?.dataset?.sku || '';
  const parsed = parseSkuUnit(sku);
  const qty = parseInt($id('rcv-qty')?.value) || 0;
  const infoEl = $id('rcv-convert-info');
  const indivEl = $id('rcv-indiv-count');

  if (!parsed || qty <= 0) {
    if (infoEl) infoEl.style.display = 'none';
    if (indivEl) indivEl.value = qty > 0 ? qty : 1;
    return;
  }

  const totalKg = Math.round(qty * parsed.perUnit * 100) / 100;
  const icon = parsed.isEgg ? '🥚' : parsed.raw === 'L' ? '🛢️' : '📦';
  const perLabel = parsed.isEgg ? parsed.perUnit + 'kg(' + parsed.eggPerTray + '알)' : parsed.perUnit + 'kg';

  if (infoEl) {
    infoEl.style.display = '';
    infoEl.innerHTML = `${icon} <strong>${qty}${parsed.unitName}</strong> × ${perLabel} = <strong style="font-size:13px">${totalKg}kg</strong> 저장 · QR 라벨 <strong>${qty}</strong>매 자동 생성`;
  }
  if (indivEl) indivEl.value = qty;
}

async function submitReceiving() {
  if (!acquireLock('submitReceiving')) return;
  const submitBtn = document.querySelector('button[onclick="submitReceiving()"]');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '등록 처리 중...'; }

  const sku = $id('rcv-item')?.selectedOptions[0]?.dataset?.sku || '';
  const supplier = $id('rcv-supplier')?.value;
  const inputQty = parseFloat($id('rcv-qty')?.value) || 0;
  const exp = $id('rcv-exp')?.value;
  const temp = $id('rcv-temp')?.value;
  // SKU → kg 변환
  const parsed = parseSkuUnit(sku);
  const qtyKg = parsed ? Math.round(inputQty * parsed.perUnit * 100) / 100 : inputQty;
  const unit = 'kg';
  const indivCount = parsed ? inputQty : (parseInt($id('rcv-indiv-count')?.value) || 1);
  const qty = String(qtyKg);

  // 필수 필드 검증
  const missing = [];
  if (!itemCode) missing.push('품목');
  if (!supplier?.trim()) missing.push('공급업체');
  if (!inputQty || inputQty <= 0) missing.push('수량');
  if (!exp) missing.push('소비기한');
  if (missing.length > 0) {
    toast('미입력 항목: ' + missing.join(', '), 'err');
    releaseLock('submitReceiving');
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '입고 등록 + QR 생성'; }
    return;
  }

  try {
    showLoading();

    let photoUrl = '';

    // Generate IDs — 새 포맷: [대분류]-[품목번호]-[입고일]-[사용기한]-[입고순번]
    const prefix = type === '원재료' ? 'RM' : 'SP';
    const rcvId = await generateSeqId('RCV', '입고기록');
    const lotId = await generateLotId(prefix, itemCode, exp, type === '원재료' ? '원재료LOT' : '소모품LOT');

    // 1. Append to 입고기록
    await SheetsAPI.append('입고기록', [
      rcvId, type, supplier, itemCode, itemName, lotId, qty, unit, formatDateTime(), State.user?.email, '완료', photoUrl
    ]);

    // 2. Append to LOT tab
    const lotTab = type === '원재료' ? '원재료LOT' : '소모품LOT';
    if (type === '원재료') {
      await SheetsAPI.append(lotTab, [
        lotId, itemCode, itemName, supplier, qty, unit, formatDate(), exp, qty, '미사용', indivCount, temp
      ]);
    } else {
      await SheetsAPI.append(lotTab, [
        lotId, itemCode, itemName, qty, unit, formatDate(), qty, '미사용'
      ]);
    }

    // 3. Generate individual QR records + QR 이미지 수식
    if (type === '원재료') {
      const perUnit = parseFloat(qty) / indivCount;
      const indivRows = [];
      for (let i = 1; i <= indivCount; i++) {
        const indivId = `${lotId}-${String(i).padStart(2, '0')}`;
        // 컬럼: [개별ID, LOT ID, 품목코드, 상태, 수량, 비고, QR이미지]
        const rowNum = ''; // placeholder — IMAGE 수식은 아래에서 별도 처리
        indivRows.push([indivId, lotId, itemCode, '미사용', String(perUnit), '', qrImageUrl(indivId)]);
      }
      await SheetsAPI.append('원재료개별', indivRows);
    }

    toast(`입고 등록 완료! QR ${indivCount}개 생성`, 'suc');

    // Offer label print
    confirm('라벨 인쇄', `QR 라벨 ${indivCount}매를 인쇄하시겠습니까?`, () => {
      Router.go('label-print', { lotId, count: indivCount, itemName, type: 'rm' });
    }, () => {
      Router.go('inventory');
    });

  } catch (e) {
    toast('입고 등록 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
    releaseLock('submitReceiving');
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '입고 등록 + QR 생성'; }
  }
}

Screens['qr-scan'] = () => {
  $id('content').innerHTML = `
    <style>
      /* Html5Qrcode 가 만드는 video 를 컨테이너 가득 채우게 강제 (letterbox 방지) */
      #qr-reader { position: relative; background: #000; overflow: hidden; }
      #qr-reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
      #qr-reader > div { width: 100% !important; height: 100% !important; }
      #qr-reader__scan_region { width: 100% !important; height: 100% !important; min-height: 0 !important; background: #000 !important; padding: 0 !important; }
      #qr-reader__scan_region img { display: none !important; }
      #qr-reader__dashboard { display: none !important; }
    </style>
    <div style="background:#000;height:100%;display:flex;flex-direction:column">
      <div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center">
        <span style="color:#fff;font-size:16px;font-weight:700">QR 스캔</span>
        <span style="color:#fff;opacity:0.6;font-size:13px;cursor:pointer" onclick="stopQRScan().then(()=>Router.go('dashboard')).catch(()=>Router.go('dashboard'))">닫기</span>
      </div>
      <div id="qr-reader" style="flex:1;min-height:0"></div>
      <div id="qr-result" style="background:var(--white);border-radius:16px 16px 0 0;padding:20px;min-height:100px">
        <div class="fs-14 fw-7 mb-8">QR 코드를 카메라에 비춰주세요</div>
      </div>
    </div>
  `;

  // Start scanner
  setTimeout(() => {
    try {
      // 화면 비율에 맞춰 가이드 사각형(qrbox) 동적 산정 — 짧은 변의 65%
      const shortSide = Math.min(window.innerWidth, window.innerHeight);
      const qrboxSize = Math.max(180, Math.floor(shortSide * 0.65));
      // viewport 가 세로 화면이면 aspectRatio 를 세로 비율로 → 카메라 영역 letterbox 최소화
      const viewportAspect = window.innerHeight > window.innerWidth
        ? window.innerHeight / window.innerWidth
        : window.innerWidth / window.innerHeight;
      window._qrScanner = new Html5Qrcode("qr-reader");
      window._qrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: qrboxSize, height: qrboxSize }, aspectRatio: viewportAspect },
        onQRScanSuccess,
        () => {}
      ).catch(e => {
        $id('qr-result').innerHTML = `<div class="c-err fs-13">카메라를 사용할 수 없습니다: ${e}</div>`;
      });
    } catch (e) {
      $id('qr-result').innerHTML = `<div class="c-err fs-13">QR 스캐너 초기화 실패</div>`;
    }
  }, 300);
};

async function stopQRScan() {
  if (window._qrScanner) {
    try { await window._qrScanner.stop(); } catch(e) {}
    try { window._qrScanner.clear(); } catch(e) {}
    window._qrScanner = null;
  }
}

async function onQRScanSuccess(decodedText) {
  stopQRScan();
  const resultEl = $id('qr-result');
  resultEl.innerHTML = `<div class="spinner" style="margin:0 auto"></div>`;

  try {
    // QR 형식 검증: RM-, FG-, SP- 접두어 확인
    const id = decodedText.trim();
    if (!id.match(/^(RM|FG|SP)-/)) {
      resultEl.innerHTML = `
        <div class="fs-14 fw-7 mb-8">스캔 결과</div>
        <div class="c-err fs-13">유효하지 않은 QR 형식입니다</div>
        <div class="fs-11 c-txt-l mt-4">QR 코드는 RM-, FG-, SP-로 시작해야 합니다</div>
        <div class="fs-11 c-txt-l mt-2">인식된 값: ${id.substring(0, 50)}</div>
        <button class="btn btn-info btn-full mt-12" onclick="Router.go('qr-scan')">다시 스캔</button>
      `;
      return;
    }
    let data = null, type = '';

    if (id.startsWith('RM-')) {
      type = '원재료';
      const indivs = await SheetsAPI.getAll('원재료개별');
      const indiv = indivs.find(r => r[0] === id);
      if (indiv) {
        const lots = await SheetsAPI.getAll('원재료LOT');
        const lot = lots.find(l => l[0] === indiv[1]);
        data = { id, lotId: indiv[1], itemName: lot?.[2] || '', remain: indiv[4], status: indiv[3], exp: lot?.[7] || '' };
      }
    } else if (id.startsWith('FG-')) {
      type = '완제품';
      const indivs = await SheetsAPI.getAll('완제품개별');
      const indiv = indivs.find(r => r[0] === id);
      if (indiv) {
        const lots = await SheetsAPI.getAll('완제품LOT');
        const lot = lots.find(l => l[0] === indiv[1]);
        data = { id, lotId: indiv[1], itemName: lot?.[2] || '', status: indiv[3], exp: lot?.[6] || '' };
        // 출하 추적 — 출하완료 시 출하기록에서 냉동창고 출하온도 조회 (제품번호 → 출하 시점 온도)
        if (indiv[3] === '출하완료') {
          try {
            const ships = await SheetsAPI.getAll('출하기록');
            const ship = ships.filter(s => s[2] === id).sort((a, b) => String(b[6]).localeCompare(String(a[6])))[0];
            if (ship) data.ship = { at: ship[6], customer: ship[3], temp: ship[8] || '', tempAt: ship[9] || '' };
          } catch (e) {}
        }
      }
    } else if (id.startsWith('SP-')) {
      type = '소모품';
      const lots = await SheetsAPI.getAll('소모품LOT');
      const lot = lots.find(l => l[0] === id);
      if (lot) {
        data = { id, lotId: id, itemName: lot[2] || '', remain: lot[6], status: lot[7] };
      }
    }

    if (!data) {
      resultEl.innerHTML = `
        <div class="fs-14 fw-7 mb-8">스캔 결과</div>
        <div class="c-err fs-13">인식할 수 없는 QR: ${id}</div>
        <button class="btn btn-info btn-full mt-12" onclick="Router.go('qr-scan')">다시 스캔</button>
      `;
      return;
    }

    // 이미 처리 완료된 항목 차단 (소진/폐기/출하완료)
    const inactiveStatuses = ['소진', '폐기', '출하완료', '입고취소'];
    const isInactive = inactiveStatuses.includes(data.status);

    // 완제품: 출하 가능 여부 체크 (냉동 12h 이상)
    let shipBtn = '';
    if (type === '완제품' && !isInactive) {
      const fgStatus = data.status || '';
      const canShip = fgStatus === '출하가능';
      if (canShip) {
        shipBtn = `<button class="btn btn-suc flex-1" onclick="processShipment('${data.id}','${data.lotId}','${data.itemName}')">출하처리</button>`;
      } else if (fgStatus === '냉동보관중') {
        shipBtn = `<button class="btn btn-gray flex-1" disabled>출하불가 (냉동보관중)</button>`;

// 빌드 버전 라벨 — document.lastModified 활용 (GitHub Pages 가 빌드 시각 기록)
function buildVersionLabel() {
  const lm = document.lastModified;
  let label = '버전 정보 없음';
  if (lm) {
    const d = new Date(lm);
    if (!isNaN(d.getTime())) {
      const pad = n => String(n).padStart(2, '0');
      label = `배포: ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
  }
  return `${label} · <a href="#" onclick="forceRefresh();return false" style="color:var(--info)">강제 새로고침</a>`;
}

// 캐시 무시하고 페이지 재로드
function forceRefresh(skipConfirm) {
  if (!skipConfirm && !window.confirm('캐시를 비우고 최신 버전을 가져옵니다. 진행할까요?')) return;
  // 쿼리 캐시버스트 — location.reload(true) 의 true 인자는 최신 브라우저에서 무시되므로 URL 쿼리로 HTTP 캐시 우회.
  const bust = location.pathname + '?v=' + Date.now();
  const go = () => location.replace(bust);
  if ('caches' in window) {
    caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).finally(go);
  } else { go(); }
}

// 새 버전 자동 감지 — 서버 index.html Last-Modified 가 현재 로드본보다 충분히 새로우면 갱신 배너 표시.
async function checkForUpdate() {
  try {
    const cur = Date.parse(document.lastModified || '');
    if (!cur) return;
    const res = await fetch(location.pathname + '?_chk=' + Date.now(), { cache: 'no-store' });
    const lm = res.headers.get('Last-Modified');
    const server = lm ? Date.parse(lm) : 0;
    if (!server || server - cur <= 90000) return;   // 1.5분 이상 새로울 때만 (시계오차 오탐 방지)
    if (document.getElementById('update-banner')) return;
    const bar = document.createElement('div');
    bar.id = 'update-banner';
    bar.style.cssText = 'background:#1e8e3e;color:#fff;padding:9px 12px;font-size:13px;font-weight:600;text-align:center;cursor:pointer';
    bar.textContent = '🆕 새 버전이 배포되었습니다 — 눌러서 업데이트';
    bar.onclick = () => forceRefresh(true);
    (document.getElementById('app') || document.body).prepend(bar);
  } catch (e) {}
}

function getSavedPrinter() {
  return localStorage.getItem('mt_printer') || 'slp-dx220';
}
function savePrinterSetting(key) {
  localStorage.setItem('mt_printer', key);
}
function getLabelSize() {
  // SLP-DX220 고정 사이즈: 60×40mm (프린터 설정 UI 제거됨)
  return { w: 60, h: 40 };
}
function saveLabelSize(w, h) {
  localStorage.setItem('mt_label_size', JSON.stringify({ w, h }));
}

function applyPrintCSS() {
  const pk = getSavedPrinter();
  const preset = PRINTER_PRESETS[pk] || PRINTER_PRESETS['slp-dx220'];
  const sz = getLabelSize();
  const r = document.documentElement;
  r.style.setProperty('--lbl-w', sz.w + 'mm');
  r.style.setProperty('--lbl-h', sz.h + 'mm');
  r.style.setProperty('--qr-sz', preset.qrSz + 'mm');
  r.style.setProperty('--lbl-fs', preset.lblFs + 'pt');
  r.style.setProperty('--lbl-txt-w', (sz.w - preset.qrSz - preset.lblGap - 4) + 'mm');
  r.style.setProperty('--lbl-gap', preset.lblGap + 'mm');
  r.style.setProperty('--lbl-pad', preset.lblPad);
}

function onPrinterChange() {
  const pk = $id('sel-printer')?.value || 'slp-dx220';
  savePrinterSetting(pk);
  const preset = PRINTER_PRESETS[pk];

  if ($id('lbl-w-input')) $id('lbl-w-input').value = preset.lblW;
  if ($id('lbl-h-input')) $id('lbl-h-input').value = preset.lblH;
  saveLabelSize(preset.lblW, preset.lblH);
  // 팁 업데이트
  if ($id('printer-tips')) $id('printer-tips').innerHTML = preset.tips;
  // 커스텀 필드 표시
  const customRow = $id('custom-size-row');
  if (customRow) customRow.style.display = pk === 'custom' ? 'flex' : 'none';
  applyPrintCSS();
}

function onLabelSizeChange() {
  const w = parseInt($id('lbl-w-input')?.value) || 50;
  const h = parseInt($id('lbl-h-input')?.value) || 30;
  saveLabelSize(w, h);

}
