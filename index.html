function renderAuditResult() {
  const sections = State._auditSections || [];
  const totalIssues = sections.reduce((s, sec) => s + sec.issues.length, 0);
  const fixableIssues = sections.reduce((s, sec) => s + sec.issues.filter(i => i.autoFix).length, 0);
  const resultEl = $id('audit-result');
  resultEl.innerHTML = `
    <div class="card ${totalIssues===0 ? 'bl-suc' : 'bl-warn'}" style="background:${totalIssues===0 ? '#e8f5e9' : '#fff8e1'};margin-top:12px">
      <div class="row between">
        <div>
          <div class="fs-14 fw-7 ${totalIssues===0 ? 'c-suc' : 'c-warn'}">${totalIssues===0 ? '✓ 모든 항목 정상' : `⚠ ${totalIssues}건 이슈 발견`}</div>
          <div class="fs-11 c-txt-l">자동 수정 가능: ${fixableIssues}건</div>
        </div>
        ${fixableIssues > 0 ? '<button class="btn btn-pri" onclick="runAuditAutoFix()">전체 자동 수정</button>' : ''}
      </div>
    </div>
    ${sections.map((sec, si) => {
      const cnt = sec.issues.length;
      return `
        <div class="card" style="padding:0;overflow:hidden;margin-top:8px">
          <div style="padding:10px 12px;cursor:pointer;background:${cnt===0?'#f0fff4':'#fffbf0'}" onclick="const d=this.nextElementSibling;d.style.display=d.style.display==='none'?'block':'none';this.querySelector('.audit-arrow').textContent=d.style.display==='none'?'▸':'▾'">
            <div class="row between">
              <span class="fs-13 fw-7">${cnt===0?'✓':'⚠'} ${sec.name}</span>
              <span><span class="badge badge-${cnt===0?'suc':'warn'}">${cnt}건</span> <span class="audit-arrow" style="color:var(--txt-l)">${cnt>0?'▾':'▸'}</span></span>
            </div>
            <div class="fs-11 c-txt-l mt-2">${sec.desc||''}</div>
          </div>
          <div style="padding:10px 12px;border-top:1px solid var(--gray-l);${cnt===0?'display:none':''}">
            ${cnt===0 ? '<div class="fs-12 c-suc">이상 없음</div>' :
              sec.issues.map((iss, ii) => `
                <div class="row between" style="padding:6px 0;${ii<sec.issues.length-1?'border-bottom:1px solid var(--bg)':''};align-items:flex-start;gap:8px">
                  <div style="flex:1">
                    <div class="fs-12 fw-6">${iss.id}</div>
                    <div class="fs-11 c-txt-l">${iss.message}</div>
                  </div>
                  ${iss.autoFix ? `<button class="btn btn-sm btn-pri" onclick="runAuditFixOne(${si},${ii})" style="white-space:nowrap">🔧 수정</button>` : '<span class="fs-10 c-txt-l">수동 확인</span>'}
                </div>
              `).join('')
            }
          </div>
        </div>
      `;
    }).join('')}
  `;
}

async function runAuditFixOne(secIdx, issIdx) {
  const sec = State._auditSections?.[secIdx];
  const iss = sec?.issues?.[issIdx];
  if (!iss?.autoFix) return;
  confirm('자동 수정', `${iss.id}\n${iss.message}\n\n수정하시겠습니까?`, async () => {
    try {
      showLoading();
      await iss.autoFix();
      toast(`수정 완료: ${iss.id} — audit 자동 재실행 중...`, 'suc', 2000);
      // 전역 영향 가능한 autoFix(예: LOT 단위 중복 정리)는 다른 issue 들도 함께 정정됨.
      // 정확한 현황 반영을 위해 audit 자동 재실행.
      await runDataAudit();
    } catch (e) {
      toast('수정 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
    }
  });
}

async function runAuditAutoFix() {
  const sections = State._auditSections || [];
  const fixable = sections.flatMap((sec, si) => sec.issues.map((iss, ii) => ({ sec, iss, si, ii })).filter(x => x.iss.autoFix));
  if (fixable.length === 0) { toast('수정 가능 항목 없음', 'info'); return; }
  confirm('전체 자동 수정', `${fixable.length}건을 일괄 수정하시겠습니까?\n각 항목은 데이터 정합성을 자동 보정합니다.`, async () => {
    try {
      showLoading();
      let okCount = 0, errCount = 0;
      for (const { iss } of fixable) {
        try { await iss.autoFix(); okCount++; }
        catch (e) { errCount++; console.error('수정 실패:', iss.id, e); }
      }
      SheetsAPI.invalidateAllCache();
      toast(`수정 ${okCount}건 완료${errCount?` · 실패 ${errCount}건`:''} — 재검사 중...`, errCount?'warn':'suc', 2500);
      // 전역 영향 가능한 autoFix 결과를 정확히 반영하기 위해 audit 자동 재실행
      await runDataAudit();
    } catch (e) {
      toast('일괄 수정 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
    }
  });
}

// ─── 검사 함수들 (각각 { name, desc, issues:[{id, message, autoFix?}] }) ───
function auditRmLotRemain(rmLots, rmIndivs) {
  const issues = [];
  for (const lot of rmLots) {
    const lotId = lot[0], totalQty = parseFloat(lot[4])||0;
    const remain = parseFloat(lot[8])||0, status = lot[9]||'';
    if (['폐기','입고취소'].includes(status)) continue;  // 종결 상태 제외
    const myIndivs = rmIndivs.filter(iv => iv[1] === lotId);
    if (myIndivs.length === 0) continue;
    const active = myIndivs.filter(iv => !['폐기','소진','입고취소'].includes(iv[3]));
    const consumed = myIndivs.filter(iv => iv[3] === '소진');
    const sample = myIndivs[0];
    const perUnit = sample ? (parseFloat(sample[4])||totalQty/(parseInt(lot[10])||1)) : totalQty/(parseInt(lot[10])||1);
    const correctRemain = Math.round(active.length * perUnit * 100)/100;
    const correctStatus = active.length === 0 ? '소진' : (consumed.length > 0 ? '사용중' : '미사용');
    const remainOff = Math.abs(remain - correctRemain) > 0.01;
    const statusOff = status !== correctStatus;
    if (remainOff || statusOff) {
      const msg = [];
      if (remainOff) msg.push(`잔량 ${remain}→${correctRemain}`);
      if (statusOff) msg.push(`상태 "${status}"→"${correctStatus}"`);
      issues.push({
        id: lotId,
        message: msg.join(' / '),
        autoFix: async () => {
          await SheetsAPI.updateRow('원재료LOT', 0, lotId, { 8: String(correctRemain), 9: correctStatus });
        }
      });
    }
  }
  return { name: '원재료 LOT 잔량·상태 정합성', desc: '활성 개별 수 × perUnit = 잔량, 상태 일치 검증', issues };
}

function auditRmLotCanceled(rmLots, rmIndivs) {
  const issues = [];
  for (const lot of rmLots) {
    const lotId = lot[0], status = lot[9]||'';
    if (!['폐기','입고취소'].includes(status)) continue;
    const myIndivs = rmIndivs.filter(iv => iv[1] === lotId);
    const wrong = myIndivs.filter(iv => iv[3] !== status && iv[3] !== '소진');
    if (wrong.length > 0) {
      issues.push({
        id: lotId,
        message: `LOT 상태 "${status}"인데 개별 ${wrong.length}건이 다른 상태 (${wrong.map(w=>w[3]||'(빈값)').join(', ')})`,
        autoFix: async () => {
          for (const iv of wrong) {
            await SheetsAPI.updateRow('원재료개별', 0, iv[0], { 3: status });
          }
        }
      });
    }
  }
  return { name: '입고취소·폐기 LOT 개별 일관성', desc: 'LOT이 종결 상태면 모든 개별도 동일/소진 상태여야 함', issues };
}

function auditFgLotRemain(fgLots, fgIndivs) {
  const issues = [];
  for (const lot of fgLots) {
    const lotId = lot[0];
    const status = lot[9]||'';
    if (['삭제','폐기','출하완료'].includes(status)) continue;
    const dbRemain = parseInt(lot[8])||0;
    const active = fgIndivs.filter(iv => iv[1] === lotId && ['냉동보관중','출하가능'].includes(iv[3]));
    if (dbRemain !== active.length) {
      issues.push({
        id: lotId,
        message: `잔량 ${dbRemain}개 → 실제 활성 ${active.length}개`,
        autoFix: async () => {
          await SheetsAPI.updateRow('완제품LOT', 0, lotId, { 8: String(active.length) });
        }
      });
    }
  }
  return { name: '완제품 LOT 잔량 정합성', desc: 'remainQty = 활성(냉동보관중+출하가능) 개별 수', issues };
}

/* FG LOT packCount(col 10) vs 실제 개별 row 수 검사
   상단 요약(재고 메인)에서 'l[10]' 을 사용하는 반면, LOT 상세는 실제 row 수를 카운트.
   두 값이 다르면 표시 불일치 발생. autoFix 는 col 10 을 실제 개수로 갱신. */
function auditFgLotPackCount(fgLots, fgIndivs) {
  const issues = [];
  for (const lot of fgLots) {
    const lotId = lot[0];
    const status = lot[9]||'';
    if (['삭제','채번예약'].includes(status)) continue;
    const dbPackCount = parseInt(lot[10])||0;
    const actual = fgIndivs.filter(iv => iv[1] === lotId).length;
    if (dbPackCount !== actual && actual > 0) {
      issues.push({
        id: lotId,
        message: `packCount(col 10) ${dbPackCount}개 → 실제 개별 row ${actual}개 (상단 요약과 상세가 다르게 보임)`,
        autoFix: async () => {
          await SheetsAPI.updateRow('완제품LOT', 0, lotId, { 10: actual });
        }
      });
    }
  }
  return { name: '완제품 LOT packCount 정합성', desc: 'lot[10] = 실제 개별 row 수 (재고 메인 상단 요약 ↔ 상세 일치)', issues };
}

function auditWoFgLotLink(wos, fgLots) {
  const issues = [];
  const fgLotById = new Map(fgLots.map(l => [l[0], l]));
  for (const wo of wos) {
    const status = wo[12]||'', fgLotId = wo[14]||'';
    if (['출하가능','출하완료','승인완료'].includes(status) && fgLotId && !fgLotById.has(fgLotId)) {
      issues.push({
        id: wo[0],
        message: `WO 상태 "${status}" / fgLotId "${fgLotId}" 가 완제품LOT 시트에 없음 (orphan reference)`
      });
    }
  }
  return { name: 'WO ↔ 완제품 LOT 연결', desc: '출하 단계 WO의 fgLotId 가 실제 LOT으로 존재해야 함', issues };
}

function auditWoStatusStep(wos, records) {
  const issues = [];
  const stepsByWo = new Map();
  for (const r of records) {
    const woId = r[0], step = parseInt(r[1])||0;
    const cur = stepsByWo.get(woId) || 0;
    if (step > cur) stepsByWo.set(woId, step);
  }
  for (const wo of wos) {
    const woId = wo[0], status = wo[12]||'', dbLastStep = parseInt(wo[13])||0;
    if (['삭제'].includes(status)) continue;
    const realMax = stepsByWo.get(woId) || 0;
    if (dbLastStep !== realMax) {
      issues.push({
        id: woId,
        message: `lastStep DB ${dbLastStep} → 실제 공정기록 max ${realMax}`,
        autoFix: async () => {
          await SheetsAPI.updateRow('작업지시서', 0, woId, { 13: String(realMax) });
        }
      });
    }
  }
  return { name: 'WO lastStep 정합성', desc: 'wo[13] 이 실제 공정기록의 최대 단계와 일치', issues };
}

function auditOrphanRecords(wos, records) {
  const issues = [];
  const woIds = new Set(wos.map(w => w[0]));
  for (const r of records) {
    const woId = r[0];
    if (!woIds.has(woId)) {
      issues.push({
        id: `${woId}/${r[1]||'?'}.${r[2]||'?'}`,
        message: `공정기록의 woId "${woId}" 가 작업지시서에 없음`
      });
    }
  }
  return { name: '공정기록 고아 (orphan)', desc: '공정기록의 woId 가 작업지시서에 존재해야 함', issues };
}

/* 중복 LOT ID 검사 — race condition 으로 동일 ID 가 2회 이상 채번된 경우.
   자동 분리는 위험 (개별 ID들이 어느 row 소속인지 데이터로 구분 불가) — 수동 가이드만. */
function auditDuplicateLotIds(rmLots, fgLots, rmIndivs, fgIndivs, wos) {
  const issues = [];
  const groups = [
    { tab: '원재료LOT', indivTab: '원재료개별', lots: rmLots, indivs: rmIndivs, dateCol: 6 },
    { tab: '완제품LOT', indivTab: '완제품개별', lots: fgLots, indivs: fgIndivs, dateCol: 5, woCol: 7 },
  ];
  for (const g of groups) {
    const byId = new Map();
    g.lots.forEach(l => {
      const id = l[0];
      if (!id) return;
      const arr = byId.get(id) || [];
      arr.push(l);
      byId.set(id, arr);
    });
    for (const [id, arr] of byId.entries()) {
      if (arr.length < 2) continue;
      arr.sort((a, b) => (a[g.dateCol]||'').localeCompare(b[g.dateCol]||''));
      const detail = arr.map((rec, i) => {
        const wo = g.woCol ? (rec[g.woCol] || '-') : '-';
        const qty = rec[g.tab==='완제품LOT' ? 3 : 4] || '?';
        const rem = rec[8] || '?';
        const date = rec[g.dateCol] || '?';
        return `${i+1}) ${g.woCol?`WO ${wo} · `:''}수량 ${qty} · 잔 ${rem} · 일자 ${date}`;
      }).join('\n');
      const myIndivCount = (g.indivs || []).filter(iv => iv[1] === id).length;
      const isFG = g.tab === '완제품LOT';
      issues.push({
        id,
        message: `${g.tab}에 ${arr.length}건 중복 row · 개별 ID ${myIndivCount}건 묶임\n${detail}\n\n자동 분리: 첫 row 유지, 2번째 이후를 새 일련번호(-002, -003...)로 분리.\n${isFG ? '완제품개별은 시트 append 순서 가정으로 packCount 기준 분리.' : ''}`,
        autoFix: isFG ? async () => { await autoSplitDupFgLot(id); } : undefined
      });
    }
  }
  return {
    name: '중복 LOT ID (race condition)',
    desc: '동시 채번으로 같은 ID 가 2회 이상 — 완제품 LOT 은 🔧 자동 분리 가능 (원재료는 수동)',
    issues
  };
}

/* 중복 FG LOT 자동 분리 — 첫 row 유지, 나머지는 새 일련번호로 분리.
   알고리즘:
   1. 완제품LOT 에서 동일 lotId 의 모든 row 인덱스 찾기 (시트 순서 = 채번 순서 가정)
   2. 첫 row 외 각 row 별로 새 ID 발급
   3. 해당 row 의 [0] 셀 변경 + 해당 row 의 woId (col 7) 의 작업지시서 wo[14] 변경
   4. 완제품개별 시트에서 같은 lotId 의 모든 row 인덱스 찾기 (시트 순서 = WO 승인 순서 가정)
   5. 첫 row 의 packCount 만큼 유지, 다음 packCount 만큼 두 번째 새 ID 로, ... */
async function autoSplitDupFgLot(lotId) {
  // 1. 완제품LOT 모든 row 조회 (인덱스 보존을 위해 raw 시트 데이터 사용)
  SheetsAPI.invalidateCache('완제품LOT');
  const fgLots = await SheetsAPI.getAll('완제품LOT', false);
  // getAll 은 헤더 1행을 slice 한 결과 — 시트 row 인덱스 = getAll 인덱스 + 2 (1-based + 헤더 보정)
  const dupRows = [];
  fgLots.forEach((row, i) => {
    if (row[0] === lotId) dupRows.push({ row, sheetRowIdx: i + 2 });
  });
  if (dupRows.length < 2) throw new Error('중복 row 없음 (이미 정리됨?)');

  // 2. 첫 row 외 새 ID 발급
  const parts = lotId.split('-');
  const seqLen = (parts[parts.length - 1] || '').length || 3;
  const prefix = parts.slice(0, -1).join('-') + '-';
  // 동일 prefix 중 현재 max seq 확인
  let maxSeq = 0;
  fgLots.forEach(l => {
    if (l[0] && l[0].startsWith(prefix)) {
      const s = parseInt(l[0].split('-').slice(-1)[0]) || 0;
      if (s > maxSeq) maxSeq = s;
    }
  });

  const assignments = [{ oldId: lotId, newId: lotId, sheetRowIdx: dupRows[0].sheetRowIdx, woId: dupRows[0].row[7] || '', packCount: parseInt(dupRows[0].row[10]) || 0 }];
  for (let i = 1; i < dupRows.length; i++) {
    maxSeq++;
    const newId = `${prefix}${String(maxSeq).padStart(seqLen, '0')}`;
    assignments.push({
      oldId: lotId,
      newId,
      sheetRowIdx: dupRows[i].sheetRowIdx,
      woId: dupRows[i].row[7] || '',
      packCount: parseInt(dupRows[i].row[10]) || 0
    });
  }

  // 3. 완제품LOT row 의 col A (lotId) 변경 (batchUpdate)
  const lotUpdates = assignments.slice(1).map(a => ({
    range: `완제품LOT!A${a.sheetRowIdx}`,
    values: [[a.newId]]
  }));
  if (lotUpdates.length > 0) await SheetsAPI.batchUpdate(lotUpdates);

  // 4. 해당 WO 의 wo[14] (col O = 15번째) 변경
  for (const a of assignments.slice(1)) {
    if (!a.woId) continue;
    const woIdx = await SheetsAPI.findRowIndex('작업지시서', 0, a.woId);
    if (woIdx > 0) {
      await SheetsAPI.batchUpdate([{ range: `작업지시서!O${woIdx}`, values: [[a.newId]] }]);
    }
  }

  // 5. 완제품개별 분리 — 시트 순서 기준 packCount 만큼 그룹 분리
  SheetsAPI.invalidateCache('완제품개별');
  const fgIndivs = await SheetsAPI.getAll('완제품개별', false);
  const targetIndivs = [];
  fgIndivs.forEach((row, i) => {
    if (row[1] === lotId) targetIndivs.push({ row, sheetRowIdx: i + 2 });
  });

  // 시트 순서대로 분할: 첫 packCount → assignment[0] (변경 없음), 다음 packCount → assignment[1], ...
  const indivUpdates = [];
  let cursor = 0;
  for (const a of assignments) {
    if (a.newId === a.oldId) { cursor += a.packCount; continue; }
    const segment = targetIndivs.slice(cursor, cursor + a.packCount);
    for (let k = 0; k < segment.length; k++) {
      const { row, sheetRowIdx } = segment[k];
      const newIndivId = `${a.newId}-${String(k + 1).padStart(2, '0')}`;
      // col A (indivId) + col B (lotId) 변경
      indivUpdates.push({ range: `완제품개별!A${sheetRowIdx}`, values: [[newIndivId]] });
      indivUpdates.push({ range: `완제품개별!B${sheetRowIdx}`, values: [[a.newId]] });
    }
    cursor += a.packCount;
  }
  if (indivUpdates.length > 0) await SheetsAPI.batchUpdate(indivUpdates);

  // 캐시 무효화 + 로그
  SheetsAPI.invalidateCache('완제품LOT');
  SheetsAPI.invalidateCache('완제품개별');
  SheetsAPI.invalidateCache('작업지시서');
  console.log(`[중복분리] ${lotId} 분리 완료:`, assignments.slice(1).map(a => `${a.oldId}→${a.newId} (WO ${a.woId}, ${a.packCount}개)`).join(', '));
}

/* 채번예약 placeholder 가 24시간 이상 stale — 거부됐는데 정리 안된 경우 또는 채번 후 작업 미완료 */
function auditStaleReserved(fgLots, wos) {
  const issues = [];
  const now = Date.now();
  for (const lot of fgLots) {
    if (lot[9] !== '채번예약') continue;
    const woId = lot[7] || '';
    const wo = wos.find(w => w[0] === woId);
    const woStatus = wo?.[12] || '(WO 없음)';
    const prodDate = lot[5] ? new Date(lot[5]).getTime() : 0;
    const ageH = prodDate ? (now - prodDate) / 3600000 : 999;
    if (ageH < 24 && ['진행중','승인대기','냉동보관중'].includes(woStatus)) continue;  // 정상 진행중
    issues.push({
      id: lot[0],
      message: `WO ${woId} 상태 "${woStatus}" / 채번 ${ageH.toFixed(0)}시간 경과 — placeholder 정리 필요`,
      autoFix: woStatus.startsWith('거부') || woStatus === '삭제' || !wo ? async () => {
        await SheetsAPI.updateRow('완제품LOT', 0, lot[0], { 9: woStatus.startsWith('거부') ? woStatus : '삭제' });
      } : undefined
    });
  }
  return { name: '채번예약 placeholder 잔여', desc: 'atomic claim 후 거부/삭제로 정리 안 된 placeholder', issues };
}

/* 중복 개별 ID 검사 — autoFix: 첫 발생 유지(출하기록 보존), 후순 발생을 새 일련번호로 renumber.
   같은 lotId 의 max(suffix seq) 찾아 그 다음 번호부터 부여. lotId 는 그대로. */
function auditDuplicateIndivIds(rmIndivs, fgIndivs) {
  const issues = [];
  const groups = [
    { tab: '원재료개별', indivs: rmIndivs },
    { tab: '완제품개별', indivs: fgIndivs },
  ];
  for (const g of groups) {
    const byId = new Map();
    g.indivs.forEach(iv => {
      const id = iv[0];
      if (!id) return;
      byId.set(id, (byId.get(id)||0) + 1);
    });
    for (const [id, count] of byId.entries()) {
      if (count < 2) continue;
      issues.push({
        id,
        message: `${g.tab} 시트에 동일 개별 ID 가 ${count}건 — 🔧 수정: 같은 LOT 의 중복 행을 soft-delete (출하기록 보존)`,
        autoFix: g.tab === '완제품개별' ? async () => {
          // 중복 indivId 의 lotId 추출 (마지막 -NN 제거) → 해당 LOT 의 중복 일괄 soft-delete
          const lotId = id.replace(/-\d+$/, '');
          await autoDeleteDupFgIndivs(lotId);
        } : undefined
      });
    }
  }
  return { name: '중복 개별 ID', desc: '동일 indivId 가 시트에 다중 row — 🔧 수정 시 중복 행 soft-delete (\'삭제\') + packCount/잔량 자동 보정', issues };
}

/* phantom renumber 행 검사 — WO 의 packCount 보다 큰 suffix 를 가진 완제품개별 행 탐지
   배경: PR #33 의 C안 renumber autoFix 가 중복 indivId 를 -41~-80 등 새 번호로 옮긴 잔재
        또는 다른 경로로 정원 초과 채번된 phantom 행
   판정: 완제품LOT[7]=woId → 작업지시서[7]=packCount (의도된 봉수)
        해당 LOT 의 비-삭제 개별 중 suffix > packCount 인 행을 phantom 으로 분류
   autoFix: phantom 행 soft-delete + LOT packCount/remain 정정
            출하완료 행은 절대 삭제 안 함 (HACCP 보존) — 있으면 수동 점검 안내 */
function auditPhantomRenumberRows(fgLots, fgIndivs, wos) {
  const issues = [];
  for (const lot of fgLots) {
    const lotId = lot[0];
    if (lot[9] === '삭제' || lot[9] === '채번예약') continue;
    const woId = lot[7] || '';
    if (!woId) continue;
    const wo = wos.find(w => w[0] === woId);
    if (!wo) continue;
    const expected = parseInt(wo[7]);
    if (!expected || expected <= 0) continue;
    const lotIndivs = fgIndivs.filter(iv => iv[1] === lotId && iv[3] !== '삭제');
    let phantomCount = 0;
    let phantomShipped = 0;
    for (const iv of lotIndivs) {
      const m = (iv[0] || '').match(/-(\d+)$/);
      if (!m) continue;
      const seq = parseInt(m[1]);
      if (seq > expected) {
        phantomCount++;
        if (iv[3] === '출하완료') phantomShipped++;
      }
    }
    if (phantomCount === 0) continue;
    issues.push({
      id: lotId,
      message: `WO ${woId} packCount=${expected} 인데 suffix > ${expected} 인 개별 ${phantomCount}건` +
               (phantomShipped > 0 ? ` (⚠️ 출하완료 ${phantomShipped}건 포함 — 자동 정리 불가, 수동 점검 필요)` : ''),
      autoFix: phantomShipped === 0 ? async () => {
        await autoDeletePhantomFgRows(lotId, expected);
      } : undefined
    });
  }
  return { name: 'phantom 개별 행 (정원 초과)', desc: 'WO packCount 보다 큰 suffix 를 가진 완제품개별 행 — 🔧 수정 시 soft-delete + LOT packCount/remain 정정 (출하완료 행은 보호)', issues };
}

/* phantom 행 일괄 soft-delete + LOT packCount/remain 보정.
   출하완료 행은 안전망으로 무조건 보호 (HACCP 출하기록 무결성). */
async function autoDeletePhantomFgRows(lotId, expectedPackCount) {
  SheetsAPI.invalidateCache('완제품개별');
  SheetsAPI.invalidateCache('완제품LOT');
  const allIndivs = await SheetsAPI.getAll('완제품개별', false);
  const toDelete = [];
  allIndivs.forEach((row, i) => {
    if (row[1] !== lotId) return;
    if (row[3] === '삭제' || row[3] === '출하완료') return;
    const m = (row[0] || '').match(/-(\d+)$/);
    if (!m) return;
    const seq = parseInt(m[1]);
    if (seq > expectedPackCount) toDelete.push({ sheetRowIdx: i + 2, oldId: row[0] });
  });
  if (toDelete.length === 0) {
    console.log(`[phantom정리] ${lotId}: 대상 없음`);
    return;
  }
  const nowStr = formatDateTime();
  const updates = [];
  for (const d of toDelete) {
    updates.push({ range: `완제품개별!D${d.sheetRowIdx}`, values: [['삭제']] });
    updates.push({ range: `완제품개별!E${d.sheetRowIdx}`, values: [[nowStr]] });
    updates.push({ range: `완제품개별!F${d.sheetRowIdx}`, values: [[`phantom정리:${d.oldId}`]] });
  }
  for (let i = 0; i < updates.length; i += 50) {
    await SheetsAPI.batchUpdate(updates.slice(i, i + 50));
  }
  SheetsAPI.invalidateCache('완제품개별');
  const refreshed = await SheetsAPI.getAll('완제품개별', false);
  const lotIndivsAfter = refreshed.filter(iv => iv[1] === lotId && iv[3] !== '삭제');
  const activeAfter = lotIndivsAfter.filter(iv => ['냉동보관중','출하가능'].includes(iv[3])).length;
  const lotIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
  if (lotIdx > 0) {
    await SheetsAPI.batchUpdate([
      { range: `완제품LOT!I${lotIdx}`, values: [[String(activeAfter)]] },
      { range: `완제품LOT!K${lotIdx}`, values: [[String(lotIndivsAfter.length)]] }
    ]);
  }
  SheetsAPI.invalidateCache('완제품LOT');
  SheetsAPI.invalidateCache('완제품개별');
  console.log(`[phantom정리] ${lotId}: ${toDelete.length}건 soft-delete · packCount → ${lotIndivsAfter.length} · remain → ${activeAfter}`);
}

/* 완제품개별 중복 indivId 일괄 정리:
   - 시트 행 인덱스 보존하여 같은 indivId 그룹 찾기
   - 첫 발생 유지 (출하기록 등 외부 참조 보존)
   - 두 번째 이후는 같은 LOT 의 max(suffix) + 1, +2 ... 로 renumber
   - lotId 는 그대로 (개별 분리만, LOT 분리는 별도) */

/* [B안 — 사용자 선호] 중복 개별 row 를 soft-delete.
   - 같은 LOT 안의 indivId 그룹별로 처리
   - 출하완료된 행이 있으면 그 행을 유지 (출하기록 보존)
   - 없으면 시트 첫 발생 row 유지
   - 나머지는 status='삭제' + 노트로 soft-delete
   - LOT packCount(col 10) / remain(col 8) 도 실제 비-삭제 / 활성 개수로 자동 보정 */
async function autoDeleteDupFgIndivs(lotId) {
  SheetsAPI.invalidateCache('완제품개별');
  SheetsAPI.invalidateCache('완제품LOT');
  const allIndivs = await SheetsAPI.getAll('완제품개별', false);
  // 해당 LOT 의 모든 row + 시트 행 인덱스 보존
  const lotRows = [];
  allIndivs.forEach((row, i) => {
    if (row[1] === lotId) lotRows.push({ row, sheetRowIdx: i + 2 });
  });
  if (lotRows.length === 0) {
    console.log(`[중복삭제] ${lotId}: 개별 없음`);
    return;
  }
  // indivId 별 그룹
  const byId = new Map();
  for (const e of lotRows) {
    const id = e.row[0];
    if (!id) continue;
    const arr = byId.get(id) || [];
    arr.push(e);
    byId.set(id, arr);
  }
  // 중복 그룹 → 삭제할 행 결정
  const toDelete = [];
  for (const [id, group] of byId.entries()) {
    if (group.length < 2) continue;
    group.sort((a, b) => a.sheetRowIdx - b.sheetRowIdx);
    // 출하완료 행 우선 유지
    let keepIdx = group.findIndex(g => g.row[3] === '출하완료');
    if (keepIdx === -1) keepIdx = 0;  // 없으면 첫 발생 유지
    for (let i = 0; i < group.length; i++) {
      if (i === keepIdx) continue;
      toDelete.push({ sheetRowIdx: group[i].sheetRowIdx, oldId: id });
    }
  }
  if (toDelete.length === 0) {
    console.log(`[중복삭제] ${lotId}: 중복 없음`);
    return;
  }
  // soft-delete via batchUpdate (status='삭제', 일자/노트 기록)
  const nowStr = formatDateTime();
  const updates = [];
  for (const d of toDelete) {
    updates.push({ range: `완제품개별!D${d.sheetRowIdx}`, values: [['삭제']] });
    updates.push({ range: `완제품개별!E${d.sheetRowIdx}`, values: [[nowStr]] });
    updates.push({ range: `완제품개별!F${d.sheetRowIdx}`, values: [[`중복정리:${d.oldId}`]] });
  }
  for (let i = 0; i < updates.length; i += 50) {
    await SheetsAPI.batchUpdate(updates.slice(i, i + 50));
  }
  // LOT packCount / remain 자동 보정
  SheetsAPI.invalidateCache('완제품개별');
  const refreshed = await SheetsAPI.getAll('완제품개별', false);
  const lotIndivsAfter = refreshed.filter(iv => iv[1] === lotId && iv[3] !== '삭제');
  const activeAfter = lotIndivsAfter.filter(iv => ['냉동보관중','출하가능'].includes(iv[3])).length;
  const lotIdx = await SheetsAPI.findRowIndex('완제품LOT', 0, lotId);
  if (lotIdx > 0) {
    await SheetsAPI.batchUpdate([
      { range: `완제품LOT!I${lotIdx}`, values: [[String(activeAfter)]] },         // col I = remain (col 8)
      { range: `완제품LOT!K${lotIdx}`, values: [[String(lotIndivsAfter.length)]] }  // col K = packCount (col 10)
    ]);
  }
  SheetsAPI.invalidateCache('완제품LOT');
  SheetsAPI.invalidateCache('완제품개별');
  console.log(`[중복삭제] ${lotId}: ${toDelete.length}건 soft-delete · packCount → ${lotIndivsAfter.length} · remain → ${activeAfter}`);
}

async function autoFixDupFgIndivIds() {
  SheetsAPI.invalidateCache('완제품개별');
  const allIndivs = await SheetsAPI.getAll('완제품개별', false);

  // 행 인덱스 보존 + 같은 indivId 그룹화
  const byId = new Map();
  allIndivs.forEach((row, i) => {
    const id = row[0];
    if (!id) return;
    const arr = byId.get(id) || [];
    arr.push({ row, sheetRowIdx: i + 2 });
    byId.set(id, arr);
  });

  // LOT 별 max seq 계산 (renumber 시 다음 번호 부여용)
  const lotMaxSeq = new Map();
  allIndivs.forEach(iv => {
    const lotId = iv[1];
    if (!lotId) return;
    const m = (iv[0]||'').match(/-(\d+)$/);
    if (!m) return;
    const seq = parseInt(m[1]);
    if (!isNaN(seq)) {
      const cur = lotMaxSeq.get(lotId) || 0;
      if (seq > cur) lotMaxSeq.set(lotId, seq);
    }
  });

  const updates = [];
  let renamedCount = 0;
  for (const [id, group] of byId.entries()) {
    if (group.length < 2) continue;
    // group 을 시트 인덱스 순으로 정렬 (낮은 게 먼저)
    group.sort((a, b) => a.sheetRowIdx - b.sheetRowIdx);
    // 첫 발생 유지, 두 번째 이후 renumber
    for (let k = 1; k < group.length; k++) {
      const { row, sheetRowIdx } = group[k];
      const lotId = row[1] || '';
      if (!lotId) continue;
      let nextSeq = (lotMaxSeq.get(lotId) || 0) + 1;
      lotMaxSeq.set(lotId, nextSeq);
      // suffix 자릿수 추정 — 기존 ID 의 마지막 -NN 길이 보존
      const m = id.match(/-(\d+)$/);
      const padLen = m ? m[1].length : 2;
      const newId = `${lotId}-${String(nextSeq).padStart(padLen, '0')}`;
      updates.push({ range: `완제품개별!A${sheetRowIdx}`, values: [[newId]] });
      renamedCount++;
    }
  }

  if (updates.length === 0) {
    console.log('[중복개별정리] 변경 사항 없음');
    return;
  }
  // batchUpdate 분할 (200건 단위)
  for (let i = 0; i < updates.length; i += 200) {
    await SheetsAPI.batchUpdate(updates.slice(i, i + 200));
  }
  SheetsAPI.invalidateCache('완제품개별');
  console.log(`[중복개별정리] ${renamedCount}건 renumber 완료`);
}

/* 시트의 모든 row 를 JSON 으로 클립보드에 복사 (채팅 붙여넣기용) */
async function dbCopyAllJSON(tab) {
  try {
    const rows = await SheetsAPI.getAll(tab, false).catch(() => []);
    const headers = DB_SHEETS[tab] || (rows[0]||[]).map((_,i) => `col${i}`);
    const objs = rows.map(r => {
      const o = {};
      headers.forEach((h, i) => { if (r[i] !== undefined && r[i] !== '') o[h] = r[i]; });
      return o;
    });
    const text = JSON.stringify({ tab, count: objs.length, rows: objs }, null, 2);
    await navigator.clipboard.writeText(text);
    toast(`📋 ${objs.length}건 JSON 복사됨 — 채팅에 붙여넣어 분석 요청 가능`, 'suc', 4000);
  } catch(e) {
    toast('복사 실패: ' + e.message, 'err');
  }
}

/* row 편집 모달 — 각 컬럼 인라인 편집, 저장 시 SheetsAPI.updateRow */
async function dbEditRow(tab, idValue) {
  showLoading();
  const rows = await SheetsAPI.getAll(tab, false).catch(() => []);
  const row = rows.find(r => String(r[0]) === String(idValue));
  hideLoading();
  if (!row) { toast('row 를 찾을 수 없습니다', 'err'); return; }
  const headers = DB_SHEETS[tab] || row.map((_,i) => `col${i}`);

  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog" style="max-width:480px;max-height:85vh;overflow-y:auto">
      <div class="d-title">${tab} 편집</div>
      <div class="d-msg" style="font-family:monospace">[0] ${headers[0]||'id'}: <b>${row[0]||'-'}</b></div>
      <div class="card bl-warn" style="background:#fff8e1;padding:8px 10px;margin-bottom:10px">
        <div class="fs-11 c-txt-l">변경할 필드만 입력. 빈칸 유지하려면 그대로 두세요.</div>
      </div>
      <div id="db-edit-fields" style="max-height:50vh;overflow-y:auto">
        ${headers.map((h, i) => `
          <div class="input-group" style="margin-bottom:6px">
            <label style="font-size:11px">[${i}] ${h}</label>
            <input type="text" data-col="${i}" value="${String(row[i]||'').replace(/"/g,'&quot;')}"
                   ${i===0?'readonly disabled style="background:var(--gray-l);opacity:0.7"':'style="font-family:monospace;font-size:12px"'}>
          </div>
        `).join('')}
      </div>
      <div class="d-actions">
        <button class="btn btn-sm btn-outline btn-gray" id="db-edit-cancel">취소</button>
        <button class="btn btn-sm btn-pri" id="db-edit-save">변경사항 저장</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#db-edit-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#db-edit-save').onclick = async () => {
    const updates = {};
    overlay.querySelectorAll('input[data-col]').forEach(inp => {
      const colIdx = parseInt(inp.dataset.col);
      if (colIdx === 0) return;
      const newVal = inp.value;
      const oldVal = String(row[colIdx]||'');
      if (newVal !== oldVal) updates[colIdx] = newVal;
    });
    if (Object.keys(updates).length === 0) { toast('변경사항 없음', 'info'); overlay.remove(); return; }
    const changeSummary = Object.entries(updates).map(([k,v]) => `[${k}] ${headers[k]||k}: "${String(row[k]||'').substring(0,30)}" → "${String(v).substring(0,30)}"`).join('\n');
    overlay.remove();
    confirm('DB 변경 저장', `${tab} / ${idValue}\n\n${changeSummary}\n\n저장하시겠습니까?`, async () => {
      try {
        showLoading();
        await SheetsAPI.updateRow(tab, 0, idValue, updates);
        SheetsAPI.invalidateCache(tab);
        toast(`✓ ${Object.keys(updates).length}개 필드 저장됨`, 'suc');
        Router.go('db-browser', { tab });
      } catch (e) {
        toast('저장 실패: ' + e.message, 'err', 4000);
      } finally { hideLoading(); }
    });
  };
}

/* 작업지시서 PDF 모음 — wo[19] (pdfUrl) 가 채워진 모든 WO 를 카드 리스트로 표시 */
Screens['wo-pdfs'] = async () => {
  renderHeader('작업지시서 PDF', '저장된 HACCP 생산기록', { back: 'more' });
  showLoading();
  try {
    SheetsAPI.invalidateCache('작업지시서');
    const wos = await SheetsAPI.getAll('작업지시서', false).catch(() => []);
    const isAdmin = State.user?.role === 'admin';
    const myEmail = State.user?.email;
    // PDF 가 있는 WO 만 + 본인 작업 또는 관리자
    let pdfWos = wos.filter(w => w[19] && (w[19]+'').trim() && w[12] !== '삭제'
                              && (isAdmin || w[8] === myEmail));
    // 정렬: 승인시각 wo[16] desc, fallback 완료시각 wo[10]
    pdfWos.sort((a, b) => {
      const da = new Date(a[16] || a[10] || a[9] || 0).getTime();
      const db = new Date(b[16] || b[10] || b[9] || 0).getTime();
      return db - da;
    });

    // 상태 카운트
    const statusCount = {};
    pdfWos.forEach(w => { const s = w[12]||'미지정'; statusCount[s] = (statusCount[s]||0)+1; });
    const curFilter = window._pdfFilter || '전체';
    const filtered = curFilter === '전체' ? pdfWos : pdfWos.filter(w => w[12] === curFilter);
    const statusBadgeMap = { '진행중':'info','승인대기':'warn','냉동보관중':'warn','출하가능':'suc','출하완료':'suc','승인완료':'suc' };
    const statusOrder = ['출하완료','출하가능','승인완료','냉동보관중','승인대기','진행중'];
    const filterStatuses = statusOrder.filter(s => statusCount[s]);

    $id('content').innerHTML = `
      <div style="padding:16px">
        <div class="card bl-info" style="background:#e3f2fd;padding:10px;margin-bottom:12px">
          <div class="fs-13 fw-7 c-info mb-4">📄 ${pdfWos.length}건 PDF 저장됨</div>
          <div class="fs-11 c-txt-l">${isAdmin ? '관리자 — 전체 작업지시서' : '본인이 작업한 건만 표시'} · 최신순</div>
        </div>

        ${filterStatuses.length > 1 ? `
          <div class="row mb-12" style="gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm ${curFilter==='전체'?'btn-pri':'btn-outline btn-gray'}" onclick="window._pdfFilter='전체';Screens['wo-pdfs']()">전체 (${pdfWos.length})</button>
            ${filterStatuses.map(s => `
              <button class="btn btn-sm ${curFilter===s?'btn-pri':'btn-outline btn-gray'}" onclick="window._pdfFilter='${s}';Screens['wo-pdfs']()">${s} (${statusCount[s]})</button>
            `).join('')}
          </div>
        ` : ''}

        ${filtered.length === 0 ?
          `<div class="empty-state"><div class="es-icon">📄</div><div class="es-title">저장된 PDF 없음</div><div class="es-desc">${pdfWos.length === 0 ? '출하 승인 시 PDF가 자동 생성됩니다' : '선택한 상태의 PDF가 없습니다'}</div></div>` :
          filtered.map(wo => {
            const woId = wo[0]||'';
            const status = wo[12]||'';
            const stColor = statusBadgeMap[status] || 'gray';
            const startDt = (wo[9]||'').substring(0,16);
            const endDt = (wo[10]||'').substring(0,16);
            const apprDt = (wo[16]||'').substring(0,16);
            const fgLot = wo[14]||'';
            const pdfUrl = wo[19]||'';
            return `
              <div class="card bl-${stColor}">
                <div class="row between mb-4">
                  <span class="fs-13 fw-7">${wo[4]||''} ${wo[5]||''}kg <span class="fs-11 c-txt-l">/ ${wo[7]||'-'}봉</span></span>
                  <span class="badge badge-${stColor}">${status}</span>
                </div>
                <div class="fs-11 c-txt-l">${woId}${fgLot ? ` · FG ${fgLot}` : ''}</div>
                <div class="fs-11 c-txt-l">${wo[8]||''} · 시작 ${startDt}${endDt ? ` · 완료 ${endDt}` : ''}</div>
                ${apprDt ? `<div class="fs-11 c-txt-l">승인: ${apprDt}${wo[15] ? ' · ' + wo[15] : ''}</div>` : ''}
                <div class="row mt-8" style="gap:6px">
                  <a href="${pdfUrl}" target="_blank" rel="noopener" class="btn btn-pri btn-sm" style="flex:1;text-align:center;text-decoration:none">📄 PDF 열기</a>
                  <button class="btn btn-outline btn-sm btn-gray" onclick="Router.go('wo-detail',{woId:'${woId}'})" style="flex:1">상세</button>
                </div>
              </div>
            `;
          }).join('')
        }
      </div>
    `;
    hideLoading();
  } catch (e) {
    hideLoading();
    toast('로드 실패: ' + e.message, 'err');
  }
};

function renderBomResult() {
  const sopId = $id('bom-sop')?.value || '';
  const unit = window._bomUnit || 'bag';
  const qty = parseFloat($id('bom-qty')?.value) || 0;
  const lblEl = $id('bom-input-label'), unitEl = $id('bom-input-unit');
  if (lblEl) lblEl.textContent = unit === 'bag' ? '생산 봉수' : '완제품 kg';
  if (unitEl) unitEl.textContent = unit === 'bag' ? '봉' : 'kg';
  const result = $id('bom-result');
  const recEl = $id('bom-rec');
  if (recEl) recEl.innerHTML = '';
  if (!result || !State._bom || qty <= 0 || !sopId) {
    if (result) result.innerHTML = '<div class="fs-12 c-txt-l mt-12">입력값을 확인하세요</div>';
    return;
  }
  const { recipes, rmItems, rmLots } = State._bom;
  const sopRecipes = recipes.filter(r => r[0] === sopId);
  if (sopRecipes.length === 0) {
    result.innerHTML = '<div class="card bl-warn" style="background:#fff8e1;margin-top:12px"><div class="fs-12 c-warn">선택한 SOP에 레시피가 없습니다</div></div>';
    return;
  }

  // ─── 권장 배치 사이즈 (200~350kg, 정수 포대) — 입력 바로 아래에 표시 ───
  if (recEl) {
    const mainRecipe = sopRecipes.find(r => r[1]==='RM003')
                    || sopRecipes.reduce((max, r) => (parseFloat(r[3])||0) > (parseFloat(max[3])||0) ? r : max, sopRecipes[0]);
    const mainItem = rmItems.find(i => i[0] === mainRecipe[1]);
    const mainSkuP = parseSkuUnit(mainItem?.[3] || '');
    const mainRatio = parseFloat(mainRecipe[3]) || 0;
    const candidates = [];
    if (mainSkuP && mainSkuP.perUnit > 0 && mainRatio > 0) {
      for (let units = 1; units <= 50; units++) {
        const totalMixKg = units * mainSkuP.perUnit;
        const maxFinishedKg = totalMixKg / (mainRatio * 1.01);
        if (maxFinishedKg < 200) continue;
        if (maxFinishedKg > 360) break;
        const bags = Math.floor(maxFinishedKg / 5);
        const finishedKg = bags * 5;
        if (finishedKg < 200 || finishedKg > 350) continue;
        const mixUsed = mainRatio * finishedKg * 1.01;
        const waste = totalMixKg - mixUsed;
        candidates.push({ units, totalMixKg, finishedKg, bags, waste });
      }
      candidates.sort((a, b) => (a.waste - b.waste) || (b.bags - a.bags));
    }
    const top3 = candidates.slice(0, 3);
    const curBags = unit === 'bag' ? qty : Math.round(qty / 5);
    if (top3.length > 0) {
      recEl.innerHTML = `
        <div class="card" style="background:#f0f7ff;border-left:3px solid var(--pri);margin-top:12px">
          <div class="fs-13 fw-7 mb-4">📐 권장 배치 (${mainRecipe[2]} 정수 ${mainSkuP.unitName} 단위)</div>
          <div class="fs-11 c-txt-l mb-8">200~350kg 범위 · 잔여 자재 최소 순 상위 3건</div>
          ${top3.map((r, i) => {
            const isCurrent = (curBags === r.bags);
            const applyVal = unit === 'bag' ? r.bags : r.finishedKg;
            return `
              <div class="row between" style="padding:8px 0;${i < top3.length-1 ? 'border-bottom:1px solid var(--bg)' : ''};align-items:center">
                <div style="flex:1">
                  <div class="fs-13 fw-7">${r.bags}봉 (${r.finishedKg}kg)</div>
                  <div class="fs-11 c-txt-l">${mainRecipe[2]} ${r.units}${mainSkuP.unitName} (${r.totalMixKg}kg) · 잔여 ${r.waste.toFixed(2)}kg</div>
                </div>
                ${isCurrent ? '<span class="badge badge-suc">현재 입력</span>' :
                  `<button class="btn btn-sm btn-pri" onclick="document.getElementById('bom-qty').value=${applyVal};renderBomResult()" style="white-space:nowrap">적용</button>`}
              </div>
            `;
          }).join('')}
        </div>
      `;
    } else if (mainSkuP && mainSkuP.perUnit > 0) {
      recEl.innerHTML = `<div class="card bl-warn" style="background:#fff8e1;margin-top:12px;padding:10px"><div class="fs-12 c-warn">⚠ 200~350kg 범위에서 ${mainRecipe[2]} 정수 ${mainSkuP.unitName} 조합 없음</div></div>`;
    }
  }

  const targetKg = unit === 'bag' ? qty * 5 : qty;
  const bagCount = unit === 'bag' ? qty : (qty / 5);
  const ratioSum = sopRecipes.reduce((s, r) => s + (parseFloat(r[3])||0), 0);

  // 자재별 계산
  const rows = sopRecipes.map(r => {
    const rmCode = r[1];
    const rmName = r[2];
    const ratio = parseFloat(r[3]) || 0;
    const needKg = ratio * targetKg * 1.01;  // index.html:4570 동일 공식
    const item = rmItems.find(i => i[0] === rmCode);
    const sku = item?.[3] || '';
    const skuP = parseSkuUnit(sku);
    const isWater = rmCode === 'RM002';  // 물은 재고 추적 대상 외 (수도 공급)
    let needConv = '—', stockKg = 0, stockConv = '—', isShort = false;
    if (skuP && skuP.perUnit > 0) {
      const u = needKg / skuP.perUnit;
      needConv = `${u.toFixed(2)} ${skuP.unitName}`;
    }
    // 재고 (활성 LOT 합계) — 물은 무제한 가용으로 간주
    if (isWater) {
      stockKg = Infinity;
      stockConv = '관리대상 외';
      isShort = false;
    } else {
      stockKg = rmLots.filter(l => l[1] === rmCode && !['폐기','입고취소'].includes(l[9]))
                     .reduce((sum, l) => sum + (parseFloat(l[8])||0), 0);
      if (skuP && skuP.perUnit > 0) {
        const su = stockKg / skuP.perUnit;
        stockConv = `${su.toFixed(2)} ${skuP.unitName}`;
      } else {
        stockConv = `${stockKg.toFixed(2)} kg`;
      }
      isShort = stockKg < needKg;
    }
    const shortKg = isShort ? needKg - stockKg : 0;
    return { rmCode, rmName, ratio, needKg, needConv, stockKg, stockConv, isShort, shortKg, sku, isWater };
  });

  const anyShort = rows.some(r => r.isShort);
  const totalNeed = rows.reduce((s, r) => s + r.needKg, 0);

  result.innerHTML = `
    <div class="card bl-${anyShort ? 'err' : 'suc'}" style="background:${anyShort ? '#fff5f5' : '#e8f5e9'};margin-top:12px">
      <div class="row between">
        <div>
          <div class="fs-13 fw-7">생산 목표</div>
          <div class="fs-16 fw-8">${targetKg.toFixed(1)} kg / ${bagCount.toFixed(1)} 봉</div>
        </div>
        <div style="text-align:right">
          <div class="fs-11 c-txt-l">SOP ${sopId}</div>
          <div class="fs-11 c-txt-l">자재 합계: ${totalNeed.toFixed(2)} kg</div>
        </div>
      </div>
      ${anyShort ? '<div class="fs-12 c-err mt-4 fw-6">⚠ 재고 부족 자재가 있습니다 (아래 빨간색 표시)</div>' : '<div class="fs-12 c-suc mt-4 fw-6">✓ 모든 자재 재고 충분</div>'}
    </div>

    <div class="card" style="padding:0;overflow:hidden;margin-top:8px">
      <div class="fs-13 fw-7" style="padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--gray-l)">자재별 필요량 / 재고 비교</div>
      ${rows.map(r => `
        <div style="padding:10px 12px;border-bottom:1px solid var(--bg);${r.isShort ? 'background:#fff5f5' : ''}">
          <div class="row between mb-4">
            <span class="fs-13 fw-6">${r.rmCode} · ${r.rmName}</span>
            ${r.isWater ? '<span class="badge badge-gray">관리대상 외</span>' :
              r.isShort ? `<span class="badge badge-err">부족 ${r.shortKg.toFixed(2)}kg</span>` : '<span class="badge badge-suc">충분</span>'}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
            <div>
              <div class="fs-11 c-txt-l">필요량 (배합비 × kg × 1.01)</div>
              <div class="fs-13 fw-7">${r.needKg.toFixed(2)} kg</div>
              ${r.needConv !== '—' ? `<div class="fs-11 c-txt-l">≈ ${r.needConv}</div>` : ''}
            </div>
            <div>
              <div class="fs-11 c-txt-l">현재고</div>
              <div class="fs-13 fw-7" style="${r.isWater ? 'color:var(--txt-l)' : r.isShort ? 'color:var(--err)' : ''}">${r.isWater ? '—' : r.stockKg.toFixed(2) + ' kg'}</div>
              <div class="fs-11 c-txt-l">${r.isWater ? '수도 공급 · 추적 안함' : '≈ ' + r.stockConv}</div>
            </div>
          </div>
          <div class="fs-10 c-txt-l mt-4">배합비 ${r.ratio.toFixed(4)} · SKU "${r.sku || '-'}"</div>
        </div>
      `).join('')}
      <div class="row between" style="padding:10px 12px;background:#eef5ff">
        <span class="fs-12 fw-6">배합비 합계</span>
        <span class="fs-12 fw-7">${ratioSum.toFixed(4)} ${Math.abs(ratioSum-1.0)<0.005 ? '✓ (정밀)' : Math.abs(ratioSum-1.01)<0.005 ? '⚠ 1.01 (반올림 — 안전계수 중복 적용)' : '⚠ 비정상'}</span>
      </div>
    </div>

  `;
}

// ─── SOP DETAIL ───
Screens['sop-detail'] = async (params = {}) => {
  const { sopId } = params;

  try {
    if (!State.sopSteps.length) State.sopSteps = await SheetsAPI.getAll('SOP공정단계').catch(() => []);
    if (!State.sopRecipes.length) State.sopRecipes = await SheetsAPI.getAll('SOP레시피').catch(() => []);
  } catch(e) {}

  const sop = State.sops.find(s => s[0] === sopId) || State.sops[0];
  const sid = sop?.[0] || sopId;
  const steps = State.sopSteps.filter(s => s[0] === sid).sort((a,b) => parseInt(a[1])-parseInt(b[1]));
  const recipes = State.sopRecipes.filter(r => r[0] === sid);

  // 미리보기 기준 (사용자가 변경 가능)
  if (!State._sopPrev) State._sopPrev = { kg: 200, bags: 40 };

  renderHeader('SOP 상세', `${sid} · ${sop?.[1] || ''}`, { back: 'sop-list' });

  function renderAll() {
    const previewKg = State._sopPrev.kg;
    const previewBags = State._sopPrev.bags;

    $id('content').innerHTML = `
      <div style="padding:12px">
        <div class="card">
          <div class="row between mb-8">
            <div>
              <div class="fs-16 fw-7">${sop?.[1] || ''}</div>
              <div class="fs-12 c-txt-l">${sid} · v${sop?.[3]||'1.0'} · 대상: ${sop?.[2]||''}</div>
            </div>
            <span class="badge badge-${sop?.[4]==='활성'?'suc':'err'}">${sop?.[4] || ''}</span>
          </div>
          ${State.user?.role === 'admin' ? '<div class="row" style="gap:8px"><button class="btn btn-sm btn-pri" disabled>수정 (준비중)</button><button class="btn btn-sm btn-outline btn-err" disabled>폐기 (준비중)</button></div>' : ''}
        </div>

        <div class="card bl-info" style="background:#e3f2fd;padding:10px">
          <div class="fs-13 fw-7 c-info mb-4">📋 작업자 화면 미리보기 (관리자)</div>
          <div class="fs-11 c-txt-l mb-8">실제 작업자가 보는 공정 화면입니다. 입력/스캔/사진은 비활성.</div>
          <div class="row" style="gap:8px;align-items:center">
            <span class="fs-11 c-txt-l">기준 수량:</span>
            <input type="number" id="sop-prev-bags" value="${previewBags}" min="1" style="width:70px;padding:4px 8px;border:1px solid var(--gray-l);border-radius:4px" oninput="window._sopPrevSetBags(this.value)">
            <span class="fs-11 c-txt-l">봉 = ${previewKg} kg</span>
          </div>
        </div>

        ${recipes.length > 0 ? `
          <div class="fs-14 fw-7 mb-8">레시피 (BOM) — 완제품 1kg당</div>
          <div class="card">
            ${recipes.map((r, i) => `
              <div class="row between" style="padding:6px 0;${i < recipes.length-1 ? 'border-bottom:1px solid var(--bg)' : ''}">
                <span class="fs-13">${r[2] || ''} (${r[1] || ''})</span>
                <span class="fs-13 c-txt-l">${r[3] || ''} ${r[4] || ''} · 공정${r[5] || ''}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <div class="fs-14 fw-7 mb-8 mt-12">공정 단계 (${steps.length}단계) — 작업자 화면 그대로</div>

/* SOP 단계 미리보기 카드 — 작업자가 실제로 보는 화면 구조와 동일.
   모든 입력·버튼은 비활성화. wo-execute 의 renderStepContent 와 동일한 스타일. */
function renderSopStepPreview(step, recipes, targetKg, packCount) {
  const stepNo = parseInt(step[1]);
  const stepType = step[3] || 'input';
  const isMixing = stepType === 'process' && (step[2]||'').includes('믹싱');
  const typeColor = { input: 'info', process: isMixing ? 'teal' : 'pri', seal: 'pri', inspect: 'warn', pack: 'gray-d', store: 'teal', 'qr-label': 'info' };
  const typeLabel = { input: '투입', process: isMixing ? '믹싱' : '공정', seal: '포장(밀봉)', inspect: '검사(CCP)', pack: '포장', store: '보관', 'qr-label': 'QR라벨' };
  const color = typeColor[stepType] || 'gray';
  const label = typeLabel[stepType] || stepType;
  const checks = (step[6] || '').split(',').filter(c => c.trim());
  const desc = step[6] || '';

  // disabled 입력 공통 스타일
  const dis = 'readonly disabled style="background:var(--gray-l);opacity:0.7"';

  let body = '';

  if (stepType === 'input') {
    const rmCode = step[4] || '';
    const recipe = recipes.find(r => r[1] === rmCode);
    const target = recipe ? (parseFloat(recipe[3]) * targetKg * 1.01).toFixed(2) : '0';
    const isWater = rmCode === 'RM002';
    let n = 1;
    body += `
      <div class="fs-14 fw-7" style="margin-bottom:6px;margin-top:4px">Step ${n++}. 투입 목표량 확인</div>
      <div class="info-box suc">
        <div class="fs-12 fw-6 c-suc">투입 목표량 (배합비 × ${targetKg}kg × 1.01)</div>
        <div class="fs-20 fw-8 c-suc mt-4">${target} kg</div>
        <div class="fs-11 c-txt-l">자재 코드: ${rmCode}${isWater ? ' (수도 공급 · 추적 외)' : ''}</div>
      </div>
    `;
    if (checks.length > 0) {
      body += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-8">체크항목</div>`;
      checks.forEach(c => {
        body += `<div class="check-item"><div class="check-box" style="pointer-events:none"></div><span>${c.trim()}</span></div>`;
      });
    }
    if (!isWater) {
      body += `
        <div class="fs-14 fw-7" style="margin-bottom:6px;margin-top:20px">Step ${n++}. 원재료 LOT 확인</div>
        <button class="btn btn-info btn-full mb-8" disabled>📷 QR 스캔 시작</button>
      `;
    }
    body += `
      <div class="fs-14 fw-7" style="margin-bottom:6px;margin-top:20px">Step ${n++}. 저울 계량값 사진 첨부 <span class="c-err">*필수</span></div>
      <div class="row mb-8" style="gap:8px">
        <button class="btn btn-sm btn-outline btn-pri flex-1" disabled>📷 카메라 촬영</button>
        <button class="btn btn-sm btn-outline btn-gray flex-1" disabled>🖼️ 갤러리 선택</button>
      </div>
      <div class="fs-14 fw-7" style="margin-bottom:6px;margin-top:20px">Step ${n++}. 실제 투입량 입력</div>
      <div class="input-group">
        <label>실제 투입량 (kg) <span class="c-err">*필수</span></label>
        <div class="input-suffix"><input type="number" placeholder="투입량 입력" ${dis}><span>kg</span></div>
      </div>
    `;
  }
  else if (stepType === 'process') {
    const std = step[5] || '';
    if (!isMixing && std) {
      body += `<div class="info-box" style="background:rgba(59,130,246,0.1)"><div class="fs-12 fw-6 c-pri">기준값</div><div class="fs-14 fw-7 mt-4">${std}</div></div>`;
    } else if (isMixing) {
      body += `<div class="info-box" style="background:rgba(20,184,166,0.1)"><div class="fs-12 fw-6" style="color:#0d9488">${step[2]||''} 공정</div></div>`;
    }
    if (checks.length > 0) {
      body += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-8">체크항목</div>`;
      checks.forEach(c => {
        body += `<div class="check-item"><div class="check-box" style="pointer-events:none"></div><span>${c.trim()}</span></div>`;
      });
    }
    body += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-12">공정 사진</div><button class="btn btn-sm btn-outline btn-pri" disabled>📷 사진 촬영/선택</button>`;
  }
  else if (stepType === 'pack' || stepType === 'seal') {
    body += `<div class="info-box" style="background:rgba(124,58,237,0.1)"><div class="fs-12 fw-6" style="color:#7c3aed">${stepType==='seal'?'포장 공정':'계량 공정'}</div></div>`;
    if (stepType === 'seal') {
      body += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-8">체크항목</div>`;
      body += `<div class="check-item"><div class="check-box" style="pointer-events:none"></div><span>제품 라벨 부착 확인</span></div>`;
      body += `<div class="check-item"><div class="check-box" style="pointer-events:none"></div><span>포장지 내 공기 없이 밀봉 상태 확인</span></div>`;
    }
    body += `<div class="fs-13 fw-7 mb-8 mt-12">무작위 3개 제품 — 저울 위 사진 + 무게 기록</div>`;
    for (let i = 1; i <= 3; i++) {
      body += `
        <div class="card" style="padding:10px;border-left:3px solid #7c3aed;margin-bottom:6px">
          <div class="fs-13 fw-6 mb-8">샘플 #${i}</div>
          <button class="btn btn-sm btn-outline btn-pri mb-8" disabled>📷 사진 촬영</button>
          <div class="input-group"><label style="font-size:12px">무게</label><div class="input-suffix"><input type="number" placeholder="g" ${dis}><span>g</span></div></div>
        </div>
      `;
    }
    body += `<div class="input-group mt-12"><label>${stepType==='seal'?'최종 완제품 수량':'포장 수량'} (예상 ${packCount}개)</label><div class="input-suffix"><input type="number" placeholder="수량" ${dis}><span>개</span></div></div>`;
  }
  else if (stepType === 'inspect') {
    body += `<div class="info-box" style="background:rgba(198,40,40,0.1)"><div class="fs-12 fw-6 c-err">CCP 금속검출 검사 (HACCP 핵심)</div></div>`;
    body += `<div class="fs-11 c-txt-l mt-4">예상 검사 수량: ${packCount}개</div>`;
    if (checks.length > 0) {
      body += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-8">체크항목</div>`;
      checks.forEach(c => {
        body += `<div class="check-item"><div class="check-box" style="pointer-events:none"></div><span>${c.trim()}</span></div>`;
      });
    }
    body += `<div class="fs-12 fw-6 mt-8 mb-4 c-err">CCP 모니터링 (시작·중간·종료 시간, Fe/SUS 결과 입력)</div>`;
    body += `<div class="fs-11 c-txt-l">실제 작업자 화면에서 7단계 점검 입력 필드 노출</div>`;
    body += `<button class="btn btn-sm btn-outline btn-pri mt-8" disabled>📷 검사 사진</button>`;
  }
  else if (stepType === 'qr-label') {
    body += `<div class="info-box" style="background:rgba(21,101,192,0.1)"><div class="fs-12 fw-6" style="color:#1565c0">QR 라벨 인쇄</div></div>`;
    body += `<div class="input-group mt-8"><label>QR 라벨 수량 (예상 ${packCount}매)</label><div class="input-suffix"><input type="number" placeholder="수량" ${dis}><span>매</span></div></div>`;
    body += `<button class="btn btn-pri btn-full mt-8" disabled>🖨️ 라벨 미리보기</button>`;
  }
  else if (stepType === 'store') {
    body += `<div class="info-box" style="background:rgba(0,105,92,0.1)"><div class="fs-12 fw-6" style="color:#00695c">냉동 보관</div></div>`;
    if (step[5]) body += `<div class="fs-11 c-txt-l mt-4">보관 기준: ${step[5]}</div>`;
    if (checks.length > 0) {
      body += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-8">체크항목</div>`;
      checks.forEach(c => {
        body += `<div class="check-item"><div class="check-box" style="pointer-events:none"></div><span>${c.trim()}</span></div>`;
      });
    }
    body += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-12">냉동고 온도계 사진</div><button class="btn btn-sm btn-outline btn-pri" disabled>📷 사진 촬영</button>`;
    body += `<div class="input-group mt-8"><label>냉동 시작 시각 (자동 기록)</label><input type="text" placeholder="자동 입력 됨" ${dis}></div>`;
  }
  else {
    body += `<div class="fs-12 c-txt-l">미정의 stepType: ${stepType}</div>`;
  }

  return `
    <div class="card bl-${color}" style="margin-bottom:10px">
      <div class="row between mb-12">
        <div class="fs-16 fw-7">공정 ${step[1]}. ${step[2]||''}</div>
        <span class="badge badge-${color}">${label}</span>
      </div>
      ${body}
      <div class="fs-10 c-txt-l mt-8" style="border-top:1px solid var(--gray-l);padding-top:6px">
        ${desc ? `${desc} · ` : ''}stepType=${stepType}
      </div>
    </div>
  `;
}

// ─── RAW MATERIAL ITEMS (원재료 품목) ───
Screens['items-rm'] = async () => {
  renderHeader('원재료 품목', '원재료 마스터 데이터', { back: 'more' });
  showLoading();
  let items = [], lots = [];
  try {
    [items, lots] = await Promise.all([
      SheetsAPI.getAll('원재료품목').catch(() => []),
      SheetsAPI.getAll('원재료LOT').catch(() => []),
    ]);
  } catch(e) {}
  hideLoading();
  items = items.filter(i => i[12] !== '비활성');

  const isAdmin = State.user?.role === 'admin';
  $id('content').innerHTML = `
    <div style="padding:16px">
      <div class="fs-12 c-txt-l mb-8">총 ${items.length}개 품목 · DB 연동 조회${isAdmin ? ' · 관리자: 우측 🗑 버튼으로 비활성화 가능' : ''}</div>
      ${items.length === 0 ?
        `<div class="empty-state"><div class="es-icon">📦</div><div class="es-title">등록된 원재료 없음</div><div class="es-desc">Google Sheets에서 직접 등록하세요</div></div>` :
        items.map(item => {
          const code = item[0], name = item[1], spec = item[2] || '', sku = item[3] || '', unit = item[4] || 'kg';
          const category = item[5] || '', allergen = item[7] || '';
          const storage = item[8] || '실온';
          const rpVal = parseFloat(item[9]) || parseFloat(item[6]) || 0;
          const leadDays = item[10] || '';
          const orderCycle = item[11] || '';
          const isWater = code === 'RM002';
          const totalRemain = isWater ? '-' :
            lots.filter(l => l[1] === code && !['폐기','소진','입고취소'].includes(l[9]))
              .reduce((sum, l) => sum + (parseFloat(l[8]) || 0), 0);
          const rmNeedsOrder = !isWater && rpVal > 0 && totalRemain <= rpVal;
          const lotCount = lots.filter(l => l[1] === code).length;
          return `
            <div class="card" ${rmNeedsOrder ? 'style="border-left:3px solid var(--warn)"' : ''}>
              <div class="row between mb-4">
                <div class="fs-14 fw-6">${name} <span class="fs-11 c-txt-l">${code}</span></div>
                <div class="row" style="gap:6px;align-items:center">
                  ${isWater ? '<span class="badge badge-info">수돗물</span>' :
                    rmNeedsOrder ? '<span class="badge badge-warn">발주필요</span>' : '<span class="badge badge-suc">정상</span>'}
                  ${isAdmin && !isWater ? `<button class="btn btn-sm btn-outline btn-err" style="padding:2px 8px;font-size:11px" onclick="deactivateRmItem('${code}','${(name||'').replace(/'/g,"\\'")}', ${lotCount})">🗑</button>` : ''}
                </div>
              </div>
              <div class="fs-12 c-txt-l">규격: ${spec || '-'} · 단위: ${unit} · SKU: ${sku || '-'}</div>
              <div class="fs-12 c-txt-l">분류: ${category || '-'} · 보관: ${storage} · 알레르겐: ${allergen || '없음'}</div>
              ${!isWater ? `<div class="fs-12" style="margin-top:4px">현재고: <b>${totalRemain}${unit}</b>${rpVal > 0 ? ` · 발주점: ${rpVal}${unit}` : ''}${lotCount > 0 ? ` · LOT ${lotCount}건` : ''}</div>` : ''}
              ${!isWater && (leadDays || orderCycle) ? `<div class="fs-11 c-txt-l">리드타임: ${leadDays || '-'}일 · 주문주기: ${orderCycle || '-'}</div>` : ''}
            </div>`;
        }).join('')
      }
      <div class="card" style="text-align:center;background:var(--bg);border:1px dashed var(--gray)">
        <div class="fs-12 c-txt-l">품목 추가/수정은 <span style="color:var(--pri);cursor:pointer" onclick="window.open('https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit#gid=0','_blank')"><b>Google Sheets</b></span>에서 관리됩니다</div>
      </div>
    </div>
  `;
};

/* 원재료 품목 비활성화 (관리자) — i[12] = '비활성'.
   삭제가 아닌 soft delete: 시트 row 보존, UI 에서만 숨김.
   LOT 가 연결된 품목은 경고 표시 후 진행. */
async function deactivateRmItem(code, name, lotCount) {
  if (State.user?.role !== 'admin') { toast('관리자만 가능합니다', 'err'); return; }
  if (code === 'RM002') { toast('물(RM002)은 비활성화 불가', 'err'); return; }
  const warn = lotCount > 0 ? `\n⚠ 연결된 LOT ${lotCount}건 — 비활성 후에도 LOT 데이터는 유지됩니다.` : '';
  confirm('원재료 품목 비활성화', `${code} ${name}${warn}\n\n비활성화하시겠습니까?\n(시트 row 는 보존, UI 에서만 숨김)`, async () => {
    if (!acquireLock('deactivateRmItem')) return;
    try {
      showLoading();
      await SheetsAPI.updateCell('원재료품목', 0, code, 12, '비활성');
      SheetsAPI.invalidateCache('원재료품목');
      toast(`${code} 비활성화 완료`, 'suc');
      await Screens['items-rm']();  // 화면 갱신
    } catch (e) {
      toast('비활성화 실패: ' + e.message, 'err');
    } finally {
      hideLoading();
      releaseLock('deactivateRmItem');
    }
  });
}

let _selectedSopId = null;

function selectSOP(sopId) {
  _selectedSopId = sopId;

  // Show steps preview
  const steps = State.sopSteps.filter(s => s[0] === sopId);
  $id('wo-steps-preview').innerHTML = steps.map(s =>
    `<div style="padding:4px 0;border-bottom:1px solid var(--bg)">${s[1]}. ${s[2]||''}</div>`
  ).join('');

  updateWOCalc();
}

function updateWOCalc() {
  const qty = parseFloat($id('wo-qty')?.value) || 0;
  const unitSize = parseInt($id('wo-unit')?.value) || 1;
  const calcEl = $id('wo-calc');
  const totalEl = $id('wo-total-production');

  if (qty <= 0 || !_selectedSopId) {
    calcEl.style.display = 'none';
    if (totalEl) totalEl.style.display = 'none';
    return;
  }

  const totalKg = qty * unitSize;
  const recipes = State.sopRecipes.filter(r => r[0] === _selectedSopId);

  // 총 생산량 표시
  if (totalEl) {
    totalEl.style.display = '';
    totalEl.innerHTML = `
      <div class="info-box suc" style="margin-bottom:12px">
        <div class="fs-12 fw-6 c-suc">총 생산량</div>
        <div class="fs-20 fw-8 c-suc mt-4">${totalKg} kg</div>
        <div class="fs-11 c-txt-l mt-2">${qty}개 × ${unitSize}kg = ${totalKg}kg</div>
      </div>
    `;
  }

  calcEl.style.display = '';
  calcEl.innerHTML = `
    <div class="card info-box suc">
      <div class="fs-13 fw-7 c-suc mb-8">원재료 투입 목표 (배합비 × ${totalKg}kg × 1.01)</div>
      <div class="fs-12 c-txt-l mb-4">+1% 여유분 자동 반영</div>
      ${recipes.map(r => {
        const target = (parseFloat(r[3]) || 0) * totalKg * 1.01;
        const isEgg = (r[1]||'') === 'RM001';
        const eggCnt = isEgg ? Math.ceil(target * 1000 / 50) : 0;
        const eggPan = Math.floor(eggCnt / 30);
        const eggAl = eggCnt % 30;
        const eggTxt = eggCnt > 0 ? (eggPan > 0 && eggAl > 0 ? eggPan + '판 ' + eggAl + '알' : eggPan > 0 ? eggPan + '판' : eggAl + '알') : '';
        return `
          <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--gray-l)">
            <span class="fs-13">${r[2]||''} (${r[1]||''})</span>
            <span class="fs-13 fw-7 c-suc">${target.toFixed(2)} kg${eggTxt ? ' <span style="background:#fff8e1;border:1px solid #ffe082;border-radius:4px;padding:1px 6px;font-size:11px;color:#e65100">🥚 ' + eggTxt + '</span>' : ''}</span>
          </div>
        `;
      }).join('')}
      <div class="fs-11 c-txt-l mt-8">예상 포장 수: ${qty}개</div>
    </div>
  `;

  updateWOBomCheck();
}

/* ─── BOM 검증 + 권장 배치 사이즈 (200~350kg, 마미만쥬믹스 정수 포대) ───
   - 자재 부족 자재 빨간 카드로 경고 (작업 시작 차단 X — 정보 제공만)
   - 주 자재(마미만쥬믹스 RM003 또는 최대 비중) 기준 정수 ${포대} 단위로 가능한
     봉수 후보 중 200~350kg 범위 + 잔여 자재 최소 순 상위 3개 표시
   - "적용" 버튼으로 wo-qty input 갱신 → updateWOCalc 재호출 */
function updateWOBomCheck() {
  const bomEl = $id('wo-bom-rec');
  if (!bomEl) return;
  const qty = parseFloat($id('wo-qty')?.value) || 0;
  const unitSize = parseInt($id('wo-unit')?.value) || 5;
  const totalKg = qty * unitSize;
  if (!_selectedSopId || qty <= 0) { bomEl.style.display = 'none'; return; }

  const recipes = State.sopRecipes.filter(r => r[0] === _selectedSopId);
  if (recipes.length === 0) { bomEl.style.display = 'none'; return; }

  const rmLots = State.rawMaterialLots || [];
  const rmItems = State.rawMaterialItems || [];

  // 자재별 재고 비교 (물 RM002 는 관리대상 외 — 부족 표시 안 함)
  const checks = recipes.map(r => {
    const code = r[1];
    const ratio = parseFloat(r[3]) || 0;
    const need = ratio * totalKg * 1.01;
    const isWater = code === 'RM002';
    if (isWater) {
      return { code, name: r[2], ratio, need, stock: Infinity, isShort: false, shortKg: 0, isWater: true };
    }
    const stock = rmLots.filter(l => l[1] === code && !['폐기','입고취소'].includes(l[9]))
                       .reduce((s, l) => s + (parseFloat(l[8])||0), 0);
    return { code, name: r[2], ratio, need, stock,
             isShort: stock < need, shortKg: Math.max(0, need - stock), isWater: false };
  });
  const shortItems = checks.filter(c => c.isShort);

  // 주 자재 = 마미만쥬믹스 우선, 없으면 비중 최대
  const main = recipes.find(r => r[1] === 'RM003')
            || recipes.reduce((a, b) => parseFloat(a[3]||0) > parseFloat(b[3]||0) ? a : b, recipes[0]);
  const mainItem = rmItems.find(i => i[0] === main[1]);
  const mainSkuP = parseSkuUnit(mainItem?.[3] || '');
  const mainRatio = parseFloat(main[3]) || 0;

  const recommendations = [];
  if (mainSkuP && mainSkuP.perUnit > 0 && mainRatio > 0) {
    // 정수 포대 단위로 200~350kg 완제품 가능한 후보 탐색
    for (let units = 1; units <= 50; units++) {
      const totalMixKg = units * mainSkuP.perUnit;
      // 이 포대 수로 만들 수 있는 최대 완제품 kg
      const maxFinishedKg = totalMixKg / (mainRatio * 1.01);
      if (maxFinishedKg < 200) continue;
      if (maxFinishedKg > 360) break;  // 후보 초과
      // 정수 봉수 (내림) — 잔여 자재 발생
      const bags = Math.floor(maxFinishedKg / unitSize);
      const finishedKg = bags * unitSize;
      if (finishedKg < 200 || finishedKg > 350) continue;
      const mixUsed = mainRatio * finishedKg * 1.01;
      const waste = totalMixKg - mixUsed;
      recommendations.push({ units, totalMixKg, finishedKg, bags, mixUsed, waste });
    }
    // 잔여 최소 → bags 큰 순으로 동률 분리
    recommendations.sort((a, b) => (a.waste - b.waste) || (b.bags - a.bags));
  }
  const top3 = recommendations.slice(0, 3);

  bomEl.style.display = '';
  bomEl.innerHTML = `
    <div class="card ${shortItems.length ? 'bl-err' : 'bl-suc'}" style="background:${shortItems.length ? '#fff5f5' : '#e8f5e9'};margin-top:12px">
      <div class="fs-13 fw-7 ${shortItems.length ? 'c-err' : 'c-suc'} mb-4">

        ${top3.map((r, i) => {

          return `
            <div class="row between" style="padding:8px 0;${i < top3.length-1 ? 'border-bottom:1px solid var(--bg)' : ''};align-items:center">
              <div style="flex:1">
                <div class="fs-13 fw-7">${r.bags}봉 (${r.finishedKg}kg)</div>
                <div class="fs-11 c-txt-l">${main[2]} ${r.units}${mainSkuP.unitName} (${r.totalMixKg}kg) · 잔여 ${r.waste.toFixed(2)}kg</div>
              </div>
              ${isCurrent ? '<span class="badge badge-suc">현재 입력</span>' :
                `<button class="btn btn-sm btn-pri" onclick="document.getElementById('wo-qty').value=${r.bags};updateWOCalc()" style="white-space:nowrap">적용</button>`}
            </div>
          `;
        }).join('')}
      </div>
    ` : (mainSkuP && mainSkuP.perUnit > 0 ? `
      <div class="card bl-warn" style="background:#fff8e1;margin-top:8px;padding:10px">
        <div class="fs-12 c-warn">⚠ 200~350kg 범위에서 ${main[2]} 정수 ${mainSkuP.unitName} 조합이 없습니다</div>
        <div class="fs-11 c-txt-l mt-4">SOP·SKU 조합 또는 안전계수 확인 필요</div>
      </div>

  `;
}

async function startWorkOrder() {
  if (!acquireLock('startWorkOrder')) return;
  const qty = parseFloat($id('wo-qty')?.value) || 0;
  const unitSize = parseInt($id('wo-unit')?.value) || 1;
  const reqId = $id('wo-req')?.value || '';
  const totalKg = qty * unitSize;

  if (!_selectedSopId) { toast('SOP를 선택하세요', 'err'); releaseLock('startWorkOrder'); return; }
  if (qty <= 0) { toast('생산 수량을 입력하세요', 'err'); releaseLock('startWorkOrder'); return; }

  try {
    showLoading();
    const woId = await generateSeqId('WO', '작업지시서');
    const sop = State.sops.find(s => s[0] === _selectedSopId);

    await SheetsAPI.append('작업지시서', [
      woId, _selectedSopId, reqId, sop?.[2] || 'FG002', sop?.[1]?.replace('제조','').trim() || '앙호두 (호두과자 전용반죽)',
      totalKg, `${unitSize}kg`, qty, State.user?.email,
      formatDateTime(), '', '', '진행중', '0', '', '', '', '', ''
    ]);

    // Update production request if linked
    if (reqId) {
      await SheetsAPI.updateCell('생산요청', 0, reqId, 7, '배정완료');
    }

    toast(`작업지시서 ${woId} 생성 완료`, 'suc');
    Router.go('wo-execute', { woId });
  } catch (e) {
    toast('생성 실패: ' + e.message, 'err');
  } finally {
    hideLoading();
    releaseLock('startWorkOrder');
  }
}

/* ═══════════════════════════════════════════════
   WORK ORDER EXECUTION (Phase 4 - 핵심)
   ═══════════════════════════════════════════════ */
Screens['wo-execute'] = async (params = {}) => {
  const { woId } = params;
  showLoading();

  try {
    // Load WO data — 항상 최신 데이터 (캐시 bypass)
    // PC에서 열 때 휴대폰에서 업데이트된 데이터를 즉시 반영하기 위함
    SheetsAPI.invalidateCache('작업지시서');
    SheetsAPI.invalidateCache('공정기록');
    const wos = await SheetsAPI.getAll('작업지시서', false);
    const wo = wos.find(w => w[0] === woId) || wos.find(w => w[12] === '진행중');
    if (!wo) { toast('작업지시서를 찾을 수 없습니다', 'err'); hideLoading(); Router.go('production'); return; }

    // Load SOP steps & recipes
    const sopId = wo[1];
    const [steps, recipes, records] = await Promise.all([
      SheetsAPI.getAll('SOP공정단계').then(all => all.filter(s => s[0] === sopId)),
      SheetsAPI.getAll('SOP레시피').then(all => all.filter(r => r[0] === sopId)),
      SheetsAPI.getAll('공정기록').then(all => all.filter(r => r[0] === wo[0])),
    ]);

    const lastSaved = parseInt(wo[13]) || 0;
    const targetQty = parseFloat(wo[5]) || 50;

    // maxStep: 공정기록에서 '완료' 상태인 최대 stepNo 기반으로 계산 (DB 기준 진실)
    let maxStepFromRecords = lastSaved;
    records.forEach(r => {
      if (r[10] === '완료' || r[10] === '임시저장') {
        const sIdx = steps.findIndex(s => String(s[1]) === String(r[1]));
        if (sIdx >= 0 && (sIdx + 1) > maxStepFromRecords) maxStepFromRecords = sIdx + 1;
      }
    });
    // maxStep = max(lastSaved, records 기반 계산값) — 데이터 무결성 보장
    const maxStep = Math.max(lastSaved, maxStepFromRecords);
    console.log(`[WO실행] woId=${wo[0]}, lastSaved=${lastSaved}, maxStepFromRecords=${maxStepFromRecords}, maxStep=${maxStep}`);

    // Store in state
    // currentStep: 현재 보고 있는 단계 (viewing position)
    // maxStep: 완료된 최대 단계 (navigation boundary) — 절대 감소하지 않음
    // ── 기존 인메모리 데이터 보존 (LiveSync 리로드 시 스캔/사진 데이터 유실 방지) ──
    const prevScannedLots = State.woExec?._scannedLots;
    const prevPendingPhotos = State.woExec?._pendingPhotos;
    const prevUseType = State.woExec?._useType;
    const prevCurrentStep = State.woExec?.currentStep;
    const isSameWo = State.woExec?.woId === wo[0];

    State.woExec = {
      woId: wo[0], wo, sopId, steps, recipes, records, targetQty,
      currentStep: isSameWo ? (prevCurrentStep ?? lastSaved) : lastSaved,
      maxStep: maxStep,
      unit: wo[6] || '1kg',
      packCount: parseInt(wo[7]) || 50,
    };

    // 같은 WO 리로드 시 인메모리 데이터 복원
    if (isSameWo) {
      if (prevScannedLots) State.woExec._scannedLots = prevScannedLots;
      if (prevPendingPhotos) State.woExec._pendingPhotos = prevPendingPhotos;
      if (prevUseType) State.woExec._useType = prevUseType;
    }

    hideLoading();
    renderWOExecute();
  } catch (e) {
    hideLoading();
    toast('작업지시서 로드 실패: ' + e.message, 'err');
    Router.go('production');
  }
};

function renderWOExecute() {
  const { woId, steps, currentStep, maxStep, targetQty, unit, packCount } = State.woExec;
  const total = steps.length;
  const step = steps[currentStep];
  if (!step) return;

  const stepType = step[3] || 'input';
  const isMixingStep = stepType === 'process' && (step[2]||'').includes('믹싱');
  const typeColor = { input: 'info', process: isMixingStep ? 'teal' : 'pri', inspect: 'warn', pack: 'gray-d', store: 'teal' };
  const typeLabel = { input: '투입', process: isMixingStep ? '믹싱' : '공정', inspect: '검사(CCP)', pack: '포장', store: '보관' };

  // Header
  renderHeader(woId, `${State.woExec.wo?.[4] || ''} ${targetQty}kg · ${unit}포장`);

  $id('content').innerHTML = `
    <!-- Progress: maxStep 기준으로 진행률 표시 -->
    <div style="background:var(--white);padding:8px 16px">
      <div class="row between mb-4">
        <span class="fs-11 fw-6 c-txt-l">공정 ${currentStep + 1} / ${total} ${currentStep < maxStep ? '<span style="color:var(--info);font-size:10px">(이전 공정 보기 중)</span>' : ''}</span>
        <span class="fs-11 c-txt-l">${Math.round((maxStep / total) * 100)}% 완료</span>
      </div>
      <div class="progress-bar"><div class="fill" style="width:${(maxStep / total) * 100}%"></div></div>
    </div>

    <!-- Step dots: maxStep 기준으로 done/locked, currentStep 기준으로 current -->
    <div class="step-nav">
      ${steps.map((s, i) => {
        const isDone = i < maxStep && i !== currentStep;
        const isCurrent = i === currentStep;
        const isAccessible = i <= maxStep; // maxStep 이하는 클릭 가능
        const dotClass = isCurrent ? 'current' : isDone ? 'done' : 'locked';
        const dotStyle = !isAccessible ? 'style="opacity:0.3;cursor:not-allowed"' : '';
        return `<div class="step-dot ${dotClass}" onclick="goToStep(${i})" ${dotStyle}>${i + 1}</div>`;
      }).join('')}
    </div>

    <!-- Step content -->
    <div style="flex:1;padding:16px;overflow-y:auto" id="step-content"></div>

    <!-- Bottom nav -->
    <div style="display:flex;gap:6px;padding:10px 12px;background:var(--white);border-top:1px solid var(--gray-l)">
      <button class="btn btn-sm btn-outline btn-gray" style="min-width:56px;white-space:nowrap"
              onclick="goToStep(${currentStep - 1})" ${currentStep === 0 ? 'disabled' : ''}>← 이전</button>
      <button class="btn btn-sm btn-outline btn-info" style="min-width:64px;white-space:nowrap"
              onclick="tempSaveWO()">임시저장</button>
      ${currentStep < total - 1 ? `
        <button class="btn btn-sm btn-pri flex-1" style="white-space:nowrap"
                onclick="handleCompleteStep()">공정 완료 · 다음 →</button>
      ` : `
        <button class="btn btn-sm btn-suc flex-1" style="white-space:nowrap"
                onclick="handleCompleteStep(true)">전체 완료 · 냉동보관 시작</button>
      `}
    </div>
  `;

  // Render step-specific content
  renderStepContent(step, stepType);

  // Validate inputs on initial render (disable next button until all filled)
  setTimeout(() => validateStepInputs(State.woExec.currentStep + 1), 100);
}

function renderStepContent(step, stepType) {
  const el = $id('step-content');
  const { recipes, targetQty } = State.woExec;
  const stepNo = parseInt(step[1]);
  const isMixing = stepType === 'process' && (step[2]||'').includes('믹싱');
  const typeColor = { input: 'info', process: isMixing ? 'teal' : 'pri', seal: 'pri', inspect: 'warn', pack: 'gray-d', store: 'teal' };
  const typeLabel = { input: '투입', process: isMixing ? '믹싱' : '공정', seal: '포장(밀봉)', inspect: '검사(CCP)', pack: '포장', store: '보관' };

  let html = `
    <div class="card bl-${typeColor[stepType]||'gray'}">
      <div class="row between mb-12">
        <div class="fs-16 fw-7">공정 ${step[1]}. ${step[2]||''}</div>
        <span class="badge badge-${typeColor[stepType]||'gray'}">${typeLabel[stepType]||stepType}</span>
      </div>
  `;

  if (stepType === 'input') {
    const rmCode = step[4] || '';
    const recipe = recipes.find(r => r[1] === rmCode);
    const target = recipe ? (parseFloat(recipe[3]) * targetQty * 1.01).toFixed(2) : '0';
    const isWater = rmCode === 'RM002';
    const checks = (step[6] || '').split(',').filter(c => c.trim());

    // ① 투입 목표량
    const eggCount = rmCode === 'RM001' ? Math.ceil(parseFloat(target) * 1000 / 50) : 0;
    const eggP = Math.floor(eggCount / 30);
    const eggA = eggCount % 30;
    const eggLabel = eggCount > 0 ? (eggP > 0 && eggA > 0 ? `${eggP}판 ${eggA}알` : eggP > 0 ? `${eggP}판` : `${eggA}알`) : '';
    let inputStepNum = 1;
    html += `
      <div class="fs-14 fw-7" style="color:#111;margin-bottom:6px;margin-top:4px">Step ${inputStepNum++}. 투입 목표량 확인</div>
      <div class="info-box suc">
        <div class="fs-12 fw-6 c-suc">투입 목표량 (배합비 × ${targetQty}kg × 1.01)</div>
        <div class="fs-20 fw-8 c-suc mt-4">${target} kg${eggLabel ? `<span style="display:inline-flex;align-items:center;gap:3px;background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:2px 8px;font-size:13px;color:#e65100;font-weight:700;margin-left:8px;vertical-align:middle">🥚 ${eggLabel}</span>` : ''}</div>
      </div>
    `;

    // ② 체크항목
    if (checks.length > 0) {
      html += `<div class="fs-12 fw-6 c-txt-l mb-4 mt-8">체크항목</div>`;
      checks.forEach((c, i) => {
        html += `
          <div class="check-item">
            <div class="check-box" id="check-${stepNo}-${i}" onclick="toggleCheck(this);validateStepInputs(${stepNo})">${''}</div>
            <span>${c.trim()}</span>
          </div>
        `;
      });
    }

    // ③ QR 스캔 (카메라 직접 실행)
    if (!isWater) {
      html += `
        <div class="fs-14 fw-7" style="color:#111;margin-bottom:6px;margin-top:20px">Step ${inputStepNum++}. 원재료 LOT 확인</div>

      `;
    }

    // ④ 저울 계량값 사진 첨부 (카메라 / 갤러리 분리)
    html += `
      <div class="fs-14 fw-7" style="color:#111;margin-bottom:6px;margin-top:20px">Step ${inputStepNum++}. 저울 계량값 사진 첨부 <span class="c-err">*필수</span></div>

      <div class="fs-14 fw-7" style="color:#111;margin-bottom:6px;margin-top:20px">Step ${inputStepNum++}. 실제 투입량 입력</div>
